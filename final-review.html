const TOPICS=[
{key:"quality",name:"Requirements Quality",zh:"需求品質",group:"Analysis",source:"依本次指定之 VT4C 架構補充；非已核實之 2026 授課投影片原文",cards:[
{h:"VT4C：六項需求品質",lead:"Verifiable、Traceable ＋ 4C：Clear、Consistent、Complete、Concise。",body:"Clear 清楚無歧義；Verifiable 可藉測試／檢查驗證；Consistent 不互相矛盾；Complete 該有的情境、輸入、輸出、例外皆包含；Concise 不冗長重複；Traceable 能追溯來源、Use Case 及測試案例。",pit:"「系統要很快」不夠可驗證；「安全又方便」過於模糊；需求編號不等於已建立可追溯的鏈結。"},
{h:"需求改寫公式",lead:"Actor + Action + Object + Condition + Measurable Result",body:"Poor: The system must respond quickly. Better: Under 200 concurrent users, 95% of course searches shall return results within 2 seconds. 定義情境、測量方式與可接受門檻。",pit:"數字只是示範，不是老師規定的效能標準。"},
{h:"六原則易混淆",lead:"Clear vs Verifiable；Complete vs Concise；Consistent vs Traceable",body:"Clear 重在語意可理解；Verifiable 重在可以判定通過／失敗。Complete 是沒有關鍵漏項；Concise 是去掉贅字。Consistent 是不打架；Traceable 是知道源頭和後續設計／測試在哪。",pit:"同一需求可能同時違反多項原則，考試依題目強調的缺陷回答。"}]},
{key:"functional",name:"Functional Modeling",zh:"功能塑模",group:"Analysis",source:"2026 Ch3 Business Process & Functional Modeling，課堂投影片 p.4、7、10",cards:[
{h:"三種產物",lead:"Use-Case Diagram、Activity Diagram、Use-Case Description (UCD)",body:"Use-case diagram 概觀系統提供的功能與 actors；Activity diagram 展開業務流程及分支；UCD 以文字敘述觸發條件、main flow、alternate / exception flows 等。",pit:"Use-case 描述「做什麼」，不要在分析階段過早混入資料表或特定程式實作。"},
{h:"Use-case 四類關係",lead:"Association、«include»、«extend»、Generalization",body:"Include 必須重用的共同行為，箭頭 base → included；Extend 於特定條件下增加可選行為，箭頭 extension → base；Generalization 空心三角朝上層泛化用例。",pit:"不可把 include 與 extend 當成相反的流程箭頭。"},
{h:"活動圖 vs 循序圖",lead:"Activity = control flow；Sequence = object-message order",body:"活動圖聚焦活動、決策、並行及泳道；循序圖重點是參與者／物件間依時間順序傳遞的訊息。",pit:"活動圖的 action 不一定每個都需要獨立成一個 Class。"}]},
{key:"structural",name:"Structural Modeling",zh:"結構塑模",group:"Analysis / Design",source:"2026 Ch4 Structural Modeling，課堂投影片 p.5–11",cards:[
{h:"Class Diagram 三格",lead:"Class Name / Attributes / Operations",body:"藉 People、Places、Things 及交易事件辨識候選 class；屬性記錄相關資料，operations 表示行為。",pit:"John 是 Student 類別的 instance，不是 Student 的子類別。"},
{h:"關係辨識",lead:"Generalization (is-a)；Aggregation/Composition (part-of)；Association",body:"Generalization 由子類別繼承；Aggregation 是整體與部分；Composition 是具有較強生命週期依存的組成；Association 是一般互動關聯。",pit:"Member borrows Book 屬 Association，並非因為有動詞就變成 Aggregation。"},
{h:"Cohesion & Coupling",lead:"High Cohesion + Low Coupling 是一般設計目標",body:"Cohesion 是同一 class/module 內職責有多緊密相關；Coupling 是不同 class/module 彼此依賴程度。",pit:"「Cohesion 是 class 間的依賴」是錯的，那是 Coupling 的概念。"}]},
{key:"behavior",name:"Behavioral Modeling",zh:"行為塑模",group:"Analysis",source:"2026 Ch5 Behavioral Modeling，投影片 p.5–10",cards:[

{h:"State Machine 與 CRUDE",lead:"State Machine = state changes；CRUDE = Create / Read / Update / Delete / Execute",body:"State machine 的 state 要反映物件屬性或業務狀態；CRUDE matrix 可檢查用例對類別或資料的操作是否遺漏。",pit:"「等待點擊按鈕」是 UI 操作步驟，未必是適合的業務物件狀態。"}]},
{key:"architecture",name:"Architecture & Class Design",zh:"架構與類別設計",group:"Design",source:"113期末考.pdf 第1頁 Q16、Q21–23，第2頁 Q34、Q37；以下為題意延伸解析",cards:[
{h:"Package Dependency",lead:"Development sequence + Change impact",body:"A 依賴 B：通常在規劃／整合時要優先考慮 B 提供的介面或服務；B 的改動可能影響 A。",pit:"依賴箭頭不是「兩個 package 永遠不能同時開發」，而是設計和變更影響上的關係。"},
{h:"Contract: Preconditions / Postconditions / Invariants",lead:"方法執行前、執行後、始終應成立",body:"Precondition：執行前需符合；Postcondition：方法正常完成後保證；Invariant：物件應維持的有效條件。",pit:"Invariant 不等於每次方法執行都要改變的值。"},
{h:"Cohesion & Coupling",lead:"一內一外",body:"高 Cohesion：一個 module 專心處理相關責任；低 Coupling：變更某 module 時較少波及其他 module。",pit:"高 Cohesion 不保證零 Coupling；看的是兩個不同維度。"}]},
{key:"ui",name:"UI Design",zh:"使用者介面設計",group:"Design",source:"113期末考.pdf 第1頁 Q24–27、第2頁 Q28–33",cards:[
{h:"UI 三機制",lead:"Navigation / Input / Output",body:"Navigation 選擇操作及移動頁面；Input 擷取資料；Output 呈現資訊。",pit:"輸入表單是 Input，不要因為出現在網頁就全歸類 Navigation。"},
{h:"UI 品質與設計",lead:"Layout、Content awareness、Aesthetics、User experience、Consistency、Minimal user effort",body:"題目常以使用者是否知道位置、操作是否一致、是否減少訓練成本等情境測觀念。",pit:"使用者轉換系統訓練費高時，重點往往是 Consistency 與降低使用負擔。"},
{h:"Essential vs Real UCD",lead:"Essential UCD 描述任務意圖；Real UCD 反映特定介面或實作互動",body:"Essential 避免過早綁定 UI 細節；Real 可逐步包含實際畫面與使用者操作。",pit:"不要把兩者當作不同用途的 UML 類別圖。"}]},
{key:"data",name:"Data & Database Design",zh:"資料庫設計",group:"Design",source:"113期末考.pdf 第1頁 Q5、第2頁 Q35–36；以下為觀念解釋",cards:[

].map((x,i)=>({id:i+1,topic:x[0],question:x[1],options:x[2].split("|"),answer:x[3],why:x[4],pit:x[5],source:i<6?"VT4C 新增練習（非原考古題）":"113期末考題型／課堂投影片考點改寫（非原卷逐字）"}));

const state={answers:{},flags:{},wrong:{},...saved};let view="cheats",category="all",quizFilter="all",query="";
const $=id=>document.getElementById(id);
const e=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(err){console.warn(err)}};
const answered=()=>QUESTIONS.filter(q=>state.answers[q.id]!==undefined).length;
const incorrect=()=>QUESTIONS.filter(q=>state.wrong[q.id]).length;
const label=k=>TOPICS.find(t=>t.key===k).zh;
function setView(v){view=v;category="all";quizFilter="all";query="";document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===v));render();window.scrollTo({top:0,behavior:"smooth"});}
function stats(){const a=answered(),w=incorrect();$("stats").innerHTML='<div class="card"><div class="meta">新增練習題</div><div class="num">'+QUESTIONS.length+'</div></div><div class="card"><div class="meta">已作答</div><div class="num">'+a+' / '+QUESTIONS.length+'</div></div><div class="card"><div class="meta">錯題待複習</div><div class="num">'+w+'</div></div><div class="card"><div class="meta">完成進度</div><div class="num">'+Math.round(a/QUESTIONS.length*100)+'%</div><div class="progress"><span style="width:'+Math.round(a/QUESTIONS.length*100)+'%"></span></div></div>';}
function filterTools(isQuiz){const opts='<option value="all">所有主題</option>'+TOPICS.map(t=>'<option value="'+t.key+'" '+(category===t.key?"selected":"")+'>'+e(t.zh)+' / '+e(t.name)+'</option>').join("");
return '<div class="toolbar"><label class="sr" for="topicFilter">按章節篩選</label><select id="topicFilter" onchange="category=this.value;render()"> '+opts+'</select>'+ (isQuiz?'<label class="sr" for="statusFilter">作答狀態</label><select id="statusFilter" onchange="quizFilter=this.value;render()"><option value="all">所有狀態</option><option value="unanswered" '+(quizFilter==="unanswered"?"selected":"")+'>未作答</option><option value="wrong" '+(quizFilter==="wrong"?"selected":"")+'>只看錯題</option><option value="flagged" '+(quizFilter==="flagged"?"selected":"")+'>只看收藏</option><option value="answered" '+(quizFilter==="answered"?"selected":"")+'>已作答</option></select>':'')+'<label class="sr" for="search">搜尋</label><input id="search" placeholder="搜尋考點、關鍵字 / Search" value="'+e(query)+'" oninput="query=this.value;updateContent()" autocomplete="off">'+(isQuiz?'<button class="btn" onclick="resetWrong()">清除錯題標記</button>':'')+'</div>';}
function cheats(){let arr=TOPICS.filter(t=>(category==="all"||category===t.key)&&(!query||(t.zh+" "+t.name+" "+t.cards.map(c=>c.h+" "+c.body+" "+c.pit).join(" ")).toLowerCase().includes(query.toLowerCase())));
return '<div class="sectionheading"><h2>核心觀念速記</h2><span class="meta">考前快速複習 · 以英文術語搭配繁體中文解釋</span></div><div class="lesson">'+arr.map(t=>'<article class="card"><span class="tag">'+e(t.group)+'</span> <span class="tag">'+e(t.zh)+'</span><h2 style="margin-top:12px">'+e(t.name)+'</h2>'+t.cards.map(c=>'<div style="border-top:1px solid var(--line);padding:14px 0"><h3>'+e(c.h)+'</h3><b>'+e(c.lead)+'</b><p>'+e(c.body)+'</p><div class="pitfall"><span class="tag trap">Common Pitfall</span> '+e(c.pit)+'</div></div>').join("")+'<p class="source">教材依據：'+e(t.source)+'</p><button class="btn small" onclick="category=\''+t.key+'\';setViewForTopic(\''+t.key+'\')">練習本主題題目 →</button></article>').join("")+'</div>'+(arr.length?"":'<div class="card empty">目前沒有符合的觀念，請更換搜尋條件。</div>');}
function setViewForTopic(k){setView("traps");category=k;render();}
function choices(q){const val=state.answers[q.id],done=val!==undefined;return '<div class="answers" role="group" aria-label="Q'+q.id+' options">'+q.options.map((o,i)=>'<button class="option '+(done?(i===q.answer?"correct":i===val?"incorrect":""):"")+'" onclick="answer('+q.id+','+i+')" '+(done?"disabled":"")+'><strong>'+String.fromCharCode(65+i)+'.</strong> '+e(o)+'</button>').join("")+'</div>';}
function quizCard(q){const val=state.answers[q.id],done=val!==undefined;
return '<article class="card qcard" id="q'+q.id+'"><div class="sectionheading"><div><span class="tag question">Question Q'+String(q.id).padStart(2,"0")+'</span> <span class="tag">'+e(label(q.topic))+'</span> '+(state.wrong[q.id]?'<span class="tag trap">錯題</span>':'')+'</div><button class="btn small" aria-label="標記第'+q.id+'題" onclick="toggleFlag('+q.id+')">'+(state.flags[q.id]?"★ 已收藏":"☆ 收藏")+'</button></div><div class="qtext">'+e(q.question)+'</div>'+choices(q)+(done?'<div class="feedback"><span class="tag answer">Standard Answer · 本站參考解答</span><div class="answerbox"><strong>'+String.fromCharCode(65+q.answer)+'. '+e(q.options[q.answer])+'</strong><p>'+e(q.why)+'</p></div><div class="pitfall"><span class="tag trap">Common Pitfall</span> '+e(q.pit)+'</div><button class="btn small" onclick="retry('+q.id+')">重做此題</button></div>':'<p class="meta">作答後顯示參考答案、原因與易錯陷阱。</p>')+'<div class="source">'+e(q.source)+'</div></article>';}
function traps(){const arr=QUESTIONS.filter(q=>(category==="all"||q.topic===category)&&(!query||(q.question+" "+q.options.join(" ")+q.why+" "+q.pit+" "+label(q.topic)).toLowerCase().includes(query.toLowerCase()))&&(quizFilter==="all"||quizFilter==="wrong"&&state.wrong[q.id]||quizFilter==="flagged"&&state.flags[q.id]||quizFilter==="answered"&&state.answers[q.id]!==undefined||quizFilter==="unanswered"&&state.answers[q.id]===undefined));return '<div class="sectionheading"><h2>歷屆考古題庫與陷阱解析</h2><span class="meta">依 113 年期末考考點及課堂主題改寫 · 不冒稱官方解答</span></div><p class="muted">點選答案後立即看解析。錯題會自動收集，可以按章節、未作答、收藏或錯題重練；重整網頁不會清除紀錄。</p><div class="sectionheading"><span class="tag">篩選結果 '+arr.length+' 題</span><button class="btn small" onclick="resetPractice()">重置所有新增練習題答案</button></div>'+arr.map(quizCard).join("")+(arr.length?"":'<div class="card empty"><h3>找不到符合條件的題目</h3><p class="muted">可改選「所有狀態」或其他章節。</p></div>');}
function render(){stats();$("pageTitle").textContent=view==="cheats"?"核心觀念速記 Cheat Sheets":"歷屆考古題庫與陷阱解析";$("pageSub").textContent=view==="cheats"?"需求品質、UML、Architecture、UI 與 Data Design，建立可快速回憶的觀念索引。":"按章節與答題狀態篩選；題目、參考解答與 Common Pitfalls 分層閱讀。";$("view").innerHTML=filterTools(view==="traps")+'<div id="content">'+(view==="cheats"?cheats():traps())+'</div>';}
function updateContent(){$("content").innerHTML=view==="cheats"?cheats():traps();}
function answer(id,value){if(state.answers[id]!==undefined)return;let q=QUESTIONS.find(x=>x.id===id);state.answers[id]=value;if(value!==q.answer)state.wrong[id]=true;else delete state.wrong[id];save();render();let el=$("q"+id);if(el)el.scrollIntoView({block:"nearest"});}
function toggleFlag(id){state.flags[id]=!state.flags[id];save();render();const el=$("q"+id);if(el)el.scrollIntoView({block:"nearest"});}
function retry(id){delete state.answers[id];save();render();const el=$("q"+id);if(el)el.scrollIntoView({block:"nearest"});}
function resetWrong(){if(confirm("要清除錯題標記嗎？已作答的答案會保留。")){state.wrong={};quizFilter="all";save();render();}}
function resetPractice(){if(confirm("要重置這個期末模組的所有答案嗎？收藏與原版模擬考不受影響。")){state.answers={};state.wrong={};quizFilter="all";save();render();}}
document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));
render();
</script></body></html>
