a{color:var(--blue)}.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.topin{max-width:1220px;margin:auto;padding:12px 20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;color:var(--ink);text-decoration:none;font-size:17px}.brand strong{display:inline-block;background:#384dc4;color:#fff;border-radius:9px;padding:2px 8px;margin-right:8px}.links{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);padding:9px 14px;font-weight:650}.btn.primary,.btn.active{color:white;background:var(--blue);border-color:var(--blue)}.btn.small{padding:6px 10px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:1220px;margin:auto;padding:24px 20px 90px}.intro{display:flex;align-items:start;justify-content:space-between;gap:16px;margin:0 0 16px}.intro h1{margin:0;font-size:clamp(24px,3vw,33px);line-height:1.35;letter-spacing:-.03em}.intro p{color:var(--muted);margin:7px 0}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.08em}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:21px;box-shadow:var(--shadow);min-width:0}.card h2,.card h3{line-height:1.35;margin:0 0 10px}.card p{margin:8px 0}.muted{color:var(--muted)}.meta{color:var(--muted);font-size:12px}.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:7px;background:var(--soft);color:#3349a5;font-size:12px;font-weight:800;white-space:normal}.tag.trap{background:var(--amber);color:var(--orange)}.tag.answer{background:var(--mint);color:var(--green)}.tag.question{background:#edf1ff;color:#354ba9}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin:20px 0}.stats .card{padding:14px}.num{font-size:25px;font-weight:850;line-height:1.15}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:15px 0}.toolbar select,.toolbar input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);min-width:0}.toolbar input{flex:1;min-width:180px}.section{margin-top:26px}.section h2{font-size:21px}.sectionheading{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}.lesson{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.lesson ul{padding-left:20px;margin:5px 0}.lesson li{margin-bottom:4px}.highlight{padding:12px 14px;background:#f5f7ff;border-radius:11px;border-left:3px solid #5c69d7;margin:12px 0;overflow-wrap:anywhere}.pitfall{padding:12px 14px;background:var(--amber);color:#70430f;border-radius:11px;margin-top:12px;overflow-wrap:anywhere}.source{font-size:12px;color:var(--muted)}.qcard{margin:12px 0}.qtext{font-size:16px;font-weight:700;white-space:pre-line;overflow-wrap:anywhere}.answers{display:grid;gap:7px;margin-top:12px}.option{width:100%;text-align:left;padding:11px 13px;border:1px solid var(--line);background:#fff;border-radius:10px;color:var(--ink);overflow-wrap:anywhere}.option:hover:not(:disabled){border-color:var(--blue)}.option.selected{border-color:var(--blue);background:var(--soft)}.option.correct{background:var(--mint);border-color:#70c6a2}.option.incorrect{background:#fff0ef;border-color:#e9a39e}.feedback{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.answerbox{padding:10px 13px;background:var(--mint);border-radius:10px;color:#14583f;margin:7px 0}.foot{margin-top:32px;padding:18px 0;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}.empty{padding:40px 20px;text-align:center}.tablewrap{overflow:auto;max-width:100%}table{border-collapse:collapse;width:100%;min-width:510px}td,th{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);overflow-wrap:anywhere}th{background:var(--soft)}.hidden{display:none!important}.sr{position:absolute;left:-9999px}.inline-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.progress{background:#e7eaf3;height:7px;overflow:hidden;border-radius:10px}.progress span{height:100%;display:block;background:var(--blue);transition:width .25s}.counter{margin-left:auto}
@media(max-width:850px){.grid,.lesson{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.topin,.wrap{padding-left:13px;padding-right:13px}.intro{display:block}.grid,.lesson{grid-template-columns:1fr}.stats{gap:7px}.card{padding:16px}.toolbar select{max-width:100%;width:100%}.toolbar input{width:100%}.links .btn{font-size:12px;padding:7px 9px}.intro h1{font-size:25px}table{min-width:440px}}

/* Final Review: structured English-first reading layout */
.lesson{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.studycard{padding:22px;overflow:hidden}
.studyhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.studycard>h2{font-size:21px;letter-spacing:-.015em;overflow-wrap:anywhere}
.studysection{border-top:1px solid var(--line);padding:16px 0 10px}
.studysection h3{font-size:14px;color:var(--blue);letter-spacing:.015em;margin:0 0 9px}
.studysection h3 small{font-size:12px;color:var(--muted);font-weight:500}
.compactlist{padding-left:19px;margin:0;display:grid;gap:7px}
.compactlist li{line-height:1.6;overflow-wrap:anywhere}
.studytable{min-width:0;table-layout:fixed;width:100%;font-size:13px;line-height:1.55}
.studytable td,.studytable th{padding:9px 10px;overflow-wrap:anywhere;word-break:normal}
.studytable th:first-child,.studytable td:first-child{width:39%}
.studytable td strong{color:var(--ink)}
.traplist{background:var(--amber);padding:13px 13px 13px 31px;border-radius:12px;color:#70430f}
.traplist strong{color:#6c3e03}
.studycard .source{padding-top:8px;border-top:1px dashed var(--line)}
@media(max-width:880px){.lesson{grid-template-columns:1fr}}

/* Pedagogical four-part chapter cards */
.deepcard{line-height:1.7}
.deepcard .studysection{padding-top:16px;padding-bottom:14px}
.deepcard .core-sentence{margin:0;font-size:15px;line-height:1.8;background:var(--soft);padding:13px 15px;border-radius:10px;overflow-wrap:anywhere}
.concept-stack{display:grid;gap:12px}

.concept-item h4{font-size:14px;line-height:1.5;margin:0 0 5px}

.exam-checks{display:grid;gap:10px}

.checkpoint>b{display:block;color:#764708;font-size:13px;margin-bottom:5px}
.checkpoint p{color:#764708}
@media(max-width:600px){.deepcard .core-sentence{font-size:14px}.concept-item p,.example-item p,.checkpoint p{font-size:13px}}

<script>
"use strict";
const TOPICS=[{"key":"quality","name":"Requirements Quality","zh":"需求品質","group":"Analysis","source":"VT4C 為本次指定之補充框架，非已確認之課堂原始措辭","definition":["**Requirement Quality** (需求敘述品質): unambiguous, testable, non-conflicting, sufficiently specified and traceable.","**VT4C**: **Verifiable**, **Traceable**, **Clear**, **Consistent**, **Complete**, **Concise**."],"columns":["Principle","Meaning (短註)"],"elements":[["**Verifiable**","Testable acceptance criteria (可驗收)"],["**Traceable**","Linked to source, use case and test (可追溯)"],["**Clear**","Unambiguous wording (不含糊)"],["**Consistent**","No contradictions (不矛盾)"],["**Complete**","All essential cases covered (不漏例外)"],["**Concise**","No redundant language (不冗長)"]],"traps":["**Clear ≠ Verifiable**: “Fast” is vague and not measurable (缺少量化門檻).","**Complete ≠ Verbose**: Cover exceptions without padding (完整不等於冗長).","**Example Rewrite**: “The system is fast” → “95% of searches finish within 2 seconds under 200 concurrent users.” (門檻為練習示例，非課堂規定)"]},{"key":"functional","name":"Functional Modeling","zh":"功能塑模","group":"Analysis","source":"2026 Ch3 投影片 p.4、7、10；補充方向依 UML 一般規則","definition":["**Functional Model** (功能模型): describes system functions and user-facing business processes.","**Use Case** (用例): a goal-oriented interaction between actor and system."],"columns":["Artifact / Relationship","Purpose (短註)"],"elements":[["**Use-Case Diagram**","Actors, functions, system boundary (系統功能概觀)"],["**Activity Diagram**","Activity/control flow, decisions, forks (流程與分支)"],["**Use-Case Description (UCD)**","Trigger, preconditions, main and alternate flows (文字情境)"],["**Association**","Actor ↔ use case (互動連結)"],["**«include»**","Base → included use case (必要共同行為)"],["**«extend»**","Extension → base use case (條件式擴充)"],["**Generalization**","Specialized → generalized actor/use case (泛化)"]],"traps":["**«include» ≠ «extend»**: The former is included behavior; the latter is conditional extension (箭頭方向不同).","**Activity Diagram ≠ Sequence Diagram**: Process/control flow versus object messages over time (焦點不同).","**Analysis ≠ Implementation**: Avoid database/UI code details in use-case definitions (先描述 What)."]},{"key":"structural","name":"Structural Modeling","zh":"結構塑模","group":"Analysis / Design","source":"2026 Ch4 投影片 p.5–11；設計品質為期末題意延伸","definition":["**Structural Model** (結構模型): identifies domain classes, properties, operations and relationships.","**Class** (類別): template; **Object** (物件): specific instance."],"columns":["Element","Meaning (短註)"],"elements":[["**Class Name**","Type of domain object (類別名稱)"],["**Attributes**","Relevant properties (資料屬性)"],["**Operations**","Supported actions (操作行為)"],["**Association**","General link (關聯)"],["**Aggregation / Composition**","Whole–part relationship (整體與部分)"],["**Generalization**","Subclass → superclass; is-a (繼承／泛化)"],["**Cohesion**","Related responsibilities within one module (內聚)"],["**Coupling**","Dependencies between modules (耦合)"]],"traps":["**Instance-of ≠ Is-a**: John is an instance of Student, not a subclass (個體不是子類別).","**Association ≠ Aggregation**: Borrowing a book is not ownership of its parts (借閱不等於組成).","**High Cohesion / Low Coupling** is the usual design target (內聚高、耦合低)."]},{"key":"behavior","name":"Behavioral Modeling","zh":"行為塑模","group":"Analysis","source":"2026 Ch5 投影片 p.5–10","definition":["**Behavioral Model** (行為模型): captures internal dynamic behavior of collaborating objects.","**Message** (訊息): invokes an operation; an interaction may produce a return value."],"columns":["Artifact","Focus (短註)"],"elements":[["**Sequence Diagram**","Time-ordered messages (時間順序)"],["**Communication Diagram**","Message links among objects (訊息連結)"],["**Instance Sequence Diagram**","One scenario, usually main event flow (單一情境)"],["**State Machine**","Events, guards, state changes (物件狀態轉移)"],["**CRUDE Matrix**","Create / Read / Update / Delete / Execute (操作檢查)"]],"traps":["**Sequence ≠ Communication**: Message timing versus link structure (不要混淆焦點).","**State ≠ Action**: States represent object conditions, not every UI click (狀態不是每個操作步驟).","**Message–Operation Consistency**: A receiver must support the called operation (跨模型一致)."]},{"key":"architecture","name":"Architecture & Class Design","zh":"架構與類別設計","group":"Design","source":"113期末考.pdf p.1 Q16、Q21–23；p.2 Q34、Q37（依題意整理，非官方答案）","definition":["**Architecture Design** (架構設計): organizes software components, their responsibilities and dependencies.","**Package Dependency** (套件相依): A package relies on services or definitions of another."],"columns":["Key Element","Meaning (短註)"],"elements":[["**Development Sequence**","Dependencies inform build order (開發順序)"],["**Change Impact**","Upstream changes may affect dependents (變更影響)"],["**Precondition**","Must hold before operation (執行前)"],["**Postcondition**","Must hold after operation (執行後)"],["**Invariant**","Valid property preserved (不變條件)"],["**Cohesion**","Within-module relatedness (內聚)"],["**Coupling**","Cross-module dependency (耦合)"]],"traps":["**Dependency ≠ Inheritance**: A package dependency is not an is-a relationship (不同語意).","**Cohesion ≠ Coupling**: One concerns internal unity; the other inter-module connection (內外不同).","**Invariant ≠ Postcondition**: It is not a one-time output (非單次結果)."]},{"key":"ui","name":"UI Design","zh":"使用者介面設計","group":"Design","source":"113期末考.pdf p.1 Q24–27；p.2 Q28–33（依題意整理）","definition":["**User Interface (UI) Design** (介面設計): organizes navigation, data entry and information display.","**Usability** (易用性): supports efficient, understandable user interaction."],"columns":["Mechanism / Principle","Meaning (短註)"],"elements":[["**Navigation**","Move between screens (畫面導覽)"],["**Input**","Capture user data (資料輸入)"],["**Output**","Display information (資訊輸出)"],["**Layout**","Intuitive grouping (版面配置)"],["**Content Awareness**","Know where one is (脈絡清楚)"],["**Aesthetics**","Readable, pleasing appearance (視覺清楚)"],["**User Experience**","Ease of interaction (操作體驗)"],["**Consistency**","Predictable patterns (一致)"],["**Minimal User Effort**","Fewer unnecessary actions (減少負擔)"],["**Window Navigation Diagram**","Screen connections (畫面關聯)"]],"traps":["**Input ≠ Navigation**: Form entry is not screen-to-screen movement (輸入不是導覽).","**Essential UCD ≠ Real UCD**: Task intent versus concrete UI interaction (抽象與具體).","**Content Awareness ≠ Aesthetics**: Knowing location versus visual appeal (概念不同)."]},{"key":"data","name":"Data & Database Design","zh":"資料庫設計","group":"Design","source":"113期末考.pdf p.1 Q5；p.2 Q35–36（依題意與一般資料庫定義整理）","definition":["**Normalization** (正規化): reduces redundancy and update anomalies; supports data integrity.","**Data Store** (資料儲存): file, relational, object-relational, object-oriented or NoSQL."],"columns":["Normal Form / Store","Rule (短註)"],"elements":[["**1NF**","Atomic values; no repeating groups (原子欄位)"],["**2NF**","1NF + no partial dependency of non-prime attributes on candidate keys (無部分相依)"],["**3NF**","2NF + no problematic transitive dependencies (無不當傳遞相依)"],["**RDB**","Relations / SQL (關聯式)"],["**ORDB**","Relational + object features (物件關聯式)"],["**OODB**","Object-based storage (物件式)"],["**NoSQL**","Multiple non-relational models (非關聯模型)"]],"traps":["**Normalization ≠ Query Optimization**: More joins may increase access cost (目的不是加快查詢).","**2NF ≠ 3NF**: Partial versus transitive dependency are different tests (判斷要分開).","**SQL support ≠ pure RDB**: SQL alone does not determine store type (不可只憑 SQL 判斷)."]}];
const DEEP_DIVE={"quality":{"core":"**Requirements Quality**：以明確、完整、一致、可驗證且可追溯的敘述，讓需求能被開發、測試與利害關係人共同理解。","why":[["**Clear** 與 **Verifiable** 為何不同？","Clear 解決「每個人解讀是否一樣」；Verifiable 解決「做完後能否客觀驗收」。例如「快速」兩者都可能不合格；改成具體負載及回應時間，才能設計可重複測試。"],["**Consistent / Complete / Concise** 如何同時成立？","Consistent 要求相同情境的規則不互斥；Complete 要涵蓋正常、例外與邊界；Concise 則移除不必要的重複。三者並非字越少越好，而是必要資訊不能漏、多餘資訊不干擾。"],["**Traceable** 為何重要？","需求須能由 Stakeholder → Requirement ID → Use Case / Design → Test Case 串起來。規格改動時，才知道要同步修改哪些圖與測試；只有編號，仍不等於建立了追溯關係。"],["**VT4C** 如何用來審題？","依本次指定框架，先定位句子的主詞、動作、條件、輸入輸出與驗收結果，再逐一問：可測嗎？可追溯嗎？是否清楚、一致、完整、精簡？同一句可能違反多個原則；題目要求單選時選最直接的缺陷。"]],"examples":[["Before：模糊需求","「系統應該快速完成選課，而且操作很方便。」"],["After：可驗收需求","「在 200 位同時使用者下，95% 的課程查詢於 2 秒內回傳結果；選課成功時顯示課程代碼與交易編號。」"],["Before：需求互相衝突","文件 A：每人最多選 18 學分；文件 B：每人最多選 21 學分（未定義例外）。"],["After：明確訂出規則","「一般學生上限 18 學分；經核准的特殊身分可至 21 學分」，並連到政策來源與測試案例。"]],"traps":[["題：需求寫了測試編號就符合 Traceable？","**不一定。**還需能連結需求來源、設計／用例與實際測試。"],["題：「The system should be user-friendly」最明顯問題？","**Clear / Verifiable**：沒有定義操作任務與可衡量的成功條件。"]],"source":"VT4C 為本次指定的補充整理；具體門檻為教學示例，非老師官方標準。"},"functional":{"core":"**Functional Modeling**：從使用者目標與業務流程描述系統「應提供什麼功能」，並以 Use-Case Diagram、Activity Diagram 與 Use-Case Description 交叉驗證。","why":[["**User Story (Why / Value)** 與 **Use Case (Interaction / How)** 為何需要一起看？","User Story 常以「As a… I want… so that…」說明角色、需求與商業價值；Use Case 描述特定目標下 Actor 與系統如何互動、包含正常及替代流程。前者幫助判斷「為何值得做」，後者幫助釐清「怎麼完成」。這裡的 How 是**互動步驟**，不是程式實作方法。"],["一個 **User Story** 為何可能拆成多個 **Use Cases**？","當使用者價值跨越多個獨立目標或交易時，例如「管理購物流程」包含瀏覽商品、加入購物車、結帳與追蹤訂單，可以分別建模。**1 對多是常見分解方式，並非 UML 強制固定基數**；實際也可能一個 Story 對應一個用例，或多個 Stories 共同補足同一用例。"],["**Actor Generalization** 何時使用？","Actor 表示系統外部的角色而非某個人的名字。當「研究生」確實擁有「學生」所有相關互動，且還有額外權限，就能畫 Research Student → Student 的 Generalization（空心三角指向一般角色）；如果只是兩個人偶爾做相同工作，不一定需要繼承。"],["**«include»** 與 **«extend»** 的分水嶺？","«include» 是基礎用例每次都會執行的可重用子行為，例如 Check Out 必定 Validate Cart；箭頭由 Base 指向 Included。«extend» 是基礎用例在特定條件下額外加入的可選行為，例如 Apply Coupon 有優惠碼時才擴充 Check Out；箭頭由 Extension 指向 Base。決策關鍵不是功能複雜度，而是**必要與條件式擴充**。"]],"examples":[["User Story","「As a student, I want to manage my courses so that I can build my schedule.」"],["Candidate Use Cases","**Search Courses** → **Enroll in Course** → **Drop Course**；依獨立業務目標分開。"],["«include» 示範","**Enroll in Course** «include» **Check Prerequisites**（若規格要求每次都檢查）。"],["«extend» 示範","**Join Waiting List** «extend» **Enroll in Course**（課程額滿且學生選擇候補時）。"]],"traps":[["題：「User Story 與 Use Case 必然是 1:N」對嗎？","**錯。**常可 1:N 分解，但不是固定的模型基數規則。"],["題：«include» 和 «extend» 只是箭頭相反？","**錯。**先判斷是否必定執行與是否條件式增加，再畫箭頭。"]],"source":"Use-Case / Activity / UCD 與關係方向以 2026 Ch3 投影片為依據；User Story 對照為補充解說。"},"structural":{"core":"**Structural Modeling**：辨識業務領域中的 Classes、Attributes、Operations 與 Relationships，描述系統需要維護的靜態結構。","why":[["為何從 **Use-Case Description** 找類別？","Use Cases 定義功能，但系統要有物件負責保存資訊與執行操作。從事件流程抽取候選名詞、動詞：名詞可能是 Class／Attribute；動詞可能是 Operation。接著以系統範圍過濾，避免把每個名詞都直接畫成一個 Class。"],["**Class**、**Object**、**Attribute** 如何分層？","Class 是可產生物件的模板；Object 是某個具體實例；Attribute 是每個實例持有的資料。例如 Student 是 Class，學號 S001 的學生是 Object，studentId 是 Attribute。"],["為何要區分三種主要 **Relationships**？","Generalization 表示 is-a，允許繼承共通操作；Aggregation/Composition 表示 whole-part；Association 表示業務互動。若把「顧客購買商品」誤當 Composition，會錯誤暗示商品生命週期依賴顧客。"],["**Cohesion** 與 **Coupling** 為何同時重要？","High Cohesion 讓一個模組的職責集中、較易理解；Low Coupling 降低跨模組改動的連鎖效應。不是追求毫無合作，而是透過清楚介面減少不必要的依賴。"]],"examples":[["Class vs Object","**Student**(studentId, name; enroll())；**student001:Student** 是實例。"],["Association","**Student — Course**：學生選修課程；可視規格再以 Enrollment 作為關聯類別紀錄選課時間、成績。"],["Generalization","**GraduateStudent → Student**：研究生是學生的一種；具有額外的論文資格檢核。"],["反例","**Customer purchases Product** 不是 Product「屬於」Customer 的 Composition。"]],"traps":[["題：「John is a Student」應畫 Generalization 嗎？","**不對。**John 是 Student 的 Object / Instance。"],["題：高 Cohesion 等於模組之間緊密相依？","**不對。**那是 High Coupling 的語意；Cohesion 看模組內部。"]],"source":"Classes / Relationships 與案例依 2026 Ch4 投影片 p.5–11；Cohesion / Coupling 為期末延伸。"},"behavior":{"core":"**Behavioral Modeling**：描述物件如何透過 Messages 合作執行 Use Cases，以及重要業務物件如何隨事件改變狀態。","why":[["**Sequence Diagram** 為何由上到下？","它強調事件先後與物件互動。每一欄是 Actor／Object 的 Lifeline，訊息由上往下排列；呼叫與回傳通常以不同線型表示，方便檢查流程是否能對上 Use-Case Description。"],["**Communication Diagram** 與 **Sequence** 如何取捨？","兩者都表達互動；Sequence 強調時間／順序，Communication 強調物件的連結與訊息流。課堂以主流程的 Instance Sequence Diagram 為重點。"],["**State Machine** 為何不是畫每次按鈕？","狀態是業務物件有意義的持續條件，如 Order = Pending、Paid、Shipped、Cancelled；Event 觸發 Transition，Guard 約束可否轉換。若只畫「使用者點下一步」，那通常更接近 Activity Flow。"],["**CRUDE Matrix** 如何當檢查工具？","針對每個 Use Case 與 Class／Data 建立 Create、Read、Update、Delete、Execute 對照，可發現某個物件從未被建立、某狀態無人更新，或用例需要操作卻找不到負責類別。"]],"examples":[["Use Case","**Place Order**：客戶確認購物車並付款。"],["Sequence（主流程）","**Customer → OrderService: createOrder() → Inventory: reserve() → Payment: authorize()**；回傳付款結果。"],["State Machine","**Pending → Paid → Shipped → Delivered**；付款失敗時可能 Pending → Cancelled。"],["CRUDE","**Place Order** 對 **Order** = C/R/U；對 **Inventory** = R/U（依業務設計而定）。"]],"traps":[["題：Sequence Diagram 中訊息接收者不需要有對應 Operation？","**錯。**應與 Class Diagram 的職責和 Operations 保持一致。"],["題：State Machine 的 State 可以直接是「Click Pay」嗎？","通常**不適合**；Click Pay 是 Event / Action，不是訂單的持續狀態。"]],"source":"Interaction Diagrams、Instance 主流程與 CRUDE 依 2026 Ch5 投影片及教材；購物範例為教學延伸。"},"architecture":{"core":"**Architecture & Class Design**：將分析模型轉成可實作、可維護的 Packages、Modules、Contracts 與層次，管理職責與依賴。","why":[["**Package Dependency** 為何同時影響時間與變更？","如果 Order Package 使用 Payment Package 提供的介面，整合前需先確認 Payment 的契約，這影響 Development Sequence；日後 Payment API 改變，可能波及 Order，這就是 Change Impact。可平行開發但必須協調介面。"],["**High Cohesion / Low Coupling** 的推導？","單一模組若同時處理付款、寄信、庫存，任何需求都可能改動它；拆成職責一致的元件會提高 Cohesion。透過穩定介面互通而非直接讀取彼此內部欄位，能降低 Coupling。"],["**Contract** 的三項約束為何缺一不可？","Precondition 指呼叫前輸入需合法；Postcondition 指成功執行後提供的保證；Invariant 指物件在合法可觀察狀態下始終需維持的性質。三者讓實作者與呼叫方對責任有共同界線。"],["**Layering** 為何有用？","UI、Business Logic、Data Management 等不同層處理不同關注點，減少畫面修改直接牽動資料儲存。層次是責任劃分，並非每層一定部署在獨立伺服器。"]],"examples":[["耦合過高 Before","**OrderPage** 直接連線資料庫、扣庫存、呼叫信用卡 API、寄送電子郵件。"],["責任拆分 After","**OrderUI → OrderService → PaymentGateway / InventoryRepository**；通知交由 NotificationService。"],["Precondition","**withdraw(amount)**：amount > 0 且餘額足夠。"],["Postcondition / Invariant","完成後餘額減少 amount；**balance ≥ 0** 為系統不允許透支時的不變條件。"]],"traps":[["題：Package A 依賴 B，代表 A 一定要在 B 全部完成後才開始？","**不一定。**可平行開發，重要的是 B 的介面契約及整合風險。"],["題：Postcondition 和 Invariant 相同嗎？","**不同。**前者是單次操作的完成保證；後者是物件長期應維持的限制。"]],"source":"Package Dependency、Contract、Cohesion 等考點參照 113期末考 Q21–23；分層示例為一般設計延伸。"},"ui":{"core":"**UI Design**：透過 Navigation、Input、Output 與一致的互動規則，使使用者能理解位置、完成任務並降低操作負擔。","why":[["**Navigation / Input / Output** 為何分開？","Navigation 決定去到哪個畫面或任務；Input 收集資訊；Output 顯示結果。三者分離可以明確檢查：使用者能否找到功能、輸入是否有效、結果是否易讀。"],["**Content Awareness** 與 **Consistency** 如何減少錯誤？","Content Awareness 讓使用者知道目前所在位置、正在操作哪筆資料；Consistency 讓按鈕、欄位、錯誤提示維持可預測，降低學習成本與誤操作。"],["**Essential UCD** 與 **Real UCD** 為何分成兩層？","Essential Use-Case Description 先描述使用者意圖與系統責任，不被介面細節綁死；Real UCD 才加入具體表單、按鈕及畫面。這有助於先驗證需求，再決定 UI 實作。"],["**Minimal User Effort** 不等於刪除所有步驟","重要交易仍需確認；真正要減少的是不必要的重複輸入、無意義切頁與難理解的操作，而不是犧牲安全性或可逆性。"]],"examples":[["Before","選課網站不顯示目前學期；所有課都擠在同一長表；送出後沒有成功訊息。"],["After · Navigation","提供 **Course Search → Details → Enrollment** 與明確麵包屑導航。"],["After · Input / Output","輸入課號與篩選條件；輸出課程名額、是否衝堂、確認編號。"],["Real UCD","按「Enroll」後系統顯示確認對話框，再送出表單並呈現結果。"]],"traps":[["題：使用者知道「目前在哪裡」，屬 Aesthetics？","**不對。**這主要是 Content Awareness。"],["題：Input 是畫面之間的移動機制？","**不對。**畫面導覽屬 Navigation，Input 負責蒐集資料。"]],"source":"UI 三機制、Content Awareness、Essential/Real UCD 等依 113期末考 p.1–2 題意；設計案例為補充。"},"data":{"core":"**Data & Database Design**：將業務資訊整理成一致、可管理的儲存結構，並透過 Normalization 降低冗餘與更新異常。","why":[["**Normalization** 為何不是直接追求更快？","如果把學生、課程、選課資料重複塞在同一張表，課程名稱修改要更新多列，容易發生不一致。正規化拆分重複資訊，可降低 Insert / Update / Delete Anomalies，但查詢可能需要更多 JOIN。"],["**1NF → 2NF → 3NF** 的判斷順序？","1NF 要求欄位原子且無 repeating groups；2NF 在 1NF 基礎上，非主屬性不可僅依賴候選鍵的一部分；3NF 在 2NF 基礎上，排除不當的傳遞相依。嚴格定義仍須考量 Superkey 與 Prime Attribute 的例外。"],["何時會出現 **Partial Dependency**？","例如 Enrollment(studentId, courseId, studentName, grade)，複合鍵為 (studentId, courseId)，studentName 只依賴 studentId，不依賴整個複合鍵；應將 Student 資訊分表。"],["**RDB / ORDB / OODB / NoSQL** 為何不能只用 SQL 區分？","資料模型與儲存結構是主要區別：RDB 是關聯式表；ORDB 延伸物件功能；OODB 儲存物件；NoSQL 包含 Document、Key-Value、Graph 等不同形式。是否支援 SQL 不足以單獨分類。"]],"examples":[["Before（未正規化）","**Enrollment**(studentId, studentName, courseId, courseName, grade)：學生及課程名稱會在多筆選課資料中重複。"],["After（拆表）","**Student**(studentId, studentName)、**Course**(courseId, courseName)、**Enrollment**(studentId, courseId, grade)。"],["Update Anomaly","若資料重複，修改課程名稱時漏改一列，會讓同一課程有不同名稱。"],["效能取捨","Normalized schema 維持資料一致性；報表查詢可能透過 JOIN、Index 或其他設計優化。"]],"traps":[["題：「Normalization 的目的在提升 Data Access Efficiency」？","**False。**主要著眼於冗餘、相依關係與資料一致性。"],["題：沒有 Partial Dependency 就直接符合 3NF？","**不一定。**還要檢查 Transitive Dependency 等條件。"]],"source":"Normalization 與 Data Stores 依 113期末考 p.1 Q5、p.2 Q35–36 的考點；嚴格定義補充自一般資料庫理論。"}};

["data","Which distinction fits 3NF study rules?","No partial dependencies|No repeating rows|No transitive dependency of non-prime attributes on a key|No foreign keys",2,"在課堂常用的 1NF→2NF→3NF 速記中，3NF 重點為去除傳遞相依。","嚴格的 3NF 定義涉及 superkey 與 prime attributes；本題採課堂速記層次。"]
].map((x,i)=>({id:i+1,topic:x[0],question:x[1],options:x[2].split("|"),answer:x[3],why:x[4],pit:x[5],source:i<6?"VT4C 新增練習（非原考古題）":"113期末考題型／課堂投影片考點改寫（非原卷逐字）"}));
const KEY="sad-final-study-v1";let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){}
const state={answers:{},flags:{},wrong:{},...saved};let view="cheats",category="all",quizFilter="all",query="";
const $=id=>document.getElementById(id);
const e=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(err){console.warn(err)}};
const answered=()=>QUESTIONS.filter(q=>state.answers[q.id]!==undefined).length;
const incorrect=()=>QUESTIONS.filter(q=>state.wrong[q.id]).length;
const label=k=>TOPICS.find(t=>t.key===k).zh;
function setView(v){view=v;category="all";quizFilter="all";query="";document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===v));render();window.scrollTo({top:0,behavior:"smooth"});}
function stats(){const a=answered(),w=incorrect();$("stats").innerHTML='<div class="card"><div class="meta">新增練習題</div><div class="num">'+QUESTIONS.length+'</div></div><div class="card"><div class="meta">已作答</div><div class="num">'+a+' / '+QUESTIONS.length+'</div></div><div class="card"><div class="meta">錯題待複習</div><div class="num">'+w+'</div></div><div class="card"><div class="meta">完成進度</div><div class="num">'+Math.round(a/QUESTIONS.length*100)+'%</div><div class="progress"><span style="width:'+Math.round(a/QUESTIONS.length*100)+'%"></span></div></div>';}
function filterTools(isQuiz){const opts='<option value="all">所有主題</option>'+TOPICS.map(t=>'<option value="'+t.key+'" '+(category===t.key?"selected":"")+'>'+e(t.zh)+' / '+e(t.name)+'</option>').join("");
return '<div class="toolbar"><label class="sr" for="topicFilter">按章節篩選</label><select id="topicFilter" onchange="category=this.value;render()"> '+opts+'</select>'+ (isQuiz?'<label class="sr" for="statusFilter">作答狀態</label><select id="statusFilter" onchange="quizFilter=this.value;render()"><option value="all">所有狀態</option><option value="unanswered" '+(quizFilter==="unanswered"?"selected":"")+'>未作答</option><option value="wrong" '+(quizFilter==="wrong"?"selected":"")+'>只看錯題</option><option value="flagged" '+(quizFilter==="flagged"?"selected":"")+'>只看收藏</option><option value="answered" '+(quizFilter==="answered"?"selected":"")+'>已作答</option></select>':'')+'<label class="sr" for="search">搜尋</label><input id="search" placeholder="搜尋考點、關鍵字 / Search" value="'+e(query)+'" oninput="query=this.value;updateContent()" autocomplete="off">'+(isQuiz?'<button class="btn" onclick="resetWrong()">清除錯題標記</button>':'')+'</div>';}
function inline(s){return e(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')}
function deepList(rows){return '<ul class="compactlist">'+rows.map(v=>'<li>'+inline(v)+'</li>').join('')+'</ul>'}
function deepRows(rows){return '<div class="concept-stack">'+rows.map(([head,body])=>'<div class="concept-item"><h4>'+inline(head)+'</h4><p>'+inline(body)+'</p></div>').join('')+'</div>'}
function cheats(){let arr=TOPICS.filter(t=>{const d=DEEP_DIVE[t.key];return (category==="all"||category===t.key)&&(!query||(t.zh+" "+t.name+" "+d.core+" "+d.why.flat().join(" ")+" "+d.examples.flat().join(" ")+" "+d.traps.flat().join(" ")).toLowerCase().includes(query.toLowerCase()))});
return '<div class="sectionheading"><h2>Concept Deep Dive · 觀念深度複習</h2><span class="meta">Core Definition → Why &amp; How → Concrete Example → Exam Checkpoints</span></div><div class="lesson">'+arr.map(t=>{const d=DEEP_DIVE[t.key];return '<article class="card studycard deepcard"><div class="studyhead"><span class="tag">'+e(t.group)+'</span><span class="tag">'+e(t.zh)+'</span></div><h2>'+e(t.name)+'</h2><section class="studysection"><h3>01 · Core Definition <small>核心定義</small></h3><p class="core-sentence">'+inline(d.core)+'</p></section><section class="studysection"><h3>02 · Why &amp; How <small>深層推導</small></h3>'+deepRows(d.why)+'</section><section class="studysection"><h3>03 · Concrete Example <small>實際案例</small></h3><div class="example-stack">'+d.examples.map(([head,body])=>'<div class="example-item"><b>'+e(head)+'</b><p>'+inline(body)+'</p></div>').join('')+'</div></section><section class="studysection"><h3>04 · Exam Traps &amp; Checkpoints <small>考試陷阱</small></h3><div class="exam-checks">'+d.traps.map(([q,a])=>'<div class="checkpoint"><b>'+inline(q)+'</b><p>'+inline(a)+'</p></div>').join('')+'</div></section><p class="source">'+e(d.source)+'</p><button class="btn small" onclick="setViewForTopic(\''+t.key+'\')">Practice '+e(t.name)+' →</button></article>'}).join("")+'</div>'+(arr.length?"":'<div class="card empty">沒有符合的章節，請調整搜尋條件。</div>');}
function setViewForTopic(k){setView("traps");category=k;render();}
function choices(q){const val=state.answers[q.id],done=val!==undefined;return '<div class="answers" role="group" aria-label="Q'+q.id+' options">'+q.options.map((o,i)=>'<button class="option '+(done?(i===q.answer?"correct":i===val?"incorrect":""):"")+'" onclick="answer('+q.id+','+i+')" '+(done?"disabled":"")+'><strong>'+String.fromCharCode(65+i)+'.</strong> '+e(o)+'</button>').join("")+'</div>';}
function quizCard(q){const val=state.answers[q.id],done=val!==undefined;
return '<article class="card qcard" id="q'+q.id+'"><div class="sectionheading"><div><span class="tag question">Question Q'+String(q.id).padStart(2,"0")+'</span> <span class="tag">'+e(label(q.topic))+'</span> '+(state.wrong[q.id]?'<span class="tag trap">錯題</span>':'')+'</div><button class="btn small" aria-label="標記第'+q.id+'題" onclick="toggleFlag('+q.id+')">'+(state.flags[q.id]?"★ 已收藏":"☆ 收藏")+'</button></div><div class="qtext">'+e(q.question)+'</div>'+choices(q)+(done?'<div class="feedback"><span class="tag answer">Standard Answer · 本站參考解答</span><div class="answerbox"><strong>'+String.fromCharCode(65+q.answer)+'. '+e(q.options[q.answer])+'</strong><p>'+e(q.why)+'</p></div><div class="pitfall"><span class="tag trap">Common Pitfall</span> '+e(q.pit)+'</div><button class="btn small" onclick="retry('+q.id+')">重做此題</button></div>':'<p class="meta">作答後顯示參考答案、原因與易錯陷阱。</p>')+'<div class="source">'+e(q.source)+'</div></article>';}
function traps(){const arr=QUESTIONS.filter(q=>(category==="all"||q.topic===category)&&(!query||(q.question+" "+q.options.join(" ")+q.why+" "+q.pit+" "+label(q.topic)).toLowerCase().includes(query.toLowerCase()))&&(quizFilter==="all"||quizFilter==="wrong"&&state.wrong[q.id]||quizFilter==="flagged"&&state.flags[q.id]||quizFilter==="answered"&&state.answers[q.id]!==undefined||quizFilter==="unanswered"&&state.answers[q.id]===undefined));return '<div class="sectionheading"><h2>歷屆考古題庫與陷阱解析</h2><span class="meta">依 113 年期末考考點及課堂主題改寫 · 不冒稱官方解答</span></div><p class="muted">點選答案後立即看解析。錯題會自動收集，可以按章節、未作答、收藏或錯題重練；重整網頁不會清除紀錄。</p><div class="sectionheading"><span class="tag">篩選結果 '+arr.length+' 題</span><button class="btn small" onclick="resetPractice()">重置所有新增練習題答案</button></div>'+arr.map(quizCard).join("")+(arr.length?"":'<div class="card empty"><h3>找不到符合條件的題目</h3><p class="muted">可改選「所有狀態」或其他章節。</p></div>');}
function render(){stats();$("pageTitle").textContent=view==="cheats"?"核心觀念速記 Cheat Sheets":"歷屆考古題庫與陷阱解析";$("pageSub").textContent=view==="cheats"?"Core Definition → Why & How → Concrete Example → Exam Traps。以繁體中文深入解說，保留英文專業術語。":"按章節與答題狀態篩選；題目、參考解答與 Common Pitfalls 分層閱讀。";$("view").innerHTML=filterTools(view==="traps")+'<div id="content">'+(view==="cheats"?cheats():traps())+'</div>';}
function updateContent(){$("content").innerHTML=view==="cheats"?cheats():traps();}
function answer(id,value){if(state.answers[id]!==undefined)return;let q=QUESTIONS.find(x=>x.id===id);state.answers[id]=value;if(value!==q.answer)state.wrong[id]=true;else delete state.wrong[id];save();render();let el=$("q"+id);if(el)el.scrollIntoView({block:"nearest"});}
function toggleFlag(id){state.flags[id]=!state.flags[id];save();render();const el=$("q"+id);if(el)el.scrollIntoView({block:"nearest"});}
function retry(id){delete state.answers[id];save();render();const el=$("q"+id);if(el)el.scrollIntoView({block:"nearest"});}
function resetWrong(){if(confirm("要清除錯題標記嗎？已作答的答案會保留。")){state.wrong={};quizFilter="all";save();render();}}
function resetPractice(){if(confirm("要重置這個期末模組的所有答案嗎？收藏與原版模擬考不受影響。")){state.answers={};state.wrong={};quizFilter="all";save();render();}}
document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));
render();
</script></body></html>
