nd Case</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> An appointment system illustrates planning, requirements, functional/structural/behavioral modeling and iterative delivery.</p><p style=\"white-space:pre-line\">SCENARIO (original teaching adaptation): A clinic uses paper schedules and phone calls. Patients need to request, reschedule and cancel appointments, while doctors maintain available hours. Receptionists manage requests; the system prevents duplicate bookings and confirms successful appointments. PLANNING: sponsor=clinic manager; need=reduce errors and administration. REQUIREMENTS: book/cancel/reschedule, maintain availability, prevent conflicts, confirmation; security and responsiveness as nonfunctional. FUNCTIONAL: actors Patient, Receptionist, Doctor; use cases Request Appointment, Cancel Appointment, Maintain Availability. STRUCTURAL: Patient, Doctor, Appointment, Availability. BEHAVIORAL: request → availability check → create or reject → confirmation. V&V: every requirement must map to behavior and appropriate object responsibilities.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>完整推導：Business Problem → System Request → Requirements → Actors/Use Cases → Classes → Sequence Messages → Tests。案例是依教材情境重新整理的教學範例，不是原書逐字內容。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">16 · Golden Rules & Three Concept Traps</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> Memorize the phase distinction, polymorphism and UP two-dimensional organization.</p><p style=\"white-space:pre-line\">EIGHT RULES: (1) Planning WHY; Analysis WHAT; Design HOW; Implementation BUILD. (2) Systems must deliver Business Value. (3) Requirements differ from technical specifications. (4) Object = instance of Class. (5) Generalization hollow arrow → superclass. (6) Runtime dispatch may call subclass overrides. (7) OOAD = use-case-driven + architecture-centric + iterative/incremental. (8) UP Phase = WHEN / Workflow = WHAT. TRAP A: Requirements exist ONLY in Inception? FALSE, workflows overlap phases. TRAP B: Parent-type reference can call subclass-specific overridden method? TRUE. TRAP C: Prototype discarded after exploration? Throwaway Prototyping.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>以上 8 句是考前速記。考題陷阱常見 only、always、與把不同分類方式寫成同義詞。</p></div></details><details class=\"card\" style=\"padding:16px\"><summary style=\"cursor:pointer;font-weight:700\">Mermaid · SDLC / UP / Clinic diagrams</summary><p class=\"small muted\">Copy the source into a Mermaid-compatible editor to render diagrams. The examples below are conceptual teaching representations.</p><pre style=\"white-space:pre-wrap;overflow-wrap:anywhere\">flowchart LR\n Planning --&gt; Analysis --&gt; Design --&gt; Implementation\n</pre><pre style=\"white-space:pre-wrap;overflow-wrap:anywhere\">classDiagram\n class Student\n class GradStudent\n Student &lt;|-- GradStudent\n</pre><pre style=\"white-space:pre-wrap;overflow-wrap:anywhere\">sequenceDiagram\n actor Patient\n participant Booking\n participant Schedule\n Patient-&gt;&gt;Booking: requestAppointment()\n Booking-&gt;&gt;Schedule: checkAvailability()\n Schedule--&gt;&gt;Booking: available\n Booking--&gt;&gt;Patient: confirmation\n</pre></details></section>";const LESSON_FULL={1:"<h1>Chapter 1. Introduction to System Development & Systems Analysis and Design</h1><p class=\"muted\">English-first definitions · 繁體中文深入解析 · SDLC / OOAD / UP / UML · Mermaid diagrams · V&V · Clinic walkthrough</p><nav class=\"toc\"><a class=\"pill\" href=\"#part1\">1. Core concepts</a><a class=\"pill\" href=\"#part2\">2. SDLC Four Phases</a><a class=\"pill\" href=\"#part3\">3. Methodologies</a><a class=\"pill\" href=\"#part4\">4. Object-Oriented Systems</a><a class=\"pill\" href=\"#part5\">5. OOAD and Unified Process</a><a class=\"pill\" href=\"#part6\">6. UML Modeling SOP</a><a class=\"pill\" href=\"#part7\">7. Clinic Walkthrough</a><a class=\"pill\" href=\"#part8\">8. Cheat Sheet & Quiz</a></nav>\n<section id=\"part1\"><h2>1. Core Definition & Theoretical Framework</h2><p><b>Systems Development Life Cycle (SDLC):</b> The process of understanding how an information system can support business needs, designing and building the system, and delivering it to users.</p><p>資訊系統開發的目標不是為技術而技術；真正的核心是 Business Value，包括降低成本、提升服務品質、改善營運效率。Business Need → Requirements → Models → Design → Operational System。各階段產出物為下個階段提供輸入，形成 progressive refinement。</p><h3>Key Glossary</h3><div style=\"overflow:auto\"><table><thead><tr><th>Term</th><th>English Definition</th><th>中文關鍵辨析</th></tr></thead><tbody><tr><td>SDLC</td><td>The overall systems development lifecycle.</td><td>系統開發生命週期，涵蓋 Planning, Analysis, Design, Implementation。</td></tr><tr><td>Systems Analyst</td><td>A professional who analyzes business situations, identifies improvements and defines information-system solutions.</td><td>不是只負責程式設計，而要理解企業流程與價值。</td></tr><tr><td>Project Sponsor</td><td>The stakeholder promoting and supporting a project based on business need.</td><td>專案發起人，協助定義業務目標。</td></tr><tr><td>Deliverable</td><td>A specific document, model, or product produced by a development task.</td><td>每階段都應產出可供後續使用的成果。</td></tr><tr><td>As-Is System</td><td>The current business process or system.</td><td>現行系統。</td></tr><tr><td>To-Be System</td><td>The proposed future business process or system.</td><td>未來系統。</td></tr><tr><td>Business Value</td><td>Benefits created for the organization by the system.</td><td>可為可衡量或難量化的效益。</td></tr><tr><td>Verification</td><td>Checking whether a specification or model is internally correct.</td><td>是否正確照規格建立。</td></tr><tr><td>Validation</td><td>Checking whether the system/model satisfies actual stakeholder needs.</td><td>是否滿足真正業務需求。</td></tr></tbody></table></div></section>\n<section id=\"part2\"><h2>2. Four Fundamental SDLC Phases</h2><pre class=\"mermaid\">flowchart LR\\n P[\"Planning: WHY\"] --> A[\"Analysis: WHAT\"]\\n A --> D[\"Design: HOW\"]\\n D --> I[\"Implementation: BUILD / TEST / DEPLOY\"]</pre><details><summary>Copyable Mermaid source</summary><pre><code>flowchart LR\\n P[\"Planning: WHY\"] --> A[\"Analysis: WHAT\"]\\n A --> D[\"Design: HOW\"]\\n D --> I[\"Implementation: BUILD / TEST / DEPLOY\"]</code></pre></details><h3>Planning: Why build the system?</h3><p><b>Project Initiation:</b> Receive System Request or RFP; clarify the Business Problem, Goals and expected Business Value; perform Technical, Economic and Organizational Feasibility; obtain approval. <b>Project Management:</b> Develop Work Plan, Staff Project, Monitor and Control. Deliverables: System Request, Feasibility Analysis, Project Plan.</p><p>System Request typically contains Project Sponsor, Business Need, Business Requirements, Business Value, and Special Issues. RFP (Request for Proposal) solicits external vendor proposals; it is not identical to an internal System Request.</p><div style=\"overflow:auto\"><table><thead><tr><th>Feasibility</th><th>Central Question</th><th>Key Checks</th></tr></thead><tbody><tr><td>Technical Feasibility</td><td>Can we build it?</td><td>Technology familiarity, functional-area knowledge, project size, compatibility.</td></tr><tr><td>Economic Feasibility</td><td>Should we build it?</td><td>Development/operating costs, annual benefits, tangible and intangible value.</td></tr><tr><td>Organizational Feasibility</td><td>Will they come?</td><td>Strategic alignment, management support, champions, adoption.</td></tr></tbody></table></div><h3>Analysis: What should the system do?</h3><p>Develop Analysis Strategy by investigating As-Is and To-Be operations. Gather and refine Requirements, specify WHO / WHAT / WHERE / WHEN, and create Functional, Structural and Behavioral Models. Deliverable: <b>System Proposal</b>, consolidating Requirements Definition, System Concept and models. Analysis emphasizes logical business requirements rather than selected server products or SQL implementation.</p><h3>Design: How will the system work?</h3><p>Four steps: (1) Design Strategy (Build, Buy, Outsource). (2) Architecture and Interface Design (Software, Hardware, Network; User Interface and Component Interface). (3) Database and File Specifications. (4) Program Design defining modules and inputs/outputs. Deliverable: <b>System Specification</b>.</p><h3>Implementation: Build, test, install and support</h3><p>System Construction (coding/testing), Installation and User Training, Support and Maintenance, and Configuration Management. Configuration Management includes identifying controlled configuration items, managing changes, and maintaining version/status records; Git alone is not the whole discipline.</p><div style=\"overflow:auto\"><table><thead><tr><th>Dimension</th><th>Planning</th><th>Analysis</th><th>Design</th><th>Implementation</th></tr></thead><tbody><tr><td>Main question</td><td>WHY?</td><td>WHAT? WHO? WHERE? WHEN?</td><td>HOW?</td><td>BUILD / DELIVER?</td></tr><tr><td>Major deliverable</td><td>Project Plan</td><td>System Proposal</td><td>System Specification</td><td>Operational System</td></tr><tr><td>Typical activity</td><td>Business feasibility</td><td>Elicit requirements</td><td>Design UI/database</td><td>Testing/training</td></tr><tr><td>Frequent trap</td><td>Need ≠ features</td><td>Do not over-specify technologies</td><td>Detailed technical choices</td><td>Coding is not the only activity</td></tr></tbody></table></div></section>\n<section id=\"part3\"><h2>3. Systems Development Methodologies</h2><p><b>Methodology:</b> A formalized approach to performing SDLC activities, techniques and deliverables. SDLC describes the broad process; a methodology defines how work is ordered, iterated and controlled.</p><h3>Waterfall Development</h3><p>Sequential phases with major deliverables and approval checkpoints. Benefits: clear milestones, documentation and formal control. Risks: late feedback, costly requirement changes and rework. Appropriate when needs are stable.</p><pre class=\"mermaid\">flowchart TD\\n A[\"Planning\"] --> B[\"Analysis\"]\\n B --> C[\"Design\"]\\n C --> D[\"Implementation\"]\\n D --> E[\"Testing / Installation / Support\"]</pre><details><summary>Copyable Mermaid source</summary><pre><code>flowchart TD\\n A[\"Planning\"] --> B[\"Analysis\"]\\n B --> C[\"Design\"]\\n C --> D[\"Implementation\"]\\n D --> E[\"Testing / Installation / Support\"]</code></pre></details><p>In the four-phase SDLC, testing belongs within Implementation even if a Waterfall teaching diagram shows it as a distinct step.</p><h3>Parallel Development vs. V-Model</h3><p><b>Parallel Development:</b> Subprojects proceed concurrently after common high-level design, shortening elapsed time but increasing coordination and integration risks. <b>V-Model:</b> Development artifacts correspond to testing activities; testing is planned with specifications.</p><pre class=\"mermaid\">flowchart TB\\n R[\"User Requirements\"] --- AT[\"Acceptance Tests\"]\\n S[\"System Specifications\"] --- ST[\"System Tests\"]\\n H[\"Architecture\"] --- IT[\"Integration Tests\"]\\n D[\"Detailed Design\"] --- UT[\"Unit Tests\"]\\n R --> S --> H --> D --> C[\"Code\"]\\n C --> UT --> IT --> ST --> AT</pre><details><summary>Copyable Mermaid source</summary><pre><code>flowchart TB\\n R[\"User Requirements\"] --- AT[\"Acceptance Tests\"]\\n S[\"System Specifications\"] --- ST[\"System Tests\"]\\n H[\"Architecture\"] --- IT[\"Integration Tests\"]\\n D[\"Detailed Design\"] --- UT[\"Unit Tests\"]\\n R --> S --> H --> D --> C[\"Code\"]\\n C --> UT --> IT --> ST --> AT</code></pre></details><h3>Phased Development</h3><p>Deliver successive functional releases: Clinic R1 Booking → R2 Availability → R3 Notifications → R4 Analytics. Earlier delivery creates feedback and value; risks include incomplete early functionality and dependency between releases.</p><h3>Prototyping</h3><div style=\"overflow:auto\"><table><thead><tr><th>Aspect</th><th>Evolutionary Prototyping</th><th>Throwaway Prototyping</th></tr></thead><tbody><tr><td>Prototype fate</td><td>Refined into production system</td><td>Discarded after exploration</td></tr><tr><td>Goal</td><td>Evolve a working solution</td><td>Resolve uncertainty</td></tr><tr><td>Risk</td><td>Early shortcuts may persist</td><td>Exploration effort is discarded</td></tr></tbody></table></div><p>Prototype is not automatically production-grade. <b>Iterative</b> means repeated refinement; <b>Incremental</b> means additions across releases.</p><h3>Agile: XP and Scrum</h3><p><b>XP (eXtreme Programming)</b> focuses engineering feedback: Pair Programming, TDD (Failing Test → Passing Code → Refactor), Continuous Integration, Small Releases and Refactoring. <b>Scrum</b> provides a time-boxed Sprint framework: Product Backlog, Sprint Planning, Daily Scrum, Sprint Review, Sprint Retrospective; Product Owner, Scrum Master and Developers. XP and Scrum can complement each other.</p><h3>DevOps</h3><pre class=\"mermaid\">flowchart LR\\n P[\"Plan\"] --> C[\"Code\"] --> B[\"Build\"] --> T[\"Test\"] --> R[\"Release\"] --> D[\"Deploy\"] --> O[\"Operate\"] --> M[\"Monitor\"] --> P</pre><details><summary>Copyable Mermaid source</summary><pre><code>flowchart LR\\n P[\"Plan\"] --> C[\"Code\"] --> B[\"Build\"] --> T[\"Test\"] --> R[\"Release\"] --> D[\"Deploy\"] --> O[\"Operate\"] --> M[\"Monitor\"] --> P</code></pre></details><p>DevOps integrates Development, Operations and automation. <b>CI:</b> frequently integrate changes with automated validation. <b>Continuous Delivery:</b> keep updates releasable. <b>Continuous Deployment:</b> automatically deploy qualifying changes. CI does NOT necessarily mean production deployment.</p><div style=\"overflow:auto\"><table><thead><tr><th>Model</th><th>Core Structure</th><th>Strength</th><th>Main Risk</th></tr></thead><tbody><tr><td>Waterfall</td><td>Sequential</td><td>Control/documentation</td><td>Late changes</td></tr><tr><td>V-Model</td><td>Development/testing correspondence</td><td>Test traceability</td><td>Rigidity</td></tr><tr><td>Parallel</td><td>Concurrent subprojects</td><td>Shorter elapsed time</td><td>Integration</td></tr><tr><td>Phased</td><td>Incremental releases</td><td>Early usable value</td><td>Release dependencies</td></tr><tr><td>Evolutionary Prototype</td><td>Refinement into product</td><td>Frequent feedback</td><td>Technical debt</td></tr><tr><td>Throwaway Prototype</td><td>Explore and discard</td><td>Requirements clarity</td><td>Discarded effort</td></tr><tr><td>XP</td><td>Short engineering cycles</td><td>Technical quality feedback</td><td>Needs discipline</td></tr><tr><td>Scrum</td><td>Sprint framework</td><td>Transparency/adaptation</td><td>Engineering practices must be added</td></tr><tr><td>DevOps</td><td>Build-deliver-operate loop</td><td>Reliable frequent delivery</td><td>Operational complexity</td></tr></tbody></table></div></section>\n<section id=\"part4\"><h2>4. Object-Oriented Information Systems (OOIS)</h2><p><b>Class:</b> A template defining shared structure and behavior. <b>Object:</b> A distinct instance of a Class with Identity, State and Behavior. <b>Attribute:</b> Relevant information characterizing an object. <b>Operation:</b> Supported behavior specification. <b>Method:</b> Concrete implementation. <b>Message:</b> Request sent to an object to invoke behavior, often with parameters and return values.</p><pre><code>Student joe = new Student();\nCourse sa = new Course();\njoe.addCourse(sa);</code></pre><p>Student / Course are classes; joe / sa are instances; addCourse is a method invocation or message. The Java snippet presumes suitable constructors and methods exist.</p><pre class=\"mermaid\">classDiagram\\n class Student {\\n -String name\\n -String major\\n +addCourse(Course c)\\n +dropCourse(Course c)\\n }\\n class Course {\\n -String courseName\\n -String courseCode\\n }\\n Student \"0..*\" -- \"0..*\" Course : enrolls</pre><details><summary>Copyable Mermaid source</summary><pre><code>classDiagram\\n class Student {\\n -String name\\n -String major\\n +addCourse(Course c)\\n +dropCourse(Course c)\\n }\\n class Course {\\n -String courseName\\n -String courseCode\\n }\\n Student \"0..*\" -- \"0..*\" Course : enrolls</code></pre></details><h3>Encapsulation vs Information Hiding</h3><p><b>Encapsulation:</b> Combine state and operations within a Class. <b>Information Hiding:</b> Conceal internal representation and expose required interfaces. Encapsulation groups; information hiding restricts access.</p><h3>Inheritance / Generalization / Abstraction</h3><p>Generalization models an <b>IS-A</b> relationship. UML uses a solid line and a <b>hollow triangle pointing to the Superclass</b>. A Superclass is not automatically an Abstract Class. Abstract classes generally cannot be instantiated directly; concrete superclasses can.</p><pre class=\"mermaid\">classDiagram\\n Student <|-- GradStudent\\n Student <|-- UnderGradStudent\\n class Student {\\n +addCourse()\\n +payTuition()\\n }\\n class GradStudent {\\n +writeThesis()\\n }\\n class UnderGradStudent {\\n +payTuition()\\n }</pre><details><summary>Copyable Mermaid source</summary><pre><code>classDiagram\\n Student &lt;|-- GradStudent\\n Student &lt;|-- UnderGradStudent\\n class Student {\\n +addCourse()\\n +payTuition()\\n }\\n class GradStudent {\\n +writeThesis()\\n }\\n class UnderGradStudent {\\n +payTuition()\\n }</code></pre></details><h3>Polymorphism, Overriding and Dynamic Binding</h3><p>Polymorphism permits subtype-specific implementation through a shared parent/interface. In Java, <code>Animal a = new Bird(); a.move();</code> normally executes Bird's overridden instance method; <code>a = new Crab(); a.move();</code> invokes Crab's implementation. Overriding differs from Overloading. Runtime Dynamic Dispatch selects the concrete receiver's overridden method.</p><pre class=\"mermaid\">classDiagram\\n Animal <|-- Bird\\n Animal <|-- Crab\\n Animal <|-- Snake\\n class Animal {\\n +move()\\n }\\n class Bird {\\n +move()\\n }\\n class Crab {\\n +move()\\n }\\n class Snake {\\n +move()\\n }</pre><details><summary>Copyable Mermaid source</summary><pre><code>classDiagram\\n Animal &lt;|-- Bird\\n Animal &lt;|-- Crab\\n Animal &lt;|-- Snake\\n class Animal {\\n +move()\\n }\\n class Bird {\\n +move()\\n }\\n class Crab {\\n +move()\\n }\\n class Snake {\\n +move()\\n }</code></pre></details><div style=\"overflow:auto\"><table><thead><tr><th>Concept</th><th>Meaning</th><th>Exam distinction</th></tr></thead><tbody><tr><td>Class / Object</td><td>Template / Instance</td><td>Student vs joe</td></tr><tr><td>Encapsulation / Hiding</td><td>Grouping / Restricting access</td><td>Not identical</td></tr><tr><td>Generalization</td><td>IS-A relationship</td><td>Triangle points to parent</td></tr><tr><td>Polymorphism</td><td>Runtime subtype behavior</td><td>Overriding vs Overloading</td></tr></tbody></table></div></section>\n<section id=\"part5\"><h2>5. OOAD Principles and Unified Process</h2><p><b>OOAD: Use-Case Driven, Architecture-Centric, Iterative and Incremental.</b></p><p><b>Functional View:</b> External functions using Use Case Diagram, Activity Diagram and Use-Case Description. <b>Structural View:</b> Classes and static relationships using CRC Cards, Class Diagram and Object Diagram. <b>Behavioral View:</b> Object interactions/state using Sequence, Communication and State Machine Diagrams. All views must remain consistent.</p><pre class=\"mermaid\">flowchart TD\\n R[\"Requirements\"] --> F[\"Functional Models: External View\"]\\n F --> S[\"Structural Models: Static View\"]\\n S --> B[\"Behavioral Models: Dynamic View\"]\\n B -. \"Refine responsibilities\" .-> S\\n B -. \"Check scenarios\" .-> F\\n F -. \"Clarify requirement\" .-> R</pre><details><summary>Copyable Mermaid source</summary><pre><code>flowchart TD\\n R[\"Requirements\"] --> F[\"Functional Models: External View\"]\\n F --> S[\"Structural Models: Static View\"]\\n S --> B[\"Behavioral Models: Dynamic View\"]\\n B -. \"Refine responsibilities\" .-> S\\n B -. \"Check scenarios\" .-> F\\n F -. \"Clarify requirement\" .-> R</code></pre></details><h3>Unified Process (UP)</h3><p>UP is an iterative and incremental process using two dimensions: <b>Phases (WHEN)</b> and <b>Workflows (WHAT ACTIVITIES)</b>. Its four phases are Inception (scope/business case; Lifecycle Objectives), Elaboration (core architecture/risks; Lifecycle Architecture), Construction (build/test; Initial Operational Capability) and Transition (deploy/accept; Product Release).</p><div style=\"overflow:auto\"><table><thead><tr><th>Workflow</th><th>Inception</th><th>Elaboration</th><th>Construction</th><th>Transition</th></tr></thead><tbody><tr><td>Business Modeling</td><td>High</td><td>Medium</td><td>Low</td><td>Low</td></tr><tr><td>Requirements</td><td>High</td><td>High</td><td>Medium</td><td>Low</td></tr><tr><td>Analysis</td><td>Medium</td><td>High</td><td>Medium</td><td>Low</td></tr><tr><td>Design</td><td>Low</td><td>High</td><td>High</td><td>Low</td></tr><tr><td>Implementation</td><td>Low</td><td>Medium</td><td>High</td><td>Medium</td></tr><tr><td>Testing</td><td>Low</td><td>Medium</td><td>High</td><td>High</td></tr><tr><td>Deployment</td><td>Low</td><td>Low</td><td>Medium</td><td>High</td></tr></tbody></table></div><p>Engineering Workflows: Business Modeling, Requirements, Analysis, Design, Implementation, Test, Deployment. Supporting Workflows: Project Management, Configuration and Change Management, Environment. This intensity matrix is a qualitative learning aid, not a copied quantitative UP workload curve.</p><p><b>Trap:</b> Requirements do not occur ONLY in Inception. Workflows span multiple phases. UP phases are not one-to-one renamings of four SDLC phases.</p></section>\n<section id=\"part6\"><h2>6. UML and Standard Modeling SOP</h2><p><b>Unified Modeling Language (UML)</b> is a standardized visual modeling language, NOT an SDLC methodology. UML diagrams can describe functional, static and behavioral views. This course teaches Use Case, Activity, Class, Object, Sequence, Communication and State Machine diagrams. The lecturer's count of UML diagram types may follow a different edition/grouping; do not invent an extra diagram type merely to match a quoted count.</p><div style=\"overflow:auto\"><table><thead><tr><th>Symbol / Model</th><th>Meaning</th><th>Key rule</th></tr></thead><tbody><tr><td>Stick Figure</td><td>Actor</td><td>Outside the system boundary</td></tr><tr><td>Oval</td><td>Use Case</td><td>Inside the subject boundary</td></tr><tr><td>Class Rectangle</td><td>Class</td><td>Name / Attributes / Operations</td></tr><tr><td>Hollow Triangle</td><td>Generalization</td><td>Points to superclass</td></tr><tr><td>Dashed «include»</td><td>Required reuse</td><td>Base → included</td></tr><tr><td>Dashed «extend»</td><td>Optional extension</td><td>Extension → base</td></tr><tr><td>Multiplicity 1, 0..1, *</td><td>Allowed instances</td><td>Read at association endpoint</td></tr><tr><td>Lifeline / Message</td><td>Object interaction over time</td><td>Messages match responsibilities</td></tr><tr><td>[guard]</td><td>Conditional flow or transition</td><td>Explicit condition</td></tr></tbody></table></div><h3>Chapter 1 Introductory Seven-Step Modeling Guide</h3><ol><li>Identify Business Problem, Value and Scope.</li><li>Identify Stakeholders, Actors and Requirements.</li><li>Build Functional View using Use Cases and activities.</li><li>Derive Structural View from relevant domain concepts and responsibilities.</li><li>Derive Behavioral View from object interactions and state changes.</li><li>Verify syntax and validate against stakeholder needs.</li><li>Iteratively refine the views and resolve inconsistencies.</li></ol><p><strong>Important distinction:</strong> This is an integrated Chapter 1 overview and NOT the later Chapter 4 structural CRC-to-class-diagram seven-step procedure.</p><h3>Cross-Model V&V</h3><ul><li>Each major Use Case traces to a requirement.</li><li>Object lifelines correspond to meaningful Class instances.</li><li>Messages invoke supported responsibilities / operations.</li><li>Class associations support scenario interactions.</li><li>Alternate and exception paths are addressed.</li><li>Analysis models remain logical rather than cluttered with technical infrastructure.</li><li>Names, business rules and constraints agree across models.</li></ul><h3>Five Modeling Pitfalls</h3><ol><li>Analysis confused with technical Design.</li><li>Generalization hollow triangle points to subclass rather than superclass.</li><li>«include» confused with «extend».</li><li>Irrelevant Classes invented without requirement support.</li><li>Models contradict each other because cross-model V&V is omitted.</li></ol></section>\n<section id=\"part7\"><h2>7. End-to-End Walkthrough: Health Clinic Appointment System</h2><h3>English Scenario Requirements</h3><blockquote>A community health clinic currently manages appointments using telephone calls and paper schedules. Receptionists spend significant time checking physician availability, recording patient details and resolving scheduling conflicts. Patients want to request, view, reschedule and cancel appointments, while doctors need to maintain consultation availability. The clinic manager wants to prevent double bookings and reduce manual administrative workload. After an appointment has been accepted, the system should notify the patient. Sensitive patient information must not be disclosed to unauthorized users. The development team must identify the business need, define the system's functional and nonfunctional requirements, model actors and domain objects, and test whether appointment requests can be completed without scheduling conflicts. The clinic also wants to retain a staffed telephone channel for patients who cannot use the online interface. The team should select a development approach that supports early user feedback and staged delivery.</blockquote><h3>Project Initiation / System Request</h3><div style=\"overflow:auto\"><table><thead><tr><th>Field</th><th>Derived Content</th></tr></thead><tbody><tr><td>Sponsor</td><td>Clinic Manager</td></tr><tr><td>Business Need</td><td>Reduce duplicate bookings, processing time and errors</td></tr><tr><td>Requirements</td><td>Booking, rescheduling, cancellation, availability, confirmation</td></tr><tr><td>Business Value</td><td>Reliable schedules and improved patient service</td></tr><tr><td>Special Issues</td><td>Patient confidentiality, staff training</td></tr></tbody></table></div><h3>Requirements Definition</h3><ul><li>FR-01: The system shall allow patients to request appointments.</li><li>FR-02: The system shall allow authorized users to reschedule appointments.</li><li>FR-03: The system shall allow patients to cancel appointments.</li><li>FR-04: The system shall allow doctors to update consultation availability.</li><li>FR-05: The system shall reject conflicting appointments.</li><li>FR-06: The system shall provide confirmation for accepted bookings.</li><li>NFR-01: Only authorized users may access patient information.</li><li>NFR-02: Booking data must be stored reliably.</li><li>NFR-03: The interface must be usable by patients and receptionists.</li></ul><h3>Functional View (Conceptual Mermaid representation)</h3><pre class=\"mermaid\">flowchart LR\\n P[\"Patient\"] --- U1([\"Request Appointment\"])\\n P --- U2([\"Cancel Appointment\"])\\n R[\"Receptionist\"] --- U1\\n D[\"Doctor\"] --- U3([\"Maintain Availability\"])\\n U1 -. \"triggers\" .-> U4([\"Send Confirmation\"])</pre><details><summary>Copyable Mermaid source</summary><pre><code>flowchart LR\\n P[\"Patient\"] --- U1([\"Request Appointment\"])\\n P --- U2([\"Cancel Appointment\"])\\n R[\"Receptionist\"] --- U1\\n D[\"Doctor\"] --- U3([\"Maintain Availability\"])\\n U1 -. \"triggers\" .-> U4([\"Send Confirmation\"])</code></pre></details><p>Mermaid Flowchart approximates the concept but is <b>not a formally exact UML Use Case Diagram</b>; the dotted line above means only conceptual relationship and is NOT automatically an «include» or «extend».</p><h3>Structural View</h3><pre class=\"mermaid\">classDiagram\\n class Patient {\\n +patientId\\n +name\\n +requestAppointment()\\n }\\n class Doctor {\\n +doctorId\\n +updateAvailability()\\n }\\n class Appointment {\\n +appointmentId\\n +status\\n +confirm()\\n +cancel()\\n }\\n class Availability {\\n +startTime\\n +endTime\\n }\\n Patient \"1\" -- \"0..*\" Appointment : requests\\n Doctor \"1\" -- \"0..*\" Appointment : attends\\n Doctor \"1\" -- \"0..*\" Availability : maintains</pre><details><summary>Copyable Mermaid source</summary><pre><code>classDiagram\\n class Patient {\\n +patientId\\n +name\\n +requestAppointment()\\n }\\n class Doctor {\\n +doctorId\\n +updateAvailability()\\n }\\n class Appointment {\\n +appointmentId\\n +status\\n +confirm()\\n +cancel()\\n }\\n class Availability {\\n +startTime\\n +endTime\\n }\\n Patient \"1\" -- \"0..*\" Appointment : requests\\n Doctor \"1\" -- \"0..*\" Appointment : attends\\n Doctor \"1\" -- \"0..*\" Availability : maintains</code></pre></details><p>Multiplicity: Each Appointment in this simplified example is associated with one Patient; one Patient may have zero or many Appointments. Multiplicity is read from the opposite endpoint.</p><h3>Behavioral View</h3><pre class=\"mermaid\">sequenceDiagram\\n actor Patient\\n participant UI as Appointment UI\\n participant Service as Appointment Service\\n participant Schedule\\n participant Appointment\\n Patient->>UI: requestAppointment(dateTime)\\n UI->>Service: submitRequest(dateTime)\\n Service->>Schedule: checkAvailability(dateTime)\\n Schedule-->>Service: available\\n alt Slot available\\n Service->>Appointment: createAppointment()\\n Appointment-->>Service: confirmation\\n Service-->>UI: bookingConfirmed()\\n UI-->>Patient: displayConfirmation()\\n else Slot unavailable\\n Service-->>UI: bookingRejected()\\n UI-->>Patient: requestAnotherSlot()\\n end</pre><details><summary>Copyable Mermaid source</summary><pre><code>sequenceDiagram\\n actor Patient\\n participant UI as Appointment UI\\n participant Service as Appointment Service\\n participant Schedule\\n participant Appointment\\n Patient->>UI: requestAppointment(dateTime)\\n UI->>Service: submitRequest(dateTime)\\n Service->>Schedule: checkAvailability(dateTime)\\n Schedule-->>Service: available\\n alt Slot available\\n Service->>Appointment: createAppointment()\\n Appointment-->>Service: confirmation\\n Service-->>UI: bookingConfirmed()\\n UI-->>Patient: displayConfirmation()\\n else Slot unavailable\\n Service-->>UI: bookingRejected()\\n UI-->>Patient: requestAnotherSlot()\\n end</code></pre></details><p>UI and Service are illustrative design-level participants. Analysis-level sequence diagrams should follow the lecturer's required abstraction and notation.</p><h3>V&V and Traceability</h3><div style=\"overflow:auto\"><table><thead><tr><th>Requirement</th><th>Functional Artifact</th><th>Structural Element</th><th>Behavioral Validation</th></tr></thead><tbody><tr><td>Book appointment</td><td>Request Appointment Use Case</td><td>Patient / Appointment</td><td>Request → Availability → Create</td></tr><tr><td>Maintain availability</td><td>Maintain Availability Use Case</td><td>Doctor / Availability</td><td>Update period</td></tr><tr><td>Prevent conflicts</td><td>Validation path</td><td>Availability / Appointment</td><td>Reject unavailable slot</td></tr><tr><td>Confirm booking</td><td>Confirmation flow</td><td>Appointment</td><td>Return confirmation</td></tr></tbody></table></div><p><b>Recommended Methodology:</b> Phased iterative releases. R1 Basic Booking; R2 Availability and Conflict Prevention; R3 Rescheduling and Notifications; R4 Reporting. The choice is an instructional inference, not a verbatim mandated textbook selection.</p></section>\n<section id=\"part8\"><h2>8. Cheat Sheet · Golden Rules</h2><ol><li><b>Planning asks WHY; Analysis asks WHAT; Design asks HOW; Implementation BUILDS and DELIVERS.</b></li><li>Every Information System should be justified by Business Value.</li><li>Requirements describe capabilities; design defines technical solutions.</li><li>Object is an instance of a Class; a Message requests behavior.</li><li>Generalization hollow triangle always points to the Superclass.</li><li>Polymorphism supports subtype-specific behavior through a common interface.</li><li>OOAD is Use-Case Driven, Architecture-Centric and Iterative/Incremental.</li><li>UP Phases describe WHEN; Workflows describe WHAT.</li></ol>\n<section class=\"quiz\"><h3>Quick Concept Check 1</h3><p><strong>In UP, the Requirements Workflow occurs only during Inception.</strong></p><button data-q=\"1\" data-option=\"0\" onclick=\"lessonAnswer('chapter1.html-1',0,1)\">A. True</button><button data-q=\"1\" data-option=\"1\" onclick=\"lessonAnswer('chapter1.html-1',1,1)\">B. False</button><div id=\"fbchapter1.html-1\"></div><div id=\"expchapter1.html-1\" hidden><b>Correct answer: B.</b> UP Workflows span multiple phases; requirements can be refined in later iterations. 中文：only 是陷阱。Workflow 與 Phase 不是一對一。</div><details><summary>English explanation / 中文解析</summary><p>UP Workflows span multiple phases; requirements can be refined in later iterations.</p><p>only 是陷阱。Workflow 與 Phase 不是一對一。</p></details></section>\n<section class=\"quiz\"><h3>Quick Concept Check 2</h3><p><strong>Which describes runtime polymorphism?</strong></p><button data-q=\"2\" data-option=\"0\" onclick=\"lessonAnswer('chapter1.html-2',0,1)\">A. All subclasses must have identical attribute values.</button><button data-q=\"2\" data-option=\"1\" onclick=\"lessonAnswer('chapter1.html-2',1,1)\">B. Superclass references may invoke a subclass's overridden instance method.</button><button data-q=\"2\" data-option=\"2\" onclick=\"lessonAnswer('chapter1.html-2',2,1)\">C. All subclasses must override every operation.</button><button data-q=\"2\" data-option=\"3\" onclick=\"lessonAnswer('chapter1.html-2',3,1)\">D. All superclasses are abstract.</button><div id=\"fbchapter1.html-2\"></div><div id=\"expchapter1.html-2\" hidden><b>Correct answer: B.</b> Dynamic dispatch invokes the method of the concrete runtime object for normally overridden methods. 中文：動態派發依實際物件型別執行覆寫方法；父類別並不必然抽象。</div><details><summary>English explanation / 中文解析</summary><p>Dynamic dispatch invokes the method of the concrete runtime object for normally overridden methods.</p><p>動態派發依實際物件型別執行覆寫方法；父類別並不必然抽象。</p></details></section>\n<section class=\"quiz\"><h3>Quick Concept Check 3</h3><p><strong>A prototype is used to compare UI alternatives and then discarded. Which approach?</strong></p><button data-q=\"3\" data-option=\"0\" onclick=\"lessonAnswer('chapter1.html-3',0,2)\">A. Waterfall</button><button data-q=\"3\" data-option=\"1\" onclick=\"lessonAnswer('chapter1.html-3',1,2)\">B. Evolutionary Prototyping</button><button data-q=\"3\" data-option=\"2\" onclick=\"lessonAnswer('chapter1.html-3',2,2)\">C. Throwaway Prototyping</button><button data-q=\"3\" data-option=\"3\" onclick=\"lessonAnswer('chapter1.html-3',3,2)\">D. Parallel Development</button><div id=\"fbchapter1.html-3\"></div><div id=\"expchapter1.html-3\" hidden><b>Correct answer: C.</b> The exploratory prototype is discarded after learning, defining Throwaway Prototyping. 中文：判斷原型是繼續演進還是丟棄。</div><details><summary>English explanation / 中文解析</summary><p>The exploratory prototype is discarded after learning, defining Throwaway Prototyping.</p><p>判斷原型是繼續演進還是丟棄。</p></details></section>\n<button onclick=\"lessonMarkDone(1)\">✓ Mark Chapter 1 as reviewed</button> <span id=\"reading1\"></span></section>\n<p class=\"muted\">Source alignment: Professor C.Y. Chen 2026 Chapter 1 slides; Dennis, Wixom & Tegarden Chapter 1 textbook. Workflow diagrams, comparison analyses and clinic scenario are instructional adaptations. Mermaid diagrams use a CDN and require internet access for rendering; textual content remains readable without it.</p>",2:"<h1>Chapter 2. Requirements Determination</h1><p class=\"muted\">English-first · 繁體中文補充 · 8 Analysis Strategies · 5 Gathering Techniques · Text Analysis · VT4C · Clinic Case Study</p><nav class=\"toc\"><a class=\"pill\" href=\"#part1\">1. Core Concepts</a><a class=\"pill\" href=\"#part2\">2. 8 Analysis Strategies</a><a class=\"pill\" href=\"#part3\">3. 5 Gathering Techniques</a><a class=\"pill\" href=\"#part4\">4. Documentation and Priorities</a><a class=\"pill\" href=\"#part5\">5. Text Analysis & VT4C</a><a class=\"pill\" href=\"#part6\">6. Requirements SOP and V&V</a><a class=\"pill\" href=\"#part7\">7. Clinic Walkthrough</a><a class=\"pill\" href=\"#part8\">8. Classroom Registration Case</a><a class=\"pill\" href=\"#part9\">9. Golden Rules & Quiz</a></nav>\n<section id=\"part1\"><h2>1. Core Concepts & Terminology</h2><p><b>Requirement:</b> A statement of what a system must do or what characteristic it must have to serve and support users' needs. <b>Requirements Determination:</b> Gathering, analyzing, refining and documenting needed capabilities and constraints.</p><p>本章屬於 SDLC Analysis。它把 System Request 中的高階 Business Need 細化成清楚的 Requirements Definition，支援後續 Functional、Structural、Behavioral Models，最後整合為 System Proposal。需求錯誤越晚發現，返工成本越大，因此不能把蒐集到的片段敘述直接當作已確認規格。</p><pre class=\"mermaid\">flowchart TD\\n A[\"Planning: System Request\"] --> B[\"Analysis: Requirements Determination\"]\\n B --> C[\"Requirements Definition\"]\\n C --> D[\"Functional Models\"]\\n C --> E[\"Structural Models\"]\\n C --> F[\"Behavioral Models\"]\\n D --> G[\"System Proposal\"]\\n E --> G\\n F --> G\\n G --> H[\"Design and Implementation\"]</pre><details><summary>Copyable Mermaid diagram source</summary><pre><code>flowchart TD\\n A[\"Planning: System Request\"] --> B[\"Analysis: Requirements Determination\"]\\n B --> C[\"Requirements Definition\"]\\n C --> D[\"Functional Models\"]\\n C --> E[\"Structural Models\"]\\n C --> F[\"Behavioral Models\"]\\n D --> G[\"System Proposal\"]\\n E --> G\\n F --> G\\n G --> H[\"Design and Implementation\"]</code></pre></details><h3>Business Requirements vs System Requirements</h3><div style=\"overflow:auto\"><table><thead><tr><th>Dimension</th><th>Business Requirement</th><th>System Requirement</th></tr></thead><tbody><tr><td>View</td><td>Business / User perspective</td><td>Developer / Technical perspective</td></tr><tr><td>Primary question</td><td>WHAT capability is needed?</td><td>HOW will this be realized?</td></tr><tr><td>Example</td><td>Patients shall be able to book appointments.</td><td>Booking service will expose an authenticated API.</td></tr><tr><td>Stage</td><td>Initially in Analysis</td><td>Refined in Design</td></tr></tbody></table></div><p>課本指出兩者沒有絕對界線；需求會隨 Inception、Elaboration、Construction 不斷細化。</p><h3>Functional vs Non-functional Requirements</h3><p><b>Functional:</b> What business processes the system must perform or information it must manage. <b>Nonfunctional:</b> Behavioral properties, qualities or constraints under which it operates.</p><div style=\"overflow:auto\"><table><thead><tr><th>Category</th><th>Definition</th><th>Example / 中文判斷</th></tr></thead><tbody><tr><td>Functional</td><td>System process or information capability</td><td>Generate daily appointment schedules（產生報表）</td></tr><tr><td>Operational</td><td>Operating environment or technology constraint</td><td>Support wireless printing（操作環境）</td></tr><tr><td>Performance</td><td>Speed, capacity, reliability and availability</td><td>Retrieve a schedule within 2 seconds（效能）</td></tr><tr><td>Security</td><td>Access and data protection</td><td>Only doctors can update availability（權限）</td></tr><tr><td>Cultural & Political</td><td>Regulatory and organizational constraints</td><td>Comply with applicable privacy regulation（法規）</td></tr></tbody></table></div><p>混合句型如「Doctors may retrieve medical records within two seconds」應視品質管理需要拆為 Functional Capability 和 measurable Performance Requirement。</p><h3>Essential Glossary</h3><div style=\"overflow:auto\"><table><thead><tr><th>Term</th><th>English Definition</th><th>中文易混淆點</th></tr></thead><tbody><tr><td>Requirements Elicitation</td><td>Discovering and clarifying stakeholder needs</td><td>需求發掘與引導，不是完全等於寫規格。</td></tr><tr><td>Requirements Gathering</td><td>Collecting information from stakeholders and artifacts</td><td>蒐集原始證據。</td></tr><tr><td>Requirements Definition</td><td>Document listing prioritized functional and nonfunctional requirements</td><td>需求定義文件，不等於整份 System Proposal。</td></tr><tr><td>As-Is / To-Be</td><td>Current / proposed future process</td><td>現況和改善目標。</td></tr><tr><td>Stakeholder</td><td>Individual or organization affected by the system</td><td>利害關係人不一定是 Actor。</td></tr><tr><td>Actor</td><td>External role interacting with a subject</td><td>對系統操作的角色，可能是人或外部系統。</td></tr><tr><td>Scope</td><td>Boundary of agreed project/system functionality</td><td>系統範圍。</td></tr><tr><td>Scope Creep</td><td>Uncontrolled growth in project scope</td><td>需求增加未做變更評估。</td></tr><tr><td>User Story</td><td>Role-centered statement of capability and benefit</td><td>As a ... I want ... so that ...</td></tr><tr><td>Verification</td><td>Checking requirements against defined specification-quality criteria</td><td>規格是否寫得正確。</td></tr><tr><td>Validation</td><td>Checking requirements meet actual stakeholder needs</td><td>是否真的是使用者要的。</td></tr><tr><td>Traceability</td><td>Linking requirements to origin, models and tests</td><td>可追蹤性。</td></tr></tbody></table></div></section>\n<section id=\"part2\"><h2>2. Eight Requirements Analysis Strategies</h2><p><b>Strategies</b> help discover problems, causes and opportunities in business processes; they are different from the five <b>Gathering Techniques</b> used to obtain evidence.</p><div style=\"overflow:auto\"><table><thead><tr><th>Strategy</th><th>Core Question</th><th>Best Use</th></tr></thead><tbody><tr><td>1. Problem Analysis</td><td>What current problems exist?</td><td>User pain points and defects.</td></tr><tr><td>2. Root Cause Analysis</td><td>Why is the problem occurring?</td><td>Repeated symptoms; uncover root causes.</td></tr><tr><td>3. Duration Analysis</td><td>Where is elapsed time spent?</td><td>Process delays and handoffs.</td></tr><tr><td>4. Activity-Based Costing</td><td>Which activities cost the most?</td><td>Business process cost reduction.</td></tr><tr><td>5. Informal Benchmarking</td><td>How do comparable organizations succeed?</td><td>Learn external practices.</td></tr><tr><td>6. Outcome Analysis</td><td>What end result is desired?</td><td>Result-first process redesign.</td></tr><tr><td>7. Technology Analysis</td><td>Can technology enable new capabilities?</td><td>Technology-enabled business change.</td></tr><tr><td>8. Activity Elimination</td><td>Which step can be removed?</td><td>Simplify or redesign process.</td></tr></tbody></table></div><h3>2.1 Problem Analysis</h3><p><b>Definition:</b> Ask users what difficulties and inefficiencies they experience, then clarify concrete examples, frequency, impact and current workarounds. SOP: Identify Stakeholders → Ask Problems → Probe Specific Occurrences → Record Business Impact → Verify Issue → Form Improvement Hypothesis.</p><p>如果接待員說「預約常常重複」，不代表解決方案必然是換畫面。先問何時重複、由誰記錄、什麼情況會出錯。</p><h3>2.2 Root Cause Analysis</h3><p><b>Definition:</b> Investigate underlying causes instead of treating only symptoms. Typical artifact: Fishbone / Cause-and-Effect Diagram.</p><pre class=\"mermaid\">flowchart LR\\n A[\"Incorrect Inventory Data\"] --> P[\"Inventory Stock-Outs\"]\\n B[\"Delayed Purchase Approval\"] --> P\\n C[\"Wrong Reorder Threshold\"] --> P\\n D[\"Slow Supplier Delivery\"] --> P\\n E[\"Unrecorded Sales\"] --> P</pre><details><summary>Copyable Mermaid diagram source</summary><pre><code>flowchart LR\\n A[\"Incorrect Inventory Data\"] --> P[\"Inventory Stock-Outs\"]\\n B[\"Delayed Purchase Approval\"] --> P\\n C[\"Wrong Reorder Threshold\"] --> P\\n D[\"Slow Supplier Delivery\"] --> P\\n E[\"Unrecorded Sales\"] --> P</code></pre></details><p>此 Mermaid 為因果關係示意；教授的 Fishbone Diagram 應用魚骨布局。SOP: Precisely define effect → Brainstorm categories → Decompose contributing causes → Validate evidence → Derive corrective requirements. 錯誤示範：只在缺貨後增加通知，卻不檢查庫存更新不正確的根本原因。</p><h3>2.3 Duration Analysis</h3><p><b>Definition:</b> Compare actual working time required by process activities with the entire elapsed process duration. Investigate large gaps caused by waiting, handoffs, or redundant steps.</p><div style=\"overflow:auto\"><table><thead><tr><th>Activity</th><th>Processing (min)</th><th>Elapsed (min)</th></tr></thead><tbody><tr><td>Receive request</td><td>3</td><td>3</td></tr><tr><td>Wait for review</td><td>0</td><td>35</td></tr><tr><td>Verify booking</td><td>4</td><td>4</td></tr><tr><td>Wait for confirmation</td><td>0</td><td>18</td></tr><tr><td>Send confirmation</td><td>2</td><td>2</td></tr><tr><td>Total</td><td>9</td><td>62</td></tr></tbody></table></div><p>62 minutes end-to-end minus 9 minutes processing = 53 minutes waiting. Possible responses: eliminate steps, integrate steps, or execute independent tasks in parallel. 等待不必然等於浪費；如果有法定審核，需先確認是否能取消。</p><h3>2.4 Activity-Based Costing (ABC)</h3><p><b>Definition:</b> Analyze costs assigned to activities to identify major cost drivers and improvement opportunities. Compare the cost of manual data entry, calls, corrections and paper processing with prospective automation and support costs.</p><div style=\"overflow:auto\"><table><thead><tr><th>Activity</th><th>Illustrative Monthly Cost</th></tr></thead><tbody><tr><td>Manual booking entry</td><td>NT$12,000</td></tr><tr><td>Confirmation calls</td><td>NT$8,000</td></tr><tr><td>Error correction</td><td>NT$6,000</td></tr><tr><td>Paperwork</td><td>NT$2,000</td></tr><tr><td>Total</td><td>NT$28,000</td></tr></tbody></table></div><p>ABC focuses the allocation and consequences of costs by business activity, not only the initial total software project budget. 數字是案例示例，不是課本提供的診所真實數據。</p><h3>2.5 Informal Benchmarking</h3><p><b>Definition:</b> Compare successful organizations' processes to identify ideas, then adapt them to local circumstances. SOP: Select comparable process → Study its practices → Identify gap → Evaluate organizational fit → Adapt. 注意 Benchmarking 不代表完全抄襲其他組織的規則。</p><h3>2.6 Outcome Analysis</h3><p><b>Definition:</b> Begin with the desired business outcome and derive suitable process changes and requirements. Lecturer's example: reducing abnormal mass ticket cancellations, examining scalping and identity controls.</p><pre class=\"mermaid\">flowchart TD\\n G[\"Desired Outcome: Fewer abnormal cancellations\"] --> C[\"Investigate causes\"]\\n C --> M[\"Evaluate methods: identity verification\"]\\n M --> E[\"Derive requirements and controls\"]</pre><details><summary>Copyable Mermaid diagram source</summary><pre><code>flowchart TD\\n G[\"Desired Outcome: Fewer abnormal cancellations\"] --> C[\"Investigate causes\"]\\n C --> M[\"Evaluate methods: identity verification\"]\\n M --> E[\"Derive requirements and controls\"]</code></pre></details><p>不應因為想用 Facial Recognition 就直接認定那是唯一需求；還要評估 privacy, misidentification, security and regulations。</p><h3>2.7 Technology Analysis</h3><p><b>Definition:</b> Assess available or emerging technology for business opportunities. SOP: Discover capability → Determine business use → Evaluate feasibility and risks → Derive requirements → Confirm stakeholder value. Example: Automatic reminders → reduce no-shows → notification schedule requirement. Technology is a means to business value.</p><h3>2.8 Activity Elimination</h3><p><b>Definition:</b> Challenge the necessity of existing activities, often through a Force-Fit Exercise: assume the step must be removed and redesign the remaining process.</p><pre class=\"mermaid\">flowchart LR\\n A[\"Patient Form\"] --> B[\"Manual Re-entry\"] --> C[\"Schedule Check\"] --> D[\"Approval\"] --> E[\"Confirmation\"]</pre><details><summary>Copyable Mermaid diagram source</summary><pre><code>flowchart LR\\n A[\"Patient Form\"] --> B[\"Manual Re-entry\"] --> C[\"Schedule Check\"] --> D[\"Approval\"] --> E[\"Confirmation\"]</code></pre></details><p>Ask whether manual re-entry and some approvals are truly required. Cannot eliminate legally necessary, clinically necessary, or security-sensitive steps purely for speed.</p></section>\n<section id=\"part3\"><h2>3. Five Requirements Gathering Techniques</h2><div style=\"overflow:auto\"><table><thead><tr><th>Technique</th><th>Strength</th><th>Limit / Bias</th><th>Best Context</th></tr></thead><tbody><tr><td>Interviews</td><td>Detail, clarification and follow-up</td><td>Time-consuming; interviewer effects</td><td>Explore complicated business rules</td></tr><tr><td>JAD</td><td>Shared decisions and conflict resolution</td><td>Scheduling and facilitation overhead</td><td>Multiple stakeholders need consensus</td></tr><tr><td>Questionnaires</td><td>Scale, standardized answers</td><td>Limited depth, nonresponse bias</td><td>Large distributed user base</td></tr><tr><td>Observation</td><td>Reveal real workarounds</td><td>Observer effect; periodic work missed</td><td>Actual operations differ from documented process</td></tr><tr><td>Document Analysis</td><td>Records existing forms and rules</td><td>May be obsolete or inaccurate</td><td>Study policies, forms, reports and records</td></tr></tbody></table></div><h3>3.1 Interviews</h3><p><b>Definition:</b> Direct conversations with stakeholders to elicit needs, problems and business facts. Structured interviews use predetermined questions; Unstructured interviews follow responses; semi-structured interviews blend both (a general methodological supplement). Question Types: Open-ended, Closed-ended and Probing.</p><div style=\"overflow:auto\"><table><thead><tr><th>Question Type</th><th>Example</th><th>Best Purpose</th></tr></thead><tbody><tr><td>Open-ended</td><td>What difficulties arise during booking?</td><td>Explore unknown issues</td></tr><tr><td>Closed-ended</td><td>How many bookings are processed daily?</td><td>Obtain precise/comparable facts</td></tr><tr><td>Probing</td><td>Why is manager approval required?</td><td>Clarify reasons and exceptions</td></tr></tbody></table></div><p><b>Top-Down:</b> General business objectives → Specific process questions. <b>Bottom-Up:</b> Specific operating details → General conclusions. SOP: Select Interviewees → Prepare Questions → Interview and record → Probe → Summarize → Confirm notes with participants → Update requirements. Interview notes must be verified, not treated as final facts.</p><h3>3.2 Questionnaires</h3><p><b>Definition:</b> Standardized written questions completed independently by respondents. Good for geographically distributed stakeholders and quantitative comparisons. Use neutral questions; avoid double-barreled questions; pilot-test; choose consistent response scales and prepare an analysis strategy. Low response or misunderstanding can threaten validity.</p><h3>3.3 Observation</h3><p><b>Definition:</b> Systematically examine actual work activities and behavior. Detect undocumented shortcuts and activities users forget to mention. Major threats: <b>Hawthorne / Observer Effect</b> and missing infrequent or periodic tasks. SOP: Define observed task → Obtain permission → Observe with minimal interference → Record actions, delays and exceptions → Check weekly/monthly tasks → Validate with staff.</p><h3>3.4 Document Analysis</h3><p><b>Definition:</b> Examine existing forms, policies, reports, user manuals and records for information about current business operations. Pay attention to user-added fields (missing information requirements) and unused fields (possibly obsolete requirements). Confirm tentative findings with users. For example, handwritten Preferred Contact Method suggests a candidate data requirement, not an automatically approved one.</p><h3>3.5 Joint Application Development (JAD)</h3><p><b>Definition:</b> Structured requirements workshops involving users, analysts, managers and facilitators. Roles may include Facilitator, Users, Analysts, Decision Makers and Scribe. SOP: Define goals → Select participants → Prepare agenda/material → Agree ground rules → Facilitate discussion → Record issues/decisions → Confirm outputs. Success depends on knowledgeable participation and effective facilitation.</p></section>\n<section id=\"part4\"><h2>4. Requirements Documentation, Prioritization & Scope</h2><h3>Two Requirements Formats</h3><p><b>Descriptive Requirement Statement:</b> FR-014: The system shall allow authorized receptionists to reschedule an existing appointment when the requested slot is available.</p><p><b>User Story:</b> As a receptionist, I want to reschedule appointments so that patient changes can be accommodated without conflicting with doctor availability.</p><div style=\"overflow:auto\"><table><thead><tr><th>Dimension</th><th>Descriptive Statement</th><th>User Story</th></tr></thead><tbody><tr><td>Structure</td><td>Actor/system + action + object + condition</td><td>As a [role], I want [capability], so that [value]</td></tr><tr><td>Strength</td><td>Explicit testable specification</td><td>Stakeholder goal/value</td></tr><tr><td>Limitation</td><td>May become overtechnical</td><td>Needs further acceptance criteria and exceptions</td></tr></tbody></table></div><p>Story Cards are lightweight artifacts for maintaining stories; a story alone rarely captures all security, exception and performance conditions.</p><h3>MoSCoW and Dependency Ordering</h3><div style=\"overflow:auto\"><table><thead><tr><th>Priority</th><th>Meaning</th><th>Example</th></tr></thead><tbody><tr><td>Must Have</td><td>Essential to the agreed scope</td><td>Prevent double-booking</td></tr><tr><td>Should Have</td><td>High value, but not blocking first release</td><td>Appointment reminders</td></tr><tr><td>Could Have</td><td>Desirable enhancement</td><td>Personalization theme</td></tr><tr><td>Won't Have (for now)</td><td>Explicitly excluded from current scope</td><td>Integrated insurance claim processing</td></tr></tbody></table></div><p>Priority (business importance) and Sequence (technical/business dependencies) are separate. Example: Register Patient → Schedule Appointment → Send Confirmation, <i>if</i> registration is required before scheduling. Confirm that assumption with stakeholders.</p><pre class=\"mermaid\">flowchart LR\\n A[\"FR-01 Register Patient\"] --> B[\"FR-02 Schedule Appointment\"] --> C[\"FR-03 Send Confirmation\"]</pre><details><summary>Copyable Mermaid diagram source</summary><pre><code>flowchart LR\\n A[\"FR-01 Register Patient\"] --> B[\"FR-02 Schedule Appointment\"] --> C[\"FR-03 Send Confirmation\"]</code></pre></details><h3>Formal Four-Step Requirements Definition Process</h3><ol><li>Gather and Analyze a set of Requirements.</li><li>Document Requirements.</li><li>Verify and Prioritize them.</li><li>Repeat for further requirements or necessary refinement, while controlling scope.</li></ol><pre class=\"mermaid\">flowchart TD\\n A[\"Gather and Analyze\"] --> B[\"Document\"] --> C[\"Verify and Prioritize\"]\\n C --> D{\"More requirements / refinement?\"}\\n D -->|Yes| A\\n D -->|No| E[\"Approved Requirements Baseline\"]</pre><details><summary>Copyable Mermaid diagram source</summary><pre><code>flowchart TD\\n A[\"Gather and Analyze\"] --> B[\"Document\"] --> C[\"Verify and Prioritize\"]\\n C --> D{\"More requirements / refinement?\"}\\n D -->|Yes| A\\n D -->|No| E[\"Approved Requirements Baseline\"]</code></pre></details><p><b>Scope Creep:</b> Uncontrolled expansion of the agreed project's scope. New features should undergo change assessment, impact analysis and prioritization rather than being silently accepted.</p></section>\n<section id=\"part5\"><h2>5. Five Text Analysis Tools & VT4C Quality Assurance</h2><h3>5.1 Sentence Diagramming</h3><p>Analyze sentence components to identify candidate Objects, Actions and Relationships: <i>The patient contacts the office regarding an appointment.</i> Patient (role/object) → contacts (action) → Office (participant); Appointment (relevant business object). A noun is only a candidate Class, never automatically a final Class.</p><h3>5.2 Domain Analysis</h3><p>Identify domain boundaries and multiple meanings of concepts. Example: Student consultation may include Thesis Advising, Course Advising, Personal Counseling and Career Consultation. Domain Analysis reduces omitted scenarios and false assumptions.</p><h3>5.3 Component Analysis</h3><p>Identify relevant Attributes of business concepts: Patient may require patientId, name, phone, email and preferred contact method. Do not collect attributes irrelevant to the agreed business scope.</p><h3>5.4 Taxonomic Analysis</h3><p>Identify classification structures and concept relationships, including kinds of consultations. Not every conceptual category hierarchy should be converted uncritically into UML inheritance.</p><pre class=\"mermaid\">flowchart TD\\n C[\"Consultation\"] --> A[\"Academic Consultation\"]\\n C --> P[\"Personal Consultation\"]\\n C --> R[\"Career Consultation\"]\\n A --> T[\"Thesis Advising\"]\\n A --> U[\"Course Advising\"]</pre><details><summary>Copyable Mermaid diagram source</summary><pre><code>flowchart TD\\n C[\"Consultation\"] --> A[\"Academic Consultation\"]\\n C --> P[\"Personal Consultation\"]\\n C --> R[\"Career Consultation\"]\\n A --> T[\"Thesis Advising\"]\\n A --> U[\"Course Advising\"]</code></pre></details><h3>5.5 Theme Analysis</h3><p>Find additional and exceptional scenarios that may be omitted by the main workflow. Ticket purchase example: family members want adjacent seats while anti-scalping rules still apply. Theme Analysis concerns business patterns, not interface color themes.</p><h3>VT4C Principle (Six Criteria)</h3><div style=\"overflow:auto\"><table><thead><tr><th>Criterion</th><th>English Definition</th><th>Typical Quality Failure</th></tr></thead><tbody><tr><td>Verifiable</td><td>Objectively testable or evaluable</td><td>The system shall be beautiful.</td></tr><tr><td>Traceable</td><td>Linkable by ID to source, models and tests</td><td>No requirement ID or origin</td></tr><tr><td>Clear</td><td>Unambiguous interpretation</td><td>The system shall be fast.</td></tr><tr><td>Consistent</td><td>No contradictory requirements</td><td>Guests both allowed and prohibited under same conditions</td></tr><tr><td>Complete</td><td>Required actor, rules and exceptions described</td><td>The system shall manage appointments</td></tr><tr><td>Concise</td><td>Focused and free of unnecessary wording</td><td>Long promotional prose without definite behavior</td></tr></tbody></table></div><h3>VT4C Revision Examples</h3><div style=\"overflow:auto\"><table><thead><tr><th>Original</th><th>Issue</th><th>Improved Requirement</th></tr></thead><tbody><tr><td>The system should be easy to use.</td><td>Unclear, unverifiable</td><td>At least 90% of representative users shall complete booking without assistance in an agreed usability test.</td></tr><tr><td>The system should provide beautiful reports.</td><td>Unverifiable</td><td>Reports shall conform to an approved layout with title, period, headings and totals.</td></tr><tr><td>The system shall manage appointments.</td><td>Incomplete</td><td>Specify create, view, reschedule and cancel privileges plus conflict rules.</td></tr><tr><td>Only members may book. Guests may book without membership.</td><td>Inconsistent</td><td>Confirm whether guest access is permitted and under what conditions.</td></tr><tr><td>Send a confirmation.</td><td>Not traceable / incomplete</td><td>FR-015: After accepted booking, send confirmation via the patient's selected channel.</td></tr><tr><td>A very advanced and highly sophisticated booking functionality should...</td><td>Not concise / unclear</td><td>The system shall let authorized users create, view, reschedule and cancel appointments.</td></tr></tbody></table></div><p>Criteria labels are completed in accordance with the 2026 lecture's VT4C framework. Text Analysis and VT4C do different jobs: discovering meaning versus checking documented requirement quality.</p></section>\n<section id=\"part6\"><h2>6. Step-by-Step Modeling SOP & Cross-Model V&V</h2><p>The lecturer's <b>formal Requirements Definition Cycle contains FOUR steps</b>. The following nine-step guide is an expanded classroom execution SOP, NOT a replacement for those four steps.</p><ol><li>Establish Business Context, Goals, Stakeholders and Scope.</li><li>Investigate the As-Is Process using appropriate Analysis Strategies.</li><li>Select Gathering Techniques based on stakeholder and evidence needs.</li><li>Collect Statements, Observations, Documents and Exceptions.</li><li>Apply Sentence, Domain, Component, Taxonomic and Theme Analysis.</li><li>Write Descriptive Requirements and User Stories.</li><li>Apply VT4C and confirm findings with stakeholders.</li><li>Prioritize using dependencies and MoSCoW; baseline scope.</li><li>Integrate Requirements Definition into the System Proposal and iterate.</li></ol><pre class=\"mermaid\">flowchart TD\\n S[\"System Request\"] --> A[\"Analyze Business Problems\"]\\n A --> G[\"Interviews / JAD / Questionnaires / Observation / Documents\"]\\n G --> R[\"Requirements Definition\"]\\n R --> V[\"Text Analysis + VT4C\"]\\n V --> P[\"Prioritized Requirements\"]\\n P --> F[\"Functional Models\"]\\n P --> ST[\"Structural Models\"]\\n P --> B[\"Behavioral Models\"]\\n F --> SP[\"System Proposal\"]\\n ST --> SP\\n B --> SP</pre><details><summary>Copyable Mermaid diagram source</summary><pre><code>flowchart TD\\n S[\"System Request\"] --> A[\"Analyze Business Problems\"]\\n A --> G[\"Interviews / JAD / Questionnaires / Observation / Documents\"]\\n G --> R[\"Requirements Definition\"]\\n R --> V[\"Text Analysis + VT4C\"]\\n V --> P[\"Prioritized Requirements\"]\\n P --> F[\"Functional Models\"]\\n P --> ST[\"Structural Models\"]\\n P --> B[\"Behavioral Models\"]\\n F --> SP[\"System Proposal\"]\\n ST --> SP\\n B --> SP</code></pre></details><h3>Verification vs Validation</h3><div style=\"overflow:auto\"><table><thead><tr><th>Question</th><th>Verification</th><th>Validation</th></tr></thead><tbody><tr><td>What is examined?</td><td>Specification correctness and internal consistency</td><td>Real stakeholder/business needs</td></tr><tr><td>Example</td><td>Can an unambiguous test be written?</td><td>Will the capability actually solve the business problem?</td></tr><tr><td>Evidence</td><td>ID, clarity, consistency, completeness</td><td>Stakeholder approval, scenario walkthrough, outcome check</td></tr></tbody></table></div><h3>Requirements Walkthrough SOP</h3><ol><li>Select an Actor and representative scenario.</li><li>Identify corresponding requirements.</li><li>Simulate the workflow from the actor's viewpoint.</li><li>Check information, roles, business rules and exceptions.</li><li>Review the expected outcome with stakeholders.</li><li>Record gaps and contradictions, revise and recheck.</li></ol><h3>Five Common Pitfalls</h3><ol><li>Treating a symptom as the root cause.</li><li>Turning all nouns directly into classes without domain/scope analysis.</li><li>Writing vague requirements using fast, easy, attractive without criteria.</li><li>Confusing manual human activities with automated system behavior.</li><li>Ignoring unavailable slots, failed payments, error conditions and other exceptions.</li></ol></section>\n<section id=\"part7\"><h2>7. Clinic Appointment System: End-to-End Walkthrough</h2><h3>Scenario Requirements (English)</h3><blockquote>A community health clinic currently manages appointments through telephone calls and paper-based schedules. Receptionists receive requests, check physician availability, and manually confirm booking times. Because multiple staff members update different records, appointment conflicts occasionally occur. Patients complain about delayed confirmations and long waiting times. The clinic wants an online appointment system that allows patients to search available consultation periods, request appointments, view bookings, and cancel or reschedule visits. Doctors should maintain available consultation periods, while receptionists assist those who prefer telephone services. The system must prevent double bookings and confirm accepted requests. Clinic managers want to reduce administrative workload without compromising patient information security. Before system design begins, the development team must analyze existing business problems, observe the current scheduling workflow, interview stakeholders, identify exceptional cases and document functional as well as non-functional requirements that can be verified and validated.</blockquote><h3>As-Is Problem / Cause / Strategy</h3><div style=\"overflow:auto\"><table><thead><tr><th>Observed Problem</th><th>Candidate Cause</th><th>Analysis Technique</th></tr></thead><tbody><tr><td>Double bookings</td><td>Disconnected records</td><td>Root Cause Analysis</td></tr><tr><td>Slow scheduling</td><td>Manual availability checks</td><td>Duration Analysis</td></tr><tr><td>High administrative workload</td><td>Repeated data entry</td><td>Activity-Based Costing</td></tr><tr><td>Late confirmations</td><td>Manual notifications</td><td>Problem Analysis</td></tr><tr><td>Unclear booking information</td><td>Fragmented schedules</td><td>Observation + Document Analysis</td></tr></tbody></table></div><h3>Select Gathering Techniques</h3><p><b>Interviews:</b> receptionist, doctor, manager. <b>Observation:</b> actual desk work. <b>Document Analysis:</b> paper schedule, forms, cancellation policy. <b>Questionnaire:</b> patients' preferences. <b>JAD:</b> resolve conflicting business rules with all principal stakeholder groups.</p><h3>Interview Questions</h3><div style=\"overflow:auto\"><table><thead><tr><th>Question</th><th>Type</th><th>Purpose</th></tr></thead><tbody><tr><td>What goes wrong during booking?</td><td>Open-ended</td><td>Identify pain points</td></tr><tr><td>How many bookings are handled daily?</td><td>Closed-ended</td><td>Quantify workload</td></tr><tr><td>Why are duplicate entries created?</td><td>Probing</td><td>Root causes</td></tr><tr><td>Who may change physician availability?</td><td>Closed-ended</td><td>Clarify permissions</td></tr><tr><td>What if no time slot exists?</td><td>Probing</td><td>Exception flow</td></tr><tr><td>How are cancellations handled?</td><td>Open-ended</td><td>Understand As-Is process</td></tr></tbody></table></div><h3>Draft Functional Requirements</h3><ol><li>FR-01: The system shall allow patients to search consultation periods by doctor and date.</li><li>FR-02: The system shall allow appointment requests for available periods.</li><li>FR-03: The system shall prevent multiple active appointments in the same physician period.</li><li>FR-04: The system shall allow patients to view existing bookings.</li><li>FR-05: The system shall allow cancellation according to clinic cancellation policy.</li><li>FR-06: The system shall allow requests to reschedule appointments.</li><li>FR-07: Authorized doctors shall maintain consultation availability.</li><li>FR-08: Authorized receptionists shall book on behalf of patients.</li><li>FR-09: The system shall generate confirmation on accepted appointments.</li><li>FR-10: The system shall record appointment status.</li></ol><h3>Non-functional Requirements</h3><ul><li>NFR-01 (Performance): Return availability search results within 2 seconds for at least 95% of requests under agreed workload.</li><li>NFR-02 (Security): Permit only authenticated authorized users to access patient appointment data.</li><li>NFR-03 (Operational): Support agreed desktop/mobile web browsers.</li><li>NFR-04 (Performance): Maintain agreed uptime during clinic operating hours. <em>Target remains unresolved.</em></li><li>NFR-05 (Cultural/Political): Meet applicable privacy and patient protection laws. <em>Specific applicable regulations remain unresolved.</em></li></ul><p>未確認的 Availability Target 和法規要求應標示為 Open Issues，不能自行填入無依據的數字與條文。</p><h3>VT4C and Prioritization</h3><div style=\"overflow:auto\"><table><thead><tr><th>Requirement</th><th>VT4C Focus</th><th>Priority (illustrative)</th></tr></thead><tbody><tr><td>FR-01 Search</td><td>Clear search parameters</td><td>Must</td></tr><tr><td>FR-02 Request</td><td>Consistent with capacity</td><td>Must</td></tr><tr><td>FR-03 Prevent conflicts</td><td>Verifiable via double-booking test</td><td>Must</td></tr><tr><td>FR-05 Cancellation</td><td>Complete cancellation policy</td><td>Must</td></tr><tr><td>FR-06 Reschedule</td><td>Define constraints</td><td>Should</td></tr><tr><td>FR-07 Doctor Availability</td><td>Clarify access rules</td><td>Must</td></tr><tr><td>FR-09 Confirmation</td><td>Verify channel and trigger</td><td>Should</td></tr><tr><td>NFR-04 Availability</td><td>Incomplete target</td><td>Open</td></tr></tbody></table></div><h3>Traceability to Models and Tests</h3><pre class=\"mermaid\">flowchart TD\\n R1[\"FR-02 Request Appointment\"] --> UC[\"UC-01 Schedule Appointment\"]\\n R2[\"FR-03 Prevent Double Booking\"] --> UC\\n R3[\"FR-07 Maintain Availability\"] --> UV[\"UC-02 Maintain Availability\"]\\n UC --> A[\"Appointment / Patient / Doctor\"]\\n UV --> AV[\"Availability\"]\\n A --> S[\"Booking Sequence Scenario\"]\\n AV --> S\\n S --> T1[\"TC-01 Valid Booking\"]\\n S --> T2[\"TC-02 Conflicting Booking\"]</pre><details><summary>Copyable Mermaid diagram source</summary><pre><code>flowchart TD\\n R1[\"FR-02 Request Appointment\"] --> UC[\"UC-01 Schedule Appointment\"]\\n R2[\"FR-03 Prevent Double Booking\"] --> UC\\n R3[\"FR-07 Maintain Availability\"] --> UV[\"UC-02 Maintain Availability\"]\\n UC --> A[\"Appointment / Patient / Doctor\"]\\n UV --> AV[\"Availability\"]\\n A --> S[\"Booking Sequence Scenario\"]\\n AV --> S\\n S --> T1[\"TC-01 Valid Booking\"]\\n S --> T2[\"TC-02 Conflicting Booking\"]</code></pre></details><p>Verification: Are all requirements linked to clear models/tests? Validation: Does the future system reduce booking conflicts and workload? This case is an original textbook-aligned teaching adaptation, not a copied official answer.</p><h3>System Proposal</h3><p>Executive Summary + System Request + Work Plan + Feasibility Analysis + Requirements Definition + Current To-Be Models. Requirements Definition is an essential part but not the entire System Proposal.</p></section>\n<section id=\"part8\"><h2>8. Professor's Online Course Registration Case</h2><p>2026 slide example: enrollment, discounts, advertisements, instructor administration, course approval, course capacity, manual payments, cancellation threshold, and keyword search.</p><div style=\"overflow:auto\"><table><thead><tr><th>Initial Statement / Topic</th><th>Problem / Ambiguity</th><th>Refined Requirement</th></tr></thead><tbody><tr><td>Online registration</td><td>Who can register; what follows?</td><td>Members and nonmembers may register; show confirmation and payment information.</td></tr><tr><td>Member discount</td><td>Unspecified amount</td><td>Members receive a 20% discount; nonmembers pay standard price.</td></tr><tr><td>Course advertising</td><td>Timing unclear</td><td>Send messages one month, two weeks and three days before a course begins.</td></tr><tr><td>Instructors add courses</td><td>Approval process missing</td><td>Instructor submits; academic admin approves; then system publishes.</td></tr><tr><td>Course full indicator</td><td>Capacity definition missing</td><td>Determine full status using assigned location capacity.</td></tr><tr><td>Manage instructors</td><td>Role unclear</td><td>Academic administrator maintains instructor data.</td></tr><tr><td>Membership and payment</td><td>Manual payment scope</td><td>Cashier confirms payment externally; system records confirmation, activates membership and notifies.</td></tr><tr><td>Under-enrolled courses</td><td>Threshold missing</td><td>Cancel courses with fewer than five learners and suggest keyword-matched alternatives.</td></tr><tr><td>Course search</td><td>Criteria missing</td><td>Allow date, instructor and keyword search.</td></tr></tbody></table></div><p><b>System Boundary:</b> The lecturer's case explicitly retains manual collection of payment. Recording the cashier's confirmation in the system does not imply automated card charging. Do not add online payment processing without scope approval.</p></section>\n<section id=\"part9\"><h2>9. Cheat Sheet & Eight Golden Rules</h2><ol><li>Functional Requirements specify WHAT the system does; Non-functional Requirements specify qualities and constraints.</li><li>Begin with real Business Problems, not a predetermined technology.</li><li>Analysis Strategies identify improvements; Gathering Techniques collect evidence.</li><li>VT4C = Verifiable, Traceable, Clear, Consistent, Complete, Concise.</li><li>Interviews describe users' reports; Observation may reveal unreported behavior.</li><li>User Story = As a [role], I want [capability], so that [benefit].</li><li>MoSCoW priority differs from task dependencies; control Scope Creep.</li><li>Requirements Definition feeds Models and forms part of System Proposal.</li></ol><h3>10-minute Exam Keyword Table</h3><div style=\"overflow:auto\"><table><thead><tr><th>Question Keyword</th><th>Answer</th></tr></thead><tbody><tr><td>Why does problem occur?</td><td>Root Cause Analysis</td></tr><tr><td>Elapsed vs active time</td><td>Duration Analysis</td></tr><tr><td>Activity costs</td><td>Activity-Based Costing</td></tr><tr><td>Copy good practices thoughtfully</td><td>Informal Benchmarking</td></tr><tr><td>Desired business outcome</td><td>Outcome Analysis</td></tr><tr><td>New technology opportunities</td><td>Technology Analysis</td></tr><tr><td>Remove unnecessary steps</td><td>Activity Elimination</td></tr><tr><td>Real-life workarounds</td><td>Observation</td></tr><tr><td>Distributed respondents</td><td>Questionnaire</td></tr><tr><td>Stakeholder agreement</td><td>JAD</td></tr><tr><td>Ambiguous words</td><td>Clear</td></tr><tr><td>Untestable requirement</td><td>Verifiable</td></tr><tr><td>Missing exceptions</td><td>Complete</td></tr><tr><td>Conflicting statements</td><td>Consistent</td></tr><tr><td>Missing ID / links</td><td>Traceable</td></tr><tr><td>Verbose requirement</td><td>Concise</td></tr></tbody></table></div>\n<section class=\"quiz\"><h3>Quick Concept Check 1</h3><p><b>Users cannot fully describe informal scheduling workarounds. Which technique best uncovers their actual actions?</b></p><button onclick=\"lessonAnswer('chapter2.html-1',0,1)\">A. Questionnaires</button><button onclick=\"lessonAnswer('chapter2.html-1',1,1)\">B. Observation</button><button onclick=\"lessonAnswer('chapter2.html-1',2,1)\">C. Informal Benchmarking</button><button onclick=\"lessonAnswer('chapter2.html-1',3,1)\">D. Outcome Analysis</button><p id=\"fbchapter2.html-1\"></p><span id=\"expchapter2.html-1\" hidden><b>Answer B.</b> Observation reveals actual behavior, including undocumented shortcuts, though it may introduce observer effects. 中文：關鍵字為 actual actions 和 informal workaround，選 Observation。</span><details><summary>English Explanation / 中文解析</summary><p>Observation reveals actual behavior, including undocumented shortcuts, though it may introduce observer effects.</p><p>關鍵字為 actual actions 和 informal workaround，選 Observation。</p></details></section>\n<section class=\"quiz\"><h3>Quick Concept Check 2</h3><p><b>The requirement says the interface must be fast and attractive. Which criteria are most directly violated?</b></p><button onclick=\"lessonAnswer('chapter2.html-2',0,1)\">A. Traceability and Consistency</button><button onclick=\"lessonAnswer('chapter2.html-2',1,1)\">B. Clarity and Verifiability</button><button onclick=\"lessonAnswer('chapter2.html-2',2,1)\">C. Completeness and Traceability</button><button onclick=\"lessonAnswer('chapter2.html-2',3,1)\">D. Conciseness and Consistency</button><p id=\"fbchapter2.html-2\"></p><span id=\"expchapter2.html-2\" hidden><b>Answer B.</b> Fast and attractive lack objective criteria and allow different interpretations. 中文：fast / attractive 沒標準，主要違反 Clear 和 Verifiable。</span><details><summary>English Explanation / 中文解析</summary><p>Fast and attractive lack objective criteria and allow different interpretations.</p><p>fast / attractive 沒標準，主要違反 Clear 和 Verifiable。</p></details></section>\n<section class=\"quiz\"><h3>Quick Concept Check 3</h3><p><b>A cashier manually verifies payment and the system activates membership afterward. Which requirement matches the case scope?</b></p><button onclick=\"lessonAnswer('chapter2.html-3',0,2)\">A. Automatically charge each credit card.</button><button onclick=\"lessonAnswer('chapter2.html-3',1,2)\">B. Replace all cashier activities.</button><button onclick=\"lessonAnswer('chapter2.html-3',2,2)\">C. Authorized cashier records payment confirmation, then system activates membership.</button><button onclick=\"lessonAnswer('chapter2.html-3',3,2)\">D. Activate membership immediately upon registration.</button><p id=\"fbchapter2.html-3\"></p><span id=\"expchapter2.html-3\" hidden><b>Answer C.</b> The system records an external manual payment result; this does not authorize automated payment processing. 中文：老師案例保留人工收費，系統只記錄確認結果並啟用會員。</span><details><summary>English Explanation / 中文解析</summary><p>The system records an external manual payment result; this does not authorize automated payment processing.</p><p>老師案例保留人工收費，系統只記錄確認結果並啟用會員。</p></details></section>\n<button onclick=\"lessonMarkDone(2)\">✓ Mark Chapter 2 as reviewed</button> <span id=\"reading2\"></span></section>\n<p class=\"muted\">Course alignment: 2026 Requirements Determination slides: pp.2–3 definitions, pp.8–14 eight analysis strategies, pp.15–25 gathering techniques, pp.26–30 formats/prioritization, pp.32–37 Text Analysis & VT4C, pp.38–41 course registration case, p.42 System Proposal; Dennis, Wixom & Tegarden textbook Chapter 3. Illustrative numbers, Mermaid charts, exercises and clinic specification are teaching adaptations. Mermaid rendering requires internet access; explanations remain accessible offline.</p>"};
