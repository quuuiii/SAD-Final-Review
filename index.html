<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>SA&D · Study Studio 2026</title><style>
:root{color-scheme:light;--bg:#f6f7fb;--paper:#fff;--ink:#172033;--muted:#64748b;--line:#e3e8ef;--accent:#6366f1;--soft:#eef2ff;--good:#0d9668;--bad:#d44850;--shadow:0 12px 40px #2531530d}body.dark{color-scheme:dark;--bg:#0d1424;--paper:#172238;--ink:#ebf2ff;--muted:#a1b0c9;--line:#34415a;--accent:#a5b4fc;--soft:#273153;--shadow:none}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f6b44e;outline-offset:3px}a{color:var(--accent)}.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.topinner{max-width:1290px;margin:auto;padding:13px 22px;display:flex;gap:20px;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center;white-space:nowrap;font-size:20px;font-weight:900}.logo{background:#6366f1;color:white;padding:3px 9px;border-radius:11px}.nav{display:flex;gap:5px;overflow:auto}.tab{white-space:nowrap;border:0;border-radius:11px;background:transparent;padding:10px 13px;color:var(--muted);font-weight:700}.tab.active{background:var(--soft);color:var(--accent)}.iconbtn,.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:11px;padding:9px 13px}.btn.primary{background:#6266e8;border-color:#6266e8;color:white}.btn.ghost{background:var(--soft);border-color:transparent;color:var(--accent)}.btn:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:1290px;margin:auto;padding:24px 22px 85px}.hero{background:linear-gradient(120deg,#252b54,#343184 70%,#5750b3);color:white;border-radius:25px;padding:35px;display:flex;justify-content:space-between;gap:22px;align-items:center}.hero h1{font-size:clamp(27px,3.5vw,45px);letter-spacing:-1px;margin:4px 0 10px}.hero p{color:#d8ddff;max-width:770px}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-weight:800;font-size:12px;color:#bfc7ff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}.stat .num{font-size:30px;line-height:1.2;font-weight:850}.muted{color:var(--muted)}.small{font-size:13px}.pill{display:inline-flex;border-radius:999px;padding:3px 10px;background:var(--soft);color:var(--accent);font-size:12px;font-weight:750}.sectiontitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 14px}.sectiontitle h2{margin:0;font-size:23px}.split{display:grid;grid-template-columns:1fr 320px;gap:18px}.chapgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.chapterCard{display:flex;align-items:center;gap:16px}.chapterCard .bubble{border-radius:13px;background:var(--soft);color:var(--accent);padding:12px 15px;font-weight:850}.progress{background:var(--line);border-radius:20px;height:9px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#8b8cf5,#50b5bd);border-radius:20px}.filter{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:12px 14px}.chapterlayout{display:grid;grid-template-columns:230px 1fr;gap:24px;align-items:start}.side{position:sticky;top:90px}.side a{display:block;text-decoration:none;padding:8px 10px;border-left:2px solid var(--line);font-size:13px}.side a:hover{border-color:var(--accent);background:var(--soft)}.topic{scroll-margin-top:100px;margin-bottom:16px}.topic h3{margin:5px 0;font-size:20px}.topic p{margin:10px 0}.topic details{background:var(--bg);border-radius:12px;padding:10px 14px;margin:11px 0}.topic summary{cursor:pointer;font-weight:700}.topic .cn{padding:11px 14px;border-left:3px solid #8d90ec;background:var(--soft);border-radius:0 9px 9px 0}.flash{border:1px dashed #8d8ae9;border-radius:13px;background:var(--soft);color:var(--ink);padding:15px;text-align:left;width:100%;min-height:70px}.question{white-space:pre-line;font-size:17px;font-weight:710}.option{display:block;text-align:left;width:100%;margin:8px 0;padding:12px 15px;border:1px solid var(--line);border-radius:12px;color:var(--ink);background:var(--paper)}.option.sel{border-color:var(--accent);background:var(--soft)}.option.correct{border-color:var(--good);background:#0b9e7320}.option.wrong{border-color:var(--bad);background:#e46b6920}.badge{background:var(--soft);color:var(--accent);padding:4px 9px;border-radius:9px;font-size:12px;font-weight:800}.feedback{border-left:3px solid var(--accent);padding:13px 17px;background:var(--soft);margin:12px 0;border-radius:0 10px 10px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}.toolbar select,.toolbar input{border:1px solid var(--line);padding:9px;border-radius:9px;background:var(--paper);color:var(--ink)}.quizq{padding:22px 0;border-bottom:1px solid var(--line)}.quizq:last-child{border:0}.summarybox{border-radius:12px;background:var(--soft);padding:14px 17px}.examphoto{width:100%;border-radius:12px;border:1px solid var(--line)}.modal{position:fixed;inset:0;background:#0c1520b8;z-index:40;display:none;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.modalbox{background:var(--paper);color:var(--ink);width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:20px;padding:22px}.cheattable{border-collapse:collapse;width:100%;font-size:13px}.cheattable th,.cheattable td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.bars{display:flex;align-items:end;gap:10px;height:165px;padding:10px}.baritem{flex:1;text-align:center;font-size:12px}.baritem i{display:block;margin:auto;width:min(45px,80%);background:linear-gradient(#8c83ec,#4cb4c0);border-radius:7px 7px 0 0}.stickybar{display:flex;justify-content:space-between;gap:15px;align-items:center}.tiny{font-size:12px}.layout2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}textarea{width:100%;min-height:100px;padding:12px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:11px}.toast{position:fixed;bottom:22px;right:22px;z-index:60;background:#252c48;color:#fff;padding:13px 18px;border-radius:12px;display:none}.hide{display:none!important}@media(max-width:1000px){.topinner{flex-wrap:wrap}.nav{order:3;width:100%}.split{grid-template-columns:1fr}.side{position:static}.chapterlayout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.wrap{padding:15px 12px 70px}.hero{padding:23px;display:block}.hero h1{font-size:28px}.chapgrid,.layout2{grid-template-columns:1fr}.card{padding:16px}.grid{gap:9px}.stat .num{font-size:24px}.topinner{padding:10px 12px}.tab{font-size:13px;padding:8px}.sectiontitle{align-items:flex-start;flex-direction:column}}
@media print{.top,.toolbar,.btn,.side{display:none!important}body{background:white}.modal{position:static;display:block;background:transparent}.modalbox{max-height:none;overflow:visible}.wrap{display:none}}
</style><style>
.full-lesson{margin:12px 0 50px;max-width:100%;line-height:1.75}
.full-lesson section,.full-lesson .card{background:var(--paper);padding:clamp(14px,3vw,24px);margin:20px 0;border:1px solid var(--line);border-radius:17px}
.full-lesson h1{font-size:clamp(1.7rem,4vw,2.7rem);line-height:1.25}
.full-lesson h2{color:var(--accent);margin:30px 0 12px}
.full-lesson h3{margin:20px 0 8px}
.full-lesson .toc{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 26px}
.full-lesson .toc a{padding:6px 10px;background:var(--soft);border-radius:9px;text-decoration:none;font-size:.85rem}
.full-lesson table{width:100%;border-collapse:collapse;font-size:.92rem}
.full-lesson th,.full-lesson td{border:1px solid var(--line);padding:9px;vertical-align:top;text-align:left}
.full-lesson th{background:var(--soft)}
.full-lesson pre{padding:14px;border-radius:12px;background:var(--soft);overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.full-lesson pre.mermaid{background:#f8fbff;color:#172033;white-space:pre;overflow:auto}
.full-lesson details{border:1px solid var(--line);border-radius:11px;padding:12px;margin:12px 0}
.full-lesson summary{cursor:pointer;font-weight:700}
.full-lesson .quiz button{display:block;width:100%;text-align:left;margin:7px 0;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
.full-lesson .feedback{color:var(--good);font-weight:700}.full-lesson .bad{color:var(--bad);font-weight:700}
.full-lesson blockquote{margin:12px 0;padding:12px 18px;border-left:4px solid var(--accent);background:var(--soft)}
@media(max-width:600px){.full-lesson td,.full-lesson th{font-size:.82rem;padding:6px}}
</style></head><body><header class="top"><div class="topinner"><div class="brand"><span class="logo">SAD.</span>Study Studio <span class="pill">2026 F</span></div><nav class="nav" id="nav" aria-label="Main navigation"><button class="tab active" data-tab="home">⌂ Dashboard</button><button class="tab" data-tab="chapters">▤ Chapters 1–5</button><button class="tab" data-tab="past">✎ Past Exam</button><button class="tab" data-tab="mock">◷ Mock Exam</button><button class="tab" data-tab="flags">☆ Mistake Book</button></nav><div style="display:flex;gap:8px"><button class="iconbtn" id="cheatBtn" title="Cheat Sheet">⚡</button><button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">☾</button></div></div></header><main class="wrap" id="app"></main><div class="modal" id="cheatModal" role="dialog" aria-modal="true"><div class="modalbox"><div class="stickybar"><h2>⚡ 10-minute Cheat Sheet</h2><button class="btn" id="closeCheat">✕ Close</button></div><p class="muted small">英文術語優先｜按章節整理的關鍵辨析與考前速記</p><div id="cheatContent"></div><button class="btn primary" id="printCheat">列印 / 儲存 PDF</button></div></div><div id="toast" class="toast" role="status"></div><script>const DATA={"chapters": [{"id": 1, "title": "System Development & SA&D", "subtitle": "Systems development, SDLC, methodologies, OO, Unified Process", "topics": [{"title": "SDLC and four phases", "definition": "The Systems Development Life Cycle (SDLC) transforms business needs into a working information system through Planning, Analysis, Design, and Implementation.", "details": "Planning asks WHY and feasibility; Analysis asks WHO, WHAT, WHERE, WHEN; Design asks HOW; Implementation builds, tests, installs and supports.", "zh": "四階段不是只能照直線進行。Analysis 產出 system proposal；Design 產出 system specification。", "memorize": "Planning → Analysis → Design → Implementation. Deliverables progressively refine the initial business need."}, {"title": "Planning and project initiation", "definition": "A system request identifies the project sponsor, business need, business requirements, business value, and special issues. Feasibility comprises technical, economic, and organizational feasibility.", "details": "Technical: Can we build it? Economic: Should we build it? Organizational: If we build it, will they come? The workplan controls staffing, schedule, risks and resources.", "zh": "不是先挑技術，再找問題。Business value 應先釐清。", "memorize": "System request → Feasibility analysis → Approval committee → Project workplan."}, {"title": "Analysis versus Design", "definition": "Analysis models the problem domain and defines what the system must do. Design refines the analysis deliverables into implementable technical specifications.", "details": "Analysis produces requirements definitions and functional, structural, behavioral models. Design makes architecture, UI, data/database, and program-design decisions.", "zh": "Analysis 看業務需求；Design 才確定如何實作。兩者相互迭代但不可混為一談。", "memorize": "Analysis: as-is/to-be, requirements, system proposal. Design: architecture, interfaces, databases, programs."}, {"title": "Implementation and configuration management", "definition": "Implementation involves system construction and testing, installation and conversion, user training, and ongoing support.", "details": "Configuration management controls evolving artifacts and their versions; change control reduces uncontrolled changes during construction.", "zh": "系統「安裝」不代表專案結束，還有訓練、維護與 post-implementation review。", "memorize": "Build and test → install/convert and train → support/maintain."}, {"title": "Development methodologies", "definition": "A methodology is a formalized approach to executing the SDLC. Approaches include Waterfall, Parallel, Phased, Prototyping, Agile (XP/Scrum) and DevOps.", "details": "Waterfall is sequential and works best with stable requirements; parallel accelerates via subprojects but raises integration risk; phased delivers staged increments; prototyping explores uncertainty.", "zh": "Evolutionary prototype 持續演進；throwaway prototype 用來釐清需求後捨棄。Agile 不是沒有規劃。", "memorize": "Waterfall vs Parallel vs Phased vs Evolutionary / Throwaway Prototyping vs Agile."}, {"title": "OO foundations and UML", "definition": "Object-oriented systems organize software around interacting objects, which encapsulate state (attributes) and behavior (operations).", "details": "Classes define common templates; objects are instances. Encapsulation hides internal state, inheritance supports reuse, polymorphism allows different implementations under a common interface. UML specifies model notation, not a development process.", "zh": "Class ≠ Object，UML ≠ Unified Process；UML 是畫圖語言，UP 是流程框架。", "memorize": "OO: identity, encapsulation, inheritance, polymorphism; UML: functional / structural / behavioral views."}, {"title": "Unified Process and iteration", "definition": "The Unified Process is use-case driven, architecture-centric, iterative and incremental. Its phases are Inception, Elaboration, Construction, Transition.", "details": "Iteration revisits a set of activities; increment delivers an additional slice of functionality. UP phases are not the same as the four SDLC activities.", "zh": "「反覆修正」是 iterative；「一部分一部分交付」是 incremental。", "memorize": "Inception → Elaboration → Construction → Transition."}]}, {"id": 2, "title": "Requirements Determination", "subtitle": "Functional vs nonfunctional, analysis strategies, elicitation, validation", "topics": [{"title": "Requirement types and scope", "definition": "A requirement states what the system must do or which characteristic it must have. Functional requirements describe processes and information; nonfunctional requirements specify quality and constraints.", "details": "Nonfunctional categories: Operational, Performance, Security, Cultural and Political. A requirements definition establishes system scope and provides inputs for later models.", "zh": "「能搜尋課程」是 functional；「2 秒內回傳」是 performance。", "memorize": "Functional = behavior; Nonfunctional = how well / under what constraints."}, {"title": "Writing requirement statements", "definition": "A descriptive requirement expresses one clear obligation. A user story typically follows “As a [role], I want [capability], so that [business value].”", "details": "Requirements should be unambiguous, testable, feasible, consistent and traceable. Avoid conflating a broad goal with a directly verifiable requirement.", "zh": "把「系統要很快」改成「95% 的查詢在 2 秒內完成」。", "memorize": "User story = Role + Goal + Value; acceptance criteria make it testable."}, {"title": "Eight requirements-analysis strategies", "definition": "Analyze the as-is process before defining the to-be system. The eight course strategies examine problems, causes, time, cost, peer practices, desired outcomes, technologies and eliminable activities.", "details": "Problem analysis; Root cause analysis (fishbone); Duration analysis; Activity-based costing; Informal benchmarking; Outcome analysis; Technology analysis; Activity elimination.", "zh": "Duration analysis 比的是各步驟實際工作時間 vs 整體耗時；差距大通常是等待。", "memorize": "8 strategies: Problem / Root cause / Duration / ABC / Benchmarking / Outcome / Technology / Elimination."}, {"title": "Five elicitation techniques", "definition": "Select elicitation methods according to accessibility of users, group consensus, process complexity, and availability of artifacts.", "details": "Interviews provide depth; questionnaires reach many; observation reveals actual work; document analysis examines manuals/forms; Joint Application Development (JAD) develops shared understanding in workshops.", "zh": "訪談可追問但耗時；問卷適用大量使用者；Observation 能發現「使用者自己沒說到」的操作。", "memorize": "Interviews | Questionnaires | Observation | Document Analysis | JAD."}, {"title": "Interview and observation pitfalls", "definition": "Interviews use open-ended, closed-ended and probing questions; interview notes should be verified by the interviewee. Observation needs awareness of observer effects and atypical behavior.", "details": "Avoid leading questions. Validate documents against actual practice because formal rules and everyday workflows may differ.", "zh": "觀察時被觀察者可能改變行為（Hawthorne effect）；不要把單次情境當成全部。", "memorize": "Prepare → ask and probe → document → verify → reconcile."}, {"title": "Requirements quality and system proposal", "definition": "Validation checks whether requirements represent genuine business needs; verification checks clarity, internal consistency, completeness and testability.", "details": "Review textual ambiguity, incomplete actor/action descriptions, conflicts, feasibility and consistency across requirements. The system proposal assembles analysis models plus updated planning artifacts.", "zh": "不要把「已寫成文字」等同「已確認正確」；需要走查與利害關係人確認。", "memorize": "Quality check → requirements definition → functional/structural/behavioral models → system proposal."}]}, {"id": 3, "title": "Functional Modeling", "subtitle": "Use-case diagrams, activity diagrams, UCD, verification", "topics": [{"title": "Three functional-model artifacts", "definition": "Functional models represent the system’s external functionality and business processes. Create a use-case diagram, activity diagrams and use-case descriptions (UCD).", "details": "A use-case diagram identifies system scope and actors; an activity diagram visualizes control flow; a UCD documents detailed events, alternatives and exceptions.", "zh": "Use case 是「系統要提供什麼服務」；不是每個小點擊都要變成 UC。", "memorize": "Requirements → Use-case diagram → Activity diagram → UCD; cross-check consistency."}, {"title": "Use-case diagram elements", "definition": "A use case is a major system function named with a verb–noun phrase. An actor is an external role, not necessarily an individual person.", "details": "Actors stay outside the subject boundary; use cases stay inside. Associations link actors and use cases; actor generalization denotes role inheritance.", "zh": "Actor 可是外部系統，並非只能是人；subject boundary 定義範圍。", "memorize": "Actor | Use case | Subject boundary | Association."}, {"title": "Include, extend, generalization", "definition": "«include» extracts required shared functionality; «extend» adds conditional/optional behavior; generalization expresses specialization/inheritance.", "details": "Include arrow: base → included use case. Extend arrow: extension → base use case. Generalization points to the general element.", "zh": "背箭頭方向：include 指向被包含者，extend 指向被延伸的基本 UC。", "memorize": "include = mandatory reused behavior; extend = optional variation; generalization = is-a."}, {"title": "Activity diagram semantics", "definition": "An activity diagram represents activities, their control flow, branching, synchronization and responsibility allocation.", "details": "Initial node starts execution; action nodes perform work; decision/merge handle alternatives; fork/join handle concurrency; activity final ends the whole activity, flow final ends one flow. Swimlanes allocate responsibility.", "zh": "Decision 是「擇一」；Fork 是「平行」；Flow final 不是整張圖停止。", "memorize": "Initial • Action • Decision/Merge • Fork/Join • Activity Final/Flow Final • Swimlane."}, {"title": "Use-case descriptions", "definition": "A use-case description documents the use-case name, actors, trigger, preconditions, normal flow, alternative/exception flows and postconditions.", "details": "Essential UCD describes intent without technology assumptions. Real UCD documents implementation-dependent interface details. Overview and detailed levels serve different precision needs.", "zh": "Essential = technology independent；Real = 可提到畫面/按鈕。事件步驟需要能對應 activity。", "memorize": "UCD: name → actors → trigger → preconditions → main flow → alternate flows → postconditions."}, {"title": "Functional V&V and traceability", "definition": "Verification and validation ensure each required behavior has consistent representations across the use-case diagram, activity diagram and UCD.", "details": "Check all actors appear in the diagram; each use case has coherent event flows; decisions and alternatives align; events correspond to activities and ultimately operations in structural models.", "zh": "三種模型不能各說各話；相同 actor、動作、條件與分支要對得起來。", "memorize": "Requirements ↔ UC ↔ Activity ↔ UCD ↔ Class responsibilities."}]}, {"id": 4, "title": "Structural Modeling", "subtitle": "CRC, classes, relations, multiplicity, object diagram", "topics": [{"title": "Purpose of structural models", "definition": "Structural models describe the static objects of the domain and their relationships. Common artifacts are CRC cards, class diagrams and object diagrams.", "details": "The analysis model captures people, places, things and events as domain objects; implementation details are refined later. Identify candidate classes from nouns and responsibilities from verbs.", "zh": "不是把句子所有名詞都建成類別；先看系統需求及範圍。", "memorize": "CRC → Class diagram → Object diagram (instance snapshot)."}, {"title": "Class, attribute, operation", "definition": "A class is a template for objects. Attributes represent relevant atomic properties; operations describe domain-specific behavior.", "details": "Abstract classes cannot be directly instantiated; concrete classes can. UML compartments show class name, attributes and operations. Visibility: + public, - private, # protected.", "zh": "name: String 是 attribute；registerCourse() 是 operation；一個 object 有自己的 attribute 值。", "memorize": "ClassName | -attribute: Type | +operation(parameter): ReturnType."}, {"title": "Three structural relationships", "definition": "Generalization expresses is-a inheritance; aggregation/composition express whole–part relationships; association expresses other meaningful links.", "details": "Generalization uses a hollow triangle toward the superclass. Aggregation uses a hollow diamond at the whole; composition uses a filled diamond at the whole and stronger lifecycle ownership.", "zh": "「Student is a Person」是 generalization；「Order contains LineItems」常是 composition；「Student enrolls in Course」是 association。", "memorize": "is-a ↔ Generalization; part-of ↔ Aggregation/Composition; participates-in ↔ Association."}, {"title": "Multiplicity and association classes", "definition": "Multiplicity constrains how many instances may participate at each association end. Common forms: 1, 0..1, 0..*, 1..*, m..n.", "details": "Multiplicity near class B indicates the number of B instances related to one A instance. A many-to-many association with its own attributes often needs an association class (e.g. Enrollment).", "zh": "不要讀反：靠近 Course 的 0..* 指「一位學生可以對應多門課」。", "memorize": "1 = exactly one; 0..1 = optional; 1..* = one or more; * = zero or more."}, {"title": "CRC cards and role-playing", "definition": "CRC stands for Class–Responsibility–Collaboration. CRC cards name a class, describe its responsibilities, and identify its collaborating classes.", "details": "Role-playing walks through UCD events and asks which object performs each operation, what information it needs and whom it calls. Revise responsibilities before drawing a full CD.", "zh": "CRC 的合作對象須對應合理 class 關係；不只是列名詞。", "memorize": "Class → responsibilities → collaborators; iterate with use-case scenarios."}, {"title": "Class diagram and object diagram", "definition": "A class diagram models types and relationships; an object diagram displays actual instances and links at a specific moment.", "details": "Object names may use instanceName:ClassName, and attributes can show current instance values. Diagram relationships must respect class multiplicity constraints.", "zh": "Class diagram 是規格；Object diagram 是某一刻「真實有哪些實例」。", "memorize": "Class: Student / Course; Objects: doris:Student / sad:Course."}, {"title": "Structural modeling consistency", "definition": "Structural models must support every necessary use-case event without adding unrelated gold-plating.", "details": "Validate class names and types, operations required by flows, association semantics, valid multiplicities and object snapshots. Check consistency with functional models.", "zh": "找不到負責某個 UC event 的 operation，代表模型可能漏掉責任。", "memorize": "UCD event → operation in class → collaborator/association → object links."}]}, {"id": 5, "title": "Behavioral Modeling", "subtitle": "Sequence/communication diagrams, CRUDE, state machines", "topics": [{"title": "Purpose and model types", "definition": "Behavioral models show internal dynamic behavior of the system. Interaction diagrams model message exchange; state machines model state changes of objects.", "details": "Sequence diagrams emphasize time/order; communication diagrams emphasize object links/message flow. Course slides cover both plus state machines.", "zh": "Functional 看外部「做什麼」，Structural 看「有哪些物件」，Behavioral 看「如何互動」。", "memorize": "Interaction = messages among objects; State machine = lifecycle of an object."}, {"title": "Sequence diagram notation", "definition": "A sequence diagram orders messages from top to bottom across actor/object lifelines. Activation bars show execution; return messages show response.", "details": "Participants appear at top, lifelines descend, solid message arrows invoke operations and dashed return arrows indicate results. Guard conditions qualify messages; fragments can show conditional flows.", "zh": "上到下是時間，不是左右；箭頭指向被呼叫方法的接收者。", "memorize": "actor/object lifeline → call message → activation → return message."}, {"title": "Instance versus generic sequence", "definition": "An instance sequence diagram represents one use-case scenario; a generic sequence diagram represents multiple scenarios through control structures.", "details": "The course emphasizes instance sequence diagrams for the main event flow. Each call must map to an appropriate operation of a class shown in the class diagram.", "zh": "只畫正常流程的單一路徑，是 instance SD；不要以為它包含所有例外路徑。", "memorize": "Choose UC/UCD flow → objects → messages → validate with CD."}, {"title": "Communication diagrams", "definition": "Communication diagrams display participants and links, annotating messages with sequence numbers that encode execution order.", "details": "They emphasize relationship topology rather than vertical time. Messages can be numbered 1, 1.1, 1.2 to indicate nested interactions.", "zh": "Communication diagram 不是沒有順序，而是用編號表達順序。", "memorize": "Sequence diagram: time order; Communication diagram: interaction structure."}, {"title": "CRUDE matrix", "definition": "CRUDE captures the ways objects operate upon or interact with domain classes: Create, Read, Update, Delete and Execute.", "details": "Use a matrix to cross-check which actor/object performs each operation and whether all responsibilities are covered. Check against UCD events, class operations and sequence messages.", "zh": "不要把 CRUD（資料操作四種）和 CRUDE（多一個 Execute）混淆。", "memorize": "C=Create; R=Read; U=Update; D=Delete; E=Execute."}, {"title": "State machines and transitions", "definition": "A behavioral state machine depicts the lifecycle of a significant object with states and transitions triggered by events.", "details": "State is a meaningful condition of an object, often tied to attribute values. Transitions use event [guard] / action. Identify initial and final states, and avoid dead ends or invalid transitions.", "zh": "State 要是物件的生命週期狀態，不是系統每一步的活動名稱。", "memorize": "State A -- event [guard] / action --> State B."}, {"title": "Behavioral V&V and model integration", "definition": "Validate that messages correspond to real class operations, and transitions correspond to legitimate domain events and attribute changes.", "details": "Each UCD event should map to an action/message where appropriate; all objects must exist in structural models; update CD or UCD when the behavioral model exposes missing responsibilities.", "zh": "畫完循序圖要反查 CD：message 的 receiver 是否真的擁有那個 operation？", "memorize": "UCD ↔ Class diagram ↔ Sequence/Communication ↔ State machine."}]}], "exam": [{"id": "1", "part": "True / False", "question": "A class on a class diagram (CD) must be associated with at least one use case (UC)", "options": ["True", "False"], "answer": 0, "en": "Course principle: Each modeled domain class should support relevant use-case responsibilities; strict direct association may be indirect, so check scope.", "zh": "解題重點：Each modeled domain class should support relevant use-case responsibilities; strict direct association may be indirect, so check scope.", "chapter": 4, "page": 1}, {"id": "2", "part": "True / False", "question": "A package diagram can be used to group use cases", "options": ["True", "False"], "answer": 0, "en": "Course principle: Packages group logically related model elements, including use cases.", "zh": "解題重點：Packages group logically related model elements, including use cases.", "chapter": 4, "page": 1}, {"id": "3", "part": "True / False", "question": "In screen design, if you want to display certain information in chronological order, the information should be displayed from right to left.", "options": ["True", "False"], "answer": 1, "en": "Course principle: Western-language chronological layout usually proceeds left to right unless context requires otherwise.", "zh": "解題重點：Western-language chronological layout usually proceeds left to right unless context requires otherwise.", "chapter": 0, "page": 1}, {"id": "4", "part": "True / False", "question": "If information items are required to enter the system individually, the appropriate input processing mechanism is batch-processing", "options": ["True", "False"], "answer": 1, "en": "Course principle: Individual entry is online input, not batch processing.", "zh": "解題重點：Individual entry is online input, not batch processing.", "chapter": 0, "page": 1}, {"id": "5", "part": "True / False", "question": "In database design, normalization is often applied to help increase the efficiency of data access", "options": ["True", "False"], "answer": 1, "en": "Course principle: Normalization reduces redundancy and anomalies; it is not necessarily an access-speed optimization.", "zh": "解題重點：Normalization reduces redundancy and anomalies; it is not necessarily an access-speed optimization.", "chapter": 0, "page": 1}, {"id": "6", "part": "True / False", "question": "You can write SQL statements in DAM (Data Access & Manipulation) classes.", "options": ["True", "False"], "answer": 0, "en": "Course principle: DAM classes contain SQL/data access logic in layered design.", "zh": "解題重點：DAM classes contain SQL/data access logic in layered design.", "chapter": 4, "page": 1}, {"id": "7", "part": "True / False", "question": "Contract forms are used to define constraints for the variables of a class.", "options": ["True", "False"], "answer": 0, "en": "Course principle: Contracts specify constraints such as preconditions, postconditions and invariants.", "zh": "解題重點：Contracts specify constraints such as preconditions, postconditions and invariants.", "chapter": 4, "page": 1}, {"id": "8", "part": "True / False", "question": "In formal usability testing, it is better for UI designers to accompany users during the evaluation to go through and navigate the interface for the users to have a better understanding about the design.", "options": ["True", "False"], "answer": 1, "en": "Course principle: Formal usability evaluations should observe natural user behavior without coaching.", "zh": "解題重點：Formal usability evaluations should observe natural user behavior without coaching.", "chapter": 0, "page": 1}, {"id": "9", "part": "True / False", "question": "CRUDE matrix must relate to activities on an activity diagram and events in a UC", "options": ["True", "False"], "answer": 0, "en": "Course principle: Traceability links interaction actions and documented use-case events.", "zh": "解題重點：Traceability links interaction actions and documented use-case events.", "chapter": 5, "page": 1}, {"id": "10", "part": "True / False", "question": "DAM objects belong to the problem domain (PD) layer.", "options": ["True", "False"], "answer": 1, "en": "Course principle: DAM is data access, not problem domain.", "zh": "解題重點：DAM is data access, not problem domain.", "chapter": 0, "page": 1}, {"id": "11", "part": "True / False", "question": "An action in an activity diagram and an event in a UC description should be related to one or more operations on CD", "options": ["True", "False"], "answer": 0, "en": "Course principle: Events map to responsibilities/operations of collaborating classes.", "zh": "解題重點：Events map to responsibilities/operations of collaborating classes.", "chapter": 3, "page": 1}, {"id": "12", "part": "True / False", "question": "An attribute or an association/aggregation relationship on CD should be related to the subject or object of an event in UCD", "options": ["True", "False"], "answer": 0, "en": "Course principle: Domain data and associations should be grounded in UC descriptions.", "zh": "解題重點：Domain data and associations should be grounded in UC descriptions.", "chapter": 4, "page": 1}, {"id": "13", "part": "True / False", "question": "In terms of system requirements, analysis models focus on functional requirements, while design models must include non-functional requirements.", "options": ["True", "False"], "answer": 0, "en": "Course principle: Nonfunctional requirements become especially decisive for design decisions.", "zh": "解題重點：Nonfunctional requirements become especially decisive for design decisions.", "chapter": 2, "page": 1}, {"id": "14", "part": "True / False", "question": "Greater coupling among classes may identify partitions", "options": ["True", "False"], "answer": 1, "en": "Course principle: Low coupling between partitions is desirable.", "zh": "解題重點：Low coupling between partitions is desirable.", "chapter": 4, "page": 1}, {"id": "15", "part": "True / False", "question": "Identifying a super class from common features among classes is an example of factoring", "options": ["True", "False"], "answer": 0, "en": "Course principle: Factoring places shared properties into a common superclass.", "zh": "解題重點：Factoring places shared properties into a common superclass.", "chapter": 4, "page": 1}, {"id": "16", "part": "True / False", "question": "In package diagram, components in a package should be as less cohesive as possible", "options": ["True", "False"], "answer": 1, "en": "Course principle: High cohesion is desirable inside a package.", "zh": "解題重點：High cohesion is desirable inside a package.", "chapter": 4, "page": 1}, {"id": "17", "part": "True / False", "question": "States in a behavioral state machine must match the different values of an attribute of an object", "options": ["True", "False"], "answer": 0, "en": "Course principle: States represent meaningful object conditions often encoded through attributes.", "zh": "解題重點：States represent meaningful object conditions often encoded through attributes.", "chapter": 5, "page": 1}, {"id": "18", "part": "True / False", "question": "Objects in a CRUDE matrix must be associated with classes", "options": ["True", "False"], "answer": 0, "en": "Course principle: A CRUDE matrix references objects instantiated from modeled classes.", "zh": "解題重點：A CRUDE matrix references objects instantiated from modeled classes.", "chapter": 5, "page": 1}, {"id": "19", "part": "True / False", "question": "When displaying text and its background, color with low contrast should be used to decrease eye strain", "options": ["True", "False"], "answer": 1, "en": "Course principle: Readability requires adequate foreground/background contrast.", "zh": "解題重點：Readability requires adequate foreground/background contrast.", "chapter": 0, "page": 1}, {"id": "20", "part": "True / False", "question": "A completeness check ensures that the numeric data entered is within the correct minimum or maximum values.", "options": ["True", "False"], "answer": 1, "en": "Course principle: Range checking is not completeness checking.", "zh": "解題重點：Range checking is not completeness checking.", "chapter": 0, "page": 1}, {"id": "21", "part": "True / False", "question": "Cohesion refers to how interdependent or interrelated the members are in a class/module/package/system", "options": ["True", "False"], "answer": 0, "en": "Course principle: Cohesion assesses internal relatedness; coupling describes dependencies across modules.", "zh": "解題重點：Cohesion assesses internal relatedness; coupling describes dependencies across modules.", "chapter": 4, "page": 1}, {"id": "22", "part": "Short Answer", "question": "Packages may be dependent upon one another. State the two meanings of “dependence”.", "options": [], "answer": "Development sequence; change impact.", "en": "A dependency can constrain development order and cause changes to propagate.", "zh": "開發先後相依、變更影響相依。", "chapter": 4, "page": 1}, {"id": "23", "part": "Short Answer", "question": "State and briefly explain the three constraint types in class and method design.", "options": [], "answer": "Precondition; postcondition; invariant.", "en": "Preconditions must hold before execution, postconditions after execution, and invariants always.", "zh": "前置條件、後置條件、不變條件。", "chapter": 4, "page": 1}, {"id": "24", "part": "Short Answer", "question": "State the solution suggested in the course slides to resolve the issue in 3D design when viewers need to determine a specific value that is being represented.", "options": [], "answer": "Show direct numeric labels / value indication instead of relying only on 3D visual estimation.", "en": "Use an explicit value display to avoid inaccurate reading of 3D graphical position.", "zh": "3D 圖難精確讀值，應直接標示數值。", "chapter": 0, "page": 1}, {"id": "25", "part": "Short Answer", "question": "GUI design comprise three mechanisms. What are they?", "options": [], "answer": "Navigation; input; output.", "en": "GUI supports navigation, data capture, and information presentation.", "zh": "導覽、輸入、輸出。", "chapter": 0, "page": 1}, {"id": "26", "part": "Short Answer", "question": "The fundamental part of the user interface that permits the system to capture information is ??? mechanism", "options": [], "answer": "Input.", "en": "Input mechanisms collect information from users.", "zh": "題目是填空，正解 input。", "chapter": 0, "page": 1}, {"id": "27", "part": "Short Answer", "question": "Answer the following questions in terms of the six aspects of UI design: (1)layout, (2)content awareness, (3)aesthetics, (4)user experience, (5)consistency, (6)minimal user effort.\n(1) What aspect emphasizes that areas in a screen should have a natural intuitive flow?\n(2) The user interface design aspect that places an emphasis on the user’s ability to always know where he/she is in the system and what information is being displayed.\n(3) What aspect suggests designing interfaces that are pleasing to the eyes?\n(4) & (5) Juan is designing a user interface for the data-entry clerks in the marketing department. In an interview with the department manager, Juan has learned that the department has frequent turnover and that there is very little money for training. What two interface design aspects would you recommend Juan emphasize in his design?", "options": [], "answer": "(1) Layout; (2) Content awareness; (3) Aesthetics; (4) Consistency; (5) Minimal user effort.", "en": "Visual flow is layout; orientation is content awareness; visual appeal is aesthetics; consistent low-effort interaction reduces training burden.", "zh": "重點：視線動線、所在位置、視覺美感、低學習成本。", "chapter": 0, "page": 1}, {"id": "28", "part": "Multiple Choice", "question": "An( ) shows how all the screens, forms and reports are related, and how the user moves from one to another.", "options": ["a. window navigation diagram", "b. interface standard design", "c. data flow diagram", "d. storyboard", "e. use scenario"], "answer": 0, "en": "A window navigation diagram represents screens and the transitions connecting them.", "zh": "畫面導覽圖呈現各畫面及其連結。", "chapter": 0, "page": 2}, {"id": "29", "part": "Short Answer", "question": "Navigation design documentation can be done by using what two artifacts?", "options": [], "answer": "Window navigation diagram; Real UCD.", "en": "A navigation diagram shows connections among screens; a real use-case description documents screen-level interactions.", "zh": "畫面關係圖搭配 Real UCD。", "chapter": 0, "page": 2}, {"id": "30", "part": "Short Answer", "question": "Briefly explain the two major dimensions in designing VR (Virtual reality)?", "options": [], "answer": "Sensory immersion; effective interaction.", "en": "VR design considers convincing sensory experience and interaction with the virtual environment.", "zh": "沉浸式感官與有效互動。", "chapter": 0, "page": 2}, {"id": "31", "part": "Multiple Choice", "question": "Which of the following is an example of outsourcing in software development?", "options": ["(a) Purchase a software system without customization from a vendor", "(b) Hire a software firm to develop an IS", "(c) The IT department in a firm develops an IS for the firm"], "answer": 1, "en": "Outsourcing delegates systems development to an external firm. Buying off-the-shelf software is purchasing a package.", "zh": "委外開發是請外部軟體公司替企業開發，不等於直接買現成套裝。", "chapter": 1, "page": 2}, {"id": "32", "part": "Short Answer", "question": "According to the course slides, from the UI design perspective, what is the major difference between essential and real UCD?", "options": [], "answer": "Essential UCD is technology independent; Real UCD includes UI and implementation-specific details.", "en": "An essential UCD focuses on user intent, whereas a real UCD specifies the interface and actual interaction.", "zh": "Essential 不指定 UI；Real 會帶入畫面細節。", "chapter": 3, "page": 2}, {"id": "33", "part": "Short Answer", "question": "There are 5 evaluation approaches for UI design: (1)Heuristic evaluation (2)Interactive evaluation (3)Walkthrough (4)A/B testing (5)Formal usability testing. Answer the following questions:\n(1) Which approach does not involve the participation of a UI designer?\n(2) Which approach suggests that the UI is operated by the designer to show the users?\n(3) Which approach is least costly?\nBriefly explain A/B testing (2pts).", "options": [], "answer": "(1) Formal usability testing; (2) Walkthrough; (3) Heuristic evaluation; A/B: compare alternative versions with assigned users on a target metric.", "en": "Expert evaluation is cheap; walkthrough demonstrates operation; formal usability testing relies on observing test users independently. A/B compares user outcomes across variants.", "zh": "正式易用性測試不應由設計師帶操作；A/B 使用不同版本比較量化表現。", "chapter": 0, "page": 2}, {"id": "34", "part": "Short Answer", "question": "An information system is logically divided into 5 layers. What are they?", "options": [], "answer": "Foundation; User Interface; Business Logic/Problem Domain; Data Management; Physical Architecture.", "en": "Layering isolates presentation, domain logic, persistence and infrastructure concerns.", "zh": "依原卷手寫方向列出五層，詳細命名需依老師課堂版本核對。", "chapter": 0, "page": 2}, {"id": "35", "part": "Short Answer", "question": "There are several types of data storages: (1) File (2) RDB (3) ORDB (4) OODB (5) No-SQL data store. Answer the following questions (以編號回答即可):\n(1) Further contains columnar data stores\n(2) Supports repeating data groups and allows multi-valued attributes\n(3) Store and handle complex data types such as multi-media objects or user-defined and can use SQL\n(4) Locking mechanisms and ACID for ensuring securing and isolating transactions are strictly enforced\n(5) Has two types of approaches for accessing data: sequential and random", "options": [], "answer": "(1) 5; (2) 4; (3) 3; (4) 2; (5) 1.", "en": "NoSQL contains column stores; OODB models rich object attributes; ORDB extends relational tables with user-defined types; RDB supports ACID; files allow sequential/random access.", "zh": "按題目選項編號：5、4、3、2、1。", "chapter": 0, "page": 2}, {"id": "36", "part": "Short Answer", "question": "Answer the following question in terms of the characteristic of three forms of normalization: 1st, 2nd, and 3rd NF.", "options": [], "answer": "1NF: atomic attributes/no repeating groups; 2NF: no partial dependencies; 3NF: no transitive dependencies.", "en": "Each higher normal form removes a different source of dependency anomalies.", "zh": "1NF 不可多值，2NF 無部分相依，3NF 無遞移相依。", "chapter": 0, "page": 2}, {"id": "37", "part": "Short Answer", "question": "Give the three levels regarding Connascence in OO system design and give an example for each level.", "options": [], "answer": "Level 1: code-level; Level 2: class-level; Level 3: use-case/system-level connascence (check course terminology).", "en": "Connascence captures dependencies such that changing one element requires coordinated change in another. Exact level labels in the handwritten scan are partly unclear.", "zh": "影像手寫層級不易辨識；應以當年度投影片術語校對，勿當官方答案。", "chapter": 0, "page": 2}, {"id": "38", "part": "Short Answer", "question": "State the two formats for writing algorithm specs in a method specification form.", "options": [], "answer": "Structured English; Activity diagram.", "en": "Structured English gives pseudocode-like rules; an activity diagram models the control flow.", "zh": "結構化英文與活動圖。", "chapter": 0, "page": 2}], "mock": [{"id": 1, "chapter": 1, "type": "choice", "question": "Which SDLC phase establishes whether a proposed system creates sufficient business value?", "options": ["Implementation", "Planning", "Design", "Deployment"], "answer": 1, "en": "Planning establishes business value and feasibility.", "zh": "Planning 先確認價值與可行性。"}, {"id": 2, "chapter": 1, "type": "choice", "question": "Which artifact is usually submitted with feasibility analysis for initial project selection?", "options": ["System request", "Object diagram", "State machine", "Sequence diagram"], "answer": 0, "en": "The system request defines business need and value.", "zh": "System request 是正式發起的文件。"}, {"id": 3, "chapter": 1, "type": "choice", "question": "Which model best fits a project with stable requirements and a linear workflow?", "options": ["Waterfall", "Evolutionary prototyping", "Scrum", "Throwaway prototyping"], "answer": 0, "en": "Waterfall works best with stable requirements.", "zh": "瀑布模式需要較穩定的需求。"}, {"id": 4, "chapter": 1, "type": "choice", "question": "What does “incremental” emphasize in system development?", "options": ["Delivering added functionality in portions", "Doing each phase only once", "Eliminating testing", "Avoiding business analysis"], "answer": 0, "en": "Incremental delivery adds a usable slice in each release.", "zh": "Incremental 強調分批交付。"}, {"id": 5, "chapter": 1, "type": "choice", "question": "Which Unified Process phase emphasizes risk reduction and architectural foundations?", "options": ["Inception", "Elaboration", "Transition", "Retirement"], "answer": 1, "en": "Elaboration stabilizes requirements and architecture.", "zh": "Elaboration 會處理主要風險與架構。"}, {"id": 6, "chapter": 1, "type": "choice", "question": "UML is best understood as which of the following?", "options": ["A development process", "A modeling notation", "A database engine", "An operating system"], "answer": 1, "en": "UML is a standardized visual modeling language.", "zh": "UML 是模型表示語言，不是開發方法。"}, {"id": 7, "chapter": 2, "type": "choice", "question": "A requirement specifying “responses within two seconds” is primarily:", "options": ["Functional", "Performance", "Business event", "Use case"], "answer": 1, "en": "Response-time targets are performance requirements.", "zh": "速度門檻屬效能非功能需求。"}, {"id": 8, "chapter": 2, "type": "choice", "question": "Which method is most suitable for discovering tacit tasks that users omit when explaining work?", "options": ["Observation", "Questionnaire only", "Code inspection", "Package diagram"], "answer": 0, "en": "Observation reveals actual processes.", "zh": "Observation 可看到未被說出的日常步驟。"}, {"id": 9, "chapter": 2, "type": "choice", "question": "What is the main purpose of root cause analysis?", "options": ["Find symptom descriptions", "Identify underlying causes", "Select a programming language", "Create classes"], "answer": 1, "en": "Root cause analysis distinguishes symptoms from causes.", "zh": "根因分析不只列問題表象。"}, {"id": 10, "chapter": 2, "type": "choice", "question": "Which requirement is most verifiable?", "options": ["The interface shall be fast", "The website shall be beautiful", "95% of queries shall complete within 2 seconds", "The system shall be modern"], "answer": 2, "en": "Measurable thresholds support acceptance tests.", "zh": "量化的條件才能驗收。"}, {"id": 11, "chapter": 2, "type": "choice", "question": "Which elicitation technique convenes analysts and users for collaborative consensus?", "options": ["JAD", "Object diagram", "Normalization", "State machine"], "answer": 0, "en": "JAD holds facilitated workshops.", "zh": "JAD 是共同工作坊。"}, {"id": 12, "chapter": 2, "type": "choice", "question": "Which method compares an organization’s process with similar successful processes elsewhere?", "options": ["Duration analysis", "Informal benchmarking", "Activity elimination", "Screen prototyping"], "answer": 1, "en": "Benchmarking learns from comparable organizations.", "zh": "Benchmarking 是同業標竿比較。"}, {"id": 13, "chapter": 3, "type": "choice", "question": "Where should an actor appear in a use-case diagram?", "options": ["Inside the system boundary", "Outside the system boundary", "Inside each use case", "Only in a state machine"], "answer": 1, "en": "Actors are roles external to the subject.", "zh": "Actor 在系統邊界外。"}, {"id": 14, "chapter": 3, "type": "choice", "question": "Which relationship models mandatory shared behavior between use cases?", "options": ["extend", "include", "generalization", "aggregation"], "answer": 1, "en": "Include expresses reused required functionality.", "zh": "include 是必要的共用行為。"}, {"id": 15, "chapter": 3, "type": "choice", "question": "Which activity diagram element synchronizes parallel execution?", "options": ["Decision", "Join", "Merge", "Flow final"], "answer": 1, "en": "A join synchronizes parallel incoming flows.", "zh": "Join 匯合平行流程。"}, {"id": 16, "chapter": 3, "type": "choice", "question": "What distinguishes an essential UCD from a real UCD?", "options": ["It always has fewer actors", "It avoids implementation-specific details", "It omits events", "It is a database schema"], "answer": 1, "en": "Essential UCD expresses user intent without UI mechanisms.", "zh": "Essential UCD 不寫畫面實作細節。"}, {"id": 17, "chapter": 3, "type": "choice", "question": "Which element ends one flow without necessarily ending the entire activity?", "options": ["Activity final", "Flow final", "Initial node", "Fork"], "answer": 1, "en": "A flow final terminates only that flow.", "zh": "Flow final 結束一條路徑。"}, {"id": 18, "chapter": 3, "type": "choice", "question": "Which verb phrase is most suitable for naming a use case?", "options": ["Customer data", "Submit Application", "Blue page", "Database table"], "answer": 1, "en": "Use-case names should be meaningful verb–noun phrases.", "zh": "使用案例建議以動詞＋受詞命名。"}, {"id": 19, "chapter": 4, "type": "choice", "question": "A Student “is a” Person. Which UML relationship is appropriate?", "options": ["Aggregation", "Generalization", "Composition", "Dependency only"], "answer": 1, "en": "An is-a relationship is generalization.", "zh": "is-a 對應繼承／泛化。"}, {"id": 20, "chapter": 4, "type": "choice", "question": "Which multiplicity means that zero or more Course objects are linked to one Student?", "options": ["1", "0..1", "0..*", "1..1"], "answer": 2, "en": "0..* allows any number including zero.", "zh": "星號表示多個，0..* 包含零。"}, {"id": 21, "chapter": 4, "type": "choice", "question": "Which model represents runtime instances and their concrete links?", "options": ["Class diagram", "Object diagram", "Activity diagram", "Use-case diagram"], "answer": 1, "en": "Object diagrams are snapshots of instances.", "zh": "Object diagram 表示某一刻的實例。"}, {"id": 22, "chapter": 4, "type": "choice", "question": "Which CRC element identifies the classes needed to fulfill a responsibility?", "options": ["Compartment", "Collaborator", "Constraint", "Multiplicity"], "answer": 1, "en": "Collaborators are classes assisting responsibilities.", "zh": "合作對象是執行責任所需的其他類別。"}, {"id": 23, "chapter": 4, "type": "choice", "question": "Which relationship best represents strong part ownership with dependent lifetime?", "options": ["Composition", "Generalization", "Loose association", "Extension"], "answer": 0, "en": "Composition models strong whole-part ownership.", "zh": "Composition 是較強的整體與部分關係。"}, {"id": 24, "chapter": 4, "type": "choice", "question": "Which class member should model a domain action such as cancelBooking()?", "options": ["Attribute", "Operation", "Multiplicity", "Actor"], "answer": 1, "en": "An operation represents a class behavior.", "zh": "動作應是 operation。"}, {"id": 25, "chapter": 5, "type": "choice", "question": "What determines vertical ordering in a sequence diagram?", "options": ["Class size", "Message timing", "Attribute visibility", "Package names"], "answer": 1, "en": "Time flows from top to bottom.", "zh": "循序圖由上到下代表時間。"}, {"id": 26, "chapter": 5, "type": "choice", "question": "What does an execution bar on a lifeline indicate?", "options": ["Database size", "Method execution", "A superclass", "User privilege"], "answer": 1, "en": "Activation represents an interval of execution.", "zh": "長條代表物件正在執行行為。"}, {"id": 27, "chapter": 5, "type": "choice", "question": "Which diagram focuses on communication links and numbered messages?", "options": ["Communication diagram", "Object diagram", "Use-case diagram", "Package diagram"], "answer": 0, "en": "Communication diagrams emphasize topology and numbered flows.", "zh": "溝通圖用連線及編號表示互動。"}, {"id": 28, "chapter": 5, "type": "choice", "question": "What does the E in CRUDE stand for?", "options": ["Evaluate", "Execute", "Exclude", "Estimate"], "answer": 1, "en": "CRUDE includes Create Read Update Delete Execute.", "zh": "CRUDE 多一個 Execute。"}, {"id": 29, "chapter": 5, "type": "choice", "question": "In a state machine, what does a guard condition indicate?", "options": ["A required Boolean condition for transition", "An object class name", "Database normalization", "A final state"], "answer": 0, "en": "A guarded transition fires only if the condition holds.", "zh": "Guard 是轉移必須滿足的條件。"}, {"id": 30, "chapter": 5, "type": "choice", "question": "What should be checked when mapping a sequence diagram to a class diagram?", "options": ["Message receivers have matching operations", "Every lifeline has five attributes", "All messages are synchronous", "Classes have no associations"], "answer": 0, "en": "Each invoked message should correspond to an available operation.", "zh": "接收 message 的類別必須有相應操作。"}, {"id": 31, "chapter": 1, "type": "short", "question": "Explain the distinction between analysis and design deliverables.", "answer": "Analysis specifies what is needed with requirements and models; design specifies how it will be implemented in architectures, interfaces, databases and programs.", "en": "Analysis focuses on business needs and conceptual models; design specifies implementation details.", "zh": "分析定義需求，設計將需求具體化為實作規格。"}, {"id": 32, "chapter": 2, "type": "short", "question": "Write one functional and one nonfunctional requirement for an online enrollment system.", "answer": "Functional: A student shall enroll in an available course. Nonfunctional: 95% of enrollment confirmations shall appear within 2 seconds.", "en": "A functional requirement describes service behavior; a nonfunctional one is a measurable quality constraint.", "zh": "功能與非功能要明確區分，最好可被驗證。"}, {"id": 33, "chapter": 3, "type": "short", "question": "Explain the difference between «include» and «extend» and state their arrow directions.", "answer": "Include: base → included, required reusable behavior. Extend: extension → base, optional/conditional behavior.", "en": "An include reuses mandatory functionality whereas an extend adds optional behavior.", "zh": "箭頭方向最常考，include 指向被用的 UC，extend 指向基礎 UC。"}, {"id": 34, "chapter": 4, "type": "short", "question": "Design a class association for Student and Course and describe the multiplicity at both ends.", "answer": "Student 0..* ↔ 0..* Course, if each student can take many courses and each course has many students; Enrollment can hold registration date/grade.", "en": "Multiplicity depends on explicitly stated business constraints and is read at the opposite end.", "zh": "兩邊多對多時可用 Enrollment 作關聯類別存修課資料。"}, {"id": 35, "chapter": 5, "type": "short", "question": "Describe the role of a sequence diagram and how CRUDE helps verify it.", "answer": "A sequence diagram orders messages among objects for a use-case scenario. CRUDE cross-checks Create/Read/Update/Delete/Execute responsibilities across participating objects.", "en": "Use sequence flows to find operations and CRUDE to detect missing or inconsistent responsibilities.", "zh": "循序圖對照 CRUDE 可查漏掉的物件責任。"}], "images": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAsHCAoIBwsKCQoMDAsNEBsSEA8PECEYGRQbJyMpKScjJiUsMT81LC47LyUmNko3O0FDRkdGKjRNUkxEUj9FRkP/2wBDAQwMDBAOECASEiBDLSYtQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0P/wAARCAcIBOIDASIAAhEBAxEB/8QAHAABAAMBAQEBAQAAAAAAAAAAAAEDBAIFBgcI/8QAThAAAgICAAQDBAUJBgMHAwIHAQIAAwQRBRIhMRNBURQiYXEVMlKRkgYjMzRCU1RygSQ1Q3OhsURikwcWJVWCwdFjg6IXRWTh8CY2o3T/xAAXAQEBAQEAAAAAAAAAAAAAAAAAAQID/8QAHhEBAQEBAAMBAQEBAAAAAAAAAAERAiExQRJRMiL/2gAMAwEAAhEDEQA/APv4gRKhERCkaiIREmIgREmRCkmRJhCIiBEaiTAiJMQIiTIgIiIExEQERECJMRAg7iTIgI1EQEREBJiICRJiAiIgIiIERJiNERJiBEmIgREmRAak6jcQIiIgNREQERJgRqTEQERECI1EQGokxAiJMRoREQJgxIgIiI0IiI0IiI0TIk6jUCIiICIkwEgyYgJESYEREQESZEBqIiAiIgIiICIiA1GoiA1IkxAREQIiIgNSZEQqZERCEmREip1I1ESgYkbiAPSc6nUiBzODLSs5KyCsyJ3ymRykHtArInMsInJX4QODG50VPpOSDvsYERJ5SewMFWHkYERJAPpGj5CBESeU+kcrekBAnXIfSOQ+kCBJE65DJCH0gQBOhI0fSSFMCQJIkhDO1r9YHIkgTrl1ECNSZMkSjmJJiERJiIVESdRqERJ1GohTU5YTuQ0DiJMQuuxEgCTCEREBERCEREBERAREiBMGIgIgRAREQEjrJiBHWTEQEREBERAREQEREBERAiIgQJiIgIiICJEmAiQYgDERAmJEQERG4EyIiAkyIgDERAREQEmRECYkbjcCZEGICIiBMSIgJMiNwJiRuIExI3ECYJkQYExIiBMRG4CIiAiIgIiIDcRAgIiICIiAjcRAREQESIgTEiT5QIkyJMBERAREQIkxECIiICIiFIiIQiIkCIiVSRJ1GoQjW5MQAEGIg const KEY='sad-review-2026-v2';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){state={}}state={theme:'light',seen:{},pastAnswers:{},flags:{},wrong:{},mockAnswers:{},mockDuration:60,mockDeadline:null,mockStarted:false,mockSubmitted:false,mockWrittenScores:{},...state};let tab='home',chapter=1,filter='',pastMode='all',pastIndex=0,quickItems=[],quickAnswers={};const $=id=>document.getElementById(id), E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('本機儲存失敗，請檢查瀏覽器空間')}}function toast(t){let x=$('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2300)}function count(){let xs=DATA.exam.filter(q=>Array.isArray(q.options)&&q.options.length),done=xs.filter(q=>state.pastAnswers[q.id]!=null),good=done.filter(q=>state.pastAnswers[q.id]===q.answer);return{done:done.length,total:xs.length,good:good.length,rate:done.length?Math.round(100*good.length/done.length):0,read:Object.keys(state.seen).filter(x=>state.seen[x]).length,readingTotal:DATA.chapters.reduce((a,c)=>a+c.topics.length,0)}}function pct(a,b){return b?Math.round(a*100/b):0}function bar(a,b){return `<div class="progress"><i style="width:${pct(a,b)}%"></i></div>`}function navigate(t){tab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render();scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>navigate(b.dataset.tab));function stat(label,value,sub){return `<div class="card stat"><div class="muted small">${label}</div><div class="num">${value}</div><div class="small muted">${sub}</div></div>`}
function renderHome(){let s=count(),cards=DATA.chapters.map(c=>{let n=c.topics.filter((_,i)=>state.seen[c.id+'-'+i]).length;return `<div class="card chapterCard"><span class="bubble">${String(c.id).padStart(2,'0')}</span><div style="flex:1"><b>${E(c.title)}</b><div class="small muted">${c.topics.length} learning topics · ${n} reviewed</div>${bar(n,c.topics.length)}<button class="btn ghost small" style="margin-top:9px" onclick="openChapter(${c.id})">Open chapter →</button></div></div>`}).join('');return `<section class="hero"><div><div class="eyebrow">SYSTEM ANALYSIS & DESIGN · 2026</div><h1>Finals, meet your match. ✦</h1><p>A bilingual exam-prep workspace grounded in 2026 course slides, with textbook explanations and the original 2024/113 paper for reference.</p><button class="btn primary" onclick="openChapter(1)">Start studying ↗</button> <button class="btn" onclick="navigate('past')">Practice past exam</button></div><div style="font-size:72px;opacity:.7">◈</div></section><div class="grid" style="margin-top:17px">${stat('Reading progress',pct(s.read,s.readingTotal)+'%',s.read+' / '+s.readingTotal+' topics')}${stat('Past exam accuracy',s.rate+'%',s.good+' correct answers')}${stat('Past exam attempted',s.done+'/'+s.total,'Auto-scored T/F & MCQ')}${stat('Bookmarked / incorrect',Object.keys(state.flags).filter(x=>state.flags[x]).length+' / '+Object.keys(state.wrong).filter(x=>state.wrong[x]).length,'Keep reviewing missed ideas')}</div><div class="split" style="margin-top:17px"><section><div class="sectiontitle"><h2>Chapter map</h2><span class="pill">5 chapters</span></div><div class="chapgrid">${cards}</div><div class="card" style="margin-top:15px"><b>Source scope note</b><p class="small muted">The 2026 lecture slides are the primary chapter map (Ch1–Ch5). The textbook’s numbering differs, and the uploaded historical paper also includes UI design, data architecture, database normalization and other design topics beyond these five lecture chapters. Those are marked as supplementary historical-exam topics, not silently inserted into the syllabus.</p></div></section><aside><div class="sectiontitle"><h2>Quick Quiz ⚡</h2><button class="btn" onclick="newQuick()">↻ 3 new</button></div><div class="card" id="quickBox"></div></aside></div>`}
function newQuick(){let pool=DATA.mock.filter(q=>q.type==='choice');quickItems=pool.map(x=>x).sort(()=>Math.random()-.5).slice(0,3);quickAnswers={};renderQuick()}function renderQuick(){let box=$('quickBox');if(!box)return;box.innerHTML=quickItems.map((q,i)=>`<div style="border-bottom:1px solid var(--line);padding:12px 0"><div class="small muted">Q${i+1} · Ch${q.chapter}</div><b>${E(q.question)}</b>${q.options.map((x,j)=>`<button class="option ${quickAnswers[q.id]===j?(j===q.answer?'correct':'wrong'):''}" ${quickAnswers[q.id]!=null?'disabled':''} onclick="answerQuick(${q.id},${j})">${E(x)}</button>`).join('')}${quickAnswers[q.id]!=null?`<div class="small" style="color:${quickAnswers[q.id]===q.answer?'var(--good)':'var(--bad)'}">${quickAnswers[q.id]===q.answer?'✓ Correct':'✕ Not quite'}. ${E(q.zh)}</div>`:''}</div>`).join('')}function answerQuick(id,v){quickAnswers[id]=v;renderQuick()}
function openChapter(id){chapter=id;navigate('chapters')}const CH1_DEEP_DIVE="<section class=\"card\" style=\"margin:0 0 20px;padding:20px\"><span class=\"pill\">CH1 EXPANDED • 2026 COURSE</span><h2>Chapter 1 · Extended Master Notes</h2><p class=\"muted\">Detailed English-first concepts, traditional Chinese guidance, comparison rules, modeling SOP, Clinic walkthrough and exam checks. Expand a topic below. Built from the course lecture and textbook framework; explanatory teaching adaptations are not presented as textbook quotations.</p><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">01 · SDLC Four Phases & Deliverables</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> The SDLC has four fundamental phases: Planning, Analysis, Design, and Implementation.</p><p style=\"white-space:pre-line\">Planning asks WHY a project is needed: System Request, Technical/Economic/Organizational Feasibility, Project Plan. Analysis asks WHO, WHAT, WHERE and WHEN: Requirements Definition, Functional/Structural/Behavioral Models, System Proposal. Design asks HOW: Build/Buy/Outsource, Architecture, User/Component Interfaces, Database and Program Specifications. Implementation builds, tests, installs, trains users, and maintains the system.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>四階段必背：Planning = WHY；Analysis = WHAT；Design = HOW；Implementation = BUILD, TEST, INSTALL, SUPPORT。產出物依序逐步精緻化。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">02 · Planning: Business Value, System Request & Feasibility</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> Systems development should be justified by business needs and business value.</p><p style=\"white-space:pre-line\">System Request fields: Project Sponsor; Business Need; Business Requirements; Business Value; Special Issues. Technical Feasibility: Can we build it? Economic Feasibility: Should we build it? Organizational Feasibility: Will stakeholders adopt it? A Request for Proposal (RFP) invites potential vendors to propose solutions; it is different from the internal System Request.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>確認系統創造價值與是否可行，屬於 Planning；不等於直接設計資料庫或開始 Coding。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">03 · As-Is, To-Be, Business vs System Requirements</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> Analysis models the current As-Is business and determines the future To-Be system.</p><p style=\"white-space:pre-line\">Functional Requirements specify business processes or information the system must handle. Nonfunctional Requirements cover operational, performance, security, and cultural/political constraints. Analysis emphasizes logical WHAT; Design develops technical HOW. A system proposal consolidates requirements and analysis models.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>例如『可線上預約』是 Functional Requirement；『兩秒內回應』是 Performance / Nonfunctional Requirement；『PostgreSQL 儲存』是 Design 決策。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">04 · Design & Implementation Decision Rules</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> Design defines how the proposed system operates; Implementation delivers the working system.</p><p style=\"white-space:pre-line\">Design Strategy: In-house development, packaged software purchase, or outsourced development. Architecture: Software, Hardware, Network. Interfaces: User Interface and Component Interface. Database/file specifications and program design complete the System Specification. Implementation: coding, testing, installation, user training, support. Configuration Management identifies controlled items, controls changes and maintains version/status records.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>教授的階段分類題：決定是否外包、畫正式介面、設計資料庫 → Design；版本控管與程式建構、部署、訓練 → Implementation。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">05 · Waterfall and V-Model</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> Waterfall is sequential development; the V-Model emphasizes planned correspondence between design artifacts and testing.</p><p style=\"white-space:pre-line\">Waterfall: Planning → Analysis → Design → Implementation, with approval milestones and relatively late user feedback. Advantages: clear documentation and controls. Weakness: costly late changes. V-Model pairs Requirements with Acceptance Testing, System Specifications with System Testing, Architecture with Integration Testing, and Detailed Design with Unit Testing. Parallel Development instead means concurrent subprojects, with integration risks.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>注意 Waterfall、Parallel 與 V-Model 的差異。V-Model 不是『兩個子專案平行開發』的同義詞。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">06 · Phased Development and Prototyping</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> Phased Development incrementally delivers functional releases; prototyping clarifies requirements through early feedback.</p><p style=\"white-space:pre-line\">Phased release example: Booking → Availability → Notifications. Evolutionary Prototyping refines a prototype into a production system; Throwaway Prototyping discards an exploratory prototype after learning. Both permit early stakeholder feedback. Phased delivery does not require discarding earlier releases.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>看 Prototype 的『命運』：留著改到正式版＝Evolutionary；丟掉重新建＝Throwaway。Incremental = 增加功能；Iterative = 重複細化。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">07 · Agile: XP and Scrum</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> Agile methods emphasize short feedback loops, incremental delivery and responsiveness to change.</p><p style=\"white-space:pre-line\">XP engineering practices include Pair Programming, Test-Driven Development (Red → Green → Refactor), Continuous Integration, Small Releases and Refactoring. Scrum organizes work through Product Backlog, Sprint, Sprint Planning, Daily Scrum, Sprint Review and Sprint Retrospective. Roles/accountabilities: Product Owner, Scrum Master, Developers. XP focuses engineering practices while Scrum structures team collaboration.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>XP 偏重程式工程技術；Scrum 偏重 Sprint 框架。兩者可以同時使用，不能因 Scrum 使用 Sprint 就說一定有 TDD。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">08 · DevOps: CI, CD and Feedback</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> DevOps integrates software development, operations, automation, monitoring and feedback.</p><p style=\"white-space:pre-line\">Cycle: Plan → Code → Build → Test → Release → Deploy → Operate → Monitor. Continuous Integration integrates code with automated checks. Continuous Delivery keeps releases deployable; Continuous Deployment automatically deploys qualifying changes. Operations feedback should inform subsequent requirements and improvements.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>CI 不等於自動部署。Continuous Delivery（隨時可發布）與 Continuous Deployment（通過後自動發布）亦不同。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">09 · OOIS: Class, Object, Attributes, Operations, Messages</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> A class is a template defining shared structure and behavior; an object is an identifiable instance with state and behavior.</p><p style=\"white-space:pre-line\">Class: Student. Object: joe. Attribute: major. Operation: addCourse(). Method: implementation of an operation. Message: invocation sent to an object, potentially including arguments and returns. Encapsulation groups state and behavior; Information Hiding conceals internal details. Identity, State and Behavior describe an object.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>Student joe = new Student(); 其中 Student 是 Class、joe 是 Object。Operation 表示行為規格，Method 偏實作，不應完全混為一談。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">10 · Inheritance, Generalization & Polymorphism</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> Generalization is an IS-A relation; polymorphism supports subclass-specific behavior through a common type.</p><p style=\"white-space:pre-line\">In UML, generalization is a solid line with a HOLLOW TRIANGLE pointing toward the SUPERCLASS. GradStudent IS-A Student. A superclass is not automatically abstract: a concrete superclass can be instantiated. Dynamic dispatch chooses a normally overridden method according to the runtime receiver's class. Overloading is different from Overriding.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>空心三角指向父類別。Animal a = new Bird(); a.move() 呼叫 Bird 覆寫的方法（在一般動態派發下）。父類別不代表一定是抽象類別。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">11 · OOAD: Three Architecture Views & Iteration</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> OOAD is Use-Case Driven, Architecture-Centric, and Iterative and Incremental.</p><p style=\"white-space:pre-line\">Functional View (external): Use Case Diagram, Activity Diagram, Use-Case Description. Structural View (static): CRC Cards, Class Diagram, Object Diagram. Behavioral View (dynamic): Sequence Diagram, Communication Diagram, State Machine Diagram. Verify use cases against responsibilities and sequence messages; revisit inconsistent models iteratively. Iterative = repeated refinement. Incremental = successive additions.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>功能模型描述 WHAT、結構模型描述物件有哪些、行為模型描述物件互動與狀態演化。模型必須雙向核對而非各畫各的。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">12 · Unified Process: Phases, Workflows and Milestones</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> UP is iterative and incremental, with two dimensions: Phases (WHEN) and Workflows (WHAT).</p><p style=\"white-space:pre-line\">Phases: Inception (scope/business case; Lifecycle Objectives), Elaboration (baseline architecture/risk; Lifecycle Architecture), Construction (build/test; Initial Operational Capability), Transition (deploy/accept; Product Release). Engineering workflows: Business Modeling, Requirements, Analysis, Design, Implementation, Test, Deployment. Supporting: Project Management, Configuration & Change Management, Environment. Workflows can span multiple phases.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>UP 的 Inception 不等於只做需求，也不能將四個 UP Phases 強行與四個 SDLC Phase 做一對一等號。『Requirements 只在 Inception』是陷阱。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">13 · UML: Diagram Selection and Terminology</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> UML is a standardized visual modeling language rather than a development methodology.</p><p style=\"white-space:pre-line\">Use Case = actors and external goals; Activity = actions, control flow and decisions; Class = static classes/attributes/operations/associations; Object = instance snapshot; Sequence = time-ordered messages and lifelines; Communication = numbered collaboration; State Machine = states, transitions, events and guards. The course slide diagram count can use a different grouping; use prescribed diagrams and standard notation in exams.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>UML ≠ UP ≠ SDLC。正式考試繪圖須遵守教授範例中箭頭的虛實與方向。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">14 · Modeling SOP: From Business Problem to Validated Views</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> Recommended introductory seven-step integrated modeling procedure.</p><p style=\"white-space:pre-line\">1 Identify business problem/value. 2 Identify stakeholders, actors and requirements. 3 Build functional use cases and process descriptions. 4 Identify relevant domain objects/classes and responsibilities. 5 Build behavioral interactions and state changes. 6 Verify syntax and validate against requirements, checking links between use cases, operations and messages. 7 Iteratively refine and recheck. This introductory seven-step outline is NOT the later Chapter 4 CRC-to-class-diagram 7-step process.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>常犯的五個錯誤：先決定技術再釐清業務、Generalization 指錯方向、Include/Extend 混淆、無需求依據就亂加 Class、各模型彼此矛盾。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">15 · Doctor–Patient Clinic End-to-E
