urse emphasis</th></tr></thead><tbody><tr><td>CRC Cards</td><td>Class–Responsibility–Collaboration cards</td><td>Which class knows/does what and which collaborators are needed?</td><td>Identification and role-playing</td></tr><tr><td>Class Diagram</td><td>Static classes, attributes, operations, structural relationships and multiplicities</td><td>How are classes structured and related?</td><td>Formal Standard format for exams</td></tr><tr><td>Object Diagram</td><td>Run-time snapshot / footprint of specific object instances</td><td>How do actual objects and attribute values realize a class structure at a moment?</td><td>Validation and discovery</td></tr></tbody></table></div>\n<p><b>Course contextual progression:</b> Functional Models → CRC Cards → Class Diagram → Object Diagram, with backtracking and review. Slide 13 contains student blanks for several exact labels, while slides 14, 20 and 38 explicitly develop these artifacts; this representation is reconstructed from their sequence.</p>\n<h3>Real-world Object Categories</h3><p>Slide 5 leaves the three categories blank. The class-identification slide 11 explicitly discusses <b>Physical Things / Places</b>, <b>Transactions / Events</b>, and <b>Roles / People</b>. Those are the grounded three categories used here.</p>\n<div style=\"overflow-x:auto\"><table><thead><tr><th>Category</th><th>Candidate Classes</th><th>Why it matters</th></tr></thead><tbody><tr><td>Roles / People</td><td>Patient, Doctor, Customer, Student</td><td>Capture business roles and their information</td></tr><tr><td>Physical Things / Places</td><td>Book, Room, Product, Clinic</td><td>Model persistent business resources</td></tr><tr><td>Transactions / Events</td><td>Appointment, Order, Enrollment, Invitation</td><td>Record business actions as persistent transactions</td></tr></tbody></table></div>\n<h3>Key terminology</h3><div style=\"overflow-x:auto\"><table><thead><tr><th>Term</th><th>Academic Definition</th><th>中文易混淆點</th></tr></thead><tbody><tr><td>Object Identity</td><td>Distinguishable object instance</td><td>物件可以有相同屬性，但仍不同實例</td></tr><tr><td>Class</td><td>Template for object state and operations</td><td>類別不是單一實例</td></tr><tr><td>Attribute</td><td>Property characterizing an object</td><td>屬性帶有資料型別及可見性</td></tr><tr><td>Operation</td><td>Behavior or service performed by an object</td><td>方法責任可能從 CRC Doing 推得</td></tr><tr><td>Association</td><td>Structural link between classes</td><td>關聯必須符合需求，不可任意增添</td></tr><tr><td>Generalization</td><td>An IS-A inheritance relationship</td><td>空心三角朝 Superclass</td></tr><tr><td>Aggregation</td><td>Whole–part association with shared lifecycle</td><td>空心菱形在 Whole 端</td></tr><tr><td>Composition</td><td>Whole–part association with strong ownership/lifecycle</td><td>實心菱形在 Whole 端</td></tr><tr><td>Multiplicity</td><td>Permitted object counts at an association endpoint</td><td>看『對面』的多重性來解讀</td></tr><tr><td>Navigability / Directional Association</td><td>Indication of allowed association traversal</td><td>教授要求考試標出方向</td></tr><tr><td>Association Class</td><td>Class representing information of an association</td><td>可補強 many-to-many 交易/關聯</td></tr><tr><td>CRC Role-Playing</td><td>Scenario walkthrough using class roles</td><td>用情境發現責任與合作缺漏</td></tr></tbody></table></div>\n</section><section id=\"part2\"><h2>2. Class Identification: From UCD Events to Domain Classes</h2>\n<h3>Grounded lecture process (pp. 11–12)</h3><ol><li><b>Focus on a selected Use Case.</b> Identify relevant business objects: people, places, things, transactions/events, roles.</li><li><b>Inspect the UCD event-flow statements.</b> Nouns and noun phrases suggest candidate Classes or Attributes. Verbs and verb phrases suggest candidate Operations or collaborations.</li><li><b>Examine domain meaning and scope.</b> Some nouns refer to values, concepts or actions, and not every highlighted candidate survives as a Class.</li><li><b>Check the requirement boundary.</b> Only include objects that the information system actually needs to represent, not everything in the real world.</li></ol>\n<p>Slide 12 explicitly cautions that <b>not every red-box candidate becomes a Class</b> after analysis.</p>\n<h3>Worked text analysis</h3><blockquote>The Patient selects a Doctor and an available Consultation Period. The System creates an Appointment and sends a Confirmation.</blockquote>\n<div style=\"overflow-x:auto\"><table><thead><tr><th>Phrase</th><th>Candidate Interpretation</th><th>Initial Modeling Decision</th></tr></thead><tbody><tr><td>Patient</td><td>Role / domain object</td><td>Class: Patient</td></tr><tr><td>Doctor</td><td>Role / domain object</td><td>Class: Doctor</td></tr><tr><td>Consultation Period</td><td>Schedule/availability unit</td><td>Class or value object depending on rules</td></tr><tr><td>Appointment</td><td>Transaction / event</td><td>Class: Appointment</td></tr><tr><td>Confirmation</td><td>Output/event</td><td>Operation or Class, depending on audit and notification requirements</td></tr><tr><td>selects</td><td>Action</td><td>Candidate operation / message</td></tr><tr><td>creates</td><td>Action</td><td>Appointment creation responsibility</td></tr><tr><td>sends</td><td>Action</td><td>Notification service / operation</td></tr></tbody></table></div>\n<h3>Attribute or Class? Student–School decision</h3>\n<p>The lecture asks: Student has an attribute <code>school</code>. Should School become a Class? Slides highlight two diagnostic questions: Are multiple school-related attributes needed? Do many Student objects share the same School object/value?</p>\n<div style=\"overflow-x:auto\"><table><thead><tr><th>Situation</th><th>Model School as Attribute</th><th>Model School as Class</th></tr></thead><tbody><tr><td>School name only, no separate operations</td><td>Likely appropriate</td><td>Potential over-modeling</td></tr><tr><td>Address, principal, phone, code and departments needed</td><td>Repeated embedded data becomes awkward</td><td>More appropriate</td></tr><tr><td>Many Students share one School</td><td>Can duplicate information</td><td>Supports normalization/reuse</td></tr><tr><td>School has independent responsibility/lifecycle</td><td>Insufficient</td><td>More appropriate</td></tr></tbody></table></div>\n<pre class=\"mermaid\">classDiagram\\n class Student {\\n -studentId: String\\n -name: String\\n }\\n class School {\\n -schoolId: String\\n -name: String\\n -address: String\\n +getDepartmentList()\\n }\\n School \"1\" -- \"0..*\" Student : enrolls</pre><details><summary>Copyable Mermaid syntax / 原始碼</summary><pre><code>classDiagram\\n class Student {\\n -studentId: String\\n -name: String\\n }\\n class School {\\n -schoolId: String\\n -name: String\\n -address: String\\n +getDepartmentList()\\n }\\n School \"1\" -- \"0..*\" Student : enrolls</code></pre></details>\n<p><b>V&V loop:</b> An Object Diagram may reveal repeated groups of values across Student instances; return to Class Diagram and consider extracting a School Class. Class extraction is a reasoned decision, not an automatic rule.</p>\n</section><section id=\"part3\"><h2>3. CRC Cards: Class, Knowing/Doing Responsibilities and Collaboration</h2>\n<p><b>CRC</b> stands for <b>Class–Responsibility–Collaboration</b>. Each card states a Class's responsibilities and the other Classes needed to realize those responsibilities for a particular Use Case.</p>\n<h3>Knowing vs Doing</h3><div style=\"overflow-x:auto\"><table><thead><tr><th>Responsibility</th><th>Definition</th><th>Typical translation to Class Diagram</th></tr></thead><tbody><tr><td>Knowing</td><td>Information that instances know or provide</td><td>Candidate Attributes and Query Operations</td></tr><tr><td>Doing</td><td>Activities an object performs for other objects or for itself</td><td>Candidate Operations / Methods</td></tr><tr><td>Collaboration</td><td>Requesting services from another class</td><td>Possible Associations and Messages</td></tr></tbody></table></div>\n<h3>Client vs Server responsibility</h3><pre><code>class A {\n  public void ma(B b) {\n    b.mb();\n  }\n}\nclass B {\n  public void mb() { /* behavior */ }\n}</code></pre>\n<p>In the illustrated call <code>b.mb()</code>, <b>A is the requestor/client</b> and <b>B is the responder/collaborator/server</b>. The object receiving the requested message should own the corresponding responsibility.</p>\n<h3>CRC Front and Back (slides 17–18)</h3>\n<div class=\"two\"><div class=\"card\"><h3>Front-side: Class & Responsibilities</h3><p><b>Class: Appointment</b></p><p><b>Knowing:</b> appointmentId, patient, doctor, consultationTime, status.</p><p><b>Doing:</b> confirm(), reschedule(), cancel().</p></div><div class=\"card\"><h3>Back-side: Collaborators & Details</h3><p><b>Collaborators:</b> Patient, Doctor, Availability.</p><p><b>Collaboration:</b> Appointment needs availability information to validate booking.</p><p><b>Use Case:</b> Schedule Appointment.</p></div></div>\n<p>Card field arrangement is an explanatory reconstruction; slide 17–18 show images of front and back cards, not plain-text field definitions.</p>\n<h3>CRC Role-Playing (slide 19)</h3><ol><li>Pick a <b>Use Case / Scenario</b>.</li><li>Assign team members to represent the objects/classes in that case.</li><li>Walk through the use case's <b>event flows</b> carefully, identifying minimal responsibilities and negotiating collaboration requests.</li><li>Construct/update CRC cards to reflect the least sufficient set of responsibilities and collaborators.</li></ol>\n<p>Slide 19 contains blanks for certain exact terms, so the underlined Use Case and Event Flow choices are context-grounded interpretations. The instruction to keep responsibilities minimal and negotiate is explicitly supported by the slide.</p>\n<h3>Online Shopping CRC derivation</h3><div style=\"overflow-x:auto\"><table><thead><tr><th>Class</th><th>Knowing</th><th>Doing</th><th>Collaborators</th></tr></thead><tbody><tr><td>Customer</td><td>Customer ID, delivery address</td><td>purchase(), provideDeliveryInfo()</td><td>Order</td></tr><tr><td>Product</td><td>Product ID, price, inventory</td><td>checkAvailability(), updateInventory()</td><td>Order</td></tr><tr><td>Order</td><td>Order ID, amount, customer and product reference</td><td>placeOrder(), calculateAmount(), initiateDelivery()</td><td>Customer, Product</td></tr></tbody></table></div>\n<pre class=\"mermaid\">classDiagram\\n class Customer {\\n -ID: String\\n -address: String\\n +purchase(): Order\\n }\\n class Product {\\n -ID: String\\n -price: int\\n -inventory: int\\n +updateInventory()\\n }\\n class Order {\\n -ID: String\\n -amount: int\\n +placeOrder()\\n +delivery()\\n }\\n Customer \"1\" -- \"0..*\" Order : places\\n Product \"1\" -- \"0..*\" Order : contains</pre><details><summary>Copyable Mermaid syntax / 原始碼</summary><pre><code>classDiagram\\n class Customer {\\n -ID: String\\n -address: String\\n +purchase(): Order\\n }\\n class Product {\\n -ID: String\\n -price: int\\n -inventory: int\\n +updateInventory()\\n }\\n class Order {\\n -ID: String\\n -amount: int\\n +placeOrder()\\n +delivery()\\n }\\n Customer \"1\" -- \"0..*\" Order : places\\n Product \"1\" -- \"0..*\" Order : contains</code></pre></details>\n<p>In a realistic system, Order–Product may need an OrderLine association class; the simplified diagram illustrates the slide's three starting classes. This is not a universal full e-commerce domain model.</p>\n</section><section id=\"part4\"><h2>4. Class Diagram: Standard UML Notation and Class Categories</h2>\n<p><b>Class Diagram:</b> Static representation of Classes and their structural relationships. The lecturer explicitly states on slide 22: <b>Exam answers should use Standard Format unless the question specifies Simplified Format.</b></p>\n<h3>Three compartments and visibility</h3><pre><code>Student\n-------------------------\n-name: String\n-address: String\n-dept: String\n/age: int\n-------------------------\n+payTuition(fee: int): void\n+getDepartment(): String</code></pre>\n<div style=\"overflow-x:auto\"><table><thead><tr><th>Notation</th><th>Meaning</th><th>Example</th></tr></thead><tbody><tr><td>+</td><td>Public visibility</td><td>+payTuition()</td></tr><tr><td>-</td><td>Private visibility</td><td>-name: String</td></tr><tr><td>#</td><td>Protected visibility</td><td>#category: String</td></tr><tr><td>/</td><td>Derived attribute</td><td>/age: int derived from birthDate</td></tr><tr><td>name: Type</td><td>Typed Attribute</td><td>-appointmentId: String</td></tr><tr><td>+op(param: Type): ReturnType</td><td>Operation signature</td><td>+cancel(id: String): boolean</td></tr><tr><td>Italic class name / {abstract}</td><td>Abstract Class</td><td>Class is not directly instantiated</td></tr><tr><td>«entity» / «boundary» / «control»</td><td>Analysis stereotypes</td><td>Useful for Entity-Boundary-Control modeling</td></tr></tbody></table></div>\n<h3>Three Class Stereotypes (slide 23)</h3><div style=\"overflow-x:auto\"><table><thead><tr><th>Type</th><th>Definition</th><th>Example in Add Course UC</th></tr></thead><tbody><tr><td>Entity / Domain Class</td><td>Represents persistent business objects/data</td><td>Student, Course, Class</td></tr><tr><td>Boundary Class</td><td>Handles the system's external interface</td><td>RegistrationUI</td></tr><tr><td>Control Class</td><td>Coordinates transactions, business processing, CRUD and synchronization</td><td>TransactionManager</td></tr></tbody></table></div>\n<pre class=\"mermaid\">classDiagram\\n class Student {\\n <<entity>>\\n -studentId: String\\n }\\n class Course {\\n <<entity>>\\n -courseId: String\\n }\\n class ClassSection {\\n <<entity>>\\n -sectionId: String\\n }\\n class RegistrationUI {\\n <<boundary>>\\n +submitRegistration()\\n }\\n class TransactionManager {\\n <<control>>\\n +enroll()\\n }\\n RegistrationUI --> TransactionManager\\n TransactionManager --> Student\\n TransactionManager --> ClassSection\\n ClassSection --> Course</pre><details><summary>Copyable Mermaid syntax / 原始碼</summary><pre><code>classDiagram\\n class Student {\\n &lt;&lt;entity>>\\n -studentId: String\\n }\\n class Course {\\n &lt;&lt;entity>>\\n -courseId: String\\n }\\n class ClassSection {\\n &lt;&lt;entity>>\\n -sectionId: String\\n }\\n class RegistrationUI {\\n &lt;&lt;boundary>>\\n +submitRegistration()\\n }\\n class TransactionManager {\\n &lt;&lt;control>>\\n +enroll()\\n }\\n RegistrationUI --> TransactionManager\\n TransactionManager --> Student\\n TransactionManager --> ClassSection\\n ClassSection --> Course</code></pre></details>\n<p>Slide 24 calls the class <b>Class</b>; the Mermaid example uses <b>ClassSection</b> to disambiguate the English concept from UML class syntax. In a graded diagram, use the precise terminology of the scenario supplied by the instructor.</p>\n<h3>Five Types of Operations (slide 26)</h3><div style=\"overflow-x:auto\"><table><thead><tr><th>Operation</th><th>Function</th><th>Lecture Example</th></tr></thead><tbody><tr><td>Constructor</td><td>Creates an object</td><td>BookManager.newArrival(new Book())</td></tr><tr><td>Service</td><td>Accesses or changes private attributes</td><td>setTitle(), getTitle()</td></tr><tr><td>Query</td><td>Makes information about the state available</td><td>Book.isAvailable()</td></tr><tr><td>Update</td><td>Changes attributes due to business process</td><td>Book.return(); Account.deposit()</td></tr><tr><td>Destructor</td><td>Removes object for a business process</td><td>AcctManager.closeAccount()</td></tr></tbody></table></div>\n<p>Professor's simplification guideline: Constructor and ordinary Service/getter/setter methods <b>need not appear</b> on every Class Diagram if omitting them reduces unnecessary complexity.</p>\n</section><section id=\"part5\"><h2>5. Relationships, Multiplicity, Navigability and Association Classes</h2>\n<h3>Three core Structural Relationships (slide 8)</h3><div style=\"overflow-x:auto\"><table><thead><tr><th>Relationship</th><th>English Semantics</th><th>UML Symbol</th><th>Exam Example</th></tr></thead><tbody><tr><td>Generalization</td><td>IS-A inheritance</td><td>Solid line with hollow triangle → Superclass</td><td>Undergraduate IS-A Student</td></tr><tr><td>Aggregation / Composition</td><td>HAS-A / PART-OF whole-part association</td><td>Hollow diamond / filled diamond at Whole</td><td>ShoppingCart contains Items</td></tr><tr><td>Association</td><td>Domain/transactional relationship</td><td>Solid line, named and directional when applicable</td><td>Customer purchases Bicycle</td></tr></tbody></table></div>\n<pre class=\"mermaid\">classDiagram\\n Student <|-- Undergraduate\\n Student <|-- GraduateStudent\\n ShoppingCart o-- Product : contains\\n Order *-- OrderLine : consists_of\\n Customer --> Order : places</pre><details><summary>Copyable Mermaid syntax / 原始碼</summary><pre><code>classDiagram\\n Student &lt;|-- Undergraduate\\n Student &lt;|-- GraduateStudent\\n ShoppingCart o-- Product : contains\\n Order *-- OrderLine : consists_of\\n Customer --> Order : places</code></pre></details>\n<p><b>Aggregation vs Composition:</b> Aggregation permits parts to exist independently of the whole, whereas Composition specifies stronger ownership and typically a dependent lifecycle. The 2026 slide groups both under whole–part relationships; this precise distinction is supplementary UML explanation rather than text explicitly spelled out on slide 8.</p>\n<h3>Multiplicity (slides 27–29)</h3><div style=\"overflow-x:auto\"><table><thead><tr><th>Notation</th><th>English Meaning</th><th>Example</th></tr></thead><tbody><tr><td>1</td><td>Exactly one</td><td>Husband–Wife 1 : 1</td></tr><tr><td>0..1</td><td>Zero or one</td><td>Optional advisor</td></tr><tr><td>0..*</td><td>Zero or more</td><td>Advisor guides Students</td></tr><tr><td>1..*</td><td>One or more</td><td>Project has at least one Employee</td></tr><tr><td>3..5</td><td>Between three and five</td><td>Team contains 3–5 Members</td></tr><tr><td>0..4</td><td>Zero through four</td><td>Advisor guides at most four Students</td></tr><tr><td>5..*</td><td>At least five</td><td>Instructor slide's Student–Class example</td></tr></tbody></table></div>\n<pre class=\"mermaid\">classDiagram\\n Advisor \"1\" -- \"0..4\" Student : guides\\n Team \"1\" -- \"3..5\" Member : contains\\n Customer \"0..*\" -- \"1..*\" Product : buys</pre><details><summary>Copyable Mermaid syntax / 原始碼</summary><pre><code>classDiagram\\n Advisor \"1\" -- \"0..4\" Student : guides\\n Team \"1\" -- \"3..5\" Member : contains\\n Customer \"0..*\" -- \"1..*\" Product : buys</code></pre></details>\n<p><b>How to read:</b> For a single Advisor, count Student instances using multiplicity printed at the Student end. For a single Student, count associated Advisor instances using the multiplicity at the Advisor end. Never read multiplicity by looking only at the adjacent class name.</p>\n<h3>Directional Association / Navigability (slide 27)</h3><p>Professor explicitly requires indicating the association direction in exams/reports. Label a business association with an appropriate verb phrase (e.g. <b>Boss manages Employee</b>) and draw the directional cue in the instructor's prescribed format. The slide shows triangle or arrow variants. Do not confuse a directional association arrow with the hollow-triangle Generalization arrow.</p>\n<h3>Association Classes (slide 30)</h3><p>A many-to-many association often carries its own transaction details. Example: Customer buys Product. Introduce Order or PurchaseLine to record quantity, date, amount and purchase-specific attributes. Such an intermediary class supports a more informative model.</p>\n<pre class=\"mermaid\">classDiagram\\n class Customer {\\n -customerId: String\\n }\\n class Product {\\n -productId: String\\n -price: Decimal\\n }\\n class Order {\\n -orderId: String\\n -orderDate: Date\\n }\\n class OrderLine {\\n -quantity: int\\n -unitPrice: Decimal\\n }\\n Customer \"1\" -- \"0..*\" Order : places\\n Order \"1\" *-- \"1..*\" OrderLine : contains\\n Product \"1\" -- \"0..*\" OrderLine : appears_in</pre><details><summary>Copyable Mermaid syntax / 原始碼</summary><pre><code>classDiagram\\n class Customer {\\n -customerId: String\\n }\\n class Product {\\n -productId: String\\n -price: Decimal\\n }\\n class Order {\\n -orderId: String\\n -orderDate: Date\\n }\\n class OrderLine {\\n -quantity: int\\n -unitPrice: Decimal\\n }\\n Customer \"1\" -- \"0..*\" Order : places\\n Order \"1\" *-- \"1..*\" OrderLine : contains\\n Product \"1\" -- \"0..*\" OrderLine : appears_in</code></pre></details>\n<p><b>Important nuance:</b> The slide calls Order a derived association class for Customer–Product at the teaching level. The expanded Order / OrderLine diagram is an explanatory refinement, not a claim that the original slide contains an OrderLine class.</p>\n<h3>Exercise: Student / Class / Course</h3><p>Slide 33 shows <b>Student “5..*” — “4..*” Class “0..*” — “1..1” Course</b> (numbers visually appear at their respective association ends). These values are example business constraints and should not be generalized to every course registration system.</p>\n</section><section id=\"part6\"><h2>6. The Lecturer's 7 Steps to Create a Class Diagram</h2>\n<p><b>Entry Criteria:</b> A selected Use Case plus the three functional artifacts: <b>Use-Case Diagram, Activity Diagram, UCD</b>. The sequence on slide 32 is <b>use-case-driven</b>, not “draw Class Diagram first”.</p>\n<div style=\"overflow-x:auto\"><table><thead><tr><th>Step</th><th>Exact Lecture Sequence</th><th>Execution SOP / 中文深解</th><th>Required Output</th></tr></thead><tbody><tr><td>1</td><td>Create CRC Cards based on the above 3 artifacts</td><td>Extract classes and initial knowing/doing/collaboration from UC diagram, Activity and UCD.</td><td>CRC cards</td></tr><tr><td>2</td><td>Review CRC Cards & identify ___ objects, attributes, operations and/or relationships</td><td>Check missing/extra objects and responsibilities. Student slide has an unfilled word: do not falsely claim verbatim solution.</td><td>Revised CRC cards</td></tr><tr><td>3</td><td>Role-play the CRC Cards</td><td>Assign object roles and perform Normal/Alternate UCD event flows, negotiating responsibilities and collaborators.</td><td>CRC updates</td></tr><tr><td>4</td><td>Create the Class Diagram based on CRCs</td><td>Transform knowing → attributes, doing → operations, collaborations → associations; add stereotypes, types and multiplicities.</td><td>Standard Class Diagram</td></tr><tr><td>5</td><td>Review Class Diagram—remove unnecessary classes, attributes, operations and/or relationships</td><td>Eliminate gold-plating, check consistent naming and class scope.</td><td>Simplified/validated structure</td></tr><tr><td>6</td><td>Incorporate Patterns</td><td>Recognize reusable patterns among business scenarios (student course registration vs product ordering).</td><td>Pattern refinement</td></tr><tr><td>7</td><td>Review and Validate the Model</td><td>Walkthrough with developers and users; check structure against business requirements and functional models.</td><td>Reviewed final diagram</td></tr></tbody></table></div>\n<h3>Fully Worked Derivation: Add Course</h3><p><b>Functional input:</b> A Student selects an available ClassSection, the system validates the course-registration rules, creates Enrollment and updates registration information.</p>\n<p><b>Step 1: Candidate CRC Cards.</b></p>\n<div style=\"overflow-x:auto\"><table><thead><tr><th>Class</th><th>Knowing</th><th>Doing</th><th>Collaborator</th></tr></thead><tbody><tr><td>Student</td><td>studentId, status</td><td>requestEnrollment()</td><td>RegistrationManager</td></tr><tr><td>Course</td><td>courseId, title</td><td>provideCourseInfo()</td><td>ClassSection</td></tr><tr><td>ClassSection</td><td>sectionId, capacity, currentEnrollment</td><td>hasSpace(), reserveSeat()</td><td>Course, Enrollment</td></tr><tr><td>Enrollment</td><td>enrollmentId, date, status</td><td>create(), cancel()</td><td>Student, ClassSection</td></tr><tr><td>RegistrationManager (Control)</td><td>Business rules</td><td>enrollStudent()</td><td>Student, ClassSection, Enrollment</td></tr><tr><td>RegistrationUI (Boundary)</td><td>Input data</td><td>submitRequest(), showResult()</td><td>RegistrationManager</td></tr></tbody></table></div>\n<p><b>Step 2 Review:</b> A direct Student–ClassSection many-to-many relationship may require an Enrollment transaction class. Ensure ClassSection and Course have independent meaning; otherwise merge the concepts as appropriate.</p>\n<p><b>Step 3 Role-Play:</b> Student requests → RegistrationUI passes request → RegistrationManager asks ClassSection.hasSpace() → Enrollment is created → ClassSection increments enrollment → UI shows confirmation. If no space, return rejection instead of creating Enrollment.</p>\n<p><b>Step 4 Standard Class Diagram:</b></p>\n<pre class=\"mermaid\">classDiagram\\n class Student {\\n <<entity>>\\n -studentId: String\\n -name: String\\n +requestEnrollment()\\n }\\n class Course {\\n <<entity>>\\n -courseId: String\\n -title: String\\n }\\n class ClassSection {\\n <<entity>>\\n -sectionId: String\\n -capacity: int\\n +hasSpace(): boolean\\n }\\n class Enrollment {\\n <<entity>>\\n -enrollmentId: String\\n -status: String\\n +cancel()\\n }\\n class RegistrationUI {\\n <<boundary>>\\n +submitRequest()\\n }\\n class RegistrationManager {\\n <<control>>\\n +enrollStudent()\\n }\\n Student \"1\" -- \"0..*\" Enrollment : holds\\n Enrollment \"0..*\" --> \"1\" ClassSection : reserves\\n Course \"1\" -- \"0..*\" ClassSection : offers\\n RegistrationUI --> RegistrationManager : submits\\n RegistrationManager --> Enrollment : creates\\n RegistrationManager --> ClassSection : checks</pre><details><summary>Copyable Mermaid syntax / 原始碼</summary><pre><code>classDiagram\\n class Student {\\n &lt;&lt;entity>>\\n -studentId: String\\n -name: String\\n +requestEnrollment()\\n }\\n class Course {\\n &lt;&lt;entity>>\\n -courseId: String\\n -title: String\\n }\\n class ClassSection {\\n &lt;&lt;entity>>\\n -sectionId: String\\n -capacity: int\\n +hasSpace(): boolean\\n }\\n class Enrollment {\\n &lt;&lt;entity>>\\n -enrollmentId: String\\n -status: String\\n +cancel()\\n }\\n class RegistrationUI {\\n &lt;&lt;boundary>>\\n +submitRequest()\\n }\\n class RegistrationManager {\\n &lt;&lt;control>>\\n +enrollStudent()\\n }\\n Student \"1\" -- \"0..*\" Enrollment : holds\\n Enrollment \"0..*\" --> \"1\" ClassSection : reserves\\n Course \"1\" -- \"0..*\" ClassSection : offers\\n RegistrationUI --> RegistrationManager : submits\\n RegistrationManager --> Enrollment : creates\\n RegistrationManager --> ClassSection : checks</code></pre></details>\n<p><b>Step 5:</b> Remove unnecessary get/set methods; confirm associations and multiplicities are grounded. <b>Step 6:</b> Compare the Enrollment transaction pattern to Order / OrderLine in e-commerce. <b>Step 7:</b> Test selected and full class scenarios, validate with stakeholders.</p>\n<p><b>Teaching-data boundary:</b> The lecture's specific Student–Class–Course multiplicities at slide 33 differ from the general-purpose business constraints in this expanded illustration. Do not use these example numbers to overwrite the teacher's slide or an exam scenario's explicit multiplicities.</p>\n</section><section id=\"part7\"><h2>7. Class Diagram vs Object Diagram, and From Models to Code</h2>\n<p><b>Object Diagram:</b> A runtime snapshot of specific object instances with actual attribute values and links at a certain moment. It is not a sequence of events. An Object Diagram can reveal missing Classes, Associations or attributes in the Class Diagram.</p>\n<h3>Class Diagram vs Object Diagram</h3><div style=\"overflow-x:auto\"><table><thead><tr><th>Aspect</th><th>Class Diagram</th><th>Object Diagram</th></tr></thead><tbody><tr><td>Subject</td><td>Class/Type structure</td><td>Concrete objects/instances</td></tr><tr><td>Attributes</td><td>Attribute definitions and types</td><td>Actual values</td></tr><tr><td>Relationships</td><td>Association types and multiplicities</td><td>Instance links at a specific moment</td></tr><tr><td>Time</td><td>Static design model</td><td>Single runtime footprint</td></tr><tr><td>Diagnostic use</td><td>Define permissible structure</td><td>Challenge structure with real scenarios</td></tr></tbody></table></div>\n<h3>Instance Naming and Values</h3><pre><code>john: Student\n--------------------\nstudentId = \"S001\"\nname = \"John\"\n\nncu: School\n--------------------\nschoolId = \"NCU\"\nname = \"National Central University\"</code></pre>\n<p>Typical UML Object Diagram notation uses an underlined object-name/classifier label such as <code>john: Student</code> and actual slot values. Mermaid ClassDiagram does not perfectly reproduce all object-instance conventions, so this ASCII representation is the notation-focused example.</p>\n<h3>Object-level example (conceptual rendering)</h3><pre class=\"mermaid\">flowchart LR\\n S[\"john: Student\\nstudentId=S001\"] --- C[\"ncu: School\\nname=National Central University\"]\\n T[\"mary: Student\\nstudentId=S002\"] --- C</pre><details><summary>Copyable Mermaid syntax / 原始碼</summary><pre><code>flowchart LR\\n S[\"john: Student\\nstudentId=S001\"] --- C[\"ncu: School\\nname=National Central University\"]\\n T[\"mary: Student\\nstudentId=S002\"] --- C</code></pre></details>\n<p>Seeing that many student objects share one School object suggests School may deserve its own Class instead of repeated Student attributes.</p>\n<h3>From Class Diagram to Coding (slide 37)</h3><p>Associations in the CD may become <b>reference attributes</b> in a receiver Class definition.</p><pre><code>public class Employee {\n    private Boss boss;\n\n    public Employee(Boss boss) {\n        this.boss = boss;\n    }\n}</code></pre>\n<p>Given a Boss–Employee association of one Boss managing one or more Employees, each Employee may store a reference to the corresponding Boss object. Exact field ownership and navigability must be consistent with the model and implementation design; UML associations do not always require one specific code representation.</p>\n</section><section id=\"part8\"><h2>8. Verification, Validation & Functional–Structural Balance</h2>\n<p>The 2026 slides at pp. 40–41 instruct analysts to walkthrough the structural model with developers/users, explain the rationale for each Class, and consult textbook <b>p.152</b> for V&V rules and <b>p.154</b> for balancing Functional and Structural Models. The student slide does <b>not reproduce those rule lists</b>, so the checklist below is a transparent teaching synthesis, NOT a verbatim transcription of those textbook pages.</p>\n<h3>Structural Walkthrough</h3><ol><li>Start from the selected Use Case and read Normal and Alternate UCD event flows.</li><li>For each scenario, identify the active objects and confirm required classes exist.</li><li>Check CRC cards: Knowing duties should have Attributes; Doing duties should have Operations.</li><li>Check collaborators: Class Diagram Associations should support required calls.</li><li>Validate multiplicity at both endpoints using concrete object examples.</li><li>Use Object Diagrams for sample objects, values and links; revise missing/redundant classes.</li><li>Remove gold-plating and unsupported attributes or associations.</li><li>Confirm the model with stakeholder/developer walkthrough and revise it iteratively.</li></ol>\n<h3>Cross-Model Traceability</h3><div style=\"overflow-x:auto\"><table><thead><tr><th>Functional Artifact</th><th>Structural Artifact</th><th>Consistency Check</th></tr></thead><tbody><tr><td>Use-Case Diagram</td><td>UC-level Class Diagram</td><td>Every relevant business function is supported by meaningful domain classes.</td></tr><tr><td>Activity Diagram</td><td>CRC Responsibilities / Operations</td><td>An action must have a responsible object or collaborating pair.</td></tr><tr><td>UCD Normal Flow</td><td>CRC Role-Play</td><td>Every essential step can be performed by an object.</td></tr><tr><td>UCD Alternate Flow</td><td>Class Operations and Relationships</td><td>Exception behavior is feasible and responsibilities are assigned.</td></tr><tr><td>UCD Business Objects</td><td>Classes/Attributes</td><td>Terminology and business information agree.</td></tr><tr><td>UCD Actor Roles</td><td>Entity/Boundary/Control</td><td>Role boundaries align; external actors are not automatically classes.</td></tr><tr><td>CRC Collaboration</td><td>Class Association</td><td>Object-to-object responsibilities have justified structural relationships.</td></tr><tr><td>Class Diagram Multiplicity</td><td>Object Diagram Links</td><td>Instance sample does not violate cardinality bounds.</td></tr></tbody></table></div>\n<pre class=\"mermaid\">flowchart TD\\n Req[\"Business Requirements\"] --> UC[\"Use-Case Diagram\"]\\n UC --> AD[\"Activity Diagram\"]\\n AD --> UCD[\"Use-Case Description\"]\\n UCD --> CRC[\"CRC: Knowing/Doing/Collaboration\"]\\n CRC --> CD[\"Class Diagram\"]\\n CD --> OD[\"Object Diagram snapshot\"]\\n OD -. \"detect structural gaps\" .-> CD\\n CD -. \"validate responsibilities\" .-> UCD</pre><details><summary>Copyable Mermaid syntax / 原始碼</summary><pre><code>flowchart TD\\n Req[\"Business Requirements\"] --> UC[\"Use-Case Diagram\"]\\n UC --> AD[\"Activity Diagram\"]\\n AD --> UCD[\"Use-Case Description\"]\\n UCD --> CRC[\"CRC: Knowing/Doing/Collaboration\"]\\n CRC --> CD[\"Class Diagram\"]\\n CD --> OD[\"Object Diagram snapshot\"]\\n OD -. \"detect structural gaps\" .-> CD\\n CD -. \"validate responsibilities\" .-> UCD</code></pre></details>\n<h3>Five Frequent Exam Pitfalls</h3><ol><li><b>Drawing simplified format in exams:</b> Slide 22 explicitly requires Standard Class Diagram format unless simplified is requested.</li><li><b>Multiplicity on wrong end:</b> Always interpret the number at the opposite association endpoint.</li><li><b>Inventing Associations:</b> A real-world relationship is not enough; it must serve System Scope and Requirements.</li><li><b>Composition vs Aggregation:</b> Filled and hollow diamonds express different ownership/lifecycle semantics.</li><li><b>Skipping CRC Role-Playing:</b> Drawing classes directly without testing responsibilities against UCD event flows can leave missing operations and collaborations.</li></ol>\n</section><section id=\"part9\"><h2>9. End-to-End Case Study: Doctor–Patient Appointment System</h2>\n<h3>Scenario Requirements (Original English, about 150 words)</h3><blockquote>A neighborhood health clinic needs an appointment system to replace fragmented paper schedules and staff phone logs. Patients should request appointments by selecting a doctor and consultation period. Receptionists may book on a patient's behalf, and doctors maintain the periods available for consultation. Before an appointment is confirmed, the system must check physician availability and prevent conflicts. Each accepted appointment should record the patient, physician, scheduled period, status, and a unique appointment identifier. Patients should be able to cancel or reschedule under the clinic's approved rules. The clinic manager wants accurate daily schedules and fewer duplicate bookings. Sensitive patient information must remain protected from unauthorized access. The analyst must identify relevant domain classes, assign their knowing and doing responsibilities using CRC cards, derive a complete Class Diagram, instantiate sample objects, and verify that the structural model supports successful and rejected booking scenarios without including irrelevant objects outside the agreed system scope.</blockquote>\n<h3>Step 1: Requirements → Candidate Classes</h3><div style=\"overflow-x:auto\"><table><thead><tr><th>Requirement Statement Fragment</th><th>Candidate Class</th><th>Reason</th></tr></thead><tbody><tr><td>Patients request an appointment</td><td>Patient</td><td>Role / persistent domain identity</td></tr><tr><td>Doctors maintain availability</td><td>Doctor, Availability</td><td>Provider and consultation periods</td></tr><tr><td>Accepted bookings are recorded</td><td>Appointment</td><td>Transaction entity with ID/status</td></tr><tr><td>Receptionists book on behalf of patient</td><td>Receptionist or UserRole</td><td>Access role; may be class depending on required stored data</td></tr><tr><td>System validates and records request</td><td>BookingController</td><td>Control responsibility</td></tr><tr><td>Patient uses online booking interface</td><td>BookingUI</td><td>Boundary responsibility</td></tr></tbody></table></div>\n<h3>Step 2: CRC Cards (Knowing / Doing / Collaboration)</h3><div style=\"overflow-x:auto\"><table><thead><tr><th>Class</th><th>Knowing</th><th>Doing</th><th>Collaborators</th></tr></thead><tbody><tr><td>Patient</td><td>patientId, contact information</td><td>requestAppointment(), cancelAppointment()</td><td>Appointment, BookingController</td></tr><tr><td>Doctor</td><td>doctorId, specialty</td><td>maintainAvailability()</td><td>Availability</td></tr><tr><td>Availability</td><td>timeSlot, status, doctor</td><td>isAvailable(), reserveSlot()</td><td>Doctor, Appointment</td></tr><tr><td>Appointment</td><td>appointmentId, dateTime, status</td><td>create(), confirm(), cancel(), reschedule()</td><td>Patient, Doctor, Availability</td></tr><tr><td>BookingController</td><td>Booking rules</td><td>validateRequest(), createAppointment()</td><td>Availability, Appointment</td></tr><tr><td>BookingUI</td><td>Request fields</td><td>acceptRequest(), displayResult()</td><td>BookingController</td></tr></tbody></table></div>\n<h3>Step 3: CRC Role-Play</h3><ol><li>Patient submits desired doctor and time to BookingUI.</li><li>BookingUI requests BookingController to schedule an Appointment.</li><li>BookingController requests Availability to check selected period.</li><li>If available, Appointment is created and associated with exactly one Patient and one Doctor.</li><li>Availability is reserved; status is confirmed.</li><li>If unavailable, the controller reports rejection and no Appointment is confirmed.</li></ol>\n<h3>Step 4: Standard Class Diagram</h3>\n<pre class=\"mermaid\">classDiagram\\n class Patient {\\n <<entity>>\\n -patientId: String\\n -name: String\\n +requestAppointment()\\n }\\n class Doctor {\\n <<entity>>\\n -doctorId: String\\n -specialty: String\\n +maintainAvailability()\\n }\\n class Availability {\\n <<entity>>\\n -slotId: String\\n -dateTime: DateTime\\n -reserved: boolean\\n +isAvailable(): boolean\\n +reserve()\\n }\\n class Appointment {\\n <<entity>>\\n -appointmentId: String\\n -status: String\\n +confirm()\\n +cancel()\\n +reschedule()\\n }\\n class BookingUI {\\n <<boundary>>\\n +submitRequest()\\n +showResult()\\n }\\n class BookingController {\\n <<control>>\\n +scheduleAppointment()\\n }\\n Patient \"1\" -- \"0..*\" Appointment : books\\n Doctor \"1\" -- \"0..*\" Appointment : attends\\n Doctor \"1\" -- \"0..*\" Availability : maintains\\n Appointment \"0..1\" --> \"1\" Availability : reserves\\n BookingUI --> BookingController : submits\\n BookingController --> Appointment : creates\\n BookingController --> Availability : checks</pre><details><summary>Copyable Mermaid syntax / 原始碼</summary><pre><code>classDiagram\\n class Patient {\\n &lt;&lt;entity>>\\n -patientId: String\\n -name: String\\n +requestAppointment()\\n }\\n class Doctor {\\n &lt;&lt;entity>>\\n -doctorId: String\\n -specialty: String\\n +maintainAvailability()\\n }\\n class Availability {\\n &lt;&lt;entity>>\\n -slotId: String\\n -dateTime: DateTime\\n -reserved: boolean\\n +isAvailable(): boolean\\n +reserve()\\n }\\n class Appointment {\\n &lt;&lt;entity>>\\n -appointmentId: String\\n -status: String\\n +confirm()\\n +cancel()\\n +reschedule()\\n }\\n class BookingUI {\\n &lt;&lt;boundary>>\\n +submitRequest()\\n +showResult()\\n }\\n class BookingController {\\n &lt;&lt;control>>\\n +scheduleAppointment()\\n }\\n Patient \"1\" -- \"0..*\" Appointment : books\\n Doctor \"1\" -- \"0..*\" Appointment : attends\\n Doctor \"1\" -- \"0..*\" Availability : maintains\\n Appointment \"0..1\" --> \"1\" Availability : reserves\\n BookingUI --> BookingController : submits\\n BookingController --> Appointment : creates\\n BookingController --> Availability : checks</code></pre></details>\n<p><b>Multiplicity constraints are illustrative:</b> Each Appointment has one Patient/Doctor; a Patient/Doctor can have many. Availability can support at most one active Appointment in the simplified model. Additional constraints must be derived from the clinic's actual rules rather than invented.</p>\n<h3>Step 5–7: Review, Patterns, Validate</h3><p>Remove unsupported classes (e.g., a HospitalBuilding Class when no location management is in scope). Apply the reusable Transaction–Party–Resource pattern: Appointment is a transaction connecting Patient, Doctor and time resources. Create object snapshots and check overbooked cases, then walkthrough with clinic staff.</p>\n<h3>Object Snapshot</h3><pre><code>p01: Patient { patientId=\"P001\" }\nd07: Doctor { doctorId=\"D007\" }\nslot01: Availability { slotId=\"S01\", reserved=true }\napt01: Appointment { appointmentId=\"A001\", status=\"Confirmed\" }\n\nLinks:\napt01 → p01\napt01 → d07\napt01 → slot01</code></pre>\n<h3>Traceability</h3><div style=\"overflow-x:auto\"><table><thead><tr><th>Requirement</th><th>CRC Responsibility</th><th>Class Operation</th><th>Validation Scenario</th></tr></thead><tbody><tr><td>Request Appointment</td><td>BookingController: schedule</td><td>scheduleAppointment()</td><td>Valid request</td></tr><tr><td>Prevent double-booking</td><td>Availability: know/reserve</td><td>isAvailable(), reserve()</td><td>Conflicting slot</td></tr><tr><td>Maintain Doctor Availability</td><td>Doctor: maintain slots</td><td>maintainAvailability()</td><td>Doctor updates schedule</td></tr><tr><td>Cancel Appointment</td><td>Appointment: update status</td><td>cancel()</td><td>Cancellation</td></tr><tr><td>Protect patient information</td><td>Boundary/Controller: enforce access policy</td><td>Authorized operation (design detail TBD)</td><td>Unauthorized access refused</td></tr></tbody></table></div>\n</section><section id=\"part10\"><h2>10. Professor's Dating Website and Building Parcel Case</h2>\n<h3>Dating Website (slides 42–50)</h3><p>Lecturer's business conditions: membership/login required for all services; members browse opposite-sex members based on criteria; logged-in members specify <b>at most five interests, three personality attributes</b>, select <b>at most ten matching members</b>, and send dating invitations; invitation records must be visible. The structural-model lecture specifically shows CRC cards for <b>Member, Invitation, InvitationManager</b>, then a Class Diagram for the Send Date Invitation use case.</p>\n<h3>CRC derivation (Teaching Reconstruction)</h3><div style=\"overflow-x:auto\"><table><thead><tr><th>Class</th><th>Knowing</th><th>Doing</th><th>Collaborators</th></tr></thead><tbody><tr><td>Member</td><td>memberId, profile, interests, personality</td><td>searchMatches(), selectRecipients()</td><td>InvitationManager</td></tr><tr><td>Invitation</td><td>invitationId, sender, recipients, status</td><td>send(), recordStatus()</td><td>Member</td></tr><tr><td>InvitationManager</td><td>Selection and invitation rules</td><td>validateCriteria(), validateRecipientLimit(), dispatchInvitations()</td><td>Member, Invitation</td></tr></tbody></table></div>\n<pre class=\"mermaid\">classDiagram\\n class Member {\\n <<entity>>\\n -memberId: String\\n -interests: List\\n -personalityCriteria: List\\n +searchMatches()\\n }\\n class Invitation {\\n <<entity>>\\n -invitationId: String\\n -status: String\\n +send()\\n }\\n class InvitationManager {\\n <<control>>\\n +validateCriteria()\\n +validateRecipients()\\n +dispatchInvitations()\\n }\\n Member \"1\" --> \"0..*\" Invitation : sends\\n InvitationManager --> Member : validates\\n InvitationManager --> Invitation : creates</pre><details><summary>Copyable Mermaid syntax / 原始碼</summary><pre><code>classDiagram\\n class Member {\\n &lt;&lt;entity>>\\n -memberId: String\\n -interests: List\\n -personalityCriteria: List\\n +searchMatches()\\n }\\n class Invitation {\\n &lt;&lt;entity>>\\n -invitationId: String\\n -status: String\\n +send()\\n }\\n class InvitationManager {\\n &lt;&lt;control>>\\n +validateCriteria()\\n +validateRecipients()\\n +dispatchInvitations()\\n }\\n Member \"1\" --> \"0..*\" Invitation : sends\\n InvitationManager --> Member : validates\\n InvitationManager --> Invitation : creates</code></pre></details>\n<p><b>Validation:</b> up to five interests, three personality criteria and ten invitees are constraints derived from the actual slide. The exact class properties shown above are educational reconstructions because the slide diagrams are image-based and do not expose all fields as extractable text.</p>\n<h3>Building Parcel Management System (slide 51)</h3><p>Assignment asks students to create <b>(1) CRC Cards and (2) a Class Diagram</b> for the <b>Collect Parcel</b> Use Case. The slide refers to earlier functional modeling requirements, not fully repeated here.</p>\n<p><b>Illustrative starting candidates:</b> Resident, Parcel, FrontDeskStaff, CollectionRecord. <b>Example responsibilities:</b> verify identity, find parcels, record handover, update parcel status. These are practice assumptions, not claimed official solutions. To submit a class diagram accurately, first retrieve the earlier case's full requirements and UCD.</p>\n</section><section id=\"part11\"><h2>11. Golden Rules, Quick Exam Checks and Mastery</h2>\n<h3>Eight 1-Sentence Golden Rules</h3><ol><li><b>Structural Modeling represents Classes, their structural contents and relationships.</b></li><li><b>CRC = Class + Knowing/Doing Responsibilities + Collaborators.</b></li><li><b>Read UCD nouns for candidate Classes and verbs for candidate Operations, but filter by scope.</b></li><li><b>Generalization IS-A uses a hollow triangle pointing to the Superclass.</b></li><li><b>Aggregation uses a hollow diamond; Composition uses a filled diamond at the Whole end.</b></li><li><b>Read Multiplicity at the opposite association endpoint and label directional relationships.</b></li><li><b>Always use the Standard Class Diagram format in exams unless Simplified is requested.</b></li><li><b>7-Step CRC-to-Class-Diagram creation ends with review and validation; Object Diagrams can trigger revisions.</b></li></ol>\n<h3>Last-Minute Comparison</h3><div style=\"overflow-x:auto\"><table><thead><tr><th>Contrast</th><th>A</th><th>B</th></tr></thead><tbody><tr><td>Class vs Object</td><td>Template with type information</td><td>Concrete instance with current values</td></tr><tr><td>Attribute vs Class</td><td>Value/property</td><td>Independent concept with shared attributes/responsibilities</td></tr><tr><td>Knowing vs Doing</td><td>Information responsibility</td><td>Behavioral responsibility</td></tr><tr><td>Generalization vs Association</td><td>IS-A inheritance</td><td>Business relationship</td></tr><tr><td>Aggregation vs Composition</td><td>Shared whole-part</td><td>Strongly owned whole-part</td></tr><tr><td>Class Diagram vs Object Diagram</td><td>Structure/types/cardinalities</td><td>Runtime footprint and links</td></tr><tr><td>Entity vs Boundary vs Control</td><td>Persistent business data</td><td>External interface vs transactional coordination</td></tr></tbody></table></div>\n<section class=\"quiz\"><h3>Quick Concept Check 1</h3><p><b>In a class diagram, Student “1” — “0..*” Appointment means what?</b></p><button onclick=\"lessonAnswer('chapter4.html-1',0,1)\">A. Each Student must have exactly one Appointment.</button><button onclick=\"lessonAnswer('chapter4.html-1',1,1)\">B. An Appointment is associated with exactly one Student, while a Student may have zero or many Appointments.</button><button onclick=\"lessonAnswer('chapter4.html-1',2,1)\">C. An Appointment always has zero Students.</button><button onclick=\"lessonAnswer('chapter4.html-1',3,1)\">D. The numbers mean order of method calls.</button><div id=\"fbchapter4.html-1\"></div><span id=\"expchapter4.html-1\" hidden>Correct Answer: B. Multiplicity at the Appointment end counts appointments per Student; multiplicity at the Student end counts students per Appointment. 中文：乘數看關聯端點：Student 1 代表每個 Appointment 對應一個 Student；Appointment 0..* 代表一個 Student 可有多筆。</span><details><summary>English / 中文完整解析</summary><p>Multiplicity at the Appointment end counts appointments per Student; multiplicity at the Student end counts students per Appointment.</p><p>乘數看關聯端點：Student 1 代表每個 Appointment 對應一個 Student；Appointment 0..* 代表一個 Student 可有多筆。</p></details></section>\n<section class=\"quiz\"><h3>Quick Concept Check 2</h3><p><b>Which is the correct sequence in the instructor's seven-step use-case-driven Class Diagram process?</b></p><button onclick=\"lessonAnswer('chapter4.html-2',0,1)\">A. Class Diagram → CRC Cards → Functional Models</button><button onclick=\"lessonAnswer('chapter4.html-2',1,1)\">B. Create CRC → Review CRC → Role-Play → Draw CD → Review CD → Incorporate Patterns → Validate</button><button onclick=\"lessonAnswer('chapter4.html-2',2,1)\">C. Code → Object Diagram → Use Case Diagram</button><button onclick=\"lessonAnswer('chapter4.html-2',3,1)\">D. Create the Simplified CD first and omit validation</button><div id=\"fbchapter4.html-2\"></div><span id=\"expchapter4.html-2\" hidden>Correct Answer: B. Slide 32 gives the CRC-first seven-step sequence and requires review, patterns and model validation. 中文：教授七步一定先 CRC，再 Review、Role-Play，之後才畫 Class Diagram、刪除不必要內容、套 Pattern、驗證。</span><details><summary>English / 中文完整解析</summary><p>Slide 32 gives the CRC-first seven-step sequence and requires review, patterns and model validation.</p><p>教授七步一定先 CRC，再 Review、Role-Play，之後才畫 Class Diagram、刪除不必要內容、套 Pattern、驗證。</p></details></section>\n<section class=\"quiz\"><h3>Quick Concept Check 3</h3><p><b>Which statement about a superclass and object diagram is correct?</b></p><button onclick=\"lessonAnswer('chapter4.html-3',0,1)\">A. Every superclass is abstract; an object diagram is a process flow.</button><button onclick=\"lessonAnswer('chapter4.html-3',1,1)\">B. An object diagram is a snapshot of actual instances, and a superclass is not automatically abstract.</button><button onclick=\"lessonAnswer('chapter4.html-3',2,1)\">C. An object diagram contains only operation signatures.</button><button onclick=\"lessonAnswer('chapter4.html-3',3,1)\">D. Class diagrams and object diagrams are identical.</button><div id=\"fbchapter4.html-3\"></div><span id=\"expchapter4.html-3\" hidden>Correct Answer: B. An Object Diagram instantiates classes with values and object links at a moment. A Superclass may be concrete. 中文：Object Diagram 是某時間點的物件快照；當父類別不代表必然 Abstract。</span><details><summary>English / 中文完整解析</summary><p>An Object Diagram instantiates classes with values and object links at a moment. A Superclass may be concrete.</p><p>Object Diagram 是某時間點的物件快照；當父類別不代表必然 Abstract。</p></details></section>\n<button onclick=\"lessonMarkDone(4)\">✓ Mark Chapter 4 as reviewed</button> <span id=\"reading4\"></span>\n</section><p class=\"muted\">Primary source: 2026 Chapter 4 Structural Modeling slides, 53 pages, lecturer 陳仲儼. Especially pp. 11–19 CRC identification/role-play, pp. 20–31 class notation/multiplicity, p. 32 seven steps, pp. 36–41 object diagram and V&V, pp. 42–51 instructional cases. Textbook: Dennis, Wixom & Tegarden, Systems Analysis and Design with UML (6th ed.), related Chapter 4. Unfilled slide terms and textbook p.152/154 V&V not reproduced in student slides are explicitly distinguished from teaching inferences.</p>"};
const TEXTBOOK_ADD={"1":"<section class=\"card textbook-integrated\" id=\"textbook-ch1\" style=\"padding:22px;margin:28px 0;border:1px solid var(--accent)\"><div class=\"eyebrow\">TEXTBOOK INTEGRATION · SOURCE-GROUNDED</div><h2>📚 Systems Analyst Roles, Skills and Methodology Taxonomy</h2><p class=\"muted\"><b>Source:</b> Dennis, Wixom & Tegarden textbook Ch1, Typical Systems Analyst Roles and Skills. This supplement summarizes and explains the textbook rather than reproducing its copyrighted pages. 課本補充與教授投影片原有內容分開標示。</p>\n<h3>Six Core Analyst Skill Categories</h3><div style=\"overflow-x:auto\"><table><thead><tr><th>Skill</th><th>Textbook emphasis</th><th>中文辨析</th></tr></thead><tbody><tr><td>Technical</td><td>Existing and future technology and integration</td><td>技術環境</td></tr><tr><td>Business</td><td>Connect IT improvements to Business Value</td><td>商業價值</td></tr><tr><td>Analytical</td><td>Investigate problems, alternatives and assumptions</td><td>批判與邏輯分析</td></tr><tr><td>Interpersonal</td><td>Communicate with users, managers and developers</td><td>溝通及引導</td></tr><tr><td>Management</td><td>Manage deadlines, people, resources and uncertainty</td><td>管理專案風險</td></tr><tr><td>Ethical</td><td>Protect confidential information and maintain trust</td><td>資訊倫理</td></tr></tbody></table></div>\n<h3>Five Distinct Project Roles</h3><div style=\"overflow-x:auto\"><table><thead><tr><th>Role</th><th>Primary responsibility</th><th>Where especially relevant</th></tr></thead><tbody><tr><td>Business Analyst</td><td>Business processes, value and requirements</td><td>Analysis</td></tr><tr><td>Systems Analyst</td><td>Information-system improvement and standards</td><td>Analysis / Design</td></tr><tr><td>Infrastructure Analyst</td><td>Network, hardware, software, database compatibility</td><td>Design / Implementation</td></tr><tr><td>Change Management Analyst</td><td>Training, adoption and resistance to organizational change</td><td>Implementation</td></tr><tr><td>Project Manager</td><td>Budget, timing, resources, sponsor benefits</td><td>All phases</td></tr></tbody></table></div>\n<h3>Methodology vs Viewpoint</h3><p>The textbook also distinguishes Process-Centered, Data-Centered and Object-Oriented perspectives. These are <b>modeling emphases</b>, not another list of Waterfall / XP / Scrum schedules. One methodology may use several modeling perspectives.</p><p><b>Example:</b> A clinic replacing a paper scheduling system needs a Business Analyst to investigate workflow, a Systems Analyst to translate requirements into models, and a Change Management Analyst to prepare receptionists for adoption.</p><p><b>Exam Check:</b> Responsible for overcoming staff resistance and organizing training? <b>Change Management Analyst</b>, not Infrastructure Analyst.</p></section>","2":"<section class=\"card textbook-integrated\" id=\"textbook-ch2\" style=\"padding:22px;margin:28px 0;border:1px solid var(--accent)\"><div class=\"eyebrow\">TEXTBOOK INTEGRATION · SOURCE-GROUNDED</div><h2>📚 Concept Maps, Story Cards and Task Lists</h2><p class=\"muted\"><b>Source:</b> Textbook Ch3, Alternative Requirements Documentation Techniques. This supplement summarizes and explains the textbook rather than reproducing its copyrighted pages. 課本補充與教授投影片原有內容分開標示。</p>\n<h3>Concept Maps</h3><p><b>Definition:</b> A Concept Map uses requirement or concept <b>nodes</b> linked by meaningfully labeled <b>arcs</b>. It can show nonhierarchical relationships between Functional Requirements and Security / Performance / Operational Constraints.</p>\n<pre class=\"mermaid\">flowchart LR\n FR[\"FR: Record Doctor Availability\"] --> FA[\"FR: Manage Appointments\"]\n SEC[\"NFR: Only Doctors Set Availability\"] -. \"impacts\" .-> FR\n PERF[\"NFR: Retrieve Schedule Within 2 Seconds\"] -. \"impacts\" .-> FA\n</pre>\n<p><b>SOP:</b> Identify verified requirements → create nodes → label impact/include arcs → inspect missing relationships → walkthrough with stakeholders → update the textual Requirements Definition. Advantages: makes cross-cutting constraints visible. Weakness: can become tangled in very large systems, so complement rather than replace written requirements.</p>\n<h3>Story Cards vs Task Lists vs Requirements Definition</h3><div style=\"overflow-x:auto\"><table><thead><tr><th>Artifact</th><th>Purpose</th><th>Example</th></tr></thead><tbody><tr><td>Story Card</td><td>Concise role / capability / benefit statement</td><td>As a Receptionist, I want to check available slots so I can avoid duplicate bookings.</td></tr><tr><td>Task List</td><td>Specific development/verification work for the story</td><td>Clarify validation, implement checking, test unavailable slots</td></tr><tr><td>Requirements Definition</td><td>Approved Functional and Non-functional system statements</td><td>FR-03: Prevent conflicting appointments; NFR-02: Restrict patient access</td></tr></tbody></table></div>\n<h3>As-Is → To-Be → Proposal</h3><p>Begin with the actual process, identify root causes and improvements, translate to requirements, use Concept Maps to show constraint impacts, and include validated requirements in the System Proposal. <b>Exam trap:</b> A Story Card is not a substitute for a complete, verifiable requirement.</p></section>","3":"<section class=\"card textbook-integrated\" id=\"textbook-ch3\" style=\"padding:22px;margin:28px 0;border:1px solid var(--accent)\"><div class=\"eyebrow\">TEXTBOOK INTEGRATION · SOURCE-GROUNDED</div><h2>📚 Textbook Activity Diagram Style and Business Process Validation</h2><p class=\"muted\"><b>Source:</b> Textbook Ch4, Guidelines for Creating Activity Diagrams; Verifying and Validating the Business Processes. This supplement summarizes and explains the textbook rather than reproducing its copyrighted pages. 課本補充與教授投影片原有內容分開標示。</p>\n<h3>Activity Diagram Style Guidelines</h3><div style=\"overflow-x:auto\"><table><thead><tr><th>Guideline</th><th>Required interpretation</th><th>Easy mistake</th></tr></thead><tbody><tr><td>Scope and Title</td><td>Choose one explicit process and a descriptive name</td><td>No defined boundary</td></tr><tr><td>Initial Node</td><td>Typically a single start placed top/upper-left</td><td>Multiple unexplained entries</td></tr><tr><td>Activity Final</td><td>Generally one overall process final placed bottom/right</td><td>Accidentally terminating all branches</td></tr><tr><td>Decision Guards</td><td>Outgoing guards should be mutually exclusive and collectively exhaustive</td><td>Overlapping or missing conditions</td></tr><tr><td>Fork/Join</td><td>Represent meaningful concurrent activities and synchronization</td><td>Mistaking parallelism for either/or choices</td></tr><tr><td>Presentation</td><td>Avoid unnecessary crossing lines and keep abstraction consistent</td><td>Hard-to-read or low-level click sequence</td></tr></tbody></table></div>\n<h3>Detailed Decision Walkthrough</h3><pre class=\"mermaid\">flowchart TD\n I((Start)) --> C[\"Check Appointment Availability\"]\n C --> D{\"Slot Available?\"}\n D -->|\"[yes]\"| A[\"Accept Appointment\"]\n D -->|\"[no]\"| B[\"Offer Alternatives\"]\n A --> F((End))\n B --> F\n</pre><p><b>Verification:</b> Check valid symbols, complete guards and consistent UCD event ordering. <b>Validation:</b> Ask whether the real clinic should show alternate times or put patients on a waiting list. A technically correct UML diagram can still represent the wrong business process.</p>\n<h3>Cross-document Traceability</h3><div style=\"overflow-x:auto\"><table><thead><tr><th>Input</th><th>Output</th><th>Cross-check</th></tr></thead><tbody><tr><td>Requirements Definition</td><td>Use-Case Diagram</td><td>Actors and primary goals identified</td></tr><tr><td>Use Case</td><td>Activity Diagram</td><td>Actions and alternate/exception paths realized</td></tr><tr><td>Activity Diagram</td><td>UCD</td><td>Every important action and object node represented in events</td></tr><tr><td>UCD</td><td>Stakeholder Walkthrough</td><td>Roles, scope and business outcomes validated</td></tr></tbody></table></div></section>","4":"<section class=\"card textbook-integrated\" id=\"textbook-ch4\" style=\"padding:22px;margin:28px 0;border:1px solid var(--accent)\"><div class=\"eyebrow\">TEXTBOOK INTEGRATION · SOURCE-GROUNDED</div><h2>📚 CRC Role-Play, Class Simplification and Structural V&V</h2><p class=\"muted\"><b>Source:</b> Textbook Ch5, Role-Playing CRC Cards with Use Cases; Object Diagrams; Verifying and Validating the Structural Model. This supplement summarizes and explains the textbook rather than reproducing its copyrighted pages. 課本補充與教授投影片原有內容分開標示。</p>\n<h3>Textbook's Four-Step CRC Role-Playing Procedure</h3><div style=\"overflow-x:auto\"><table><thead><tr><th>Step</th><th>Procedure</th><th>Output</th></tr></thead><tbody><tr><td>1. Pick a Use Case</td><td>Choose one use case and one specific scenario</td><td>Scenario script</td></tr><tr><td>2. Identify Relevant Roles</td><td>Identify actors and object roles, assign participants</td><td>Role roster</td></tr><tr><td>3. Role-Play Scenarios</td><td>Perform UCD events; identify implicit or impossible handoffs, revise and repeat</td><td>Improved UCD + CRC cards</td></tr><tr><td>4. Repeat</td><td>Re-enact other important scenarios and use cases</td><td>Scenario coverage</td></tr></tbody></table></div>\n<p>The textbook's <b>Make Old Patient Appt</b> example exposes hidden assumptions such as how the patient's first contact reaches the Receptionist. The role-playing team must clarify who receives and processes each message. This 4-step subprocedure belongs inside the professor's wider <b>7-Step CRC → Class Diagram</b> SOP, rather than replacing it.</p>\n<h3>Three Class Diagram Simplification Techniques</h3><div style=\"overflow-x:auto\"><table><thead><tr><th>Technique</th><th>Purpose</th><th>Caution</th></tr></thead><tbody><tr><td>Show concrete classes only</td><td>Reduce visual complexity</td><td>Inherited associations may become harder to see</td></tr><tr><td>Use-case / relationship / compartment views</td><td>Display only relevant portion of diagram</td><td>Keep the complete underlying model</td></tr><tr><td>Packages</td><td>Cluster related classes</td><td>Group by actual relationships</td></tr></tbody></table></div>\n<h3>Object Diagram Identifies a Structural Defect</h3><p>The textbook instantiates Patient, Appointment, Doctor and Symptom objects. By examining actual links and attribute values, analysts may discover that an Appointment's <b>reason</b> should reference a Symptom rather than being treated as a loosely connected Patient attribute. This is an example of <b>Class Diagram → Object Diagram → Revised Class Diagram</b>.</p>\n<pre class=\"mermaid\">flowchart LR\n P[\"johnDoe: Patient\"] --> A[\"appt1: Appointment\"]\n A --> D[\"drSmith: Doctor\"]\n A --> S[\"symptom1: Symptom\"]\n</pre>\n<h3>Structural Walkthrough and Cross-Model Validation</h3><ol><li>Confirm each business Class is justified by a Requirement or Use-Case scenario.</li><li>Map CRC Knowing to Attributes and CRC Doing to Operations.</li><li>Match CRC Collaborators to feasible Associations and Navigability.</li><li>Role-play Normal and Alternate UCD events to detect responsibilities that lack an owner.</li><li>Read Multiplicity on both association ends and test concrete instances.</li><li>Use Object Diagrams to reveal incorrect or misplaced Attributes and Links.</li><li>Remove unsupported Classes and unnecessary Associations, without losing required business information.</li><li>Check consistency with Functional Models and validate with domain stakeholders.</li></ol></section>",5:"<h1>Chapter 5. Behavioral Modeling</h1><p class=\"muted\">English-first · 繁體中文詳解 · 2026 Course Slides · Six-Step Sequence SOP · CRUDE · Five-Step State SOP · V&V · Mermaid Diagrams · Full Cases</p><nav class=\"toc\"><a class=\"pill\" href=\"#part1\">1. Framework</a><a class=\"pill\" href=\"#part2\">2. Interaction Diagrams</a><a class=\"pill\" href=\"#part3\">3. Sequence Syntax</a><a class=\"pill\" href=\"#part4\">4. 6-Step SOP</a><a class=\"pill\" href=\"#part5\">5. Borrow Books Case</a><a class=\"pill\" href=\"#part6\">6. CRUDE</a><a class=\"pill\" href=\"#part7\">7. State Machines</a><a class=\"pill\" href=\"#part8\">8. 5-Step State SOP</a><a class=\"pill\" href=\"#part9\">9. Clinic Case</a><a class=\"pill\" href=\"#part10\">10. Lecture Cases</a><a class=\"pill\" href=\"#part11\">11. V&V</a><a class=\"pill\" href=\"#part12\">12. Exam Prep</a></nav><section id=\"part1\"><h2>1. Behavioral Modeling: Scope, Objectives and Artifact Relationships</h2>\n<p><b>Behavioral Modeling:</b> Dynamic modeling of how interacting objects collaborate to fulfill use cases and how an important business object changes state during its lifetime. The two main model families are <b>Interaction Diagrams</b> and <b>Behavioral State Machines</b>. The lecturer explicitly states Behavioral Modeling is iterative and can induce changes to functional and structural models (2026 lecture pp.4–8).</p>\n<p>中文：Functional Model 說明「使用者需要系統做什麼」，Structural Model 說明「有哪些物件及責任」，Behavioral Model 說明「物件以什麼訊息及順序合作」以及「重要物件何時轉換狀態」。它不是用來重新描寫靜態 Class 清單，也不是重新畫一次 Use Case。</p>\n<pre class=\"mermaid\">flowchart TD\n R[\"Requirements Definition\"] --> F[\"Functional Models: UC, Activity, UCD\"]\n F --> S[\"Structural Models: CRC, Class Diagram\"]\n S --> B[\"Behavioral Modeling\"]\n B --> I[\"Interaction: Sequence / Communication\"]\n B --> SM[\"Object Lifecycle: State Machine\"]\n I --> CR[\"CRUDE Matrix\"]\n CR -. \"revise responsibilities and collaborations\" .-> S\n SM -. \"revise attributes, status, operations\" .-> S\n B -. \"verify requirements and scenarios\" .-> F</pre><details><summary>Mermaid 原始碼（可複製）</summary><pre><code>flowchart TD\n R[\"Requirements Definition\"] --> F[\"Functional Models: UC, Activity, UCD\"]\n F --> S[\"Structural Models: CRC, Class Diagram\"]\n S --> B[\"Behavioral Modeling\"]\n B --> I[\"Interaction: Sequence / Communication\"]\n B --> SM[\"Object Lifecycle: State Machine\"]\n I --> CR[\"CRUDE Matrix\"]\n CR -. \"revise responsibilities and collaborations\" .-> S\n SM -. \"revise attributes, status, operations\" .-> S\n B -. \"verify requirements and scenarios\" .-> F</code></pre></details>\n<div style=\"overflow:auto\"><table><thead><tr><th>Artifact</th><th>Primary View</th><th>What must be answered?</th><th>Main Source</th></tr></thead><tbody><tr><td>Sequence Diagram</td><td>Dynamic interactions over time</td><td>In what order are messages sent?</td><td>Slides 8–32</td></tr><tr><td>Communication Diagram</td><td>Object/link collaboration</td><td>Which objects communicate, and what messages are passed?</td><td>Slides 7 and 48; textbook not provided</td></tr><tr><td>CRUDE Matrix</td><td>System-wide collaboration checks</td><td>Who creates, reads, updates, deletes, executes what?</td><td>Slides 33–35</td></tr><tr><td>Behavioral State Machine</td><td>Lifecycle of one business object</td><td>Which state changes occur after which events/guards?</td><td>Slides 36–41</td></tr><tr><td>Cross-model V&V</td><td>Consistency and completeness</td><td>Does each model match the UC, UCD and CD?</td><td>Slides 42, 46–48</td></tr></tbody></table></div>\n<h3>Glossary</h3><div style=\"overflow:auto\"><table><thead><tr><th>English Term</th><th>Academic Meaning</th><th>中文重點</th></tr></thead><tbody><tr><td>Interaction</td><td>Object-to-object collaboration through requests/messages</td><td>物件互相呼叫實現功能</td></tr><tr><td>Lifeline</td><td>An individual participant over time</td><td>垂直虛線表示參與者的存在</td></tr><tr><td>Message</td><td>Communication / operation invocation between objects</td><td>可包含參數、回傳值</td></tr><tr><td>Execution Occurrence</td><td>Time an object performs a behavior</td><td>執行條（activation bar）</td></tr><tr><td>Synchronous Message</td><td>Caller typically awaits completion</td><td>同步呼叫</td></tr><tr><td>Asynchronous Message</td><td>Caller does not necessarily wait</td><td>非同步訊息</td></tr><tr><td>Return Message</td><td>Response/result of an invocation</td><td>通常虛線，可省略明顯回傳</td></tr><tr><td>Frame / Combined Fragment</td><td>Container for interaction, alternatives or loops</td><td>框架、alt、opt、loop</td></tr><tr><td>Instance Sequence Diagram</td><td>One concrete use-case scenario</td><td>本課程主要使用</td></tr><tr><td>Generic Sequence Diagram</td><td>Several possible scenarios or all relevant flows</td><td>一般化流程，與 instance 不同</td></tr><tr><td>State</td><td>Condition of an object during its lifetime</td><td>某個物件狀態</td></tr><tr><td>Event</td><td>Occurrence triggering potential change</td><td>觸發事件</td></tr><tr><td>Transition</td><td>Movement from source to target state</td><td>狀態轉移</td></tr><tr><td>Guard</td><td>Boolean condition constraining a transition</td><td>方括號條件</td></tr><tr><td>CRUDE</td><td>Create, Read, Update, Delete, Execute</td><td>跨物件操作矩陣</td></tr></tbody></table></div></section><section id=\"part2\"><h2>2. Interaction Diagrams: Sequence vs Communication and Message Types</h2>\n<p>The 2026 slides identify two UML interaction diagrams: (1) <b>Sequence Diagram</b>, emphasizing timing/order, and (2) <b>Communication Diagram</b>, emphasizing the pattern of message flow between linked objects. Slide 7 explicitly says Communication Diagrams are <b>not included in the assigned textbook</b>; the comparison and illustrative notation below derive from the lecture plus standard UML explanation, not from missing textbook pages.</p>\n<div style=\"overflow:auto\"><table><thead><tr><th>Dimension</th><th>Sequence Diagram</th><th>Communication Diagram</th></tr></thead><tbody><tr><td>Emphasis</td><td>Temporal ordering along the vertical axis</td><td>Object relationships / network of links</td></tr><tr><td>Layout</td><td>Actors/participants across top; time top → bottom</td><td>Objects arranged as nodes with links</td></tr><tr><td>Messages</td><td>Ordered by vertical location</td><td>Annotated and commonly numbered along links</td></tr><tr><td>Good for</td><td>Scenario walkthrough, operation order and return values</td><td>Identifying which objects must communicate</td></tr><tr><td>Limit</td><td>Long diagrams when many participants/messages</td><td>Temporal detail less immediately visible</td></tr></tbody></table></div>\n<h3>Message Fundamentals</h3><p>Slide 6 uses a Java-style Student–Course example: <code>Student.registerCourse(Course c)</code> invokes <code>c.add(stu_ID)</code>, then obtains a returned boolean. In this interaction, Student sends a <b>Call Message</b> and Course provides a <b>Return Message</b>. The sender's Class need not implement the receiver's operation: the receiver owns its behavior.</p>\n<pre><code>public class Student {\n  private String stu_ID;\n  public String registerCourse(Course c) {\n    boolean accepted = c.add(stu_ID);\n    return accepted ? \"accepted\" : \"rejected\";\n  }\n}</code></pre>\n<pre class=\"mermaid\">sequenceDiagram\n participant Student\n participant Course\n Student->>Course: add(stu_ID)\n activate Course\n Course-->>Student: accepted: boolean\n deactivate Course</pre><details><summary>Mermaid 原始碼（可複製）</summary><pre><code>sequenceDiagram\n participant Student\n participant Course\n Student->>Course: add(stu_ID)\n activate Course\n Course-->>Student: accepted: boolean\n deactivate Course</code></pre></details>\n<p><b>Semantic rules:</b> A solid arrow indicates the call; a dashed arrow illustrates a return. A synchronous call generally uses a filled arrowhead and an asynchronous signal a stick arrowhead in formal UML. Mermaid reproduces these concepts approximately. An obvious return may be omitted, as the lecture says in Step 4 (p.19).</p>\n<h3>Communication Diagram Conceptual Example</h3><pre class=\"mermaid\">flowchart LR\n S[\"student: Student\"] -- \"1: registerCourse()\" --> M[\"registrationManager: Control\"]\n M -- \"1.1: add(studentId)\" --> C[\"course: Course\"]\n C -- \"1.2: result\" --> M</pre><details><summary>Mermaid 原始碼（可複製）</summary><pre><code>flowchart LR\n S[\"student: Student\"] -- \"1: registerCourse()\" --> M[\"registrationManager: Control\"]\n M -- \"1.1: add(studentId)\" --> C[\"course: Course\"]\n C -- \"1.2: result\" --> M</code></pre></details>\n<p><b>Formal notation caution:</b> Mermaid flowchart with numbered connectors is a teaching approximation. When drawing a graded UML Communication Diagram, represent objects, links, appropriately directed messages and sequence numbers in the UML style specified in class.</p></section><section id=\"part3\"><h2>3. Sequence Diagram: Standard UML Syntax and Detailed Reading</h2>\n<div style=\"overflow:auto\"><table><thead><tr><th>Element / Symbol</th><th>UML Meaning</th><th>Drawing / Interpretation Rule</th></tr></thead><tbody><tr><td>Actor</td><td>External user/system participant</td><td>May be represented with a stick figure; outside subject conceptually</td></tr><tr><td>Object Lifeline</td><td>Instance participant such as <code>patient: Patient</code></td><td>Label instance : Class; dashed vertical lifeline</td></tr><tr><td>Boundary / Control / Entity</td><td>Analysis stereotypes</td><td>UI ↔ orchestration ↔ persistent business objects</td></tr><tr><td>Solid Call Arrow</td><td>Message or method invocation</td><td>Sender → receiver; include operation name(arguments)</td></tr><tr><td>Dashed Return Arrow</td><td>Response/result</td><td>Receiver → caller, may be omitted if obvious</td></tr><tr><td>Execution Occurrence</td><td>Execution bar on lifeline</td><td>Time during which called behavior executes</td></tr><tr><td>Self Message</td><td>An object invokes its own operation</td><td>Loops back to same lifeline</td></tr><tr><td>Create / Destroy</td><td>Beginning/end of an object's existence</td><td>Creation message to new lifeline; destruction indicated if applicable</td></tr><tr><td>Frame / Combined Fragment</td><td>Region enclosing alt, opt, loop</td><td>Guards such as [available] and [else]</td></tr><tr><td>Nested Message</td><td>Receiver invokes another object</td><td>Vertical order preserves execution logic</td></tr></tbody></table></div>\n<h3>Instance vs Generic</h3><p><b>Generic Sequence Diagram:</b> Can account for several paths of a Use Case, often by using alt/opt/loop fragments. <b>Instance Sequence Diagram:</b> Specifies one scenario (a single path through a Use Case). <b>The lecturer explicitly says this course uses instance sequence diagrams</b> (slide 8). Therefore when assigned “draw SD for Borrow Books normal flow,” focus on that selected normal scenario rather than automatically creating a giant diagram for every branch.</p>\n<h3>Frames: alt / opt / loop</h3><pre class=\"mermaid\">sequenceDiagram\n actor Patient\n participant BookingUI\n participant BookingManager\n participant Appointment\n Patient->>BookingUI: requestAppointment(doctor, slot)\n BookingUI->>BookingManager: book(doctor, slot)\n alt slot available\n   BookingManager->>Appointment: create(patient, doctor, slot)\n   Appointment-->>BookingManager: appointmentId\n   BookingManager-->>BookingUI: confirmed(appointmentId)\n else slot unavailable\n   BookingManager-->>BookingUI: rejected()\n end\n BookingUI-->>Patient: displayResult()</pre><details><summary>Mermaid 原始碼（可複製）</summary><pre><code>sequenceDiagram\n actor Patient\n participant BookingUI\n participant BookingManager\n participant Appointment\n Patient->>BookingUI: requestAppointment(doctor, slot)\n BookingUI->>BookingManager: book(doctor, slot)\n alt slot available\n   BookingManager->>Appointment: create(patient, doctor, slot)\n   Appointment-->>BookingManager: appointmentId\n   BookingManager-->>BookingUI: confirmed(appointmentId)\n else slot unavailable\n   BookingManager-->>BookingUI: rejected()\n end\n BookingUI-->>Patient: displayResult()</code></pre></details>\n<p>課堂的 Instance Sequence Diagram 一般只需要抽出其中一條具體 scenario。例如「slot available」的正常流程可獨立畫一張；上面 alt 版用於教學比較 Generic 與 Instance 的視野。</p>\n<h3>Execution vs Return</h3><p>An Execution Occurrence is not the same as a Lifeline. The Lifeline persists as the participant exists, while the Execution Occurrence marks active execution. Returning a value is different from sending another business request. The lecture's example on slides 10–11 uses the execution bar specifically for this distinction.</p></section><section id=\"part4\"><h2>4. The Lecturer's Six-Step Sequence Diagram SOP</h2>\n<p><b>Official 2026 slide 19 SOP:</b> (1) Set the context; (2) Identify actors and objects interacting in the UC scenario; (3) Set the lifeline for each object; (4) Add messages; (5) Add execution occurrence; (6) Validate the sequence diagram. The lecture's associated slide 20 expands Step 1 into four checks.</p>\n<div style=\"overflow:auto\"><table><thead><tr><th>Step</th><th>What the Slides Require</th><th>Detailed Construction SOP</th><th>Pitfall</th></tr></thead><tbody><tr><td>1. Set the Context</td><td>Select UC; focus normal flow; clarify Swimlane AD; obtain UC-level CD</td><td>Select exactly one Use Case, choose its major Normal UCD Flow, map actions to actor/class responsibility lanes, retrieve candidate classes and associations.</td><td>Trying to show unrelated use cases</td></tr><tr><td>2. Identify Actors & Objects</td><td>Identify participating actors and objects for that scenario</td><td>Extract participants from UCD step subjects/receivers and the UC-level CD, including needed Boundary/Control/Entity objects.</td><td>Turning every noun into an object lifeline</td></tr><tr><td>3. Set Lifelines</td><td>Arrange one lifeline per relevant instance</td><td>Use <code>instanceName: ClassName</code>, meaningful left-right order and dashed lifeline; actor may appear first.</td><td>Confusing Class name and instance identity</td></tr><tr><td>4. Add Messages</td><td>Draw arrows, include parameters, omit obvious returns</td><td>Walk top-to-bottom through UCD events; assign each operation to receiver class and include meaningful parameters/results.</td><td>Wrong receiver, direction or order</td></tr><tr><td>5. Add Execution Occurrences</td><td>Mark execution of called operations</td><td>Show appropriate activation bars, nesting and return where relevant.</td><td>Activation bar mistakenly covering entire scenario</td></tr><tr><td>6. Validate Diagram</td><td>Ensure every selected process step is represented</td><td>Walkthrough alongside UCD / Activity / CD; correct any missing objects, operations, associations and inconsistent paths.</td><td>Assuming a syntactically correct diagram is business-correct</td></tr></tbody></table></div>\n<h3>Step 1: Context Preparation (slide 20)</h3><ol><li>Select a <b>Use Case</b>.</li><li>Choose the <b>major Normal Flow</b> from its <b>Use-Case Description</b>.</li><li>Use its <b>Activity Diagram</b>; create/refine a <b>Swimlane Activity Diagram</b> to assign activities to actors and classes.</li><li>Prepare its <b>UC-level Class Diagram</b> from Structural Modeling.</li></ol>\n<h3>Text → Lifelines → Messages</h3>\n<div style=\"overflow:auto\"><table><thead><tr><th>UCD Normal Step</th><th>Responsible Participant</th><th>Corresponding Message</th></tr></thead><tbody><tr><td>Patient selects doctor and time</td><td>Patient → BookingUI</td><td>requestAppointment(doctor,slot)</td></tr><tr><td>System verifies schedule</td><td>BookingUI → BookingManager → Availability</td><td>book(); isAvailable(slot)</td></tr><tr><td>System creates Appointment</td><td>BookingManager → Appointment</td><td>create(patient,doctor,slot)</td></tr><tr><td>System reports confirmation</td><td>BookingManager → BookingUI → Patient</td><td>confirmed(id); displayResult()</td></tr></tbody></table></div>\n<pre class=\"mermaid\">sequenceDiagram\n actor Patient\n participant UI as bookingUI: BookingUI\n participant Manager as bookingManager: BookingManager\n participant Avail as availability: Availability\n participant Appt as appointment: Appointment\n Patient->>UI: requestAppointment(doctor,slot)\n activate UI\n UI->>Manager: book(patient,doctor,slot)\n activate Manager\n Manager->>Avail: isAvailable(slot)\n Avail-->>Manager: true\n Manager->>Appt: create(patient,doctor,slot)\n Appt-->>Manager: ap
