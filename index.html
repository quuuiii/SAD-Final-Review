dependent observer's perspective rather than subjective narration.</li><li>Stay at a consistent level of abstraction.</li><li>Use a sensible number of steps to cover the meaningful process.</li><li>Apply the <b>KISS</b> principle (Keep It Simple and Straightforward; common interpretation, lecturer slide leaves this term blank) when organizing flows.</li><li>Explicitly document loop conditions and termination.</li></ol>\n<p><b>Transparency:</b> Guidelines 1 and 6 contain unfilled blanks in the supplied student slides. The expanded SVO and KISS labels are teaching interpretations, not verified verbatim answers from the instructor's filled-in key.</p></section><section id=\"part7\"><h2>7. Complete UCD Example: Register for Course</h2>\n<div style=\"overflow:auto\"><table><tr><th>Field</th><th>Content</th></tr><tr><td>Use Case ID</td><td>UC-01</td></tr><tr><td>Use Case Name</td><td>Register for Course</td></tr><tr><td>Use Case Type</td><td>Essential, Detailed</td></tr><tr><td>Primary Actor</td><td>Learner</td></tr><tr><td>Stakeholders</td><td>Academic Administrator; Cashier</td></tr><tr><td>Brief Description</td><td>A learner selects a course and receives registration confirmation and manual payment instructions.</td></tr><tr><td>Trigger</td><td>Learner selects Register for Course.</td></tr><tr><td>Preconditions</td><td>The course is published and learner has access to the registration function.</td></tr><tr><td>Success Postcondition</td><td>An accepted registration is recorded; payment remains pending manual confirmation.</td></tr><tr><td>Relationships</td><td>May include Check Course Capacity, if this is modeled as a separate reusable use case.</td></tr><tr><td>Importance</td><td>High</td></tr></table></div>\n<h3>Normal Flow of Events</h3><ol><li>The Learner selects a course.</li><li>The System retrieves the selected course and location capacity.</li><li>The System verifies that a seat is available.</li><li>The System identifies whether the Learner is a Member.</li><li>The System calculates the applicable course fee.</li><li>The System records the registration request.</li><li>The System displays registration confirmation and manual payment information.</li></ol>\n<h3>Sub-flow SF-01: Determine Course Fee</h3><ol><li>The System obtains the standard course fee.</li><li>If the Learner is a Member, the System applies the 20% discount; otherwise it retains the standard fee.</li><li>The System returns the calculated fee to the main flow.</li></ol>\n<h3>Alternate Flow AF-01: Course Full</h3><p>At Normal Flow Step 3, if capacity is exhausted, the System shows the course as full and does not accept the requested registration. The Learner may select another course; this return path must be explicitly drawn if required by the actual business rules.</p>\n<h3>Exception Flow EF-01: Registration Cannot Be Saved</h3><p>At Step 6, if persistence fails, the System indicates failure and does not display a successful confirmation. This branch is an expanded teaching example rather than an explicitly provided nine-requirement scenario rule.</p>\n<h3>Activity Diagram → UCD mapping</h3><div style=\"overflow:auto\"><table><tr><th>Activity Action</th><th>Matching UCD Event</th></tr><tr><td>Learner selects course</td><td>Normal Step 1</td></tr><tr><td>System checks capacity</td><td>Normal Steps 2–3</td></tr><tr><td>System determines fee</td><td>Normal Steps 4–5 + SF-01</td></tr><tr><td>System registers request</td><td>Normal Step 6</td></tr><tr><td>System displays confirmation</td><td>Normal Step 7</td></tr><tr><td>System shows course full</td><td>AF-01</td></tr><tr><td>System handles save failure</td><td>EF-01</td></tr></table></div>\n<p><b>Cross-check:</b> Every Action in the Activity Diagram must have at least one event in the UCD, and the order must match. A separate UCD would be required if a business goal is elevated to an independent Use Case; don't substitute one shared UCD for two diagrammed use cases.</p></section><section id=\"part8\"><h2>8. V&V: Formal Walkthrough and Eight Cross-Model Rules</h2>\n<p><b>Verification:</b> Check artifacts for correct and internally consistent UML syntax, flow and fields. <b>Validation:</b> Confirm the functional models satisfy business needs with the Client.</p>\n<h3>Formal Walkthrough Roles (slide 30)</h3><div style=\"overflow:auto\"><table><tr><th>Role</th><th>Responsibility</th></tr><tr><td>Facilitator / Host (e.g., PM)</td><td>Arrange meeting and lead review process</td></tr><tr><td>Presenter</td><td>Author presents Use Cases, Activity Diagrams and UCDs</td></tr><tr><td>Recorder / Scribe</td><td>Document defects, questions and corrections</td></tr><tr><td>Client / Stakeholder</td><td>Confirm that the modeled functions support real business operations</td></tr></table></div>\n<h3>The Eight Lecturer Rules (slides 31–32)</h3><ol><li><b>Action-to-event coverage:</b> Every Action / Activity on an Activity Diagram must have at least one corresponding event in its UCD.</li><li><b>Object-node coverage:</b> Every Object Node in an Activity Diagram must be mentioned in a UCD event.</li><li><b>Order consistency:</b> The sequence of UCD events must match the activity-flow order.</li><li><b>One-to-one documentation:</b> Each Use Case has one and only one UCD.</li><li><b>Actor consistency:</b> All Actors listed in a UCD must appear in the Use-Case Diagram (student slide contains a blank; Actor is the course-context interpretation).</li><li><b>Stakeholder review:</b> Stakeholders in the UCD should preferably appear in the diagram if they are true interacting Actor roles; evaluate whether an interested but non-interacting stakeholder truly belongs there.</li><li><b>Relationship consistency:</b> Every relationship specified in the UCD must be represented on the Use-Case Diagram.</li><li><b>Diagram syntax:</b> Enforce all diagram-specific element, label, arrow and control-node rules.</li></ol>\n<h3>Bidirectional Validation Matrix</h3><div style=\"overflow:auto\"><table><tr><th>From</th><th>To</th><th>Verify</th></tr><tr><td>Requirement</td><td>Use Case Diagram</td><td>Does each core business goal have a corresponding use case?</td></tr><tr><td>Use Case Diagram</td><td>UCD</td><td>Exactly one description per use case; same actors/relationships?</td></tr><tr><td>Activity Diagram</td><td>UCD</td><td>Do every Action and Object Node appear in the event list?</td></tr><tr><td>UCD</td><td>Activity Diagram</td><td>Does sequence, branching and termination agree?</td></tr><tr><td>Functional Models</td><td>Structural Models (Ch4)</td><td>Are the responsible domain concepts and class operations supported?</td></tr><tr><td>Functional Models</td><td>Behavioral Models (Ch5)</td><td>Can interaction scenarios realize all normal and alternate flows?</td></tr></table></div>\n<h3>Typical Point-Deduction Errors</h3><ol><li>Wrong include / extend arrow direction or dashed stereotype.</li><li>Actor represented as a specific real person's name instead of a role.</li><li>UCD event ordering contradicts the Activity Diagram.</li><li>Flow Final used to end an entire activity, or Activity Final ends all parallel tasks unexpectedly.</li><li>Missing UCD for a diagrammed Use Case, or missing Actors/relationships in one artifact.</li></ol></section><section id=\"part9\"><h2>9. End-to-End Case: Doctor–Patient Appointment System</h2>\n<h3>Scenario Requirements (Original English Teaching Adaptation)</h3>\n<blockquote>A community health clinic wants to replace paper schedules and telephone-only booking with an appointment information system. A Patient should be able to search for available consultation periods, request an appointment, view existing appointments, and cancel or reschedule a visit. A Receptionist may perform a booking on a patient's behalf, while a Doctor controls available consultation periods. The system must check the requested period before recording a new booking, reject conflicting time slots, and notify the requester of an accepted appointment. Patient information must remain available only to authorized users. The clinic wants to preserve its staffed reception desk because some patients cannot use an online interface. Analysts must derive use cases from these requirements, construct an Activity Diagram for the booking process, write a detailed Use-Case Description, and perform a walkthrough to verify that both successful and unavailable-slot scenarios are consistently represented across all functional models.</blockquote>\n<h3>Step A: Actors, Business Goals, Use Cases</h3><div style=\"overflow:auto\"><table><tr><th>Source Verb / Goal</th><th>Actor</th><th>Candidate Use Case</th></tr><tr><td>Search for consultation periods</td><td>Patient / Receptionist</td><td>Search Availability</td></tr><tr><td>Request a new consultation</td><td>Patient / Receptionist</td><td>Schedule Appointment</td></tr><tr><td>Cancel or reschedule</td><td>Patient / Receptionist</td><td>Manage Appointment</td></tr><tr><td>Maintain available periods</td><td>Doctor</td><td>Maintain Availability</td></tr><tr><td>Confirm accepted booking</td><td>System response</td><td>Send Confirmation (may be included behavior)</td></tr></table></div>\n<h3>Step B: Conceptual Use-Case Diagram</h3>\n<pre class=\"mermaid\">flowchart LR\\n Patient[\"Patient\"] --- Find([\"Search Availability\"])\\n Patient --- Book([\"Schedule Appointment\"])\\n Patient --- Manage([\"Manage Appointment\"])\\n Receptionist[\"Receptionist\"] --- Book\\n Receptionist --- Manage\\n Doctor[\"Doctor\"] --- Avail([\"Maintain Availability\"])\\n Book -. \"«include»: required checking\" .-> Check([\"Check Availability\"])</pre><details><summary>Mermaid source / 原始碼</summary><pre><code>flowchart LR\\n Patient[\"Patient\"] --- Find([\"Search Availability\"])\\n Patient --- Book([\"Schedule Appointment\"])\\n Patient --- Manage([\"Manage Appointment\"])\\n Receptionist[\"Receptionist\"] --- Book\\n Receptionist --- Manage\\n Doctor[\"Doctor\"] --- Avail([\"Maintain Availability\"])\\n Book -. \"«include»: required checking\" .-> Check([\"Check Availability\"])</code></pre></details>\n<p>Formal UML rendering requires oval nodes within a named Subject boundary and appropriately styled Actor/UML dependency symbols; the Mermaid flowchart gives the labeled interaction semantics.</p>\n<h3>Step C: Schedule Appointment Activity Diagram</h3>\n<pre class=\"mermaid\">flowchart TD\\n I((Start)) --> A[\"Patient enters requested Doctor/Date\"]\\n A --> B[\"System checks availability\"]\\n B --> C{\"Slot available?\"}\\n C -->|\"[yes]\"| D[\"System creates appointment\"]\\n D --> E[\"System confirms appointment\"]\\n E --> F((Finish))\\n C -->|\"[no]\"| X[\"System displays alternative slots\"]\\n X --> Y{\"Retry?\"}\\n Y -->|\"[yes]\"| A\\n Y -->|\"[no]\"| F</pre><details><summary>Mermaid source / 原始碼</summary><pre><code>flowchart TD\\n I((Start)) --> A[\"Patient enters requested Doctor/Date\"]\\n A --> B[\"System checks availability\"]\\n B --> C{\"Slot available?\"}\\n C -->|\"[yes]\"| D[\"System creates appointment\"]\\n D --> E[\"System confirms appointment\"]\\n E --> F((Finish))\\n C -->|\"[no]\"| X[\"System displays alternative slots\"]\\n X --> Y{\"Retry?\"}\\n Y -->|\"[yes]\"| A\\n Y -->|\"[no]\"| F</code></pre></details>\n<h3>Step D: Essential Detailed UCD</h3>\n<div style=\"overflow:auto\"><table><tr><th>Field</th><th>Specification</th></tr><tr><td>ID / Name</td><td>UC-01 Schedule Appointment</td></tr><tr><td>Primary Actor</td><td>Patient</td></tr><tr><td>Stakeholder(s)</td><td>Receptionist; Doctor</td></tr><tr><td>Trigger</td><td>Patient requests a consultation slot</td></tr><tr><td>Precondition</td><td>Patient is authorized to use the booking function</td></tr><tr><td>Success Postcondition</td><td>A valid appointment is stored and confirmed</td></tr><tr><td>Relationships</td><td>Includes availability validation in this modeling choice</td></tr><tr><td>Importance</td><td>High / Must</td></tr></table></div>\n<p><b>Normal Flow:</b> (1) Patient selects doctor/date. (2) System obtains available consultation periods. (3) System validates the requested slot. (4) System creates the appointment. (5) System sends/displays confirmation.</p><p><b>Alternate AF-01:</b> When slot unavailable at Step 3, System displays other available options; Patient chooses another slot or exits. <b>Exception EF-01:</b> When data cannot be saved, System displays failure rather than claiming a confirmed booking.</p>\n<h3>Step E: Check the Eight V&V Rules</h3>\n<div style=\"overflow:auto\"><table><tr><th>Check</th><th>Result</th></tr><tr><td>Each Activity Action appears in UCD</td><td>Match Select/Check/Create/Confirm/Alternatives with UCD steps</td></tr><tr><td>Object nodes in UCD</td><td>Specify requested appointment and consultation period if modeled as object nodes</td></tr><tr><td>Flow sequence</td><td>Check before Create; Confirm after persistence</td></tr><tr><td>One UCD per UC</td><td>UC-01 has exactly one description</td></tr><tr><td>Actors match diagram</td><td>Patient primary; Receptionist as alternate actor if its interaction is modeled</td></tr><tr><td>Stakeholders reflected appropriately</td><td>Doctor may be stakeholder without direct booking participation</td></tr><tr><td>Relationships consistent</td><td>Include availability check only if depicted consistently</td></tr><tr><td>Notation valid</td><td>Correct directions, guards and final nodes</td></tr></table></div>\n<p><b>Modeling decision:</b> The distinction between a standalone Check Availability use case and an internal action depends on scenario boundaries and reuse. Both can be sensible, but the Use Case Diagram, Activity Diagram and UCD must choose one consistent interpretation.</p></section><section id=\"part10\"><h2>10. Professor's Dating Website Case + Building Parcel Exercise</h2>\n<h3>Lecturer's Dating Website Scenario (slides 33–37)</h3><p>Membership required for all site functions. Members can search or browse opposite-sex member profiles based on preferences. A logged-in Member may specify <b>at most five interests and three personality criteria</b>, select <b>up to ten matching members</b>, send online date invitations through the system and view their invitation history. The teaching materials encourage English Use Case naming for consistency with interface and class design.</p>\n<h3>Requirements → User Story</h3><p><b>Descriptive statement (English teaching translation):</b> After logging in, a Member may specify no more than five interest criteria and three personality conditions, select up to ten matching Members, send date invitations through the system, and view invitation records.</p><p><b>User Story:</b> As a registered Member, I want to find compatible members and send online date invitations so that I can connect with people who share my interests.</p>\n<div style=\"overflow:auto\"><table><tr><th>Actor</th><th>Candidate Use Case</th><th>Important Requirement</th></tr><tr><td>Visitor</td><td>Register Membership</td><td>All functions require membership/login</td></tr><tr><td>Member</td><td>Log In</td><td>Access to member features</td></tr><tr><td>Member</td><td>Search Matching Members</td><td>Maximum five interests, three personality criteria</td></tr><tr><td>Member</td><td>Send Date Invitations</td><td>Select at most ten recipients</td></tr><tr><td>Member</td><td>View Invitation History</td><td>Access previous outgoing invitations</td></tr></table></div>\n<h3>Activity Flow: Send Date Invitation</h3>\n<pre class=\"mermaid\">flowchart TD\\n I((Start)) --> L[\"Member logs in\"]\\n L --> K[\"Set interests and personality criteria\"]\\n K --> V{\"Within limits?\"}\\n V -->|\"[no]\"| K\\n V -->|\"[yes]\"| Q[\"System searches matching members\"]\\n Q --> S[\"Member selects recipients\"]\\n S --> M{\"At most 10 recipients?\"}\\n M -->|\"[no]\"| S\\n M -->|\"[yes]\"| N[\"System sends invitations\"]\\n N --> H[\"System records invitation history\"]\\n H --> F((Finish))</pre><details><summary>Mermaid source / 原始碼</summary><pre><code>flowchart TD\\n I((Start)) --> L[\"Member logs in\"]\\n L --> K[\"Set interests and personality criteria\"]\\n K --> V{\"Within limits?\"}\\n V -->|\"[no]\"| K\\n V -->|\"[yes]\"| Q[\"System searches matching members\"]\\n Q --> S[\"Member selects recipients\"]\\n S --> M{\"At most 10 recipients?\"}\\n M -->|\"[no]\"| S\\n M -->|\"[yes]\"| N[\"System sends invitations\"]\\n N --> H[\"System records invitation history\"]\\n H --> F((Finish))</code></pre></details>\n<p><b>UCD:</b> UC-D03 Send Date Invitations. Primary Actor: Member. Trigger: Member selects invitation function. Normal Flow: login → criteria → results → recipients → send → record. Alternate: criteria above limit; more than 10 recipients; no matching members. Each branch must be specified consistently in both Activity Diagram and UCD.</p>\n<h3>Building Parcel Management System (slide 42)</h3><p>The lecturer assigns an independent exercise: create (1) Use-Case Diagram for the Building Parcel Management System, (2) Activity Diagram for <b>Collect Parcel</b>, and (3) UCD for <b>Collect Parcel</b>. The provided slide refers to prior requirements not reproduced on that slide, so the complete official business rules cannot be verified from this chapter alone.</p>\n<p><b>Suggested practice only:</b> Actor Resident requests parcel pickup; Staff checks parcel identity; system records collection and changes package state. Do not label these invented details as the lecturer's official answer unless the earlier case requirements support them.</p></section><section id=\"part11\"><h2>11. Cheat Sheet, Golden Rules & High-Discrimination Quiz</h2>\n<h3>Eight Golden Rules</h3><ol><li>Functional Modeling has THREE artifacts: Use-Case Diagram → Activity Diagram → UCD.</li><li>Use Cases originate from business processes/goals; Actors are ROLES, never personal names.</li><li>«include» arrow: Base → Included; «extend» arrow: Extension → Base.</li><li>Generalization hollow triangle always points to the GENERAL element.</li><li>Decision/Merge handles alternatives; Fork/Join handles concurrency.</li><li>Activity Final stops the whole activity; Flow Final stops only one path.</li><li>One Use Case has exactly one UCD, with normal, sub-, alternative and exception flows.</li><li>Each Activity Action/Object Node, Actor and Relationship must be consistent with its UCD and Use-Case Diagram.</li></ol>\n<h3>Fast Comparison Table</h3><div style=\"overflow:auto\"><table><tr><th>Common Contrast</th><th>A</th><th>B</th></tr><tr><td>Actor vs Stakeholder</td><td>Actor directly interacts with system</td><td>Stakeholder may only be interested/affected</td></tr><tr><td>Use Case vs Activity</td><td>User-facing functional goal</td><td>Step inside a business process</td></tr><tr><td>Include vs Extend</td><td>Required shared behavior</td><td>Conditional/optional extension</td></tr><tr><td>Decision vs Fork</td><td>Mutually exclusive selection</td><td>Parallel execution</td></tr><tr><td>Merge vs Join</td><td>Rejoins alternatives</td><td>Synchronizes concurrent flows</td></tr><tr><td>Activity Final vs Flow Final</td><td>Ends all activity execution</td><td>Ends one execution path</td></tr><tr><td>Essential vs Real UCD</td><td>Business intent / technology independent</td><td>Specific implemented system steps</td></tr><tr><td>Overview vs Detail UCD</td><td>High-level outline</td><td>Detailed event flow</td></tr></table></div>\n<section class=\"quiz\"><h3>Concept Check 1</h3><p><b>A use case called 'Apply Member Discount' is an optional extension of 'Register for Course'. Which direction is correct?</b></p><button onclick=\"lessonAnswer('chapter3.html-1',0,1)\">A. Register → Apply Discount with «extend»</button><button onclick=\"lessonAnswer('chapter3.html-1',1,1)\">B. Apply Discount → Register with «extend»</button><button onclick=\"lessonAnswer('chapter3.html-1',2,1)\">C. Member → Register with «include»</button><button onclick=\"lessonAnswer('chapter3.html-1',3,1)\">D. Apply Discount → Register with Generalization</button><div id=\"fbchapter3.html-1\"></div><span id=\"expchapter3.html-1\" hidden>Correct answer: B. An «extend» arrow originates at the extending use case and targets the base use case. 中文：Extend 是延伸指向基礎；Include 才是基礎指向被引用。</span><details><summary>答案與中英解析</summary><p>An «extend» arrow originates at the extending use case and targets the base use case.</p><p>Extend 是延伸指向基礎；Include 才是基礎指向被引用。</p></details></section>\n<section class=\"quiz\"><h3>Concept Check 2</h3><p><b>Two concurrent branches have been started. Which node should synchronize them, and which final node ends only one path?</b></p><button onclick=\"lessonAnswer('chapter3.html-2',0,1)\">A. Merge and Activity Final</button><button onclick=\"lessonAnswer('chapter3.html-2',1,1)\">B. Join and Flow Final</button><button onclick=\"lessonAnswer('chapter3.html-2',2,1)\">C. Decision and Activity Final</button><button onclick=\"lessonAnswer('chapter3.html-2',3,1)\">D. Fork and Activity Final</button><div id=\"fbchapter3.html-2\"></div><span id=\"expchapter3.html-2\" hidden>Correct answer: B. Join synchronizes concurrent paths; a Flow Final ends a single active flow without ending the entire activity. 中文：Join 同步平行路徑；Flow Final 只結束單一路徑。</span><details><summary>答案與中英解析</summary><p>Join synchronizes concurrent paths; a Flow Final ends a single active flow without ending the entire activity.</p><p>Join 同步平行路徑；Flow Final 只結束單一路徑。</p></details></section>\n<section class=\"quiz\"><h3>Concept Check 3</h3><p><b>Which is a DIRECT cross-model V&V rule from the 2026 lecture?</b></p><button onclick=\"lessonAnswer('chapter3.html-3',0,1)\">A. One UCD may describe all use cases.</button><button onclick=\"lessonAnswer('chapter3.html-3',1,1)\">B. Every action/activity in an Activity Diagram must appear in at least one UCD event.</button><button onclick=\"lessonAnswer('chapter3.html-3',2,1)\">C. Stakeholders must always be represented as actors, even without system interaction.</button><button onclick=\"lessonAnswer('chapter3.html-3',3,1)\">D. The order of UCD steps may differ from activity flows.</button><div id=\"fbchapter3.html-3\"></div><span id=\"expchapter3.html-3\" hidden>Correct answer: B. Slide 31 requires an event in the UCD for each Activity Diagram action/activity and matching ordering. Exactly one UCD is required per use case. 中文：活動圖每個 Action/Activity 在 UCD 至少有對應事件，且順序須一致；每個 UC 恰好一份 UCD。</span><details><summary>答案與中英解析</summary><p>Slide 31 requires an event in the UCD for each Activity Diagram action/activity and matching ordering. Exactly one UCD is required per use case.</p><p>活動圖每個 Action/Activity 在 UCD 至少有對應事件，且順序須一致；每個 UC 恰好一份 UCD。</p></details></section>\n<button onclick=\"lessonMarkDone(3)\">✓ Mark Chapter 3 as reviewed</button> <span id=\"reading3\"></span></section><p class=\"muted\">Source: 2026 Chapter 3: Business Process & Functional Modeling lecture slides, 43 pages; Dennis, Wixom & Tegarden, Systems Analysis and Design with UML, 6th ed. (2015) Chapter 3 cited in slide footer. All Mermaid drawings are reconstructed instructional diagrams rather than copies of copyrighted slide figures. Class registration and dating case constraints originate from slides; clinic example and extended alternatives are labeled teaching adaptations. Slide blanks not independently confirmed are identified in the respective sections.</p>"};
function renderChapters(){let c=DATA.chapters[chapter-1],all=c.topics.map((t,i)=>({...t,i})),matched=all.filter(t=>(t.title+' '+t.definition+' '+t.details+' '+t.zh+' '+t.memorize).toLowerCase().includes(filter.toLowerCase()));return `<div class="sectiontitle"><div><span class="eyebrow" style="color:var(--accent)">LEARNING LIBRARY</span><h2>Ch${chapter} · ${E(c.title)}</h2><p class="muted">${E(c.subtitle)}</p></div></div><div class="toolbar">${DATA.chapters.map(c=>`<button class="btn ${chapter===c.id?'primary':''}" onclick="chapter=${c.id};filter='';render()">Ch${c.id}</button>`).join('')}</div>${chapter<=3?'<div class="full-lesson">'+LESSON_FULL[chapter]+'</div>':'<div class="card" style="padding:16px;margin:16px 0">Chapter '+chapter+' detailed material is not yet available. Continue with the chapter notes below.</div>'}${chapter>=4?`<input class="filter" id="topicSearch" placeholder="⌕ Search terms" value="${E(filter)}" oninput="filter=this.value;renderTopics()"><div class="chapterlayout" style="margin-top:20px"><aside class="side card"><b>Chapter outline</b><div id="outlines">${matched.map(t=>`<a href="#topic-${t.i}">${t.i+1}. ${E(t.title)}</a>`).join('')}</div><hr style="border:0;border-top:1px solid var(--line)"><div class="small muted">${c.topics.filter((t,i)=>state.seen[chapter+'-'+i]).length} / ${c.topics.length} reviewed</div>${bar(c.topics.filter((t,i)=>state.seen[chapter+'-'+i]).length,c.topics.length)}</aside><div id="topics">${topicHtml(matched)}</div></div>`:''}`}function topicHtml(items){return items.map(t=>{let key=chapter+'-'+t.i;return `<article id="topic-${t.i}" class="card topic"><div class="stickybar"><span class="pill">${chapter}.${t.i+1} · Core concept</span><label class="small"><input type="checkbox" ${state.seen[key]?'checked':''} onchange="state.seen['${key}']=this.checked;save();render()"> Reviewed</label></div><h3>${E(t.title)}</h3><p><strong>Definition.</strong> ${E(t.definition)}</p><details><summary>Deep Dive · Theory / Key steps / Comparisons</summary><p>${E(t.details)}</p><div class="cn"><b>中文理解：</b>${E(t.zh)}</div></details><button class="flash" id="flash-${t.i}" onclick="this.innerHTML=this.dataset.back==='1'?'<b>Tap to reveal memory cue ↻</b>':'${E(t.memorize).replaceAll("'","&#39;")}';this.dataset.back=this.dataset.back==='1'?'0':'1'" data-back="0"><b>Tap to reveal memory cue ↻</b></button></article>`}).join('')||'<div class="card">No matching concepts. Try another keyword.</div>'}function renderTopics(){let c=DATA.chapters[chapter-1];let matched=c.topics.map((t,i)=>({...t,i})).filter(t=>(t.title+' '+t.definition+' '+t.details+' '+t.zh+' '+t.memorize).toLowerCase().includes(filter.toLowerCase()));$('topics').innerHTML=topicHtml(matched);$('outlines').innerHTML=matched.map(t=>`<a href="#topic-${t.i}">${t.i+1}. ${E(t.title)}</a>`).join('')}
function pastList(){return DATA.exam.filter(q=>pastMode==='all'||(pastMode==='flag'&&state.flags[q.id])||(pastMode==='wrong'&&state.wrong[q.id])||(pastMode==='unanswered'&&state.pastAnswers[q.id]==null))}function renderPast(){let s=count(),pool=pastList();pastIndex=Math.max(0,Math.min(pastIndex,pool.length-1));let q=pool[pastIndex];return `<div class="sectiontitle"><div><h2>Past Exam · 2024 EXAM 2</h2><div class="muted">原卷 38 個主題題號（部分含多小題）；題幹英文維持原稿，附原始掃描供核對。</div></div><span class="pill">Original archival paper</span></div><div class="grid">${stat('Accuracy',s.rate+'%','Correct / attempted')}${stat('Answered',s.done+'/'+s.total,'Auto-graded T/F + MC')}${stat('Flags',Object.keys(state.flags).filter(x=>state.flags[x]).length,'Bookmarks')}${stat('Wrong answers',Object.keys(state.wrong).filter(x=>state.wrong[x]).length,'For a second attempt')}</div><div class="toolbar"><label>Filter <select onchange="pastMode=this.value;pastIndex=0;render()"><option value="all" ${pastMode==='all'?'selected':''}>All questions</option><option value="unanswered" ${pastMode==='unanswered'?'selected':''}>Unanswered</option><option value="wrong" ${pastMode==='wrong'?'selected':''}>Incorrect</option><option value="flag" ${pastMode==='flag'?'selected':''}>Bookmarked</option></select></label><button class="btn ghost" onclick="showPaper()">View full original paper</button></div>${q?`<section class="card"><div class="stickybar"><div><span class="badge">Q${q.id} · ${E(q.part)}</span> <span class="small muted">Source page ${q.page} · ${q.chapter?'Ch'+q.chapter:'Supplementary design topics'}</span></div><button class="btn" onclick="toggleFlag('${q.id}')">${state.flags[q.id]?'★':'☆'} Flag</button></div><div class="question" style="margin:22px 0">${E(q.question)}</div>${q.options.length?`${q.options.map((o,j)=>`<button class="option ${state.pastAnswers[q.id]===j?(j===q.answer?'correct':'wrong'):''} ${state.pastAnswers[q.id]!=null&&j===q.answer?'correct':''}" ${state.pastAnswers[q.id]!=null?'disabled':''} onclick="answerPast('${q.id}',${j})">${E(o)}</button>`).join('')}${state.pastAnswers[q.id]!=null?`<div class="feedback"><b>${state.pastAnswers[q.id]===q.answer?'✓ Correct!':'✕ Incorrect.'}</b> Answer: ${E(q.options[q.answer])}</div>`:''}`:`<textarea id="essay" placeholder="Type your own answer here. This is practice, not automated grading.">${E(state['essay-'+q.id]||'')}</textarea><div class="toolbar"><button class="btn" onclick="state['essay-${q.id}']=$('essay').value;save();toast('Draft saved')">Save draft</button><button class="btn ghost" onclick="document.getElementById('exp').classList.remove('hide')">Reveal reference points</button></div>`}<details id="exp" ${q.options.length?'':'class="hide"'} ${state.pastAnswers[q.id]!=null?'open':''}><summary>Show bilingual explanation / reference</summary><div class="feedback"><b>Reference answer:</b> ${E(q.options.length?q.options[q.answer]:q.answer)}<p><b>English:</b> ${E(q.en)}</p><p><b>中文解析：</b>${E(q.zh)}</p><div class="small muted">Reference solutions are study annotations, not an official instructor answer key. Some original handwriting is unclear; verify with the scanned page.</div></div></details><div class="stickybar" style="margin-top:22px"><button class="btn" ${pastIndex<=0?'disabled':''} onclick="pastIndex--;render()">← Previous</button><span class="small muted">${pastIndex+1} / ${pool.length}</span><button class="btn primary" ${pastIndex>=pool.length-1?'disabled':''} onclick="pastIndex++;render()">Next →</button></div></section>`:'<div class="card">No questions in this filter.</div>'}<div class="small muted" style="margin-top:16px">重要：考古題 Q22–Q38 的開放問答不作自動評分。少數模糊字詞與手寫批註不具備可靠的逐字辨識，原始影像是最終核對依據。</div>`}function answerPast(id,i){let q=DATA.exam.find(x=>x.id===id);if(state.pastAnswers[id]!=null)return;state.pastAnswers[id]=i;if(i!==q.answer)state.wrong[id]=true;save();render()}function toggleFlag(id){state.flags[id]=!state.flags[id];save();render()}function showPaper(){let h=`<h2>Original source · 113期末考.pdf</h2><p class="muted small">兩頁完整原圖可放大檢查。此處保留手寫與印刷版式，供逐字核對。</p>${DATA.images.map((s,i)=>`<h3>Page ${i+1}</h3><img class="examphoto" src="${s}" alt="Source exam page ${i+1}">`).join('')}`;showModal(h)}
function renderFlags(){let flagged=DATA.exam.filter(q=>state.flags[q.id]||state.wrong[q.id]);return `<div class="sectiontitle"><h2>☆ Mistake Book / Flagged</h2><span class="pill">${flagged.length} items</span></div>${flagged.length?flagged.map(q=>`<div class="card" style="margin-bottom:12px"><div class="small muted">Q${q.id} ${state.wrong[q.id]?'· Incorrect':''} ${state.flags[q.id]?'· Bookmarked':''}</div><b>${E(q.question)}</b><p class="small muted">${E(q.zh)}</p><button class="btn ghost" onclick="pastMode='all';pastIndex=DATA.exam.findIndex(x=>x.id==='${q.id}');navigate('past')">Practice this question</button> <button class="btn" onclick="delete state.wrong['${q.id}'];delete state.flags['${q.id}'];save();render()">Remove from list</button></div>`).join(''):'<div class="card">No mistakes yet. Practice past exam questions to collect tricky topics.</div>'}`}
function answeredMock(){return Object.keys(state.mockAnswers).length}function timeLeft(){return state.mockDeadline==null?state.mockDuration*60:Math.max(0,Math.floor((state.mockDeadline-Date.now())/1000))}function startMock(){state.mockStarted=true;state.mockSubmitted=false;state.mockAnswers={};state.mockWrittenScores={};state.mockDeadline=Date.now()+state.mockDuration*60000;save();render()}function finishMock(){if(!state.mockStarted||state.mockSubmitted)return;let pending=DATA.mock.length-answeredMock();if(pending&&!confirm(`${pending} unanswered items. Submit anyway?`))return;state.mockSubmitted=true;state.mockDeadline=null;save();render()}function chooseMock(id,v){if(state.mockSubmitted)return;state.mockAnswers[id]=v;save();let n=$('mockAnswered');if(n)n.textContent=answeredMock()+'/'+DATA.mock.length}function draftMock(id,v){state.mockAnswers[id]=v;save();let n=$('mockAnswered');if(n)n.textContent=answeredMock()+'/'+DATA.mock.length}function scoreMock(){let mc=DATA.mock.filter(x=>x.type==='choice'),hit=mc.filter(x=>state.mockAnswers[x.id]===x.answer),shorts=DATA.mock.filter(x=>x.type==='short');let by=DATA.chapters.map(c=>{let arr=mc.filter(q=>q.chapter===c.id);return{title:'Ch'+c.id,score:pct(arr.filter(q=>state.mockAnswers[q.id]===q.answer).length,arr.length)}});return{mc:mc.length,hit:hit.length,shorts:shorts.length,by}}
function renderMock(){if(!state.mockStarted)return `<div class="sectiontitle"><h2>Mock Exam Simulator</h2></div><div class="hero"><div><div class="eyebrow">MIDTERM PRACTICE SIMULATOR</div><h1>35 questions · Five chapters</h1><p>30 multiple-choice questions (6 per chapter) + 5 written short answers (1 per chapter). MCQ scoring is automatic. Short answers are self-assessed after submission, with bilingual rubrics.</p></div></div><div class="card" style="margin-top:17px"><h3>Exam setup</h3><label>Exam duration <select id="duration" onchange="state.mockDuration=+this.value;save()"><option value="60" ${state.mockDuration===60?'selected':''}>60 minutes</option><option value="90" ${state.mockDuration===90?'selected':''}>90 minutes</option><option value="120" ${state.mockDuration===120?'selected':''}>120 minutes</option></select></label><p class="muted">Answers and explanations are hidden until submission. Your timer uses an absolute deadline, so page reloads do not restart the exam.</p><button class="btn primary" onclick="startMock()">Start timed exam →</button></div>`;if(state.mockSubmitted)return resultsMock();let remain=timeLeft();return `<div class="sectiontitle"><h2>Live Mock Exam</h2><span class="pill">No spoilers until submitted</span></div><div class="card stickybar"><div><b>⏳ <span id="timer">${clock(remain)}</span></b><div class="small muted">Answered <span id="mockAnswered">${answeredMock()}/${DATA.mock.length}</span></div></div><button class="btn primary" onclick="finishMock()">Submit & Score</button></div><div class="card" style="margin-top:16px">${DATA.mock.map(q=>`<div class="quizq"><div class="small muted">Question ${q.id} / ${DATA.mock.length} · Chapter ${q.chapter} · ${q.type==='choice'?'MCQ':'Short answer'}</div><div class="question" style="margin:8px 0">${E(q.question)}</div>${q.type==='choice'?q.options.map((v,i)=>`<label class="option"><input type="radio" name="mock${q.id}" value="${i}" ${state.mockAnswers[q.id]===i?'checked':''} onchange="chooseMock(${q.id},${i})"> ${E(v)}</label>`).join(''):`<textarea placeholder="Type an English or Chinese answer. Review after submission." oninput="draftMock(${q.id},this.value)">${E(state.mockAnswers[q.id]||'')}</textarea>`}</div>`).join('')}<button class="btn primary" onclick="finishMock()">Submit final answers</button></div>`}
function clock(s){return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function radar(by){let cx=130,cy=125,R=86;let pts=(r)=>by.map((b,i)=>{let a=-Math.PI/2+i*2*Math.PI/by.length;return [cx+Math.cos(a)*r*(b.score/100),cy+Math.sin(a)*r*(b.score/100)]});let grids=[.25,.5,.75,1].map(r=>`<polygon points="${by.map((b,i)=>{let a=-Math.PI/2+i*2*Math.PI/by.length;return (cx+Math.cos(a)*R*r).toFixed(1)+','+(cy+Math.sin(a)*R*r).toFixed(1)}).join(' ')}" fill="none" stroke="var(--line)"/>`).join('');let points=pts(R).map(x=>x.join(',')).join(' ');let labels=by.map((b,i)=>{let a=-Math.PI/2+i*2*Math.PI/by.length;return `<text x="${cx+Math.cos(a)*105}" y="${cy+Math.sin(a)*105}" dominant-baseline="middle" text-anchor="middle" fill="var(--ink)" font-size="12">${b.title}</text>`}).join('');return `<svg viewBox="0 0 260 260" role="img" aria-label="Chapter mastery radar chart" style="max-width:310px;width:100%;display:block;margin:auto">${grids}<polygon points="${points}" fill="#6366f155" stroke="#7774ed" stroke-width="2.5"/>${labels}</svg>`}function resultsMock(){let sc=scoreMock();return `<div class="sectiontitle"><h2>Your exam report</h2><button class="btn" onclick="if(confirm('Start a new attempt? Previous mock answers will be replaced.')){state.mockStarted=false;state.mockSubmitted=false;state.mockAnswers={};save();render()}">New mock exam</button></div><div class="grid">${stat('MCQ score',sc.hit+'/'+sc.mc,pct(sc.hit,sc.mc)+'% correct')}${stat('Written responses',Object.keys(state.mockAnswers).filter(k=>+k>30).length+'/'+sc.shorts,'Self-grade below')}${stat('Accuracy',pct(sc.hit,sc.mc)+'%','Auto-graded section')}${stat('Coverage','5 chapters','6 MC + 1 written each')}</div><div class="layout2" style="margin-top:16px"><div class="card"><h3>Chapter mastery · Radar + Bar</h3>${radar(sc.by)}<div class="bars">${sc.by.map(b=>`<div class="baritem"><b>${b.score}%</b><i style="height:${Math.max(4,1.3*b.score)}px"></i>${b.title}</div>`).join('')}</div><p class="small muted">Based on MCQ only; written grading is manual.</p></div><div class="card"><h3>Revision roadmap</h3>${[...sc.by].sort((a,b)=>a.score-b.score).map(b=>`<div style="margin:8px 0"><b>${b.title}</b> · ${b.score}% ${bar(b.score,100)}</div>`).join('')}</div></div><div class="sectiontitle"><h2>Answer review & correction guide</h2></div>${DATA.mock.map(q=>{let v=state.mockAnswers[q.id],good=v===q.answer;return `<div class="card" style="margin-bottom:11px"><div class="small muted">Q${q.id} · Ch${q.chapter}</div><b>${E(q.question)}</b><p>${q.type==='choice'?`Your answer: ${v==null?'(blank)':E(q.options[v])} · <span style="color:${good?'var(--good)':'var(--bad)'}">${good?'✓ Correct':'✕ Incorrect'}</span><div>Correct: ${E(q.options[q.answer])}</div>`:`<b>Your written answer:</b> ${E(v||'(blank)')}<br><b>Rubric / Model:</b> ${E(q.answer)}`}</p><details><summary>Bilingual explanation & revision guide</summary><p><b>English:</b> ${E(q.en)}</p><p><b>中文：</b>${E(q.zh)}</p></details>${q.type==='short'?`<label>Self-assessment <select onchange="state.mockWrittenScores[${q.id}]=+this.value;save()"><option value="0">Not yet / 0</option><option value="1" ${state.mockWrittenScores[q.id]===1?'selected':''}>Partially correct / 1</option><option value="2" ${state.mockWrittenScores[q.id]===2?'selected':''}>Meets rubric / 2</option></select></label>`:''}</div>`}).join('')}`}
function cheats(){return `<table class="cheattable"><thead><tr><th>Chapter</th><th>Key contrast / core reminders</th></tr></thead><tbody>${DATA.chapters.map(c=>`<tr><td><b>Ch${c.id}</b><div class="muted">${E(c.title)}</div></td><td>${c.topics.map(t=>`<div style="margin-bottom:7px"><b>${E(t.title)}:</b> ${E(t.memorize)}<div class="muted">${E(t.zh)}</div></div>`).join('')}</td></tr>`).join('')}</tbody></table>`}function showModal(h){$('cheatContent').innerHTML=h;$('cheatModal').classList.add('open')}function render(){let app=$('app');app.innerHTML=tab==='home'?renderHome():tab==='chapters'?renderChapters():renderMock();if(tab==='home')renderQuick();if(tab==='chapters'&&chapter<=3)renderLessonDiagrams()}$('cheatBtn').onclick=()=>$('cheatModal').classList.add('open');$('closeCheat').onclick=()=>{$('cheatModal').classList.remove('open');$('cheatContent').innerHTML=cheats()};$('cheatModal').onclick=e=>{if(e.target===$('cheatModal')){$('cheatModal').classList.remove('open');$('cheatContent').innerHTML=cheats()}};$('printCheat').onclick=()=>print();$('themeBtn').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';document.body.classList.toggle('dark',state.theme==='dark');$('themeBtn').textContent=state.theme==='dark'?'☀':'☾';save()};document.body.classList.toggle('dark',state.theme==='dark');$('themeBtn').textContent=state.theme==='dark'?'☀':'☾';$('cheatContent').innerHTML=cheats();newQuick();render();setInterval(()=>{if(tab==='mock'&&state.mockStarted&&!state.mockSubmitted&&state.mockDeadline){let s=timeLeft();let el=$('timer');if(el)el.textContent=clock(s);if(!s){state.mockSubmitted=true;state.mockDeadline=null;save();render();toast('Exam time is over. Answers submitted.')}}},1000);
