"作業要求學生為 **Collect Parcel（領取包裹）**使用案例製作（1）**CRC Cards** 和（2）**Class Diagram（類別圖）**。投影片引用先前的功能模型需求，本章並未全部重複列出。"],["Illustrative starting candidates: Resident","**練習用候選類別**包含 Resident、Parcel、FrontDeskStaff 和 CollectionRecord。可能職責包含核對身分、查找包裹、記錄交付與更新包裹狀態。這些是假設範例，不是已確認的官方解答。正式畫圖前應先取得先前案例的完整需求與 UCD。"],["Multiplicity at the Appointment end","寫在 Appointment 那一端的**多重性**表示每名 Student 對應幾筆 Appointment；寫在 Student 端的多重性則表示每筆 Appointment 對應幾位 Student。"],["Which is the correct sequence","題目：教授以使用案例為驅動的**七步驟類別圖繪製流程**，正確順序為何？"],["Slide 32 gives the CRC-first","教授第 32 頁列出從 CRC 開始的七步驟，並要求進行檢查、參考設計模式以及模型驗證。"],["Which statement about a superclass","題目：下列關於**父類別（Superclass）**與**物件圖（Object Diagram）**的敘述，哪一項正確？"],["An Object Diagram instantiates","**物件圖（Object Diagram）**呈現某一時刻實際類別實例的屬性值及物件連結；父類別也可以是具體類別，不一定是抽象類別。"],["The textbook's Make Old Patient","課本的 **Make Old Patient Appt（為舊病人安排預約）**例子揭露一些隱藏假設，例如病人第一次聯絡時，請求如何傳給櫃檯人員。角色扮演小組必須釐清誰接收及處理各則訊息。這個四步驟子程序是教授完整七步驟 CRC 到類別圖流程的一部分，而不是替代整個流程。"],["The textbook instantiates Patient","課本建立 Patient、Appointment、Doctor 和 Symptom 的物件實例。檢查實際連結與屬性值後，分析師可能發現預約原因應參照 Symptom，而不是放在沒有充分關係的 Patient 屬性中。這是**類別圖 → 物件圖 → 修正類別圖**的示範。"],["Source: Textbook Ch5","**來源：**課本第五章有關 CRC 卡角色扮演、物件圖，以及結構模型驗證與確認的內容。此處為摘要說明，不是逐字重製原書。"],["Primary source: 2026 Chapter 4","**主要來源：**陳仲儼教授 2026 年第四章結構模型投影片（共 53 頁），特別包括第 11–19 頁的 CRC 識別與角色扮演、第 20–31 頁的類別圖符號與多重性、第 32 頁的七步驟、第 36–41 頁的物件圖及 V&V、第 42–51 頁的教學案例。另參考 Dennis、Wixom、Tegarden《Systems Analysis and Design with UML》第六版相關課本章節；學生投影片未填的術語及未重製的課本 V&V 規則，與教學推論分開標示。"]],"5":[["Sequence Diagram:","**循序圖（Sequence Diagram）**依時間先後表示參與者與物件的訊息互動。**生命線（Lifeline）**表示參與互動的個體，訊息箭頭則表示彼此傳送的呼叫或回應。"],["State Machine Diagram:","**狀態機圖（State Machine Diagram）**追蹤單一物件隨事件或條件而產生的狀態變化，重點是物件生命週期，不是多個物件間的對話。"],["Behavioral Modeling: Dynamic","**行為模型（Behavioral Modeling）**動態描述互動物件如何合作完成使用案例，以及重要業務物件在生命週期中如何改變狀態。兩大模型類型是**互動圖（Interaction Diagrams）**與**行為狀態機（Behavioral State Machines）**。教授特別強調行為建模需要反覆修正，並可能促使功能模型和結構模型改變。"],["The 2026 slides identify two UML","2026 投影片列出兩種 UML **互動圖（Interaction Diagrams）**：（1）**循序圖（Sequence Diagram）**，重視時間與先後順序；（2）**溝通圖（Communication Diagram）**，重視連結物件間的訊息流動模式。第 7 頁說明指定課本未收錄溝通圖，因此相關比較及符號範例採用課堂投影片與標準 UML 解釋，不冒充缺少的課本內容。"],["Slide 6 uses a Java-style","第 6 頁使用 Java 風格的 Student–Course 範例：**Student.registerCourse(Course c)** 呼叫 **c.add(stu_ID)**，接著取得回傳的布林值。在這次互動中，Student 發送**呼叫訊息（Call Message）**，Course 提供**回傳訊息（Return Message）**。發送端的類別不必自己實作接收端的操作；操作應由接收物件負責。"],["Semantic rules: A solid arrow","符號規則：**實線箭頭**表示呼叫，**虛線箭頭**表示回傳。正式 UML 中，同步呼叫一般使用實心箭頭，非同步訊號一般使用開放式箭頭。Mermaid 只能近似呈現。教授在第 19 頁第 4 步說明，若回傳結果很明顯，可以省略回傳訊息。"],["Formal notation caution: Mermaid","**正式符號提醒：**以編號連線畫出的 Mermaid 流程圖只是教學近似。正式 UML **溝通圖（Communication Diagram）**考試必須依課堂規定畫出物件、連結、方向正確的訊息與順序編號。"],["Generic Sequence Diagram: Can","**一般型循序圖（Generic Sequence Diagram）**可以描述一個 Use Case 的多條路徑，常利用 alt、opt 或 loop 片段。**實例型循序圖（Instance Sequence Diagram）**則只描述單一具體情境，也就是某個 Use Case 的一條路徑。教授第 8 頁明確表示本課程使用實例型循序圖，因此題目要求畫借書正常流程時，應專注於指定流程，而非把所有可能路徑畫進一張龐大的圖。"],["An Execution Occurrence is not","**執行區段（Execution Occurrence）**與**生命線（Lifeline）**不同。生命線表示參與者存在的時間，執行區段只標出正在執行操作的期間。回傳結果也不同於發送新的業務請求；教授第 10–11 頁以執行框說明這些差異。"],["Official 2026 slide 19 SOP","教授第 19 頁的六步驟 **SOP**：（1）設定情境；（2）找出使用案例情境中互動的參與者與物件；（3）為每個物件設定生命線；（4）加入訊息；（5）加入執行區段；（6）驗證循序圖。第 20 頁另外把第 1 步展開為四項檢查。"],["Lecture pp.23–32 walks","教授第 23–32 頁從**圖書館館藏管理系統**的 Borrow Books 使用案例描述開始，接著討論候選類別、使用案例層級的類別圖、循序圖、新增業務資訊與修正後的類別圖。這點非常重要：**行為模型可能發現結構模型遺漏的部分**。"],["Exam insight: A new message","**考試重點：**新訊息（例如 recordCheckout()）可能代表類別圖缺少狀態或交易資料，因此**循序圖與類別圖之間需要雙向檢查與修正**。"],["Program order should reflect","程式的執行順序應與訊息的時間順序一致。這裡只是示範相同互動未來如何轉成方法呼叫；**分析階段**的 UML 建模並不要求一定要寫 Java 程式。"],["CRUDE = Create, Read","**CRUDE** 分別代表 **Create（建立）**、**Read（讀取）**、**Update（更新）**、**Delete（刪除）**、**Execute（執行）**。教授第 33 頁明確定義這五項，並說明 **CRUDE Matrix（矩陣）**可辨認或驗證物件間的協作。它強調全系統互動的概觀，補充針對單一情境的循序圖。"],["How to read a matrix","**矩陣讀法：**列（Row）是發起互動的角色或類別，欄（Column）是被操作的目標類別，儲存格表示允許或需要的互動。空格代表在這個範圍內沒有畫出協作，不代表該類別永遠不可能參與其他 Use Case。"],["Exam trap: A class with no links","**考試陷阱：**如果某個類別在特定矩陣中沒有連結，應先調查，而不是直接刪除。要確認其他 Use Case 是否仍需要這個類別。"],["Behavioral State Machine: A dynamic","**行為狀態機（Behavioral State Machine）**是動態模型，描述特定物件在生命週期中如何因事件改變狀態。狀態機圖聚焦**一個重要業務物件的狀態**，不是所有參與者的訊息順序。適合用於行為會隨狀態改變的類別。"],["Examples: reserve()","例如 **reserve() [slotAvailable] / markReserved()** 與 **cancel() [beforeDeadline] / releaseSlot()**，方括號內是轉換的**守衛條件（Guard）**。實際守衛條件應依真實業務規則決定，不能只靠直覺。"],["Lecture p.40 asks which state creates","第 40 頁詢問汽車租賃會員狀態機何處產生**黑洞（Black Hole）**。這是指模型可以進入某狀態，但按既定規則無法再經有效轉移離開，而業務本來應該還有後續行為。可能是缺少事件、誤解生命週期條件，或它本來就應是終止狀態；要區分模型錯誤與合法的最終狀態。"],["Notice: A status such as Cancelled","注意 **Cancelled（已取消）**描述的是 Appointment 的狀態；**Cancel Appointment（取消預約）**是 Use Case。沒有語意分析，就不能把使用案例名稱直接當成狀態。"],["Scenario: Customers deposit NT$10,000","**會員情境：**顧客繳交新臺幣 10,000 元成為一般會員。一般會員第二次租車時升為銀級；銀級會員累積五次租車升為金級。金級會員連續六個月未租車會降為銀級；損壞汽車的會員會被凍結六個月、期間不能租車，之後回到一般會員；一般會員超過三年未租車會失去會員資格，必須重新申請。"],["Scope caveats: The slide describes","**範圍提醒：**投影片描述會員升級與凍結，但沒有定義所有次數重置規則、帳單例外或每一種狀態的轉換。因此狀態圖只能依明確敘述繪製，不能把自行猜測的轉移當成教授提供的官方規則。"],["After checking the model, ask","檢查模型時，應確認每個非終止狀態未來是否仍有可達的轉移。Expired（到期）對目前的 Membership 物件可以是合理的終止狀態，但業務允許顧客重新申請會員，這可能代表建立新的會員物件，而非重新啟動舊物件。"],["V&V: Every message's receiver","**驗證與確認（V&V）**：每筆訊息的接收端都應有對應操作，Appointment 的狀態變化也必須反映在狀態資料中。若系統必須在同時提出多筆預約時避免重複預約，後續設計需要適當的原子操作與並行控制，但那超出分析層級圖形的範圍。"],["As in Chapters 3–4","延續第三、四章的**交友網站案例**：使用者須具備會員資格並登入，可以瀏覽配對對象，且邀請會在線上發送。教授展示 UCD、使用案例層級類別圖、循序圖及 Invitation（邀請）的狀態機，並詢問未來系統應把狀態值存在哪裡，因此結構模型應為 Invitation 加入適當的生命週期狀態屬性。"],["Use the Borrow Books UCD","使用 **Borrow Books 的 UCD** 建立實例型循序圖，並與使用案例層級類別圖比較互動類別，評估借閱紀錄是否需要交易類別或其他資訊。**CRUDE** 可呈現整個系統的協作，包括缺乏有意義互動、值得調查的類別。"],["Task: For Collect Parcel","**練習題：**針對 Collect Parcel（領取包裹），繪製（1）循序圖及（2）重要物件的行為狀態機。可能適合追蹤的類別為 **Parcel（包裹）**，因為它可能有已收到、待領取與已領取等狀態。實際事件與守衛條件必須由前面章節的需求決定，不能自行當作官方答案。"],["Source boundary: This clinic scenario","**來源界線：**這個診所情境是根據課程概念自行編寫的完整範例。教授第 23–32 頁則使用官方的圖書館館藏管理及 Borrow Books 案例；這兩個來源會在本章分開分析。"],["Official cases: Slide 34 uses","**官方案例：**第 34 頁是校園住宿系統，包括公寓屋主、學生、職員與公寓；第 35 頁以圖書館館藏管理系統展示全系統 **CRUDE Matrix**，並問哪些類別可能完全沒有協作。學生版圖片無法完全轉成文字，所以此處的 Parcel 矩陣明確標示為示例替代品，不是假裝逐格轉錄官方矩陣。"],["This is an original worked teaching","這是符合課堂概念的原創教學案例，不是教授的診所圖形原稿，也不是已提供的官方標準答案。"],["Important caveat: The names of specific","**重要提醒：**上方 Invitation 的具體狀態名稱是教學提案；可擷取為文字的投影片並沒有逐一列出圖片中的狀態名稱。如果要重現教授原例，請對照投影片中的狀態機圖片。"],["Actors: Apartment Owner","**參與者（Actors）**包含公寓屋主、學生與職員；**結構物件**包括公寓屋主與公寓。練習題要判斷哪些建立、讀取、更新、刪除與執行操作被允許。官方矩陣包含屋主／職員的建立或刪除權限，以及學生的讀取互動，但不是每個儲存格都能從圖片精確轉錄。"],["Practice assumption: These three Parcel","**練習假設：**Parcel 的三種狀態只是學習用模型，並非已確認的課本或投影片圖形。正式評分時，應以實際的使用案例描述與類別圖為依據。"],["The available slides show diagrams","提供的學生版投影片有些圖表是圖片，也包含空白欄位。接下來兩張圖是為解釋推理而繪製，並非把投影片中的 6-15 或 6-19 圖逐字或逐線重製。"],["Lecture p.42 assigns students","教授第 42 頁指定學生閱讀課本第 182 頁的行為模型 **V&V** 與功能－行為交叉檢查，以及第 183 頁的結構－行為交叉檢查。當時提供的五份課本 PDF 中並沒有對應的行為模型章節，所以以下規則是依投影片整合的教學檢查，不能假稱直接引用了未提供的課本頁面。"],["A student is asked for a Sequence Diagram","題目：學生要針對 **Borrow Books（借書）**的主要正常情境畫 **Sequence Diagram（循序圖）**，哪種作答最符合教授規定？"],["Slide 8 says the course uses Instance","教授第 8 頁指出本課程採用**實例型循序圖（Instance Sequence Diagram）**，通常聚焦選定使用案例的主要正常流程。"],["An object reaches a nonterminal","題目：一個物件進入某個非終止狀態後，已無有效的外出轉移，但業務實際上還需要繼續進行。最可能出現哪個建模問題？"],["The diagram may contain an unintended","此圖可能產生非預期的**黑洞／死路狀態（Black Hole / Dead-end State）**。應檢查是否遺漏事件或守衛條件，以及該狀態究竟應不應是最終狀態。"],["Primary verified material:","**已核對的主要來源：**陳仲儼教授 2026 年第五章行為模型投影片（共 50 頁），尤其是第 4–8、10–11、19–20、23–35、36–42、43–49 頁。投影片引用 Dennis、Wixom、Tegarden《Systems Analysis and Design with UML》第六版，以及行為模型 V&V 所需的課本頁碼。本區部分案例擴充與 Mermaid 圖形屬教學改編，不應視為教授原始解答。"]]};
function fullBilingual(html,ch){const rules=FULL_TRANSLATION_PARAGRAPHS[ch]||[];return html.replace(/(<p\b[^>]*>)([\s\S]*?)(<\/p>)/gi,(whole,open,body,close)=>{let plain=body.replace(/<[^>]*>/g,' ').trim();let item=rules.find(([match])=>plain.toLowerCase().includes(match.toLowerCase()));if(!item)return whole;let translated=item[1].replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');return open+body+close+'<div class="cn" style="padding:12px 14px;margin:3px 0 18px;background:rgba(128,128,128,.07);border-left:3px solid var(--accent);border-radius:8px"><b>繁體中文完整翻譯</b><p style="margin:8px 0 0">'+translated+'</p></div>'})}
const CHAPTER_VOCAB={"1":[["SDLC","系統開發生命週期"],["Planning","規劃"],["Analysis","分析"],["Design","設計"],["Implementation","實作與導入"],["Feasibility","可行性"],["Business Value","商業價值"],["Stakeholder","利害關係人"],["Deliverable","交付成果"],["Waterfall","瀑布式開發"],["Prototyping","原型開發"],["Iteration","迭代"],["Incremental","增量式"],["Agile","敏捷式開發"],["Scrum","敏捷開發框架"],["Sprint","短週期衝刺"],["DevOps","開發與維運整合"],["Encapsulation","封裝"],["Inheritance","繼承"],["Polymorphism","多型"],["Unified Process","統一軟體開發流程"],["Verification","驗證是否符合規格"],["Validation","確認是否符合使用者需求"]],"2":[["Requirements Determination","需求確認"],["Requirement","需求"],["Elicitation","需求引導與蒐集"],["Functional Requirement","功能性需求"],["Non-functional Requirement","非功能性需求"],["Interview","訪談"],["Observation","觀察法"],["Document Analysis","文件分析"],["Questionnaire","問卷"],["JAD","聯合應用開發會議"],["Root Cause","根本原因"],["As-Is","現況"],["To-Be","改善後流程"],["Traceability","可追溯性"],["Consistency","一致性"],["Completeness","完整性"],["Verifiable","可驗證的"],["Measurable","可量測的"],["Constraint","限制條件"],["Assumption","假設"],["Acceptance Criteria","驗收準則"],["Story Card","需求故事卡"],["Task List","工作清單"]],"3":[["Functional Modeling","功能模型"],["Use Case","使用案例"],["Actor","參與者"],["System Boundary","系統邊界"],["Include","包含關係"],["Extend","延伸關係"],["Generalization","一般化與繼承"],["Scenario","情境"],["Trigger","觸發事件"],["Precondition","前置條件"],["Postcondition","後置條件"],["Normal Flow","正常流程"],["Alternative Flow","替代流程"],["Exception Flow","例外流程"],["Activity Diagram","活動圖"],["Initial Node","初始節點"],["Final Node","終止節點"],["Decision","決策分支"],["Merge","合併節點"],["Fork","平行分岔"],["Join","平行同步"],["Guard","守衛條件"],["Swimlane","泳道"],["Walkthrough","逐步檢查"]],"4":[["Structural Modeling","結構模型"],["Class Diagram","類別圖"],["Class","類別"],["Object","物件"],["Attribute","屬性"],["Operation","操作與方法"],["Responsibility","職責"],["Collaborator","協作者"],["CRC Card","類別責任協作卡"],["Association","關聯"],["Aggregation","聚合"],["Composition","組合"],["Multiplicity","多重性"],["Cardinality","基數"],["Generalization","一般化"],["Inheritance","繼承"],["Visibility","可見性"],["Public","公開的"],["Private","私有的"],["Protected","受保護的"],["Boundary Class","邊界類別"],["Control Class","控制類別"],["Entity Class","實體類別"],["Dependency","依賴關係"],["Cohesion","內聚性"],["Coupling","耦合度"]],"5":[["Behavioral Modeling","行為模型"],["Sequence Diagram","循序圖"],["Communication Diagram","溝通圖"],["Interaction Diagram","互動圖"],["Lifeline","生命線"],["Message","訊息"],["Synchronous Message","同步訊息"],["Asynchronous Message","非同步訊息"],["Return Message","回傳訊息"],["Activation","執行區段"],["Combined Fragment","組合片段"],["Alternative","替代分支"],["Optional","可選分支"],["Loop","迴圈"],["Guard","守衛條件"],["State Machine","狀態機"],["State","狀態"],["Transition","狀態轉移"],["Event","事件"],["Initial State","初始狀態"],["Final State","結束狀態"],["Pseudocode","虛擬碼"],["CRUDE Matrix","建立讀取更新刪除執行矩陣"],["Consistency","一致性"],["Traceability","可追溯性"],["Walkthrough","逐步檢查"]]};
function vocabularyPanel(ch){let words=[...(CHAPTER_VOCAB[ch]||[]),...(EXTRA_VOCAB[ch]||[])];return '<details class="card" style="margin:16px 0;padding:18px"><summary style="cursor:pointer;font-weight:700">📖 重要英文詞彙對照（'+words.length+' 個）｜點擊展開</summary><p class="small muted">依本章英文教材整理。內文首次出現的常見術語也會附中文意思。</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px">'+words.map(([en,zh])=>'<div style="padding:8px 10px;border:1px solid var(--line);border-radius:8px"><b>'+en+'</b><div class="small muted">'+zh+'</div></div>').join('')+'</div></details>'}
function enrichVocabulary(html,ch){let words=[...(CHAPTER_VOCAB[ch]||[]),...(EXTRA_VOCAB[ch]||[])].sort((a,b)=>b[0].length-a[0].length);let done=new Set();return html.replace(/(<(?:p|li|td)\b[^>]*>)([\s\S]*?)(<\/(?:p|li|td)>)/gi,(all,open,body,close)=>{let parts=body.split(/(<[^>]*>)/g);for(let i=0;i<parts.length;i++){if(parts[i].startsWith('<'))continue;for(let [en,zh] of words){if(done.has(en))continue;let text=parts[i],lower=text.toLowerCase(),needle=en.toLowerCase(),idx=lower.indexOf(needle);if(idx<0)continue;let before=text[idx-1]||'',after=text[idx+needle.length]||'';if(/[a-z]/i.test(before)||/[a-z]/i.test(after))continue;parts[i]=text.slice(0,idx)+'<strong style="border-bottom:1px dotted var(--accent)" title="'+zh+'">'+text.slice(idx,idx+en.length)+'</strong><small style="color:var(--accent)">（'+zh+'）</small>'+text.slice(idx+en.length);done.add(en)}}return open+parts.join('')+close})}
const INLINE_ZH_RULES=[["SDLC|Life Cycle|Four Fundamental|Planning:|Analysis:|Design:|Implementation:","這一段在說明系統開發的階段與各階段的核心問題。閱讀時請區分「為什麼要做、要做什麼、如何設計、如何上線」，並記住各階段的產出。"],["Waterfall|Parallel Development|V-Model|Phased Development|Prototyp|Agile|Scrum|XP|DevOps|Methodolog","這裡比較不同開發方法的流程、回饋速度與適用情境。考試通常不只問定義，還會給一個需求變動或時程限制的情境，要你選方法並說明理由。"],["Object-Oriented|OOAD|Encapsulation|Information Hiding|Inheritance|Generalization|Abstraction|Polymorphism|Overriding|Dynamic Binding","這一段是物件導向概念：注意類別如何封裝資料與行為、繼承與覆寫如何影響責任分配。不要把「隱藏內部實作」和「完全不能存取」混為一談。"],["Unified Process|Iteration|Inception|Elaboration|Construction|Transition","重點是反覆迭代、逐步細化模型，不是一次把所有需求與設計定死。可用每次迭代的目標與交付物來理解。"],["UML|Modeling SOP|Modeling Guide|Traceability|Cross-Model|Walkthrough|Verification|Validation|V&V","模型要彼此一致：需求、流程、類別與互動圖的名稱及行為都應能互相追溯。作圖題請先確認情境，再檢查符號、方向與完整性。"],["Feasibility|System Request|Project Initiation|Business Value|Business Case|Project Role|Analyst Skill","這裡聚焦專案是否值得做、誰負責什麼，以及如何把業務問題轉成可執行的專案。要分清楚商業價值、可行性與系統功能。"],["Requirement|Stakeholder|Interview|Questionnaire|Observation|Document Analysis|JAD|Elicitation","需求蒐集的重點是確認真正的使用者需要，而非直接照單全收解決方案。請比較各蒐集方法能得到什麼證據、各有什麼限制。"],["Functional|Nonfunctional|Non-functional|Quality Attribute|VT4C|Measurab","功能需求說明系統做什麼；非功能需求說明效能、安全、可用性等品質限制。模糊形容詞要改成可觀察或可量測的條件。"],["Root Cause|Problem Analysis|As-Is|To-Be|Concept Map|Story Card|Task List","先理解現況（As-Is）與真正問題，再描述改善後的流程（To-Be）。表面症狀不等於根本原因，需求也不等於待辦清單。"],["Use Case|Use-Case|Actor|Include|Extend|System Boundary|Scenario","Use Case 從外部角色看系統提供的服務。請注意 Actor、系統邊界與關係箭頭；include 通常是必要共用流程，extend 是條件式擴充。"],["Activity Diagram|Decision|Merge|Fork|Join|Swimlane|Control Flow","Activity Diagram 描述工作流程。Decision／Merge 處理條件分支；Fork／Join 處理平行與同步。考試畫圖要檢查起終點及每條分支。"],["Class Diagram|CRC|Responsibilit|Collaborat|Association|Aggregation|Composition|Multiplicity|Attribute|Operation","Class Diagram 表示靜態結構；CRC 用來分配類別責任與協作者。畫關聯時要檢查多重性、關係類型，以及操作是否放在負責的類別。"],["Sequence Diagram|Interaction Diagram|Communication Diagram|Message|Lifeline|Activation|Frame|alt / opt / loop","Sequence Diagram 的時間由上往下，重點是訊息的先後與發送／接收對象。alt、opt、loop 分別表達條件分支、可選流程與重複。"],["State Machine|State Diagram|State Transition|Guard|Event|Statechart","狀態圖追蹤單一物件如何因事件而改變狀態。State 是持續情況，Transition 是狀態轉換，Guard 是允許轉換的條件。"],["CRUDE|CRUD|Pseudocode|Borrow Books|Clinic|Appointment|Example|Walkthrough","這部分用案例把文字需求轉成模型。讀案例時可逐步追問：誰觸發、資料如何變動、哪個類別負責、各圖是否互相一致。"]];
function addInlineChinese(html,chapter){return html.replace(/(<h[23][^>]*>)([\s\S]*?)(<\/h[23]>)/gi,(whole,open,inner,close)=>{let title=inner.replace(/<[^>]*>/g,' ').replace(/&[^;]+;/g,' ').trim();if(!title||/中文輔助|中文解釋|中文重點/.test(title))return whole;let rule=INLINE_ZH_RULES.find(([pattern])=>new RegExp(pattern,'i').test(title));let msg=rule?rule[1]:'本節請先掌握英文標題所指的核心概念，再對照定義、圖例與操作步驟。考試時要能用自己的話解釋用途，並辨別相近名詞。';return whole+'<div class="cn" style="margin:8px 0 16px;padding:11px 14px;border-left:3px solid var(--accent);border-radius:8px"><b>🇹🇼 中文輔助：</b>'+msg+'</div>'})}
const TEACHER_CH5_SECTION="<section class='card' id='teacher-ch5' style='padding:20px;margin:18px 0;border:1px solid var(--accent)'><div class='eyebrow'>2026 TEACHER EDITION · CH05 · 教授填空與作圖重點</div><h2>Ch5 教師版精華｜Behavioral Modeling（行為模型）</h2><p>**Exam Scope**: Midterm covers <b>Ch1–Ch5</b>, English questions, answers in Chinese or English; question types include T/F, multiple choice, written responses and possible diagrams.</p><p class='cn'><b>期中考公告（教師版 p.2）：</b><b>11/6 18:00–20:30</b>；題目英文，<b>答案可中文或英文</b>；包含是非、選擇、問答及可能的繪圖。圖形格式以課本與投影片為準。<b>禁用鉛筆、3C 設備及翻譯機，違規全卷 0 分</b>。答題與繪圖潦草也不利給分。</p><h3>Introduction（p.5）：三個填空</h3><p><b>Behavioral models describe the internal behavior of an information system.</b></p><p class='cn'><b>行為模型</b>描述資訊系統的<b>內部行為（Internal Behavior）</b>，包含<b>Interaction Diagrams（互動圖）</b>與<b>Behavioral State Machines（行為狀態機）</b>。建立模型是<b>Iterative（迭代式）</b>過程，可能促使其他模型修正。</p><h3>Interaction Diagrams（p.6–8）</h3><p><b>Objects execute methods</b>; a <b>Message</b> is critical; two message contents: <b>method parameter</b> and <b>return</b>. <b>Sequence Diagram</b> emphasizes timing and order; <b>Communication Diagram</b> emphasizes message flow.</p><p class='cn'><b>物件互動</b>藉由呼叫類別的<b>Methods（方法）</b>完成工作；<b>Message（訊息）</b>是關鍵。教師版明列<b>Method Parameter（方法參數）</b>及<b>Return（回傳）</b>；<b>Sequence Diagram（循序圖）</b>強調時間／順序，<b>Communication Diagram（溝通圖）</b>強調訊息流。課本指定部分不包含溝通圖。</p><p><b>Instance Sequence Diagram</b> shows a single scenario, usually the <b>main event flows</b>; all course sequence diagrams are of this kind.</p><p class='cn'>本課程採<b>Instance Sequence Diagram（實例型循序圖）</b>，通常聚焦 UCD 中的<b>主要正常事件流程（Main Event Flows）</b>；與涵蓋多個情境的<b>Generic Sequence Diagram</b>不同。</p><h3>Six Steps to Create a Sequence Diagram（p.19–20）</h3><ol><li><b>Set the context（設定情境）</b>。</li><li><b>Identify actors &amp; objects（找出參與者和物件）</b>。</li><li><b>Set lifelines（建立生命線）</b>。</li><li><b>Add messages（加入帶參數的訊息箭頭）</b>，明顯的回傳值可省略。</li><li><b>Add execution occurrences（加入執行區段）</b>。</li><li><b>Validate（驗證圖形）</b>，確認涵蓋所有相關步驟。</li></ol><p><b>Set the Context</b>: Select a <b>UC</b> → read the <b>major normal flow</b> of its <b>UCD</b> → elaborate a <b>swimlane Activity Diagram</b> if needed → prepare the <b>UC-level Class Diagram</b>.</p><p class='cn'><b>設定情境</b>時，教師版的四項重點是：選一個使用案例、聚焦 UCD 的主要正常流程、必要時用泳道活動圖釐清各活動責任，以及準備該使用案例的類別圖。<b>循序圖完成後，Class Diagram（類別圖）可能需要修改</b>，這是 p.19 的填空答案。</p><h3>Library Borrow Books｜教師版的類別圖修正（p.23–32）</h3><p><b>Sequence Diagram → Revised UC-Level Class Diagram</b>. New transaction class: <b>Checkout</b> with <b>RSV_ID, checkout_date, return_date</b>; additional <b>Publisher</b> class and revised operations such as <b>checkoutBooks()</b> / <b>check_out()</b>.</p><p class='cn'>借書範例從<b>Borrow Books 的 UCD</b>建立循序圖，並發現借出資訊需要保存。教師版最終修正類別圖增加<b>Checkout（借閱紀錄／交易類別）</b>，記錄<b>借閱編號、借出日期、歸還日期</b>；也包含<b>Publisher（出版社）</b>，並修訂相關方法與關聯。注意<b>一開始畫出的類別圖不是最後答案</b>，應以 p.30–32 的修正版為準。</p><h3>CRUDE Analysis（p.33–35）</h3><p><b>CRUDE = Create, Read, Update, Delete, Execute</b>; the matrix is most useful as a <b>system-wide</b> representation.</p><p class='cn'><b>CRUDE</b> 五種操作是<b>建立、讀取、更新、刪除、執行</b>；教師版填空為<b>System-wide（全系統範圍）</b>。矩陣可檢查類別協作，也可發現沒有任何協作的候選類別。沒有連結不代表一定要刪除，仍需依全部使用案例確認。</p><h3>Behavioral State Machines（p.36–41）</h3><p><b>State</b> = a value of object attributes at a point in time; <b>Event</b> = a cause of change; <b>Transition</b> = movement between states. Check for <b>black holes</b> and <b>miracles</b>.</p><p class='cn'><b>State（狀態）</b>描述物件某時刻的屬性狀況；<b>Event（事件）</b>造成變化；<b>Transition（轉移）</b>將物件移到另一狀態。<b>Black Hole（黑洞）</b>是有進入卻沒有合理離開路徑的非終止狀態；<b>Miracle（奇蹟狀態）</b>是有離開路徑卻沒有進入路徑的狀態。教師版 p.40 的汽車租賃會員案例指明<b>Silver Membership（銀級會員）</b>可能存在黑洞。</p><p><b>Five Steps</b>: Set context (<b>system-level CD</b>) → identify states → lay out diagram → add transitions, triggers, actions and guards → validate reachability.</p><p class='cn'>建立狀態機的五步驟：<b>（1）設定情境，準備 System-level Class Diagram（系統層級類別圖）；（2）確認初始、最終和穩定狀態；（3）安排圖形方向；（4）加入狀態轉移、觸發事件、執行動作和守衛條件；（5）驗證所有狀態都可到達。</b>Guard（守衛條件）應互斥，避免轉移條件互相衝突。</p><h3>教師版例題：Invitation State &amp; Parcel（p.43–49）</h3><p>For the dating-site <b>Invitation</b>, cross-check its <b>State Machine</b> with the <b>Class Diagram</b>: where are status values stored?</p><p class='cn'>交友網站的<b>Invitation（邀請）</b>狀態機要求回頭檢查<b>Class Diagram</b>：邀請狀態值要有適當屬性保存。另有<b>Collect Parcel（領取包裹）</b>練習，需畫<b>Sequence Diagram</b>及某重要物件的<b>State Machine</b>；題目沒有直接指定唯一的物件答案，應依情境判斷。</p><p class='small muted'><b>來源：</b>陳仲儼教授 2026 Ch5 教師版 p.2、5–8、19–20、23–41、43–49。英文重要詞彙與填空採教師版；中文解釋、案例判讀為學習輔助。</p></section>";
const CHINESE_STUDY_AIDS={"1":"<section class=\"card\" style=\"margin:18px 0;padding:22px\"><h2>🇹🇼 中文輔助理解｜系統開發流程與方法選擇</h2><p class=\"muted\">保留英文原名，搭配白話解釋與考試判斷提示。這是複習輔助，詳細定義與圖形仍以本章教材為準。</p><div style=\"display:grid;gap:12px\"><div style=\"padding:12px 14px;border:1px solid var(--line);border-radius:12px\"><strong>Systems Analysis and Design</strong><p style=\"margin:7px 0\">系統分析是釐清問題與需求；系統設計是決定如何實現需求。</p><p class=\"small muted\" style=\"margin:0\"><b>考試提醒：</b>Analysis 問 What（要做什麼），Design 問 How（怎麼做）。不要把畫介面當成需求分析。</p></div><div style=\"padding:12px 14px;border:1px solid var(--line);border-radius:12px\"><strong>SDLC</strong><p style=\"margin:7px 0\">系統開發生命週期將工作分成 Planning、Analysis、Design、Implementation。</p><p class=\"small muted\" style=\"margin:0\"><b>考試提醒：</b>記住順序，也要知道每個階段的交付成果。</p></div><div style=\"padding:12px 14px;border:1px solid var(--line);border-radius:12px\"><strong>Waterfall</strong><p style=\"margin:7px 0\">瀑布式偏向階段順序進行，適合需求相對穩定的情況。</p><p class=\"small muted\" style=\"margin:0\"><b>考試提醒：</b>考題若強調「需求變動頻繁」，通常要比較原型法或迭代式方法。</p></div><div style=\"padding:12px 14px;border:1px solid var(--line);border-radius:12px\"><strong>Prototyping</strong><p style=\"margin:7px 0\">先做可供使用者觀看或操作的原型，再根據回饋調整。</p><p class=\"small muted\" style=\"margin:0\"><b>考試提醒：</b>原型的核心是取得 Feedback，不代表一開始就完成正式系統。</p></div><div style=\"padding:12px 14px;border:1px solid var(--line);border-radius:12px\"><strong>Project Feasibility</strong><p style=\"margin:7px 0\">可行性分析評估專案是否值得做、能否完成，包括技術、經濟及組織等面向。</p><p class=\"small muted\" style=\"margin:0\"><b>考試提醒：</b>可行不等於一定獲利，還要看成本、效益與組織接受度。</p></div></div></section>","2":"<section class=\"card\" style=\"margin:18px 0;padding:22px\"><h2>🇹🇼 中文輔助理解｜需求蒐集與品質判斷</h2><p class=\"muted\">保留英文原名，搭配白話解釋與考試判斷提示。這是複習輔助，詳細定義與圖形仍以本章教材為準。</p><div style=\"display:grid;gap:12px\"><div style=\"padding:12px 14px;border:1px solid var(--line);border-radius:12px\"><strong>Requirements Determination</strong><p style=\"margin:7px 0\">找出利害關係人真正需要的功能、限制與業務規則。</p><p class=\"small muted\" style=\"margin:0\"><b>考試提醒：</b>使用者說的解決方法，不一定就是根本需求。</p></div><div style=\"padding:12px 14px;border:1px solid var(--line);border-radius:12px\"><strong>Functional Requirement</strong><p style=\"margin:7px 0\">描述系統必須提供的行為或服務，例如預約、查詢、取消。</p><p class=\"small muted\" style=\"margin:0\"><b>考試提醒：</b>重點是「系統做什麼」。</p></div><div style=\"padding:12px 14px;border:1px solid var(--line);border-radius:12px\"><strong>Non-functional Requirement</strong><p style=\"margin:7px 0\">描述系統運作的品質或限制，例如速度、安全、可靠性。</p><p class=\"small muted\" style=\"margin:0\"><b>考試提醒：</b>「系統要很快」太模糊；「95% 查詢在 2 秒內完成」較可驗證。</p></div><div style=\"padding:12px 14px;border:1px solid var(--line);border-radius:12px\"><strong>Interview / Observation / Document Analysis</strong><p style=\"margin:7px 0\">訪談取得想法；觀察看到實際作業；文件分析掌握既有規則與紀錄。</p><p class=\"small muted\" style=\"margin:0\"><b>考試提醒：</b>三者互補，訪談說法與實際操作不一致時尤其需要交叉確認。</p></div><div style=\"padding:12px 14px;border:1px solid var(--line);border-radius:12px\"><strong>Root Cause Analysis</strong><p style=\"margin:7px 0\">不是只處理表面症狀，而是追問造成問題的真正原因。</p><p class=\"small muted\" style=\"margin:0\"><b>考試提醒：</b>例如排隊久可能源於排班或流程瓶頸，而不只是「人太多」。</p></div></div></section>","3":"<section class=\"card\" style=\"margin:18px 0;padding:22px\"><h2>🇹🇼 中文輔助理解｜功能模型與流程圖判讀</h2><p class=\"muted\">保留英文原名，搭配白話解釋與考試判斷提示。這是複習輔助，詳細定義與圖形仍以本章教材為準。</p><div style=\"display:grid;gap:12px\"><div style=\"padding:12px 14px;border:1px solid var(--line);border-radius:12px\"><strong>Use Case</strong><p style=\"margin:7px 0\">從外部參與者角度描述系統提供的有價值功能。</p><p class=\"small muted\" style=\"margin:0\"><b>考試提醒：</b>Actor 是與系統互動的角色，不一定是某個具體的人。</p></div><div style=\"padding:12px 14px;border:1px solid var(--line);border-radius:12px\"><strong>«include»</strong><p style=\"margin:7px 0\">必要且可重用的共同流程；箭頭指向被包含的 Use Case。</p><p class=\"small muted\" style=\"margin:0\"><b>考試提醒：</b>A include B：執行 A 時必須執行 B。</p></div><div style=\"padding:12px 14px;border:1px solid var(--line);border-radius:12px\"><strong>«extend»</strong><p style=\"margin:7px 0\">在特定條件下額外擴充原本的 Use Case；箭頭指向被擴充者。</p><p class=\"small muted\" style=\"margin:0\"><b>考試提醒：</b>不要把 extend 誤當成「一定執行」。</p></div><div style=\"padding:12px 14px;border:1px solid var(--line);border-radius:12px\"><strong>Activity Diagram</strong><p style=\"margin:7px 0\">呈現活動的控制流程、分支、平行處理與結束。</p><p class=\"small muted\" style=\"margin:0\"><b>考試提醒：</b>Decision/Merge 用於條件分流與匯合；Fork/Join 用於平行工作與同步。</p></div><div style=\"padding:12px 14px;border:1px solid var(--line);border-radius:12px\"><strong>Use-Case Description (UCD)</strong><p style=\"margin:7px 0\">將 Use Case 的觸發條件、前置條件、正常流程與替代流程寫成可檢查的文字。</p><p class=\"small muted\" style=\"margin:0\"><b>考試提醒：</b>畫 Sequence Diagram 前，先挑選 UCD 的某一條具體情境。</p></div></div></section>","4":"<section class=\"card\" style=\"margin:18px 0;padding:22px\"><h2>🇹🇼 中文輔助理解｜結構模型與類別關係</h2><p class=\"muted\">保留英文原名，搭配白話解釋與考試判斷提示。這是複習輔助，詳細定義與圖形仍以本章教材為準。</p><div style=\"display:grid;gap:12px\"><div style=\"padding:12px 14px;border:1px solid var(--line);border-radius:12px\"><strong>Structural Modeling</strong><p style=\"margin:7px 0\">描述系統有哪些類別、資料、責任及彼此關係，屬於較靜態的視角。</p><p class=\"small muted\" style=\"margin:0\"><b>考試提醒：</b>Functional 是做什麼；Structural 是誰負責、保存什麼。</p></div><div style=\"padding:12px 14px;border:1px solid var(--line);border-radius:12px\"><strong>CRC Cards</strong><p style=\"margin:7px 0\">Class–Responsibility–Collaborator，用卡片討論類別的責任與合作對象。</p><p class=\"small muted\" style=\"margin:0\"><b>考試提醒：</b>Responsibility 是該類別應知道或應執行的事，不是把所有功能塞給一個類別。</p></div><div style=\"padding:12px 14px;border:1px solid var(--line);border-radius:12px\"><strong>Class vs Object</strong><p style=\"margin:7px 0\">Class 是類別模板；Object 是某一個實際實例。</p><p class=\"small muted\" style=\"margin:0\"><b>考試提醒：</b>Patient 是類別；patient01:Patient 才是物件實例。</p></div><div style=\"padding:12px 14px;border:1px solid var(--line);border-radius:12px\"><strong>Association / Aggregation / Composition</strong><p style=\"margin:7px 0\">Association 是一般關聯；Aggregation 是較弱的整體部分關係；Composition 表示較強的生命週期依存。</p><p class=\"small muted\" style=\"margin:0\"><b>考試提醒：</b>看到空心菱形與實心菱形時，要判斷部分是否能獨立存在。</p></div><div style=\"padding:12px 14px;border:1px solid var(--line);border-radius:12px\"><strong>Multiplicity</strong><p style=\"margin:7px 0\">描述關係兩端允許連接多少個實例，例如 1、0..1、0..*、1..*。</p><p class=\"small muted\" style=\"margin:0\"><b>考試提醒：</b>數字寫在「被計數的那一端」，不是隨意放在關係線中間。</p></div></div></section>","5":"<section class=\"card\" style=\"margin:18px 0;padding:22px\"><h2>🇹🇼 中文輔助理解｜互動、狀態與跨模型驗證</h2><p class=\"muted\">保留英文原名，搭配白話解釋與考試判斷提示。這是複習輔助，詳細定義與圖形仍以本章教材為準。</p><div style=\"display:grid;gap:12px\"><div style=\"padding:12px 14px;border:1px solid var(--line);border-radius:12px\"><strong>Sequence Diagram</strong><p style=\"margin:7px 0\">描述某個使用情境中，參與者與物件依時間先後傳送哪些訊息。</p><p class=\"small muted\" style=\"margin:0\"><b>考試提醒：</b>時間由上往下；接收訊息的物件應具備對應 Operation。</p></div><div style=\"padding:12px 14px;border:1px solid var(--line);border-radius:12px\"><strong>Communication Diagram</strong><p style=\"margin:7px 0\">強調哪些物件彼此連結、互傳訊息，通常用訊息編號表達順序。</p><p class=\"small muted\" style=\"margin:0\"><b>考試提醒：</b>Sequence 看時間；Communication 看合作網絡。</p></div><div style=\"padding:12px 14px;border:1px solid var(--line);border-radius:12px\"><strong>State Machine Diagram</strong><p style=\"margin:7px 0\">追蹤一個重要物件從建立到結束的狀態變化。</p><p class=\"small muted\" style=\"margin:0\"><b>考試提醒：</b>Requested、Confirmed、Cancelled 是狀態；confirm() 是觸發轉移的事件或操作。</p></div><div style=\"padding:12px 14px;border:1px solid var(--line);border-radius:12px\"><strong>Guard / Transition</strong><p style=\"margin:7px 0\">Transition 是狀態間的箭頭；Guard 是允許轉移的布林條件。</p><p class=\"small muted\" style=\"margin:0\"><b>考試提醒：</b>[available] 和 [unavailable] 是條件，不是兩個新狀態。</p></div><div style=\"padding:12px 14px;border:1px solid var(--line);border-radius:12px\"><strong>CRUDE Matrix</strong><p style=\"margin:7px 0\">Create、Read、Update、Delete、Execute，檢查不同類別間的操作與協作是否完整。</p><p class=\"small muted\" style=\"margin:0\"><b>考試提醒：</b>如果某類別能被讀取卻找不到建立來源，要回頭查需求是否漏掉。</p></div><div style=\"padding:12px 14px;border:1px solid var(--line);border-radius:12px\"><strong>Verification & Validation</strong><p style=\"margin:7px 0\">檢查圖形內部是否一致，以及模型是否真正符合需求。</p><p class=\"small muted\" style=\"margin:0\"><b>考試提醒：</b>Sequence 訊息、Class Operations、State Transitions 與 CRUDE 要互相對得起來。</p></div></div></section>"};
const SOURCE_GUIDES={"1":"<section class=\"card\" id=\"source-integrated-1\"><h2>📖 教材原文對照與理解｜Ch1</h2><p class=\"muted small\">依你上傳的 2026 教授講義整理；原文節錄與中文解釋分開標示，並標出投影片頁碼。這是講義對照，不宣稱是完整教科書逐字稿。</p><details><summary>SDLC: Methodologies</summary><p><b>教材原文：</b> Methodology: a formal approach to conducting the SDLC.</p><p><b>中文理解：</b> 方法論是執行系統開發生命週期的一套正式方法。比較 Waterfall、Parallel、Phased 等方法時，要回到需求是否明確、技術熟悉度、系統複雜度與時程。</p><p class=\"muted small\">來源：Ch1 投影片 p.10；方法比較表請見老師補充區</p></details><details><summary>Characterization of OOIS</summary><p><b>教材原文：</b> Object (instance): instantiation of a class.</p><p><b>中文理解：</b> Class 是類別定義；Object 是由類別建立的實例。搭配 Student joe = new Student() 辨認 class、object 與 method call。</p><p class=\"muted small\">來源：Ch1 投影片 p.22；class 為課堂手寫填答</p></details></section>","2":"<section class=\"card\" id=\"source-integrated-2\"><h2>📖 教材原文對照與理解｜Ch2</h2><p class=\"muted small\">依你上傳的 2026 教授講義整理；原文節錄與中文解釋分開標示，並標出投影片頁碼。這是講義對照，不宣稱是完整教科書逐字稿。</p><details><summary>Requirements Determination</summary><p><b>教材原文：</b> A statement of what the system must do to serve & support the user need.</p><p><b>中文理解：</b> 需求描述系統必須做到的事情。Functional 針對業務流程；Non-functional 針對支援功能所需的品質與限制。</p><p class=\"muted small\">來源：Ch2 投影片 p.3</p></details><details><summary>Interviewing Approaches</summary><p><b>教材原文：</b> Top-down / Bottom-up.</p><p><b>中文理解：</b> Top-down 從概括問題逐步問到具體細節；Bottom-up 從具體問題歸納到較大的議題。講義以訂單處理改善為例。</p><p class=\"muted small\">來源：Ch2 投影片 p.18</p></details></section>","3":"<section class=\"card\" id=\"source-integrated-3\"><h2>📖 教材原文對照與理解｜Ch3</h2><p class=\"muted small\">依你上傳的 2026 教授講義整理；原文節錄與中文解釋分開標示，並標出投影片頁碼。這是講義對照，不宣稱是完整教科書逐字稿。</p><details><summary>Functional Modeling</summary><p><b>教材原文：</b> Use-case diagrams, activity diagrams, & use case descriptions (UCD).</p><p><b>中文理解：</b> 三者分工不同：Use-case diagram 呈現系統功能與外部角色；Activity diagram 呈現業務流程；UCD 詳述事件與條件。應對照同一個需求，不是三份互不相關的圖。</p><p class=\"muted small\">來源：Ch3 投影片 p.2–4</p></details><details><summary>From requirements to models</summary><p><b>教材原文：</b> Model the requirements into functional models.</p><p><b>中文理解：</b> 先從需求辨認 use cases，再描繪業務流程，最後補上使用案例描述。教材留白部分不會自行冒充教師填答。</p><p class=\"muted small\">來源：Ch3 投影片 p.4</p></details></section>","4":"<section class=\"card\" id=\"source-integrated-4\"><h2>📖 教材原文對照與理解｜Ch4</h2><p class=\"muted small\">依你上傳的 2026 教授講義整理；原文節錄與中文解釋分開標示，並標出投影片頁碼。這是講義對照，不宣稱是完整教科書逐字稿。</p><details><summary>Three structural representations</summary><p><b>教材原文：</b> CRC cards, class diagrams, object diagrams.</p><p><b>中文理解：</b> CRC 先釐清責任與合作類別；Class diagram 呈現類別、屬性、方法與關係；Object diagram 顯示特定時刻的實例。</p><p class=\"muted small\">來源：Ch4 投影片 p.3</p></details><details><summary>Structural model consistency</summary><p><b>教材原文：</b> Consistency between functional models and structural models.</p><p><b>中文理解：</b> 畫出的類別與操作應能支持前面 use case 所要求的行為。考試若要跨圖檢查，先問『這個功能由哪個類別負責？』。</p><p class=\"muted small\">來源：Ch4 投影片 p.3</p></details></section>","5":"<section class=\"card\" id=\"source-integrated-5\"><h2>📖 教材原文對照與理解｜Ch5</h2><p class=\"muted small\">依你上傳的 2026 教授講義整理；原文節錄與中文解釋分開標示，並標出投影片頁碼。這是講義對照，不宣稱是完整教科書逐字稿。</p><details><summary>Behavioral modeling artifacts</summary><p><b>教材原文：</b> Communication diagrams, sequence diagrams, & state machines.</p><p><b>中文理解：</b> Sequence diagram 依時間順序看物件傳遞的訊息；State machine 看單一物件在事件下如何改變狀態。講義另介紹 communication diagram。</p><p class=\"muted small\">來源：Ch5 投影片 p.4</p></details><details><summary>CRUDE matrices</summary><p><b>教材原文：</b> Use CRUDE matrices for cross-checking object collaboration.</p><p><b>中文理解：</b> CRUDE 是用來交叉檢查物件間操作與合作的工具，不是另一種取代 sequence diagram 的流程圖。</p><p class=\"muted small\">來源：Ch5 投影片 p.4</p></details></section>"};
const PLAIN_GUIDES={"1":"<section class=\"card\" id=\"plain-guide-1\"><h2>💡 觀念白話講解｜Ch1</h2><p class=\"muted small\">補充理解用，原本老師的英文定義、圖表與課堂筆記保持不變。點選不懂的觀念展開說明。</p><details><summary>Waterfall vs. Phased</summary><p>Waterfall 像照著完整施工圖一次蓋好房子；Phased 則先完成可使用的一部分，再逐步交付其他功能。老師的 ERP 例題選 Phased，重點是可以分階段導入。</p></details><details><summary>Class vs. Object</summary><p>Class 是設計圖，Object 是依設計圖建立的實體。Student 是類別，joe = new Student() 建立的 joe 才是物件。</p></details><details><summary>Inheritance vs. Polymorphism</summary><p>Inheritance 是子類別繼承父類別的資料與方法；Polymorphism 是透過相同的父類別參照呼叫方法時，實際執行結果可因子類別物件而不同。</p></details><details><summary>Dynamic binding</summary><p>Animal a = new Crab() 時，a 的宣告型別是 Animal，執行時指向 Crab 物件。a.move() 會依實際物件選擇方法實作，這是動態方法繫結。</p></details><details><summary>UP 的 Phases 與 Workflows</summary><p>Phase 回答『開發進行到哪個時間階段？』；Workflow 回答『正在做哪類工作？』。同一階段可以同時進行多種工作。</p></details></section>","2":"<section class=\"card\" id=\"plain-guide-2\"><h2>💡 觀念白話講解｜Ch2</h2><p class=\"muted small\">補充理解用，原本老師的英文定義、圖表與課堂筆記保持不變。點選不懂的觀念展開說明。</p><details><summary>Functional vs. Nonfunctional</summary><p>Functional 問『系統能做什麼？』例如學生可以加選課程；Nonfunctional 問『系統要達到什麼品質或限制？』例如查詢需在兩秒內完成。</p></details><details><summary>Interview vs. Observation</summary><p>訪談能知道使用者怎麼描述工作；觀察能看到實際操作。兩者可能不同，所以常需要交叉確認。</p></details><details><summary>Requirement vs. Solution</summary><p>『學生可以查詢課程』是需求；『用哪種資料庫和按鈕實作』屬於後續設計選擇，不要太早混在一起。</p></details></section>","3":"<section class=\"card\" id=\"plain-guide-3\"><h2>💡 觀念白話講解｜Ch3</h2><p class=\"muted small\">補充理解用，原本老師的英文定義、圖表與課堂筆記保持不變。點選不懂的觀念展開說明。</p><details><summary>Use-case Diagram vs. Activity Diagram</summary><p>Use-case Diagram 先回答『誰能使用哪些功能？』；Activity Diagram 再回答『這個流程依照什麼順序進行？』。</p></details><details><summary>Include vs. Extend</summary><p>Include 是每次都需要執行的共用功能；Extend 是特定條件才加入的額外行為。記箭頭時，include 指向被包含者，extend 指向被延伸的基本 use case。</p></details><details><summary>Decision vs. Fork</summary><p>Decision 是依條件選其中一條路；Fork 是同時展開平行工作。看到條件判斷和同時進行，要分清楚。</p></details></section>","4":"<section class=\"card\" id=\"plain-guide-4\"><h2>💡 觀念白話講解｜Ch4</h2><p class=\"muted small\">補充理解用，原本老師的英文定義、圖表與課堂筆記保持不變。點選不懂的觀念展開說明。</p><details><summary>CRC Card vs. Class Diagram</summary><p>CRC Card 先想『這個類別負責什麼、需要誰協助？』；Class Diagram 再把類別的屬性、方法與彼此關係正式畫出來。</p></details><details><summary>Class vs. Object Diagram</summary><p>Class Diagram 描述有哪些類別及關係；Object Diagram 是某一個時間點的具體物件快照。</p></details><details><summary>Multiplicity</summary><p>Multiplicity 回答『一個物件可以對應多少個另一邊的物件？』。例如一位學生可以選多門課，畫圖時要仔細確認數字標在哪一端。</p></details></section>","5":"<section class=\"card\" id=\"plain-guide-5\"><h2>💡 觀念白話講解｜Ch5</h2><p class=\"muted small\">補充理解用，原本老師的英文定義、圖表與課堂筆記保持不變。點選不懂的觀念展開說明。</p><details><summary>Sequence vs. Communication Diagram</summary><p>兩者都描述物件之間的訊息互動。Sequence Diagram 特別強調訊息的時間順序；Communication Diagram 更強調參與物件之間的連結。</p></details><details><summary>State vs. Transition</summary><p>State 是物件目前所處的狀態；Transition 是事件發生後，物件從一個狀態移動到另一個狀態。</p></details><details><summary>Guard vs. Event</summary><p>Event 是觸發轉移的事情；Guard 是轉移能否發生的條件。事件發生但條件不符合時，不一定會轉移。</p></details></section>"};
const CH1_UML_ORIGINAL="<section class=\"card\" id=\"ch1-uml-original\" style=\"margin:18px 0\"><h2>📌 UML 原文投影片完整對照｜手寫答案與考試範圍</h2><p>本區依你提供的三張 UML 投影片整理，保留原文表格的 <b>Diagram Name / Used to... / Primary Phase</b>。綠色勾選表示老師標示的「本課程範圍」，沒有勾選的項目仍保留，方便完整對照。</p>\n<h3>Unified Modeling Language (UML)</h3><p><b>手寫註記：</b>統一塑模語言。</p><p><b>Original:</b> Provides a common vocabulary of object-oriented terms and diagramming techniques to model an information system from analysis through implementation.</p><p><b>中文：</b>提供物件導向的共同術語及繪圖技術，用來描述資訊系統從分析到實作的模型。</p><p><b>Original:</b> The 2.5th version of UML has 15 diagram types in 2 major groups:</p><p><b>手寫填答：</b>1. <b>Structural diagrams</b>　2. <b>Behavior diagrams</b></p>\n<h3>UML Structure Diagrams</h3><p><b>Original + 手寫填空：</b>Represent the <b>Static &amp; Structural</b> relationships in an information system.</p><p><b>中文：</b>呈現資訊系統中的靜態與結構關係。</p><div style=\"overflow-x:auto\"><table style=\"min-width:690px;width:100%\"><thead><tr><th>本課程範圍</th><th>Diagram Name</th><th>Used to...</th><th>Primary Phase</th></tr></thead><tbody><tr><td style=\"text-align:center\">✅</td><td><b>Class</b></td><td>Illustrate the relationships between classes modeled in the system</td><td>Analysis, Design</td></tr><tr><td style=\"text-align:center\">✅</td><td><b>Object</b></td><td>Illustrate the relationships between objects modeled in the system; used when actual instances of the classes will better communicate the model</td><td>Analysis, Design</td></tr><tr><td style=\"text-align:center\">✅</td><td><b>Package</b></td><td>Group other UML elements together to form higher-level constructs</td><td>Analysis, Design, Implementation</td></tr><tr><td style=\"text-align:center\">✅</td><td><b>Deployment</b></td><td>Show the physical architecture of the system; can also be used to show software components being deployed onto the physical architecture</td><td>Physical Design, Implementation</td></tr><tr><td style=\"text-align:center\">✅</td><td><b>Component</b></td><td>Illustrate the physical relationships among the software components</td><td>Physical Design, Implementation</td></tr><tr><td style=\"text-align:center\">—</td><td><b>Composite Structure Design</b></td><td>Illustrate the internal structure of a class, i.e., the relationships among the parts of a class</td><td>Analysis, Design</td></tr><tr><td style=\"text-align:center\">—</td><td><b>Profile</b></td><td>Used to develop extensions to the UML itself</td><td>None</td></tr></tbody></table></div>\n<h3>UML Behavior Diagrams</h3><p><b>Original + 手寫填空：</b>Depict the <b>dynamic</b> relationships among the instances or objects that represent the business information system.</p><p><b>中文：</b>描述代表業務資訊系統的實例或物件之間的動態關係。</p><div style=\"overflow-x:auto\"><table style=\"min-width:690px;width:100%\"><thead><tr><th>本課程範圍</th><th>Diagram Name</th><th>Used to...</th><th>Primary Phase</th></tr></thead><tbody><tr><td style=\"text-align:center\">✅</td><td><b>Activity</b></td><td>Illustrate business workflows independent of classes, the flow of activities in a use case, or detailed design of a method</td><td>Analysis, Design</td></tr><tr><td style=\"text-align:center\">✅</td><td><b>Sequence</b></td><td>Model the behavior of objects within a use case; focuses on the time-based ordering of an activity</td><td>Analysis, Design</td></tr><tr><td style=\"text-align:center\">—</td><td><b>Communication</b></td><td>Model the behavior of objects within a use case; focus on the communication among a set of collaborating objects of an activity</td><td>Analysis, Design</td></tr><tr><td style=\"text-align:center\">—</td><td><b>Interaction Overview</b></td><td>Illustrate an overview of the flow of control of a process</td><td>Analysis, Design</td></tr><tr><td style=\"text-align:center\">—</td><td><b>Timing</b></td><td>Illustrate the interaction among a set of objects and the state changes they go through along a time axis</td><td>Analysis, Design</td></tr><tr><td style=\"text-align:center\">✅</td><td><b>Behavioral State Machine</b></td><td>Examine the behavior of one class</td><td>Analysis, Design</td></tr><tr><td style=\"text-align:center\">—</td><td><b>Protocol State Machine</b></td><td>Illustrate the dependencies among the different interfaces of a class</td><td>Analysis, Design</td></tr><tr><td style=\"text-align:center\">✅</td><td><b>Use-Case</b></td><td>Capture business requirements for the system and illustrate the interaction between the system and its environment</td><td>Analysis</td></tr></tbody></table></div>\n<details><summary>💡 兩類圖形怎麼區分？</summary><p><b>Structural</b> 著重「系統有哪些元素、彼此如何連結」；<b>Behavioral</b> 著重「流程、訊息與狀態如何變化」。這段是補充理解，不是投影片原文。</p></details></section>";
const CH1_SUPPORTING_DETAIL="<section class=\"card\" id=\"supporting-workflows-detailed\"><h2>Supporting Workflows｜原圖完整對照</h2><p>這是 Unified Process 二維圖的下半部。橫軸是 <b>Phases</b>，縱軸是五種 <b>Supporting Workflows</b>；灰色面積表示該階段相對工作量，不是精確數值。</p><div style=\"overflow-x:auto\"><table><thead><tr><th>Supporting Workflow</th><th>Inception</th><th>Elaboration</th><th>Construction</th><th>Transition</th><th>Production</th></tr></thead><tbody><tr><th>Configuration and Change Management</th><td>少</td><td>增加</td><td>較多</td><td>仍持續</td><td>持續</td></tr><tr><th>Project Management</th><td>有明顯工作量</td><td>持續</td><td>持續</td><td>持續</td><td>仍持續</td></tr><tr><th>Environment</th><td>前期較多</td><td>降低</td><td>少</td><td>短暫增加</td><td>圖中接近無</td></tr><tr><th>Operation and Support</th><td>少</td><td>少</td><td>逐漸增加</td><td>增加</td><td>較多</td></tr><tr><th>Infrastructure Management</th><td>持續</td><td>持續</td><td>持續</td><td>持續</td><td>持續</td></tr></tbody></table></div><p class=\"muted small\">上表是依圖片灰色曲線做的定性讀圖，並非投影片提供的數值。</p><h3>老師手寫補充</h3><ul><li><b>Configuration and Change Management</b>：組態與變更管理</li><li><b>Project Management</b>：專案管理</li><li><b>Environment</b>：<b>IDE、CASE Tools</b></li><li><b>Operation and Support</b>：<b>Training、Document、user manual、maintenance</b></li><li><b>Infrastructure Management</b>：<b>Design patterns、API、SPI</b></li></ul><h3>Phases 與 Iterations</h3><p>圖上階段依序為 <b>Inception → Elaboration → Construction → Transition → Production</b>。下方迭代標示為 Inception 的 <b>Iter 1 … Iter i</b>、Elaboration 的 <b>Iter i+1 … Iter j</b>、Construction 的 <b>Iter j+1 … Iter k</b>、Transition 的 <b>Iter k+1 … Iter m</b>。</p><p><b>Production</b> 被綠色虛線圈起來，複習時要特別注意：系統投入正式使用後，Operation and Support 仍有大量工作，Configuration and Change Management、Project Management 與 Infrastructure Management 也沒有完全停止。</p><details><summary>💡 讀圖理解：為什麼 Production 還需要工作？</summary><p>系統正式上線不代表專案相關工作全部消失。使用者支援、文件、維護與變更仍然存在。圖中灰色曲線正是要表達：不同工作在不同階段的投入程度不同，而且可能重疊。</p></details></section>";
const CH1_HANDWRITTEN_UML="<section class=\"card\" id=\"ch1-handwritten-uml\"><h2>✍️ Ch1｜手寫筆記整合：Unified Process &amp; UML</h2><p class=\"muted small\">依你提供的四張課堂投影片整理。英文沿用投影片；藍字為手寫填答，綠色勾選代表投影片標註的本課程範圍。</p>\n<h3>The Unified Process：二維工作量圖</h3><p><b>Phases（橫軸）</b>：Inception → Elaboration → Construction → Transition → Production。<b>Workflows（縱軸）</b>：每種工作在各階段都有不同程度的投入；灰色曲線代表相對工作量，不是只能在某一階段執行。</p>\n<p><b>Engineering Workflows（手寫填答）</b>：</p><ol><li>Business Model</li><li>Requirement</li><li>Analysis</li><li>Design</li><li>Implementation</li><li>Test</li><li>Deployment</li></ol>\n<p><b>Supporting Workflows（手寫填答）</b>：</p><ol><li>Configuration and Change Management</li><li>Project Management</li><li>Environment（旁註：IDE、CASE tools）</li><li>Operation and Support（旁註：Training、Document、user manual、maintenance）</li><li>Infrastructure Management（旁註：Design patterns、API、SPI）</li></ol>\n<p><b>讀圖技巧：</b>Business Model 的工作量偏前期；Implementation 在 Construction 較高；Operation and Support 在後期與 Production 更重要。這是圖形趨勢的解讀，不是額外手寫答案。</p>\n<h3>Unified Modeling Language (UML)</h3><p><b>投影片原文：</b>Provides a common vocabulary of object-oriented terms and diagramming techniques to model an information system from analysis through implementation.</p><p><b>中文理解：</b>UML 提供物件導向的共同術語與繪圖方式，讓分析、設計到實作能用一致的模型溝通。</p><p>投影片記載 UML 2.5 有 <b>15 diagram types</b>，分成兩大類（手寫填答）：<b>1. Structural diagrams；2. Behavior diagrams</b>。</p>\n<h3>UML Structure Diagrams</h3><p><b>原文填空：</b>Represent the <b>Static &amp; Structural</b> relationships in an information system.</p><p><b>綠色勾選：本課程範圍</b></p><ul><li>✓ Class：類別間的關係</li><li>✓ Object：物件實例間的關係</li><li>✓ Package：將 UML 元素組成較高層次的群組</li><li>✓ Deployment：系統實體架構與部署</li><li>✓ Component：軟體元件之間的實體關係</li></ul><p>同頁另列 Composite Structure Design、Profile，但沒有綠色勾選。</p>\n<h3>UML Behavior Diagrams</h3><p><b>原文填空：</b>Depict the <b>dynamic</b> relationships among the instances or objects that represent the business information system.</p><p><b>綠色勾選：本課程範圍</b></p><ul><li>✓ Activity：業務工作流程與活動流向</li><li>✓ Sequence：物件行為，特別強調時間順序</li><li>✓ Behavioral State Machine：單一類別的行為與狀態變化</li><li>✓ Use-Case：系統業務需求及與外部環境的互動</li></ul><p>同頁另列 Communication、Interaction Overview、Timing、Protocol State Machine，但沒有綠色勾選。</p>\n<details><summary>💡 考試怎麼分 Structural 和 Behavioral？</summary><p><b>Structural = 靜態</b>：系統由哪些類別、物件、元件組成，以及它們的關係。<b>Behavioral = 動態</b>：流程如何進行、訊息如何傳遞、狀態如何改變。</p><p>例：選課系統的 Student 和 Course 關係 → Class Diagram；學生如何完成選課流程 → Activity Diagram；選課過程中物件依序互相呼叫 → Sequence Diagram。</p></details></section>";
const CH1_TEACHER_UPGRADE="<section class=\"card\" id=\"teacher-ch1-upgrade\"><h2>Ch1｜老師投影片補充</h2><p>依照課堂投影片的順序與原文整理，保留老師標註的答案。</p>\n<h3>Which Methodology to Use?</h3><div style=\"overflow-x:auto\"><table><thead><tr><th>Ability to Develop Systems</th><th>Waterfall</th><th>Parallel</th><th>Phased</th><th>Prototyping</th><th>Throwaway Prototyping</th><th>XP</th><th>SCRUM</th></tr></thead><tbody><tr><th>With Unclear User Requirements</th><td>Poor</td><td>Poor</td><td>Good</td><td>Excellent</td><td>Excellent</td><td>Excellent</td><td>Excellent</td></tr><tr><th>With Unfamiliar Technology</th><td>Poor</td><td>Poor</td><td>Good</td><td>Poor</td><td>Excellent</td><td>Good</td><td>Good</td></tr><tr><th>That Are Complex</th><td>Good</td><td>Good</td><td>Good</td><td>Poor</td><td>Excellent</td><td>Good</td><td>Good</td></tr><tr><th>That Are Reliable</th><td>Good</td><td>Good</td><td>Good</td><td>Poor</td><td>Excellent</td><td>Excellent</td><td>Excellent</td></tr><tr><th>With a Short Time Schedule</th><td>Poor</td><td>Good</td><td>Excellent</td><td>Excellent</td><td>Good</td><td>Excellent</td><td>Excellent</td></tr><tr><th>With Schedule Visibility</th><td>Poor</td><td>Poor</td><td>Excellent</td><td>Excellent</td><td>Good</td><td>Excellent</td><td>Excellent</td></tr></tbody></table></div><p class=\"small muted\">Structured Methodologies：Waterfall、Parallel；RAD Methodologies：Phased、Prototyping、Throwaway Prototyping；Agile Methodologies：XP、SCRUM。Poor / Good / Excellent 依投影片原表。</p>\n<h3>Exercise &amp; Discussion</h3><p>Identify the proper SDLC models for the following development scenarios:</p><ol><li>大型 ERP 系統：<b>Phased</b></li><li>工廠生管系統：<b>Parallel</b></li><li>政府委外系統：<b>Waterfall</b></li><li>遊戲軟體：<b>Prototyping / DevOps</b></li></ol><p><b>上述皆可運用 Agile?</b> Yes, but must consider (1) communication costs &amp; (2) entire development time frame (usually adopt the time-boxing approach to control time).</p>\n<h3>Characterization of OOIS</h3><p><b>Classes &amp; Objects</b></p><ul><li>Object (instance): instantiation of a <b>class</b></li><li>Attributes: data that characterizes the class</li></ul><p><b>Methods &amp; Messages</b></p><ul><li>Methods: the <b>behavior</b> of a class</li><li>Messages: information sent to an object to trigger a method (method call)</li></ul><p>Student example:</p><pre>Student joe = new Student();\nCourse sa = new Course();\njoe.addCourse(sa);</pre><p>老師註記：method parameters (an object reference).</p>\n<h3>Characterization of OOIS (cont.)</h3><p><b>Encapsulation &amp; information hiding</b></p><ul><li>Encapsulation: a combination of data &amp; behaviors</li><li>Information hiding: functionality details are hidden</li></ul><p><b>Inheritance</b></p><ul><li>General classes are created (called: <b>Superclass</b>)</li><li><b>Subclass</b> can inherit some data and methods from a superclass</li><li>Abstraction vs. implementation (see next slide)</li></ul>\n<h3>Inheritance 例子</h3><pre>Student\n+addCourse()\n+dropCourse()\n+payTuition()\n     △\nGradStudent          UnderGradStudent\n+writeThesis()       +payTuition()\n+payTuition()</pre><p>In Student class: Any abstraction? <b>payTuition()</b>；Any implementation?（投影片未填答）</p><p>Can instantiate Student? <b>No</b>（老師手寫答案）。</p><p>Why define three methods here? Why no implementation of addCourse() &amp; dropCourse()? 老師註記：因為 superclass 有定義了。</p>\n<h3>Characteristics of OOIS (cont.)：Polymorphism</h3><p>Mechanism: linking a reference to various types of object at runtime. A key feature in such mechanism:</p><p><b>Dynamic binding</b>, which includes: (1) <b>type</b> binding &amp; (2) <b>method</b> binding. Contrast with static binding.</p>\n<h3>Polymorphism 例子</h3><pre>Animal\n+move()\n  △\nBird / Crab / Snake\n+move()\n\nIn Java:\nAnimal a;\na = new Bird();\na = new Crab();\na.move();</pre><p>課堂問題：Dynamic type binding 在哪裡？Dynamic method binding 在哪裡？</p>\n<h3>Characteristics of OOSAD</h3><p><b>1. Use-case driven</b></p><p>“Use cases” to define/objectize the <b>functionality</b> of an OOIS. Each use case focuses on one <b>business process</b>.</p><p>例如選課系統：business process? 老師註記：加選、退選。</p><p><b>2. Architecture/modularization centric</b></p><ul><li><b>Functional</b> view: focusing on user perspective</li><li><b>Structural</b> view: focusing on the content of a class and the relationships among classes</li><li><b>Behavioral</b> view: focusing on messaging between classes and resulting outcome</li></ul><p><b>3. Iterative &amp; incremental</b></p><p>Undergoes continuous increments, testing &amp; refinement. May go back to revise the prior analysis/design contents.</p><p>為何一開始無法正確完整地完成分析或設計？老師註記：需求不明確。</p><p>The analyst &amp; users understand the future system better over time.</p>\n<h3>The Unified Process</h3><p>A two-dimensional process consisting of <b>phases</b> and <b>workflows</b> to denote the workload of SDLC activities.</p><ul><li>Phases are time periods in development</li><li>Workflows are the tasks that occur in each phase</li><li>Activities in both phases &amp; workflows will overlap</li></ul></section>";
const CH2_SLIDES_21_30="<section class=\"card\" id=\"ch2-slides-21-30\" style=\"margin:18px 0;padding:20px\"><h2>📘 Ch2｜需求蒐集、User Stories 與優先排序（投影片 p.21–30）</h2><p class=\"muted\">依課堂投影片與手寫填答整理。保留英文關鍵字，搭配繁體中文說明與例子。</p>\n<h3>p.21｜3. Observation 現場觀察</h3><p><b>Suitable when users often don’t remember everything they do.</b> 使用者可能記不得每天實際執行的每一步，因此直接觀察工作現場。</p><p><b>Two validity threats 兩種效度威脅：</b>① <b>Hawthorne effect（霍桑效應）</b>：被觀察的人會改變或假裝自己的行為，因此觀察應保持低調（keep a low profile），不要打斷或影響工作者。② <b>Periodic activities 週期性活動</b>：別漏掉每週、每月、每年的工作，這些可能不在觀察期間發生。</p>\n<h3>p.22–23｜4. Document Analysis 文件分析</h3><p><b>Suitable when there exist written manuals, policies, forms, reports, etc.</b> 適用於已有作業手冊、政策、表單、報表，或舊系統分析設計文件的情況。</p><p><b>Important tips：</b>① Look for user additions to forms/reports（找出使用者額外手寫或補充的欄位）。② Look for unused form/report elements（找出從未使用的欄位）。</p><div class=\"card\" style=\"padding:12px\"><b>Fig. 2-10｜獸醫診所病患資料卡</b><p>舊表單「Name」被誤填為寵物名稱，應改成 <b>Owner’s Name</b>；工作人員在 Pet’s Name 後手動補上動物種類及出生日期，代表新表單應增設欄位；電話號碼區碼不清楚，應明確提示。這就是從<b>錯填、額外補充、欄位不清</b>發現需求。</p></div>\n<h3>p.24｜5. Joint Application Development (JAD)</h3><p><b>Joint user-analyst seminars</b>：讓使用者與分析師共同討論需求，也可遠端進行。會前應仔細規劃、提醒攜帶文件與使用手冊，並訂定 <b>Ground rules</b>（例如對事不對人）。</p><p><b>老師填答：Anonymity（匿名）</b> 是促進 JAD 成功的關鍵；適合腦力激盪及處理 <b>diverse opinions（不同意見）</b>。</p>\n<h3>p.25｜Requirements-Gathering Techniques: Summary</h3><p>不同蒐集技術可以合併使用。Document analysis 與 Observation 所需訓練較少；JAD 會議可能很有挑戰。</p><div style=\"overflow-x:auto\"><table style=\"width:100%;border-collapse:collapse;font-size:.88rem\"><thead><tr><th>比較項目</th><th>Interviews</th><th>JAD</th><th>Questionnaires</th><th>Document Analysis</th><th>Observation</th></tr></thead><tbody><tr><td>Type of information</td><td>As-is, improvements, to-be</td><td>As-is, improvements, to-be</td><td>As-is, improvements</td><td>As-is</td><td>As-is</td></tr><tr><td>Depth 深度</td><td>High</td><td>High</td><td>Medium</td><td>Low</td><td>Low</td></tr><tr><td>Breadth 廣度</td><td>Low</td><td>Medium</td><td>High</td><td>High</td><td>Low</td></tr><tr><td>Integration 整合</td><td>Low</td><td>High</td><td>Low</td><td>Low</td><td>Low</td></tr><tr><td>User involvement 參與</td><td>Medium</td><td>High</td><td>Low</td><td>Low</td><td>Low</td></tr><tr><td>Cost 成本</td><td>Medium</td><td>Low to Medium</td><td>Low</td><td>Low</td><td>Low to Medium</td></tr></tbody></table></div>\n<h3>p.26｜Defining / Documenting Requirements</h3><p>兩種主要記錄格式：① <b>Descriptive statement</b>（敘述式需求）② <b>User story</b>（使用者故事，與 <b>Agile</b> 開發方法相關）。User Story 可透過故事情境描述 functional 與 non-functional requirements，具有 low tech、high touch、容易更新與攜帶等特性。</p><p>老師填答：User Stories 可依 <b>Risk level（風險程度）</b> 與 <b>Importance（重要性）</b> 排序，並用 story cards（索引卡、便利貼）管理。</p>\n<h3>p.27｜User Story 的標準格式與例子</h3><div class=\"card\" style=\"padding:12px\"><p><b>As a &lt;role&gt;, I want &lt;goal&gt;, so that &lt;benefit&gt;.</b></p><p><b>Functional requirement：</b>As a secretary, I want to schedule appointments for a patient, so that we can meet both the patient and the physician’s availability.</p><p>中文：身為秘書，我想替病患預約看診，以便配合病患和醫師雙方的空檔。</p><p><b>Non-functional requirement：</b>As a secretary, I want to print the daily schedule wirelessly, so that all printing can share a printer without physical cables.</p><p>老師答案：<b>Operational requirement（操作／營運需求）</b>，重點是無線列印這項運作環境與使用方式的限制。</p></div>\n<h3>p.28｜Visualize Development Progress with User Story Cards</h3><p>用便利貼把需求故事放在看板欄位，例如 <b>Stories → To Do → In Progress</b>，移動卡片呈現進度。卡片可寫角色、目標、效益及 <b>Acceptance criteria（驗收條件）</b>。這是需求追蹤與進度視覺化的工具。</p>\n<h3>p.29｜Prioritizing Requirements 需求優先排序</h3><p>兩個角度：<b>Sequence</b>（實作先後順序）由 <b>dependency 依存性</b> 決定，例如先有商品選購才能完成購物車結帳；<b>Importance</b>（重要性）用 <b>MoSCoW</b> 方法分類。</p><div style=\"overflow-x:auto\"><table style=\"width:100%;border-collapse:collapse\"><thead><tr><th>MoSCoW</th><th>老師填答</th><th>意義</th></tr></thead><tbody><tr><td><b>M</b></td><td>Must have</td><td>不可妥協、一定要有</td></tr><tr><td><b>S</b></td><td>Should have</td><td>能為系統增加顯著價值</td></tr><tr><td><b>C</b></td><td>Could have</td><td>影響較小、有餘力再做</td></tr><tr><td><b>W</b></td><td>Won’t have</td><td>不在本次範圍內</td></tr></tbody></table></div>\n<h3>p.30｜Process for Defining Requirements</h3><ol><li><b>Gather &amp; analyze</b> requirements：蒐集與分析需求。</li><li><b>Document</b> requirements：將需求記錄下來。</li><li><b>Verify &amp; prioritize</b> each requirement：與使用者確認並排定優先順序。</li><li><b>Continue / iterate</b>：反覆處理下一批需求，逐步演進。</li></ol><p><b>老師提醒：Must work with users（必須與使用者合作）。</b> 特別小心 <b>Scope creep（範圍蔓延）</b>：開發過程中持續加入原先範圍外的需求。使用者想要但不屬於當前範圍的功能，可以排入後續版本增強（future enhancements）。</p></section>";

<section class="card" id="ch2-slides-31-40" style="padding:22px;margin:18px 0">
<h2>Ch2｜需求驗證與品質（投影片 31–40）</h2><p class="muted">Problems in Requirement Determination · Text Analysis · VT4C · 線上選課系統案例。保留課堂英文關鍵字與老師註記。</p>
<h3>p.31–32｜Problems in Requirement Determination &amp; Validation</h3>
<ol><li><b>Analyst may not have access to the correct users</b>：分析師未接觸真正的使用者。</li><li><b>Requirements specifications may be inadequate</b>：需求規格不充分。</li><li><b>Some requirements may not be known at the beginning</b>：一開始未必知道所有需求。</li><li><b>Verifying and validating requirements can be difficult</b>：確認與驗證需求不容易。</li></ol>
<p><b>Two methods for validating requirements：</b>① Text analysis（文字分析）② The VT4C principle（需求品質六原則）。</p>
<h3>p.33–35｜Text Analysis：五種工具</h3>
<div style="overflow-x:auto"><table><thead><tr><th>Tool</th><th>原文重點／中文解釋</th><th>投影片例子</th></tr></thead><tbody>
<tr><td>1. Sentence diagramming<br>句子圖解</td><td>Identify primary objects of interest：從句子找出主要物件；老師註記留意名詞、動詞。</td><td>The patient contacts the office regarding an appointment.（patient、office、appointment；contacts）</td></tr>
<tr><td>2. Domain analysis<br>領域分析</td><td>Find all of the semantics：找出業務領域中的不同意涵。</td><td>「晤談」不只輔導，也可能涉及論文、課業、導生晤談。</td></tr>
<tr><td>3. Component analysis<br>成分分析</td><td>Identify attributes of a business object：確認物件要記錄的屬性。</td><td>學生：姓名、系所、電話；網購顧客需要記錄哪些屬性？</td></tr>
<tr><td>4. Taxonomic analysis<br>分類分析</td><td>Structure of semantic relationships among object types：分析分類與組成關係。</td><td>a-kind-of（是一種）、a-part-of（是一部分）；研究生是一種學生，教師與學生可作為預約單相關成員。</td></tr>
<tr><td>5. Theme analysis<br>主題分析</td><td>Uncover potential business scenarios：找出尚未考慮的業務情境。</td><td>購票全家同區卻不能視為黃牛；設計批次購買張數的限制。晤談系統另有職涯晤談。</td></tr>
</tbody></table></div>
<p><b>好記法：</b>句子找物件 → 領域找意思 → 成分找屬性 → 分類找關係 → 主題找情境。</p>
<h3>p.36｜VT4C Principle for Descriptive Requirements</h3>
<div style="overflow-x:auto"><table><thead><tr><th>原則</th><th>課堂定義</th><th>白話理解</th></tr></thead><tbody>
<tr><td><b>Clear</b></td><td>There is only one way to interpret the requirement.</td><td>清楚、沒有歧義，只有一種解讀。</td></tr>
<tr><td><b>Verifiable</b></td><td>Can be tested if the requirement is met.</td><td>能檢驗是否達成，盡量量化可測試。</td></tr>
<tr><td><b>Consistent</b></td><td>Not in conflict with other requirements.</td><td>與其他需求及既有業務流程不衝突；投影片提及 IEEE 830 SRS。</td></tr>
<tr><td><b>Complete</b></td><td>功能不缺漏。</td><td>完整交代特定使用者角色與動詞、必要功能。</td></tr>
<tr><td><b>Concise</b></td><td>需求描述不拖泥帶水。</td><td>簡潔精準，不冗長。</td></tr>
<tr><td><b>Traceable</b></td><td>Has a unique identifier; linked to subsequent artifacts (e.g. use cases).</td><td>每項需求有唯一編號，可追溯到後續產出。</td></tr>
</tbody></table></div>
<p><b>老師填空：</b>V = Verifiable、T = Traceable、4C = Clear / Consistent / Complete / Concise。尚未符合原則的需求以 <b>TBD</b> 標記（To Be Determined）。</p>
<h3>p.37｜判斷需求敘述的品質</h3>
<ul><li>「資料列表賞心悅目就好」→ <b>Verifiable</b> 問題：應問每頁預設幾筆資料。</li><li>「銷售資訊的維護要安全」→ <b>Clear / Complete</b>：例如明確規定由哪個角色登入後才能操作。</li><li>「有呈現當月的銷售記錄」→ <b>Complete</b>：需確認是否要列印、誰能使用。</li><li>「可協助企業掌握來電顧客的資訊」→ <b>Clear</b>：例如客服可查閱顧客先前購買紀錄。</li><li>不同使用者對畫面設計要求不一致 → <b>Consistent</b>。</li><li>避免「最好、盡量、好看」等含糊字眼 → <b>Clear / crisp</b>。</li></ul>

function clock(s){return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function radar(by){let cx=130,cy=125,R=86;let pts=(r)=>by.map((b,i)=>{let a=-Math.PI/2+i*2*Math.PI/by.length;return [cx+Math.cos(a)*r*(b.score/100),cy+Math.sin(a)*r*(b.score/100)]});let grids=[.25,.5,.75,1].map(r=>`<polygon points="${by.map((b,i)=>{let a=-Math.PI/2+i*2*Math.PI/by.length;return (cx+Math.cos(a)*R*r).toFixed(1)+','+(cy+Math.sin(a)*R*r).toFixed(1)}).join(' ')}" fill="none" stroke="var(--line)"/>`).join('');let points=pts(R).map(x=>x.join(',')).join(' ');let labels=by.map((b,i)=>{let a=-Math.PI/2+i*2*Math.PI/by.length;return `<text x="${cx+Math.cos(a)*105}" y="${cy+Math.sin(a)*105}" dominant-baseline="middle" text-anchor="middle" fill="var(--ink)" font-size="12">${b.title}</text>`}).join('');return `<svg viewBox="0 0 260 260" role="img" aria-label="Chapter mastery radar chart" style="max-width:310px;width:100%;display:block;margin:auto">${grids}<polygon points="${points}" fill="#6366f155" stroke="#7774ed" stroke-width="2.5"/>${labels}</svg>`}
const RULE_SYNONYMS={"planning":["規劃"],"analysis":["分析"],"design":["設計"],"implementation":["實作","實施"],"why":["為什麼","商業價值"],"what":["需求"],"how":["如何"],"waterfall":["瀑布"],"prototype":["原型","雛型"],"feedback":["回饋"],"functional":["功能性"],"nonfunctional":["非功能"],"measurable":["量化","秒","%"],"problem":["問題"],"root cause":["根因","根本原因"],"example":["例如"],"clear":["清楚"],"verifiable":["可驗證"],"interview":["訪談"],"observation":["觀察"],"document":["文件"],"include":["包含"],"extend":["延伸"],"direction":["方向"],"decision":["決策"],"merge":["合併"],"fork":["平行"],"join":["同步"],"actor":["角色"],"trigger":["觸發"],"normal flow":["正常流程"],"alternate":["替代"],"action":["動作"],"ucd":["使用案例描述"],"relationship":["關係"],"class":["類別"],"responsibilities":["責任"],"collaborators":["協作"],"sequence":["時序"],"messages":["訊息"],"state":["狀態"],"transition":["轉移"]};
function ruleGrade(q){let s=String(state.mockAnswers[q.id]||'').trim();let keys=q.type==='diagram'?(q.diagramKeys||[]):(q.keywords||[]);if(!s)return {score:0,got:[],missing:keys};let got=[],missing=[];for(let key of keys){let hits=[key,...(RULE_SYNONYMS[String(key).toLowerCase()]||[])];(hits.some(v=>s.toLowerCase().includes(v.toLowerCase()))?got:missing).push(key)}let score=keys.length?Math.round(q.points*got.length/keys.length*10)/10:0;return {score,got,missing}}
function resultsMidterm(){let objective=DATA.mock.filter(q=>q.type!=='short'&&q.type!=='diagram'),written=DATA.mock.filter(q=>q.type==='short'||q.type==='diagram'),total=DATA.mock.reduce((n,q)=>n+q.points,0);let p=objective.reduce((n,q)=>{let a=state.mockAnswers[q.id];return n+(q.type==='matching'?q.pairs.reduce((s,x,i)=>s+(a&&Number(a[i])===i?q.points/q.pairs.length:0),0):(a===q.answer?q.points:0))},0),grades=Object.fromEntries(written.map(q=>[q.id,ruleGrade(q)])),wp=written.reduce((n,q)=>n+grades[q.id].score,0);return `<div class="sectiontitle"><h2>期中考 · 規則式批改結果</h2><button class="btn" onclick="if(confirm('重新作答會覆蓋舊答案，確定嗎？')){state.mockStarted=false;state.mockSubmitted=false;state.mockAnswers={};save();render()}">重新作答</button></div><div class="grid">${stat('客觀題',p.toFixed(1),'自動計分')}${stat('簡答／畫圖估分',wp.toFixed(1),'規則式')}${stat('總分（參考）',(p+wp).toFixed(1)+' / '+total,'不等同教師給分')}</div><div class="card"><h3>免費本機批改</h3><p>不使用 Gemini 或 API。空白答案 0 分；問答依 Rubric 關鍵字，圖形依 Mermaid 語法、必要物件和符號估分。<b>此評分無法可靠判定完整 UML 語意、箭頭方向、多重性位置和邏輯正確性</b>，請對照標準答案。</p></div>${DATA.mock.map(q=>{let answer=state.mockAnswers[q.id],g=grades[q.id];return `<article class="card" style="margin:12px 0"><div class="small muted">Q${q.id} · Ch${q.chapter} · ${q.points} pts · ${q.type}</div><b>${E(q.question)}</b>${q.type==='short'||q.type==='diagram'?`<p>你的答案：</p><pre style="white-space:pre-wrap">${E(answer||'(未作答)')}</pre><p><b>估計：${g.score} / ${q.points}</b> · 符合 ${g.got.length} 項 · 可補充：${E(g.missing.join('、')||'已涵蓋列出重點')}</p><p>參考答案：</p>${q.type==='diagram'?`<pre class="mermaid">${E(q.answer)}</pre><details><summary>參考圖原始碼</summary><pre>${E(q.answer)}</pre></details>`:`<p>${E(q.answer)}</p>`}`:(q.type==='matching'?`<p>${q.pairs.map((pair,i)=>`${E(pair[0])} → ${E(pair[1])}: ${answer&&Number(answer[i])===i?'✓':'✗'}`).join('<br>')}</p>`:`<p>${answer===q.answer?'✓ Correct':'✗ Incorrect'} · Answer: ${E(q.options[q.answer])}</p>`)}<details><summary>English / 中文解析</summary><p>${E(q.en||q.answer)}</p><p>${E(q.zh||'')}</p></details></article>`}).join('')}`}
async function previewMockDiagram(id){let el=$('diagramPreview'+id),s=String(state.mockAnswers[id]||'').trim();if(!el)return;if(!s){el.textContent='請先輸入 Mermaid 語法';return}el.textContent='渲染中…';try{let m=await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');m.default.initialize({startOnLoad:false,securityLevel:'strict'});let result=await m.default.render('drawing'+id+'_'+Date.now(),s);el.innerHTML=result.svg}catch(e){el.textContent='圖形語法錯誤：'+String(e.message||e)}}
function cheats(){return `<table class="cheattable"><thead><tr><th>Chapter</th><th>Key contrast / core reminders</th></tr></thead><tbody>${DATA.chapters.map(c=>`<tr><td><b>Ch${c.id}</b><div class="muted">${E(c.title)}</div></td><td>${c.topics.map(t=>`<div style="margin-bottom:7px"><b>${E(t.title)}:</b> ${E(t.memorize)}<div class="muted">${E(t.zh)}</div></div>`).join('')}</td></tr>`).join('')}</tbody></table>`}function showModal(h){$('cheatContent').innerHTML=h;$('cheatModal').classList.add('open')}function render(){let app=$('app');app.innerHTML=tab==='home'?renderHome():tab==='chapters'?renderChapters():renderMock();if(tab==='home')renderQuick();if(tab==='chapters'&&chapter<=5)renderLessonDiagrams()}$('cheatBtn').onclick=()=>$('cheatModal').classList.add('open');$('closeCheat').onclick=()=>{$('cheatModal').classList.remove('open');$('cheatContent').innerHTML=cheats()};$('cheatModal').onclick=e=>{if(e.target===$('cheatModal')){$('cheatModal').classList.remove('open');$('cheatContent').innerHTML=cheats()}};$('printCheat').onclick=()=>print();$('themeBtn').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';document.body.classList.toggle('dark',state.theme==='dark');$('themeBtn').textContent=state.theme==='dark'?'☀':'☾';save()};document.body.classList.toggle('dark',state.theme==='dark');$('themeBtn').textContent=state.theme==='dark'?'☀':'☾';$('cheatContent').innerHTML=cheats();newQuick();render();setInterval(()=>{if(tab==='mock'&&state.mockStarted&&!state.mockSubmitted&&state.mockDeadline){let s=timeLeft();let el=$('timer');if(el)el.textContent=clock(s);if(!s){state.mockSubmitted=true;state.mockDeadline=null;save();render();toast('Exam time is over. Answers submitted.')}}},1000);
