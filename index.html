<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>系統分析與設計｜期中考複習 · SAD Midterm Study Studio 2026</title><style>
:root{color-scheme:light;--bg:#f6f7fb;--paper:#fff;--ink:#172033;--muted:#64748b;--line:#e3e8ef;--accent:#6366f1;--soft:#eef2ff;--good:#0d9668;--bad:#d44850;--shadow:0 12px 40px #2531530d}body.dark{color-scheme:dark;--bg:#0d1424;--paper:#172238;--ink:#ebf2ff;--muted:#a1b0c9;--line:#34415a;--accent:#a5b4fc;--soft:#273153;--shadow:none}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f6b44e;outline-offset:3px}a{color:var(--accent)}.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.topinner{max-width:1290px;margin:auto;padding:13px 22px;display:flex;gap:20px;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center;white-space:nowrap;font-size:20px;font-weight:900}.logo{background:#6366f1;color:white;padding:3px 9px;border-radius:11px}.nav{display:flex;gap:5px;overflow:auto}.tab{white-space:nowrap;border:0;border-radius:11px;background:transparent;padding:10px 13px;color:var(--muted);font-weight:700}.tab.active{background:var(--soft);color:var(--accent)}.iconbtn,.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:11px;padding:9px 13px}.btn.primary{background:#6266e8;border-color:#6266e8;color:white}.btn.ghost{background:var(--soft);border-color:transparent;color:var(--accent)}.btn:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:1290px;margin:auto;padding:24px 22px 85px}.hero{background:linear-gradient(120deg,#252b54,#343184 70%,#5750b3);color:white;border-radius:25px;padding:35px;display:flex;justify-content:space-between;gap:22px;align-items:center}.hero h1{font-size:clamp(27px,3.5vw,45px);letter-spacing:-1px;margin:4px 0 10px}.hero p{color:#d8ddff;max-width:770px}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-weight:800;font-size:12px;color:#bfc7ff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}.stat .num{font-size:30px;line-height:1.2;font-weight:850}.muted{color:var(--muted)}.small{font-size:13px}.pill{display:inline-flex;border-radius:999px;padding:3px 10px;background:var(--soft);color:var(--accent);font-size:12px;font-weight:750}.sectiontitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 14px}.sectiontitle h2{margin:0;font-size:23px}.split{display:grid;grid-template-columns:1fr 320px;gap:18px}.chapgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.chapterCard{display:flex;align-items:center;gap:16px}.chapterCard .bubble{border-radius:13px;background:var(--soft);color:var(--accent);padding:12px 15px;font-weight:850}.progress{background:var(--line);border-radius:20px;height:9px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#8b8cf5,#50b5bd);border-radius:20px}.filter{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:12px 14px}.chapterlayout{display:grid;grid-template-columns:230px 1fr;gap:24px;align-items:start}.side{position:sticky;top:90px}.side a{display:block;text-decoration:none;padding:8px 10px;border-left:2px solid var(--line);font-size:13px}.side a:hover{border-color:var(--accent);background:var(--soft)}.topic{scroll-margin-top:100px;margin-bottom:16px}.topic h3{margin:5px 0;font-size:20px}.topic p{margin:10px 0}.topic details{background:var(--bg);border-radius:12px;padding:10px 14px;margin:11px 0}.topic summary{cursor:pointer;font-weight:700}.topic .cn{padding:11px 14px;border-left:3px solid #8d90ec;background:var(--soft);border-radius:0 9px 9px 0}.flash{border:1px dashed #8d8ae9;border-radius:13px;background:var(--soft);color:var(--ink);padding:15px;text-align:left;width:100%;min-height:70px}.question{white-space:pre-line;font-size:17px;font-weight:710}.option{display:block;text-align:left;width:100%;margin:8px 0;padding:12px 15px;border:1px solid var(--line);border-radius:12px;color:var(--ink);background:var(--paper)}.option.sel{border-color:var(--accent);background:var(--soft)}.option.correct{border-color:var(--good);background:#0b9e7320}.option.wrong{border-color:var(--bad);background:#e46b6920}.badge{background:var(--soft);color:var(--accent);padding:4px 9px;border-radius:9px;font-size:12px;font-weight:800}.feedback{border-left:3px solid var(--accent);padding:13px 17px;background:var(--soft);margin:12px 0;border-radius:0 10px 10px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}.toolbar select,.toolbar input{border:1px solid var(--line);padding:9px;border-radius:9px;background:var(--paper);color:var(--ink)}.quizq{padding:22px 0;border-bottom:1px solid var(--line)}.quizq:last-child{border:0}.summarybox{border-radius:12px;background:var(--soft);padding:14px 17px}.examphoto{width:100%;border-radius:12px;border:1px solid var(--line)}.modal{position:fixed;inset:0;background:#0c1520b8;z-index:40;display:none;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.modalbox{background:var(--paper);color:var(--ink);width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:20px;padding:22px}.cheattable{border-collapse:collapse;width:100%;font-size:13px}.cheattable th,.cheattable td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.bars{display:flex;align-items:end;gap:10px;height:165px;padding:10px}.baritem{flex:1;text-align:center;font-size:12px}.baritem i{display:block;margin:auto;width:min(45px,80%);background:linear-gradient(#8c83ec,#4cb4c0);border-radius:7px 7px 0 0}.stickybar{display:flex;justify-content:space-between;gap:15px;align-items:center}.tiny{font-size:12px}.layout2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}textarea{width:100%;min-height:100px;padding:12px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:11px}.toast{position:fixed;bottom:22px;right:22px;z-index:60;background:#252c48;color:#fff;padding:13px 18px;border-radius:12px;display:none}.hide{display:none!important}@media(max-width:1000px){.topinner{flex-wrap:wrap}.nav{order:3;width:100%}.split{grid-template-columns:1fr}.side{position:static}.chapterlayout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.wrap{padding:15px 12px 70px}.hero{padding:23px;display:block}.hero h1{font-size:28px}.chapgrid,.layout2{grid-template-columns:1fr}.card{padding:16px}.grid{gap:9px}.stat .num{font-size:24px}.topinner{padding:10px 12px}.tab{font-size:13px;padding:8px}.sectiontitle{align-items:flex-start;flex-direction:column}}
@media print{.top,.toolbar,.btn,.side{display:none!important}body{background:white}.modal{position:static;display:block;background:transparent}.modalbox{max-height:none;overflow:visible}.wrap{display:none}}
</style><style>

.full-lesson h3{margin:20px 0 8px}
.full-lesson .toc{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 26px}
.full-lesson .toc a{padding:6px 10px;background:var(--soft);border-radius:9px;text-decoration:none;font-size:.85rem}
.full-lesson table{width:100%;border-collapse:collapse;font-size:.92rem}
.full-lesson th,.full-lesson td{border:1px solid var(--line);padding:9px;vertical-align:top;text-align:left}
.full-lesson th{background:var(--soft)}

.full-lesson .quiz button{display:block;width:100%;text-align:left;margin:7px 0;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}

</style></head><body><header class="top"><div class="topinner"><div class="brand"><span class="logo">SAD.</span>期中考複習 <span class="pill">Midterm 2026</span></div><nav class="nav" id="nav" aria-label="Main navigation"><button class="tab active" data-tab="home">⌂ Dashboard</button><button class="tab" data-tab="chapters">▤ Chapters 1–5</button><button class="tab" data-tab="mock">◷ 期中模擬試題</button></nav><div style="display:flex;gap:8px"><button class="iconbtn" id="cheatBtn" title="Cheat Sheet">⚡</button><button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">☾</button></div></div></header><main class="wrap" id="app"></main><div class="modal" id="cheatModal" role="dialog" aria-modal="true"><div class="modalbox"><div class="stickybar"><h2>⚡ 10-minute Cheat Sheet</h2><button class="btn" id="closeCheat">✕ Close</button></div><p class="muted small">英文術語優先｜按章節整理的關鍵辨析與考前速記</p><div id="cheatContent"></div><button class="btn primary" id="printCheat">列印 / 儲存 PDF</button></div></div><div id="toast" class="toast" role="status"></div><script>const DATA={"chapters":[{"id":1,"title":"System Development & SA&D","subtitle":"Systems development, SDLC, methodologies, OO, Unified Process","topics":[{"title":"SDLC and four phases","definition":"The Systems Development Life Cycle (SDLC) transforms business needs into a working information system through Planning, Analysis, Design, and Implementation.","details":"Planning asks WHY and feasibility; Analysis asks WHO, WHAT, WHERE, WHEN; Design asks HOW; Implementation builds, tests, installs and supports.","zh":"四階段不是只能照直線進行。Analysis 產出 system proposal；Design 產出 system specification。","memorize":"Planning → Analysis → Design → Implementation. Deliverables progressively refine the initial business need."},{"title":"Planning and project initiation","definition":"A system request identifies the project sponsor, business need, business requirements, business value, and special issues. Feasibility comprises technical, economic, and organizational feasibility.","details":"Technical: Can we build it? Economic: Should we build it? Organizational: If we build it, will they come? The workplan controls staffing, schedule, risks and resources.","zh":"不是先挑技術，再找問題。Business value 應先釐清。","memorize":"System request → Feasibility analysis → Approval committee → Project workplan."},{"title":"Analysis versus Design","definition":"Analysis models the problem domain and defines what the system must do. Design refines the analysis deliverables into implementable technical specifications.","details":"Analysis produces requirements definitions and functional, structural, behavioral models. Design makes architecture, UI, data/database, and program-design decisions.","zh":"Analysis 看業務需求；Design 才確定如何實作。兩者相互迭代但不可混為一談。","memorize":"Analysis: as-is/to-be, requirements, system proposal. Design: architecture, interfaces, databases, programs."},{"title":"Implementation and configuration management","definition":"Implementation involves system construction and testing, installation and conversion, user training, and ongoing support.","details":"Configuration management controls evolving artifacts and their versions; change control reduces uncontrolled changes during construction.","zh":"系統「安裝」不代表專案結束，還有訓練、維護與 post-implementation review。","memorize":"Build and test → install/convert and train → support/maintain."},{"title":"Development methodologies","definition":"A methodology is a formalized approach to executing the SDLC. Approaches include Waterfall, Parallel, Phased, Prototyping, Agile (XP/Scrum) and DevOps.","details":"Waterfall is sequential and works best with stable requirements; parallel accelerates via subprojects but raises integration risk; phased delivers staged increments; prototyping explores uncertainty.","zh":"Evolutionary prototype 持續演進；throwaway prototype 用來釐清需求後捨棄。Agile 不是沒有規劃。","memorize":"Waterfall vs Parallel vs Phased vs Evolutionary / Throwaway Prototyping vs Agile."},{"title":"OO foundations and UML","definition":"Object-oriented systems organize software around interacting objects, which encapsulate state (attributes) and behavior (operations).","details":"Classes define common templates; objects are instances. Encapsulation hides internal state, inheritance supports reuse, polymorphism allows different implementations under a common interface. UML specifies model notation, not a development process.","zh":"Class ≠ Object，UML ≠ Unified Process；UML 是畫圖語言，UP 是流程框架。","memorize":"OO: identity, encapsulation, inheritance, polymorphism; UML: functional / structural / behavioral views."},{"title":"Unified Process and iteration","definition":"The Unified Process is use-case driven, architecture-centric, iterative and incremental. Its phases are Inception, Elaboration, Construction, Transition.","details":"Iteration revisits a set of activities; increment delivers an additional slice of functionality. UP phases are not the same as the four SDLC activities.","zh":"「反覆修正」是 iterative；「一部分一部分交付」是 incremental。","memorize":"Inception → Elaboration → Construction → Transition."}]},{"id":2,"title":"Requirements Determination","subtitle":"Functional vs nonfunctional, analysis strategies, elicitation, validation","topics":[{"title":"Requirement types and scope","definition":"A requirement states what the system must do or which characteristic it must have. Functional requirements describe processes and information; nonfunctional requirements specify quality and constraints.","details":"Nonfunctional categories: Operational, Performance, Security, Cultural and Political. A requirements definition establishes system scope and provides inputs for later models.","zh":"「能搜尋課程」是 functional；「2 秒內回傳」是 performance。","memorize":"Functional = behavior; Nonfunctional = how well / under what constraints."},{"title":"Writing requirement statements","definition":"A descriptive requirement expresses one clear obligation. A user story typically follows “As a [role], I want [capability], so that [business value].”","details":"Requirements should be unambiguous, testable, feasible, consistent and traceable. Avoid conflating a broad goal with a directly verifiable requirement.","zh":"把「系統要很快」改成「95% 的查詢在 2 秒內完成」。","memorize":"User story = Role + Goal + Value; acceptance criteria make it testable."},{"title":"Eight requirements-analysis strategies","definition":"Analyze the as-is process before defining the to-be system. The eight course strategies examine problems, causes, time, cost, peer practices, desired outcomes, technologies and eliminable activities.","details":"Problem analysis; Root cause analysis (fishbone); Duration analysis; Activity-based costing; Informal benchmarking; Outcome analysis; Technology analysis; Activity elimination.","zh":"Duration analysis 比的是各步驟實際工作時間 vs 整體耗時；差距大通常是等待。","memorize":"8 strategies: Problem / Root cause / Duration / ABC / Benchmarking / Outcome / Technology / Elimination."},{"title":"Five elicitation techniques","definition":"Select elicitation methods according to accessibility of users, group consensus, process complexity, and availability of artifacts.","details":"Interviews provide depth; questionnaires reach many; observation reveals actual work; document analysis examines manuals/forms; Joint Application Development (JAD) develops shared understanding in workshops.","zh":"訪談可追問但耗時；問卷適用大量使用者；Observation 能發現「使用者自己沒說到」的操作。","memorize":"Interviews | Questionnaires | Observation | Document Analysis | JAD."},{"title":"Interview and observation pitfalls","definition":"Interviews use open-ended, closed-ended and probing questions; interview notes should be verified by the interviewee. Observation needs awareness of observer effects and atypical behavior.","details":"Avoid leading questions. Validate documents against actual practice because formal rules and everyday workflows may differ.","zh":"觀察時被觀察者可能改變行為（Hawthorne effect）；不要把單次情境當成全部。","memorize":"Prepare → ask and probe → document → verify → reconcile."},{"title":"Requirements quality and system proposal","definition":"Validation checks whether requirements represent genuine business needs; verification checks clarity, internal consistency, completeness and testability.","details":"Review textual ambiguity, incomplete actor/action descriptions, conflicts, feasibility and consistency across requirements. The system proposal assembles analysis models plus updated planning artifacts.","zh":"不要把「已寫成文字」等同「已確認正確」；需要走查與利害關係人確認。","memorize":"Quality check → requirements definition → functional/structural/behavioral models → system proposal."}]},{"id":3,"title":"Functional Modeling","subtitle":"Use-case diagrams, activity diagrams, UCD, verification","topics":[{"title":"Three functional-model artifacts","definition":"Functional models represent the system’s external functionality and business processes. Create a use-case diagram, activity diagrams and use-case descriptions (UCD).","details":"A use-case diagram identifies system scope and actors; an activity diagram visualizes control flow; a UCD documents detailed events, alternatives and exceptions.","zh":"Use case 是「系統要提供什麼服務」；不是每個小點擊都要變成 UC。","memorize":"Requirements → Use-case diagram → Activity diagram → UCD; cross-check consistency."},{"title":"Use-case diagram elements","definition":"A use case is a major system function named with a verb–noun phrase. An actor is an external role, not necessarily an individual person.","details":"Actors stay outside the subject boundary; use cases stay inside. Associations link actors and use cases; actor generalization denotes role inheritance.","zh":"Actor 可是外部系統，並非只能是人；subject boundary 定義範圍。","memorize":"Actor | Use case | Subject boundary | Association."},{"title":"Include, extend, generalization","definition":"«include» extracts required shared functionality; «extend» adds conditional/optional behavior; generalization expresses specialization/inheritance.","details":"Include arrow: base → included use case. Extend arrow: extension → base use case. Generalization points to the general element.","zh":"背箭頭方向：include 指向被包含者，extend 指向被延伸的基本 UC。","memorize":"include = mandatory reused behavior; extend = optional variation; generalization = is-a."},{"title":"Activity diagram semantics","definition":"An activity diagram represents activities, their control flow, branching, synchronization and responsibility allocation.","details":"Initial node starts execution; action nodes perform work; decision/merge handle alternatives; fork/join handle concurrency; activity final ends the whole activity, flow final ends one flow. Swimlanes allocate responsibility.","zh":"Decision 是「擇一」；Fork 是「平行」；Flow final 不是整張圖停止。","memorize":"Initial • Action • Decision/Merge • Fork/Join • Activity Final/Flow Final • Swimlane."},{"title":"Use-case descriptions","definition":"A use-case description documents the use-case name, actors, trigger, preconditions, normal flow, alternative/exception flows and postconditions.","details":"Essential UCD describes intent without technology assumptions. Real UCD documents implementation-dependent interface details. Overview and detailed levels serve different precision needs.","zh":"Essential = technology independent；Real = 可提到畫面/按鈕。事件步驟需要能對應 activity。","memorize":"UCD: name → actors → trigger → preconditions → main flow → alternate flows → postconditions."},{"title":"Functional V&V and traceability","definition":"Verification and validation ensure each required behavior has consistent representations across the use-case diagram, activity diagram and UCD.","details":"Check all actors appear in the diagram; each use case has coherent event flows; decisions and alternatives align; events correspond to activities and ultimately operations in structural models.","zh":"三種模型不能各說各話；相同 actor、動作、條件與分支要對得起來。","memorize":"Requirements ↔ UC ↔ Activity ↔ UCD ↔ Class responsibilities."}]},{"id":4,"title":"Structural Modeling","subtitle":"CRC, classes, relations, multiplicity, object diagram","topics":[{"title":"Purpose of structural models","definition":"Structural models describe the static objects of the domain and their relationships. Common artifacts are CRC cards, class diagrams and object diagrams.","details":"The analysis model captures people, places, things and events as domain objects; implementation details are refined later. Identify candidate classes from nouns and responsibilities from verbs.","zh":"不是把句子所有名詞都建成類別；先看系統需求及範圍。","memorize":"CRC → Class diagram → Object diagram (instance snapshot)."},{"title":"Class, attribute, operation","definition":"A class is a template for objects. Attributes represent relevant atomic properties; operations describe domain-specific behavior.","details":"Abstract classes cannot be directly instantiated; concrete classes can. UML compartments show class name, attributes and operations. Visibility: + public, - private, # protected.","zh":"name: String 是 attribute；registerCourse() 是 operation；一個 object 有自己的 attribute 值。","memorize":"ClassName | -attribute: Type | +operation(parameter): ReturnType."},{"title":"Three structural relationships","definition":"Generalization expresses is-a inheritance; aggregation/composition express whole–part relationships; association expresses other meaningful links.","details":"Generalization uses a hollow triangle toward the superclass. Aggregation uses a hollow diamond at the whole; composition uses a filled diamond at the whole and stronger lifecycle ownership.","zh":"「Student is a Person」是 generalization；「Order contains LineItems」常是 composition；「Student enrolls in Course」是 association。","memorize":"is-a ↔ Generalization; part-of ↔ Aggregation/Composition; participates-in ↔ Association."},{"title":"Multiplicity and association classes","definition":"Multiplicity constrains how many instances may participate at each association end. Common forms: 1, 0..1, 0..*, 1..*, m..n.","details":"Multiplicity near class B indicates the number of B instances related to one A instance. A many-to-many association with its own attributes often needs an association class (e.g. Enrollment).","zh":"不要讀反：靠近 Course 的 0..* 指「一位學生可以對應多門課」。","memorize":"1 = exactly one; 0..1 = optional; 1..* = one or more; * = zero or more."},{"title":"CRC cards and role-playing","definition":"CRC stands for Class–Responsibility–Collaboration. CRC cards name a class, describe its responsibilities, and identify its collaborating classes.","details":"Role-playing walks through UCD events and asks which object performs each operation, what information it needs and whom it calls. Revise responsibilities before drawing a full CD.","zh":"CRC 的合作對象須對應合理 class 關係；不只是列名詞。","memorize":"Class → responsibilities → collaborators; iterate with use-case scenarios."},{"title":"Class diagram and object diagram","definition":"A class diagram models types and relationships; an object diagram displays actual instances and links at a specific moment.","details":"Object names may use instanceName:ClassName, and attributes can show current instance values. Diagram relationships must respect class multiplicity constraints.","zh":"Class diagram 是規格；Object diagram 是某一刻「真實有哪些實例」。","memorize":"Class: Student / Course; Objects: doris:Student / sad:Course."},{"title":"Structural modeling consistency","definition":"Structural models must support every necessary use-case event without adding unrelated gold-plating.","details":"Validate class names and types, operations required by flows, association semantics, valid multiplicities and object snapshots. Check consistency with functional models.","zh":"找不到負責某個 UC event 的 operation，代表模型可能漏掉責任。","memorize":"UCD event → operation in class → collaborator/association → object links."}]},{"id":5,"title":"Behavioral Modeling","subtitle":"Sequence/communication diagrams, CRUDE, state machines","topics":[{"title":"Purpose and model types","definition":"Behavioral models show internal dynamic behavior of the system. Interaction diagrams model message exchange; state machines model state changes of objects.","details":"Sequence diagrams emphasize time/order; communication diagrams emphasize object links/message flow. Course slides cover both plus state machines.","zh":"Functional 看外部「做什麼」，Structural 看「有哪些物件」，Behavioral 看「如何互動」。","memorize":"Interaction = messages among objects; State machine = lifecycle of an object."},{"title":"Sequence diagram notation","definition":"A sequence diagram orders messages from top to bottom across actor/object lifelines. Activation bars show execution; return messages show response.","details":"Participants appear at top, lifelines descend, solid message arrows invoke operations and dashed return arrows indicate results. Guard conditions qualify messages; fragments can show conditional flows.","zh":"上到下是時間，不是左右；箭頭指向被呼叫方法的接收者。","memorize":"actor/object lifeline → call message → activation → return message."},{"title":"Instance versus generic sequence","definition":"An instance sequence diagram represents one use-case scenario; a generic sequence diagram represents multiple scenarios through control structures.","details":"The course emphasizes instance sequence diagrams for the main event flow. Each call must map to an appropriate operation of a class shown in the class diagram.","zh":"只畫正常流程的單一路徑，是 instance SD；不要以為它包含所有例外路徑。","memorize":"Choose UC/UCD flow → objects → messages → validate with CD."},{"title":"Communication diagrams","definition":"Communication diagrams display participants and links, annotating messages with sequence numbers that encode execution order.","details":"They emphasize relationship topology rather than vertical time. Messages can be numbered 1, 1.1, 1.2 to indicate nested interactions.","zh":"Communication diagram 不是沒有順序，而是用編號表達順序。","memorize":"Sequence diagram: time order; Communication diagram: interaction structure."},{"title":"CRUDE matrix","definition":"CRUDE captures the ways objects operate upon or interact with domain classes: Create, Read, Update, Delete and Execute.","details":"Use a matrix to cross-check which actor/object performs each operation and whether all responsibilities are covered. Check against UCD events, class operations and sequence messages.","zh":"不要把 CRUD（資料操作四種）和 CRUDE（多一個 Execute）混淆。","memorize":"C=Create; R=Read; U=Update; D=Delete; E=Execute."},{"title":"State machines and transitions","definition":"A behavioral state machine depicts the lifecycle of a significant object with states and transitions triggered by events.","details":"State is a meaningful condition of an object, often tied to attribute values. Transitions use event [guard] / action. Identify initial and final states, and avoid dead ends or invalid transitions.","zh":"State 要是物件的生命週期狀態，不是系統每一步的活動名稱。","memorize":"State A -- event [guard] / action --> State B."},{"title":"Behavioral V&V and model integration","definition":"Validate that messages correspond to real class operations, and transitions correspond to legitimate domain events and attribute changes.","details":"Each UCD event should map to an action/message where appropriate; all objects must exist in structural models; update CD or UCD when the behavioral model exposes missing responsibilities.","zh":"畫完循序圖要反查 CD：message 的 receiver 是否真的擁有那個 operation？","memorize":"UCD ↔ Class diagram ↔ Sequence/Communication ↔ State machine."}]}],"exam":[],"mock":[{"id":1,"chapter":1,"type":"tf","points":2,"question":"The SDLC includes Planning, Analysis, Design and Implementation.","options":["True","False"],"answer":0,"en":"SDLC four phases.","zh":"SDLC four phases."},{"id":2,"chapter":1,"type":"tf","points":2,"question":"Detailed program design is the main deliverable of the Analysis phase.","options":["True","False"],"answer":1,"en":"System Proposal is Analysis; program design is Design.","zh":"System Proposal is Analysis; program design is Design."},{"id":3,"chapter":1,"type":"tf","points":2,"question":"A System Request normally identifies a business need and expected business value.","options":["True","False"],"answer":0,"en":"Planning begins with business need.","zh":"Planning begins with business need."},{"id":4,"chapter":1,"type":"tf","points":2,"question":"A Superclass is always abstract and cannot be instantiated.","options":["True","False"],"answer":1,"en":"Concrete superclasses may be instantiated.","zh":"Concrete superclasses may be instantiated."},{"id":5,"chapter":1,"type":"tf","points":2,"question":"UML is a standard modeling language, not a systems development methodology.","options":["True","False"],"answer":0,"en":"UML vs UP.","zh":"UML vs UP."},{"id":6,"chapter":1,"type":"tf","points":2,"question":"The hollow triangle in a UML Generalization points toward the subclass.","options":["True","False"],"answer":1,"en":"Triangle points toward superclass.","zh":"Triangle points toward superclass."},{"id":7,"chapter":1,"type":"tf","points":2,"question":"In UP, Requirements activities can occur across several phases.","options":["True","False"],"answer":0,"en":"UP workflows overlap phases.","zh":"UP workflows overlap phases."},{"id":8,"chapter":2,"type":"tf","points":2,"question":"A security requirement is categorized as a Functional Requirement merely because it limits system access.","options":["True","False"],"answer":1,"en":"Security is a nonfunctional category in the course.","zh":"Security is a nonfunctional category in the course."},{"id":9,"chapter":2,"type":"tf","points":2,"question":"Observation may reveal informal workarounds that interviews fail to uncover.","options":["True","False"],"answer":0,"en":"Observation vs interview.","zh":"Observation vs interview."},{"id":10,"chapter":2,"type":"tf","points":2,"question":"Root Cause Analysis examines underlying causes instead of only symptoms.","options":["True","False"],"answer":0,"en":"Analyze causes.","zh":"Analyze causes."},{"id":11,"chapter":2,"type":"tf","points":2,"question":"Duration Analysis examines activity costs rather than elapsed time.","options":["True","False"],"answer":1,"en":"Duration focuses elapsed time; ABC costs.","zh":"Duration focuses elapsed time; ABC costs."},{"id":12,"chapter":2,"type":"tf","points":2,"question":"MoSCoW Must Have always means the feature should be implemented first, regardless of dependencies.","options":["True","False"],"answer":1,"en":"Priority and sequence differ.","zh":"Priority and sequence differ."},{"id":13,"chapter":2,"type":"tf","points":2,"question":"Requirements should be verifiable, traceable, clear, consistent, complete and concise.","options":["True","False"],"answer":0,"en":"VT4C criteria.","zh":"VT4C criteria."},{"id":14,"chapter":2,"type":"tf","points":2,"question":"An Actor is always the same thing as a stakeholder.","options":["True","False"],"answer":1,"en":"Stakeholders may have no system interaction.","zh":"Stakeholders may have no system interaction."},{"id":15,"chapter":3,"type":"tf","points":2,"question":"The «include» arrow in a Use-Case Diagram points from the base use case toward the included use case.","options":["True","False"],"answer":0,"en":"Include direction.","zh":"Include direction."},{"id":16,"chapter":3,"type":"tf","points":2,"question":"An «extend» relationship points from the base use case to the optional extension.","options":["True","False"],"answer":1,"en":"Extension points to base.","zh":"Extension points to base."},{"id":17,"chapter":3,"type":"tf","points":2,"question":"A Fork Node creates concurrent paths in an Activity Diagram.","options":["True","False"],"answer":0,"en":"Fork concurrency.","zh":"Fork concurrency."},{"id":18,"chapter":3,"type":"tf","points":2,"question":"A Flow Final Node always terminates every active path in an Activity Diagram.","options":["True","False"],"answer":1,"en":"Flow Final ends only its flow.","zh":"Flow Final ends only its flow."},{"id":19,"chapter":3,"type":"tf","points":2,"question":"Each Use Case should have one Use-Case Description.","options":["True","False"],"answer":0,"en":"One UCD per use case.","zh":"One UCD per use case."},{"id":20,"chapter":4,"type":"tf","points":2,"question":"Multiplicity at an association endpoint describes the allowed number of instances at that endpoint.","options":["True","False"],"answer":0,"en":"Multiplicity semantics.","zh":"Multiplicity semantics."},{"id":21,"chapter":5,"type":"tf","points":2,"question":"A Sequence Diagram represents time-ordered messages between interacting participants.","options":["True","False"],"answer":0,"en":"Behavioral model.","zh":"Behavioral model."},{"id":22,"chapter":3,"type":"choice","question":"Where should an actor appear in a use-case diagram?","options":["Inside the system boundary","Outside the system boundary","Inside each use case","Only in a state machine"],"answer":1,"en":"Actors are roles external to the subject.","zh":"Actor 在系統邊界外。","points":2},{"id":23,"chapter":3,"type":"choice","question":"Which relationship models mandatory shared behavior between use cases?","options":["extend","include","generalization","aggregation"],"answer":1,"en":"Include expresses reused required functionality.","zh":"include 是必要的共用行為。","points":2},{"id":24,"chapter":1,"type":"matching","question":"Match these development terms to their correct meanings.","points":4,"pairs":[["Planning","Business value and feasibility"],["Analysis","Requirements and logical models"],["Design","System architecture and specifications"]],"en":"Correct pairings require matching every concept with its distinct purpose.","zh":"三組配對各自依定義核對，部分正確可得部分分數。"},{"id":25,"chapter":2,"type":"matching","question":"Match each technique with its central purpose.","points":4,"pairs":[["Observation","Examine actual work practices"],["JAD","Reach shared stakeholder understanding"],["Root Cause Analysis","Identify underlying reasons for a problem"]],"en":"Correct pairings require matching every concept with its distinct purpose.","zh":"三組配對各自依定義核對，部分正確可得部分分數。"},{"id":26,"chapter":3,"type":"matching","question":"Match each UML activity node to its function.","points":4,"pairs":[["Decision","Select one alternative path"],["Fork","Start concurrent paths"],["Join","Synchronize concurrent paths"]],"en":"Correct pairings require matching every concept with its distinct purpose.","zh":"三組配對各自依定義核對，部分正確可得部分分數。"},{"id":27,"chapter":1,"type":"short","points":2,"question":"State the four SDLC phases in order and give their core questions.","answer":"Planning WHY; Analysis WHAT; Design HOW; Implementation BUILD/TEST/DELIVER.","en":"Four phase sequence","zh":"Four phase sequence","keywords":["why","what","how","implementation"]},{"id":28,"chapter":1,"type":"short","points":3,"question":"Explain two differences between Waterfall and evolutionary prototyping.","answer":"Waterfall emphasizes sequential milestone-based development with stable requirements and late feedback. Evolutionary prototyping repeatedly refines a prototype that may become the production system.","en":"Sequential vs iterative","zh":"Sequential vs iterative","keywords":["waterfall","prototype","feedback"]},{"id":29,"chapter":2,"type":"short","points":3,"question":"Give one Functional and one measurable Non-functional Requirement for a clinic appointment system.","answer":"FR: The system shall allow a patient to book an available slot. NFR: At least 95% of availability searches complete within 2 seconds under agreed workload.","en":"Function vs quality","zh":"Function vs quality","keywords":["functional","nonfunctional","measurable"]},{"id":30,"chapter":2,"type":"short","points":3,"question":"Explain Problem Analysis vs Root Cause Analysis with a scheduling example.","answer":"Problem Analysis identifies duplicate bookings as an observable problem. Root Cause Analysis examines whether disconnected schedules or manual duplicate entry cause the problem.","en":"Problem vs root cause","zh":"Problem vs root cause","keywords":["problem","root cause","example"]},{"id":31,"chapter":2,"type":"short","points":3,"question":"Explain VT4C and identify a missing criterion in: 'The system should be very fast'.","answer":"VT4C: Verifiable, Traceable, Clear, Consistent, Complete, Concise. Very fast is unclear and not verifiable without quantitative conditions.","en":"Six quality criteria","zh":"Six quality criteria","keywords":["clear","verifiable","vt4c"]},{"id":32,"chapter":2,"type":"short","points":3,"question":"Distinguish Interview, Observation and Document Analysis.","answer":"Interview asks stakeholders about their work; Observation examines actual behavior; Document Analysis reviews existing forms, reports, and procedures.","en":"Gathering techniques","zh":"Gathering techniques","keywords":["interview","observation","document"]},{"id":33,"chapter":3,"type":"short","points":4,"question":"State the correct directions and purposes of «include» and «extend».","answer":"Include is base → included, used for reusable required behavior. Extend is extension → base, used for optional or conditional behavior.","en":"UML arrows","zh":"UML arrows","keywords":["include","extend","direction"]},{"id":34,"chapter":3,"type":"diagram","points":4,"question":"Draw an Activity Diagram for booking an appointment: Start → Check Availability → Decision with available/unavailable branches → Confirm/Reject → End. Use Mermaid flowchart syntax.","answer":"flowchart TD\n A((Start)) --> B[Check Availability]\n B --> C{Available?}\n C -->|available| D[Confirm Booking]\n C -->|unavailable| E[Reject Booking]\n D --> F((End))\n E --> F","en":"Activity control nodes","zh":"Activity control nodes","keywords":["decision","merge","fork","join"],"diagramKind":"activity","diagramKeys":["flowchart","check","{","available","unavailable"]},{"id":35,"chapter":3,"type":"short","points":4,"question":"Describe the purpose of a Use-Case Description and list at least five important fields.","answer":"One UCD specifies a single use case, including ID, Name, Primary Actor, Trigger, Brief Description, Normal Flow, Alternate Flows and Relationships.","en":"UCD fields","zh":"UCD fields","keywords":["actor","trigger","normal flow","alternate"]},{"id":36,"chapter":3,"type":"short","points":4,"question":"List the major checks of a Functional Model walkthrough.","answer":"Each Activity Action maps to a UCD event; their order matches; each Use Case has one UCD; Actors and Relationships match diagrams; alternative paths are accounted for.","en":"V&V walkthrough","zh":"V&V walkthrough","keywords":["action","ucd","actor","relationship"]},{"id":37,"chapter":4,"type":"diagram","points":4,"question":"Draw a UML Class Diagram using Patient, Doctor, Appointment and associations with multiplicity. Use Mermaid classDiagram syntax.","answer":"classDiagram\n class Patient\n class Doctor\n class Appointment\n Patient \"1\" -- \"0..*\" Appointment : books\n Doctor \"1\" -- \"0..*\" Appointment : attends","en":"Structural CRC","zh":"Structural CRC","keywords":["class","responsibilities","collaborators"],"diagramKind":"class","diagramKeys":["classDiagram","Patient","Doctor","Appointment","0..*"]},{"id":38,"chapter":5,"type":"diagram","points":5,"question":"Draw a Sequence Diagram for booking a successful appointment using Patient, BookingUI, BookingController, Appointment; include request, validation, create and confirmation. Use Mermaid sequenceDiagram syntax.","answer":"sequenceDiagram\n actor Patient\n participant BookingUI\n participant BookingController\n participant Appointment\n Patient->>BookingUI: request()\n BookingUI->>BookingController: schedule()\n BookingController->>BookingController: validateAvailability()\n BookingController->>Appointment: create()\n Appointment-->>BookingController: confirmation\n BookingController-->>BookingUI: confirmed()","en":"Behavioral views","zh":"Behavioral views","keywords":["sequence","messages","state","transition"],"diagramKind":"sequence","diagramKeys":["sequenceDiagram","Patient","BookingUI","BookingController","Appointment","->>"]}],"images":[]};
const KEY='sad-review-2026-v2';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){state={}}state={theme:'light',seen:{},pastAnswers:{},flags:{},wrong:{},mockAnswers:{},mockDuration:60,mockDeadline:null,mockStarted:false,mockSubmitted:false,mockWrittenScores:{},...state};let tab='home',chapter=1,filter='',pastMode='all',pastIndex=0,quickItems=[],quickAnswers={};const $=id=>document.getElementById(id), E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('本機儲存失敗，請檢查瀏覽器空間')}}function toast(t){let x=$('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2300)}function count(){let xs=DATA.exam.filter(q=>Array.isArray(q.options)&&q.options.length),done=xs.filter(q=>state.pastAnswers[q.id]!=null),good=done.filter(q=>state.pastAnswers[q.id]===q.answer);return{done:done.length,total:xs.length,good:good.length,rate:done.length?Math.round(100*good.length/done.length):0,read:Object.keys(state.seen).filter(x=>state.seen[x]).length,readingTotal:DATA.chapters.reduce((a,c)=>a+c.topics.length,0)}}function pct(a,b){return b?Math.round(a*100/b):0}function bar(a,b){return `<div class="progress"><i style="width:${pct(a,b)}%"></i></div>`}function navigate(t){if(t==='past'||t==='flags')t='mock';tab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render();scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>navigate(b.dataset.tab));function stat(label,value,sub){return `<div class="card stat"><div class="muted small">${label}</div><div class="num">${value}</div><div class="small muted">${sub}</div></div>`}
function renderHome(){let s=count(),cards=DATA.chapters.map(c=>{let n=c.topics.filter((_,i)=>state.seen[c.id+'-'+i]).length;return `<div class="card chapterCard"><span class="bubble">${String(c.id).padStart(2,'0')}</span><div style="flex:1"><b>${E(c.title)}</b><div class="small muted">${c.topics.length} learning topics · ${n} reviewed</div>${bar(n,c.topics.length)}<button class="btn ghost small" style="margin-top:9px" onclick="openChapter(${c.id})">Open chapter →</button></div></div>`}).join('');return `<section class="hero"><div><div class="eyebrow">SYSTEM ANALYSIS & DESIGN · 2026</div><h1>Midterm, meet your match. ✦</h1><p>2026 系統分析與設計期中考複習：完整英中雙語教材、UML 圖解與模擬試題。</p><button class="btn primary" onclick="openChapter(1)">Start studying ↗</button> <button class="btn" onclick="navigate('mock')">Practice mock exam</button></div><div style="font-size:72px;opacity:.7">◈</div></section><div class="grid" style="margin-top:17px">${stat('Reading progress',pct(s.read,s.readingTotal)+'%',s.read+' / '+s.readingTotal+' topics')}${stat('Mock exam questions',DATA.mock.length,'Original practice questions')}${stat('Mock exam status',state.mockSubmitted?'Submitted':state.mockStarted?'In progress':'Not started','Timed practice')}${stat('Completed notes',Object.keys(state.seen).filter(x=>state.seen[x]).length,'Chapter progress')}</div><div class="split" style="margin-top:17px"><section><div class="sectiontitle"><h2>Chapter map</h2><span class="pill">5 chapters</span></div><div class="chapgrid">${cards}</div><div class="card" style="margin-top:15px"><b>Source scope note</b><p class="small muted">The 2026 lecture slides are the primary chapter map (Ch1–Ch5). The textbook’s chapter numbering differs from the 2026 lecture slides. This site now focuses on the midterm lecture chapters and original mock questions; the final exam archive has been removed.</p></div></section><aside><div class="sectiontitle"><h2>Quick Quiz ⚡</h2><button class="btn" onclick="newQuick()">↻ 3 new</button></div><div class="card" id="quickBox"></div></aside></div>`}
function newQuick(){let pool=DATA.mock.filter(q=>q.type==='choice');quickItems=pool.map(x=>x).sort(()=>Math.random()-.5).slice(0,3);quickAnswers={};renderQuick()}function renderQuick(){let box=$('quickBox');if(!box)return;box.innerHTML=quickItems.map((q,i)=>`<div style="border-bottom:1px solid var(--line);padding:12px 0"><div class="small muted">Q${i+1} · Ch${q.chapter}</div><b>${E(q.question)}</b>${q.options.map((x,j)=>`<button class="option ${quickAnswers[q.id]===j?(j===q.answer?'correct':'wrong'):''}" ${quickAnswers[q.id]!=null?'disabled':''} onclick="answerQuick(${q.id},${j})">${E(x)}</button>`).join('')}${quickAnswers[q.id]!=null?`<div class="small" style="color:${quickAnswers[q.id]===q.answer?'var(--good)':'var(--bad)'}">${quickAnswers[q.id]===q.answer?'✓ Correct':'✕ Not quite'}. ${E(q.zh)}</div>`:''}</div>`).join('')}function answerQuick(id,v){quickAnswers[id]=v;renderQuick()}
function openChapter(id){chapter=id;navigate('chapters')}const CH1_DEEP_DIVE="<section class=\"card\" style=\"margin:0 0 20px;padding:20px\"><span class=\"pill\">CH1 EXPANDED • 2026 COURSE</span><h2>Chapter 1 · Extended Master Notes</h2><p class=\"muted\">Detailed English-first concepts, traditional Chinese guidance, comparison rules, modeling SOP, Clinic walkthrough and exam checks. Expand a topic below. Built from the course lecture and textbook framework; explanatory teaching adaptations are not presented as textbook quotations.</p><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">01 · SDLC Four Phases & Deliverables</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> The SDLC has four fundamental phases: Planning, Analysis, Design, and Implementation.</p><p style=\"white-space:pre-line\">Planning asks WHY a project is needed: System Request, Technical/Economic/Organizational Feasibility, Project Plan. Analysis asks WHO, WHAT, WHERE and WHEN: Requirements Definition, Functional/Structural/Behavioral Models, System Proposal. Design asks HOW: Build/Buy/Outsource, Architecture, User/Component Interfaces, Database and Program Specifications. Implementation builds, tests, installs, trains users, and maintains the system.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>四階段必背：Planning = WHY；Analysis = WHAT；Design = HOW；Implementation = BUILD, TEST, INSTALL, SUPPORT。產出物依序逐步精緻化。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">02 · Planning: Business Value, System Request & Feasibility</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> Systems development should be justified by business needs and business value.</p><p style=\"white-space:pre-line\">System Request fields: Project Sponsor; Business Need; Business Requirements; Business Value; Special Issues. Technical Feasibility: Can we build it? Economic Feasibility: Should we build it? Organizational Feasibility: Will stakeholders adopt it? A Request for Proposal (RFP) invites potential vendors to propose solutions; it is different from the internal System Request.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>確認系統創造價值與是否可行，屬於 Planning；不等於直接設計資料庫或開始 Coding。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">03 · As-Is, To-Be, Business vs System Requirements</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> Analysis models the current As-Is business and determines the future To-Be system.</p><p style=\"white-space:pre-line\">Functional Requirements specify business processes or information the system must handle. Nonfunctional Requirements cover operational, performance, security, and cultural/political constraints. Analysis emphasizes logical WHAT; Design develops technical HOW. A system proposal consolidates requirements and analysis models.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>例如『可線上預約』是 Functional Requirement；『兩秒內回應』是 Performance / Nonfunctional Requirement；『PostgreSQL 儲存』是 Design 決策。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">04 · Design & Implementation Decision Rules</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> Design defines how the proposed system operates; Implementation delivers the working system.</p><p style=\"white-space:pre-line\">Design Strategy: In-house development, packaged software purchase, or outsourced development. Architecture: Software, Hardware, Network. Interfaces: User Interface and Component Interface. Database/file specifications and program design complete the System Specification. Implementation: coding, testing, installation, user training, support. Configuration Management identifies controlled items, controls changes and maintains version/status records.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>教授的階段分類題：決定是否外包、畫正式介面、設計資料庫 → Design；版本控管與程式建構、部署、訓練 → Implementation。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">05 · Waterfall and V-Model</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> Waterfall is sequential development; the V-Model emphasizes planned correspondence between design artifacts and testing.</p><p style=\"white-space:pre-line\">Waterfall: Planning → Analysis → Design → Implementation, with approval milestones and relatively late user feedback. Advantages: clear documentation and controls. Weakness: costly late changes. V-Model pairs Requirements with Acceptance Testing, System Specifications with System Testing, Architecture with Integration Testing, and Detailed Design with Unit Testing. In this lecturer's Chapter 1, the Parallel Model is presented as the V-Model, with a development activity paired to its corresponding testing activity.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>以本課程教師版為準：<b>Parallel Model = V Model</b>。此圖的重點是開發階段與測試階段一一對應，並非兩個子專案同時開發。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">06 · Phased Development and Prototyping</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> Phased Development incrementally delivers functional releases; prototyping clarifies requirements through early feedback.</p><p style=\"white-space:pre-line\">Phased release example: Booking → Availability → Notifications. Evolutionary Prototyping refines a prototype into a production system; Throwaway Prototyping discards an exploratory prototype after learning. Both permit early stakeholder feedback. Phased delivery does not require discarding earlier releases.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>看 Prototype 的『命運』：留著改到正式版＝Evolutionary；丟掉重新建＝Throwaway。Incremental = 增加功能；Iterative = 重複細化。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">07 · Agile: XP and Scrum</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> Agile methods emphasize short feedback loops, incremental delivery and responsiveness to change.</p><p style=\"white-space:pre-line\">XP engineering practices include Pair Programming, Test-Driven Development (Red → Green → Refactor), Continuous Integration, Small Releases and Refactoring. Scrum organizes work through Product Backlog, Sprint, Sprint Planning, Daily Scrum, Sprint Review and Sprint Retrospective. Roles/accountabilities: Product Owner, Scrum Master, Developers. XP focuses engineering practices while Scrum structures team collaboration.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>XP 偏重程式工程技術；Scrum 偏重 Sprint 框架。兩者可以同時使用，不能因 Scrum 使用 Sprint 就說一定有 TDD。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">08 · DevOps: CI, CD and Feedback</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> DevOps integrates software development, operations, automation, monitoring and feedback.</p><p style=\"white-space:pre-line\">Cycle: Plan → Code → Build → Test → Release → Deploy → Operate → Monitor. Continuous Integration integrates code with automated checks. Continuous Delivery keeps releases deployable; Continuous Deployment automatically deploys qualifying changes. Operations feedback should inform subsequent requirements and improvements.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>CI 不等於自動部署。Continuous Delivery（隨時可發布）與 Continuous Deployment（通過後自動發布）亦不同。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">09 · OOIS: Class, Object, Attributes, Operations, Messages</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> A class is a template defining shared structure and behavior; an object is an identifiable instance with state and behavior.</p><p style=\"white-space:pre-line\">Class: Student. Object: joe. Attribute: major. Operation: addCourse(). Method: implementation of an operation. Message: invocation sent to an object, potentially including arguments and returns. Encapsulation groups state and behavior; Information Hiding conceals internal details. Identity, State and Behavior describe an object.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>Student joe = new Student(); 其中 Student 是 Class、joe 是 Object。Operation 表示行為規格，Method 偏實作，不應完全混為一談。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">10 · Inheritance, Generalization & Polymorphism</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> Generalization is an IS-A relation; polymorphism supports subclass-specific behavior through a common type.</p><p style=\"white-space:pre-line\">In UML, generalization is a solid line with a HOLLOW TRIANGLE pointing toward the SUPERCLASS. GradStudent IS-A Student. A superclass is not automatically abstract: a concrete superclass can be instantiated. Dynamic dispatch chooses a normally overridden method according to the runtime receiver's class. Overloading is different from Overriding.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>空心三角指向父類別。Animal a = new Bird(); a.move() 呼叫 Bird 覆寫的方法（在一般動態派發下）。父類別不代表一定是抽象類別。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">11 · OOAD: Three Architecture Views & Iteration</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> OOAD is Use-Case Driven, Architecture-Centric, and Iterative and Incremental.</p><p style=\"white-space:pre-line\">Functional View (external): Use Case Diagram, Activity Diagram, Use-Case Description. Structural View (static): CRC Cards, Class Diagram, Object Diagram. Behavioral View (dynamic): Sequence Diagram, Communication Diagram, State Machine Diagram. Verify use cases against responsibilities and sequence messages; revisit inconsistent models iteratively. Iterative = repeated refinement. Incremental = successive additions.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>功能模型描述 WHAT、結構模型描述物件有哪些、行為模型描述物件互動與狀態演化。模型必須雙向核對而非各畫各的。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">12 · Unified Process: Phases, Workflows and Milestones</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> UP is iterative and incremental, with two dimensions: Phases (WHEN) and Workflows (WHAT).</p><p style=\"white-space:pre-line\">Phases: Inception (scope/business case; Lifecycle Objectives), Elaboration (baseline architecture/risk; Lifecycle Architecture), Construction (build/test; Initial Operational Capability), Transition (deploy/accept; Product Release). Engineering workflows: Business Modeling, Requirements, Analysis, Design, Implementation, Test, Deployment. Supporting: Project Management, Configuration & Change Management, Environment. Workflows can span multiple phases.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>UP 的 Inception 不等於只做需求，也不能將四個 UP Phases 強行與四個 SDLC Phase 做一對一等號。『Requirements 只在 Inception』是陷阱。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">13 · UML: Diagram Selection and Terminology</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> UML is a standardized visual modeling language rather than a development methodology.</p><p style=\"white-space:pre-line\">Use Case = actors and external goals; Activity = actions, control flow and decisions; Class = static classes/attributes/operations/associations; Object = instance snapshot; Sequence = time-ordered messages and lifelines; Communication = numbered collaboration; State Machine = states, transitions, events and guards. The course slide diagram count can use a different grouping; use prescribed diagrams and standard notation in exams.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>UML ≠ UP ≠ SDLC。正式考試繪圖須遵守教授範例中箭頭的虛實與方向。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">14 · Modeling SOP: From Business Problem to Validated Views</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> Recommended introductory seven-step integrated modeling procedure.</p><p style=\"white-space:pre-line\">1 Identify business problem/value. 2 Identify stakeholders, actors and requirements. 3 Build functional use cases and process descriptions. 4 Identify relevant domain objects/classes and responsibilities. 5 Build behavioral interactions and state changes. 6 Verify syntax and validate against requirements, checking links between use cases, operations and messages. 7 Iteratively refine and recheck. This introductory seven-step outline is NOT the later Chapter 4 CRC-to-class-diagram 7-step process.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>常犯的五個錯誤：先決定技術再釐清業務、Generalization 指錯方向、Include/Extend 混淆、無需求依據就亂加 Class、各模型彼此矛盾。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">15 · Doctor–Patient Clinic End-to-End Case</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> An appointment system illustrates planning, requirements, functional/structural/behavioral modeling and iterative delivery.</p><p style=\"white-space:pre-line\">SCENARIO (original teaching adaptation): A clinic uses paper schedules and phone calls. Patients need to request, reschedule and cancel appointments, while doctors maintain available hours. Receptionists manage requests; the system prevents duplicate bookings and confirms successful appointments. PLANNING: sponsor=clinic manager; need=reduce errors and administration. REQUIREMENTS: book/cancel/reschedule, maintain availability, prevent conflicts, confirmation; security and responsiveness as nonfunctional. FUNCTIONAL: actors Patient, Receptionist, Doctor; use cases Request Appointment, Cancel Appointment, Maintain Availability. STRUCTURAL: Patient, Doctor, Appointment, Availability. BEHAVIORAL: request → availability check → create or reject → confirmation. V&V: every requirement must map to behavior and appropriate object responsibilities.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>完整推導：Business Problem → System Request → Requirements → Actors/Use Cases → Classes → Sequence Messages → Tests。案例是依教材情境重新整理的教學範例，不是原書逐字內容。</p></div></details><details class=\"card\" style=\"margin-bottom:12px;padding:18px\"><summary style=\"cursor:pointer;font-weight:750;font-size:1.05rem\">16 · Golden Rules & Three Concept Traps</summary><div style=\"padding-top:12px\"><p><strong>Core Definition:</strong> Memorize the phase distinction, polymorphism and UP two-dimensional organization.</p><p style=\"white-space:pre-line\">EIGHT RULES: (1) Planning WHY; Analysis WHAT; Design HOW; Implementation BUILD. (2) Systems must deliver Business Value. (3) Requirements differ from technical specifications. (4) Object = instance of Class. (5) Generalization hollow arrow → superclass. (6) Runtime dispatch may call subclass overrides. (7) OOAD = use-case-driven + architecture-centric + iterative/incremental. (8) UP Phase = WHEN / Workflow = WHAT. TRAP A: Requirements exist ONLY in Inception? FALSE, workflows overlap phases. TRAP B: Parent-type reference can call subclass-specific overridden method? TRUE. TRAP C: Prototype discarded after exploration? Throwaway Prototyping.</p><p class=\"muted\" style=\"white-space:pre-line\"><b>中文補充：</b>以上 8 句是考前速記。考題陷阱常見 only、always、與把不同分類方式寫成同義詞。</p></div></details><details class=\"card\" style=\"padding:16px\"><summary style=\"cursor:pointer;font-weight:700\">Mermaid · SDLC / UP / Clinic diagrams</summary><p class=\"small muted\">Copy the source into a Mermaid-compatible editor to render diagrams. The examples below are conceptual teaching representations.</p><pre style=\"white-space:pre-wrap;overflow-wrap:anywhere\">flowchart LR\n Planning --&gt; Analysis --&gt; Design --&gt; Implementation\n</pre><pre style=\"white-space:pre-wrap;overflow-wrap:anywhere\">classDiagram\n class Student\n class GradStudent\n Student &lt;|-- GradStudent\n</pre><pre style=\"white-space:pre-wrap;overflow-wrap:anywhere\">sequenceDiagram\n actor Patient\n participant Booking\n participant Schedule\n Patient-&gt;&gt;Booking: requestAppointment()\n Booking-&gt;&gt;Schedule: checkAvailability()\n Schedule--&gt;&gt;Booking: available\n Booking--&gt;&gt;Patient: confirmation\n</pre></details></section>";const LESSON_FULL={"1":"<h1>Chapter 1. Introduction to System Development & Systems Analysis and Design</h1><p class=\"muted\">English-first definitions · 繁體中文深入解析 · SDLC / OOAD / UP / UML · Mermaid diagrams · V&V · Clinic walkthrough</p><nav class=\"toc\"><a class=\"pill\" href=\"#part1\">1. Core concepts</a><a class=\"pill\" href=\"#part2\">2. SDLC Four Phases</a><a class=\"pill\" href=\"#part3\">3. Methodologies</a><a class=\"pill\" href=\"#part4\">4. Object-Oriented Systems</a><a class=\"pill\" href=\"#part5\">5. OOAD and Unified Process</a><a class=\"pill\" href=\"#part6\">6. UML Modeling SOP</a><a class=\"pill\" href=\"#part7\">7. Clinic Walkthrough</a><a class=\"pill\" href=\"#part8\">8. Cheat Sheet & Quiz</a></nav>\n<section id=\"part1\"><h2>1. Core Definition & Theoretical Framework</h2><section class='card' style='padding:18px;margin:18px 0;border:1px solid var(--accent)' id='teacher-ch1'><h3>SDLC Core Definitions &amp; Key Concepts</h3><h3>SDLC：Analysis / Design 填空（p.6–7）</h3><p><b>Analysis Phase</b>: Establish the <b>requirements</b>; create analysis models in <b>UML</b>.</p><p class='cn'><b>分析階段：</b>建立並逐步精煉<b>需求（Requirements）</b>；用<b>UML（統一塑模語言）</b>建立系統分析模型，捕捉使用者的業務流程與資料。先看<b>As-Is（現況）</b>與<b>To-Be（未來）</b>，最後形成<b>System Proposal（系統提案）</b>。</p><p><b>Design Phase</b>: Design <b>user interfaces</b> and <b>component interfaces</b>; develop <b>data &amp; database specifications</b>.</p><p class='cn'><b>設計階段：</b>設計<b>使用者介面（User Interfaces）</b>與<b>元件介面（Component Interfaces）</b>，制定<b>資料及資料庫規格（Data &amp; Database Specifications）</b>；技術架構分為<b>Software（軟體）</b>、<b>Hardware（硬體）</b>與<b>Network（網路）</b>。</p><h3>Methodology：教師版標準填空（p.10–11）</h3><p><b>Process-oriented → Repeatability</b>（流程導向 → 可重複／標準化）<br><b>Data-centered → Business Intelligence</b>（資料導向 → 商業智慧）<br><b>Object-oriented → Reusability</b>（物件導向 → 可重用性）<br><b>RAD → Agility</b>（快速應用程式開發 → 敏捷應變）</p><p><b>Sequential → Structured Development</b>；<b>Iterative / Cyclic → RAD, Agile, DevOps</b>.</p><p class='cn'><b>循序式</b>在本張教師版的分類答案是<b>Structured Development（結構化開發）</b>；<b>迭代／循環式</b>對應<b>RAD、Agile、DevOps</b>。此為教授投影片的課堂分類，與其他教材對特定實務方法的細節比較要分開看。</p><h3>DevOps 教師版填空（p.18）</h3><p><b>Requirements include testing-related activities. Automation is the key to enable DevOps.</b></p><p class='cn'>教授填空為<b>testing（測試）</b>與<b>Automation（自動化）</b>。<b>DevOps</b>是<b>Agile</b> 的延伸，強調在開發階段也考慮系統交付、實際運作、持續整合及反覆測試。</p><h3>Which Methodology to Use? 情境題（p.21）</h3><div style='overflow:auto'><table><thead><tr><th>情境</th><th>教師版答案</th><th>辨識線索</th></tr></thead><tbody><tr><td>大型 ERP 系統</td><td><b>Phased Development</b></td><td>分批交付大系統功能</td></tr><tr><td>工廠生管系統</td><td><b>Parallel Development</b></td><td>依本課教師版的 V-Model，開發各階段安排對應測試活動</td></tr><tr><td>政府委外系統</td><td><b>Waterfall</b></td><td>明確階段與正式核准</td></tr><tr><td>遊戲軟體</td><td><b>Prototyping / DevOps</b></td><td>快速試作、回饋與更新</td></tr></tbody></table></div><p class='cn'>老師也說這些情境<b>都可以運用 Agile</b>，但必須考慮<b>Communication Costs（溝通成本）</b>和<b>Entire Development Time Frame（完整開發時程）</b>，常用<b>Time-boxing（限時區塊）</b>控制時間。表中是這份課堂題目的示範答案，不表示每種產業永遠只能使用一種方法。</p><h3>OOIS / OOAD 教師版填空（p.22–28）</h3><p><b>Object = instance of a class</b>; <b>Methods = behavior</b>; <b>Messages trigger method calls</b>.</p><p class='cn'><b>Object（物件）</b>是由<b>Class（類別）</b>產生的實例；<b>Methods（方法）</b>代表類別可執行的行為；<b>Message（訊息）</b>會觸發方法呼叫。<b>Superclass（父類別）</b>可由<b>Subclass（子類別）</b>繼承。</p><p><b>Dynamic Binding = Type Binding + Method Binding</b>; <b>OOAD = Functional + Structural + Behavioral Views</b>.</p><p class='cn'><b>Dynamic Type Binding（動態型別繫結）</b>是在執行時決定參照變數對應的實際物件型別；<b>Dynamic Method Binding（動態方法繫結）</b>是在執行時決定要執行哪個覆寫方法。<b>Functional View（功能觀點）</b>看使用者需求，<b>Structural View（結構觀點）</b>看類別內容和關係，<b>Behavioral View（行為觀點）</b>看訊息互動及結果。</p><p><b>OOAD is iterative and incremental</b> because analysts and users learn more about the future system over time.</p><p class='cn'>**為何 OOAD 需迭代？**教授教師版填空是<b>需求不明確</b>；分析師與使用者會隨著開發逐步更了解未來系統，因此可能返回修訂先前的分析或設計。</p><h3>Unified Process / UML（p.29–33）</h3><p><b>UP</b> has overlapping <b>Phases</b> (time periods) and <b>Workflows</b> (activities). <b>UML 2.5</b> groups diagrams into <b>Structure Diagrams</b> and <b>Behavior Diagrams</b>.</p><p class='cn'><b>UP（統一開發流程）</b>包含時間上的<b>階段（Phases）</b>及工作上的<b>流程（Workflows）</b>，不同活動會互相重疊。教師版指出 <b>UML 2.5</b>有兩大組：<b>Structure Diagrams（結構圖）</b>描述<b>靜態與結構關係</b>；<b>Behavior Diagrams（行為圖）</b>描述<b>物件／實例間動態關係</b>。</p></section><p><b>Systems Development Life Cycle (SDLC):</b> The process of understanding how an information system can support business needs, designing and building the system, and delivering it to users.</p><p>資訊系統開發的目標不是為技術而技術；真正的核心是 Business Value，包括降低成本、提升服務品質、改善營運效率。Business Need → Requirements → Models → Design → Operational System。各階段產出物為下個階段提供輸入，形成 progressive refinement。</p><h3>Key Glossary</h3><div style=\"overflow:auto\"><table><thead><tr><th>Term</th><th>English Definition</th><th>中文關鍵辨析</th></tr></thead><tbody><tr><td>SDLC</td><td>The overall systems development lifecycle.</td><td>系統開發生命週期，涵蓋 Planning, Analysis, Design, Implementation。</td></tr><tr><td>Systems Analyst</td><td>A professional who analyzes business situations, identifies improvements and defines information-system solutions.</td><td>不是只負責程式設計，而要理解企業流程與價值。</td></tr><tr><td>Project Sponsor</td><td>The stakeholder promoting and supporting a project based on business need.</td><td>專案發起人，協助定義業務目標。</td></tr><tr><td>Deliverable</td><td>A specific document, model, or product produced by a development task.</td><td>每階段都應產出可供後續使用的成果。</td></tr><tr><td>As-Is System</td><td>The current business process or system.</td><td>現行系統。</td></tr><tr><td>To-Be System</td><td>The proposed future business process or system.</td><td>未來系統。</td></tr><tr><td>Business Value</td><td>Benefits created for the organization by the system.</td><td>可為可衡量或難量化的效益。</td></tr><tr><td>Verification</td><td>Checking whether a specification or model is internally correct.</td><td>是否正確照規格建立。</td></tr><tr><td>Validation</td><td>Checking whether the system/model satisfies actual stakeholder needs.</td><td>是否滿足真正業務需求。</td></tr></tbody></table></div></section>\n<section id=\"part2\"><h2>2. Four Fundamental SDLC Phases</h2><pre class=\"mermaid\">flowchart LR\\n P[\"Planning: WHY\"] --> A[\"Analysis: WHAT\"]\\n A --> D[\"Design: HOW\"]\\n D --> I[\"Implementation: BUILD / TEST / DEPLOY\"]</pre><details><summary>Copyable Mermaid source</summary><pre><code>flowchart LR\\n P[\"Planning: WHY\"] --> A[\"Analysis: WHAT\"]\\n A --> D[\"Design: HOW\"]\\n D --> I[\"Implementation: BUILD / TEST / DEPLOY\"]</code></pre></details><h3>Planning: Why build the system?</h3><p><b>Project Initiation:</b> Receive System Request or RFP; clarify the Business Problem, Goals and expected Business Value; perform Technical, Economic and Organizational Feasibility; obtain approval. <b>Project Management:</b> Develop Work Plan, Staff Project, Monitor and Control. Deliverables: System Request, Feasibility Analysis, Project Plan.</p><p>System Request typically contains Project Sponsor, Business Need, Business Requirements, Business Value, and Special Issues. RFP (Request for Proposal) solicits external vendor proposals; it is not identical to an internal System Request.</p><div style=\"overflow:auto\"><table><thead><tr><th>Feasibility</th><th>Central Question</th><th>Key Checks</th></tr></thead><tbody><tr><td>Technical Feasibility</td><td>Can we build it?</td><td>Technology familiarity, functional-area knowledge, project size, compatibility.</td></tr><tr><td>Economic Feasibility</td><td>Should we build it?</td><td>Development/operating costs, annual benefits, tangible and intangible value.</td></tr><tr><td>Organizational Feasibility</td><td>Will they come?</td><td>Strategic alignment, management support, champions, adoption.</td></tr></tbody></table></div><h3>Analysis: What should the system do?</h3><p>Develop Analysis Strategy by investigating As-Is and To-Be operations. Gather and refine Requirements, specify WHO / WHAT / WHERE / WHEN, and create Functional, Structural and Behavioral Models. Deliverable: <b>System Proposal</b>, consolidating Requirements Definition, System Concept and models. Analysis emphasizes logical business requirements rather than selected server products or SQL implementation.</p><h3>Design: How will the system work?</h3><p>Four steps: (1) Design Strategy (Build, Buy, Outsource). (2) Architecture and Interface Design (Software, Hardware, Network; User Interface and Component Interface). (3) Database and File Specifications. (4) Program Design defining modules and inputs/outputs. Deliverable: <b>System Specification</b>.</p><h3>Implementation: Build, test, install and support</h3><div class='card' style='padding:18px;margin:12px 0 18px;border:1px solid var(--accent)'><div class='eyebrow'>2026 CH1 SLIDE 8–9 · 課堂考試重點</div><h3>Implementation Phase｜Three Major Steps（實作階段三大步驟）</h3><ol><li><b>Construct the system（建構系統）</b>：<b>Build it &amp; test it（建置與測試）</b>。此階段還要進行 <b>Configuration Management（組態管理／建構管理）</b>。</li><li><b>Install system（安裝系統）</b>：將系統導入實際環境，並 <b>Train the users（訓練使用者）</b>。教授在投影片特別追問「容易嗎？」：不能假設訓練和導入沒有困難，應考慮新流程學習與使用者適應。</li><li><b>Support the system（支援系統）</b>：進行 <b>Maintenance（維護）</b>。某些情況下，維護可能被視為獨立階段，例如 <b>Outsourced Maintenance（委外維護）</b>。</li></ol><h4>Configuration Management（組態管理）｜三個重點</h4><p>此處依教師版 Ch1 第 8–9 頁的正式填空答案列出：<b>① 程式簽出／簽入管制 ② 變更管制 ③ 版本管制</b>。請優先背下這三項，因為投影片第 8 頁和第 9 頁都特別以問號要求回答。</p><div style='overflow:auto'><table><thead><tr><th>課堂手寫重點</th><th>中文輔助理解</th><th>English terminology（補充對照）</th></tr></thead><tbody><tr><td><b>變更管制</b></td><td>系統需求、程式或設定有變更時，應先記錄、評估、核准並追蹤。</td><td>Change Control</td></tr><tr><td><b>程式簽出／簽入管制</b></td><td>管理程式檔案的簽出、編輯與簽入，避免多人修改衝突，並追蹤由誰取用、修改及歸還。</td><td>Program Check-out / Check-in Control（英文補充對照）</td></tr><tr><td><b>版本管制</b></td><td>記錄檔案與程式各版本，知道哪個版本正在使用，必要時能追溯修改。</td><td>Version Control</td></tr></tbody></table></div><p class='small muted'><b>來源區分：</b>三大步驟和組態管理三項填空均已核對教師版 Ch1 第 8–9 頁；表格中的白話解釋及英譯屬於額外學習輔助。</p></div><p>System Construction (coding/testing), Installation and User Training, Support and Maintenance, and Configuration Management. Configuration Management includes identifying controlled configuration items, managing changes, and maintaining version/status records; Git alone is not the whole discipline.</p><div style=\"overflow:auto\"><table><thead><tr><th>Dimension</th><th>Planning</th><th>Analysis</th><th>Design</th><th>Implementation</th></tr></thead><tbody><tr><td>Main question</td><td>WHY?</td><td>WHAT? WHO? WHERE? WHEN?</td><td>HOW?</td><td>BUILD / DELIVER?</td></tr><tr><td>Major deliverable</td><td>Project Plan</td><td>System Proposal</td><td>System Specification</td><td>Operational System</td></tr><tr><td>Typical activity</td><td>Business feasibility</td><td>Elicit requirements</td><td>Design UI/database</td><td>Testing/training</td></tr><tr><td>Frequent trap</td><td>Need ≠ features</td><td>Do not over-specify technologies</td><td>Detailed technical choices</td><td>Coding is not the only activity</td></tr></tbody></table></div></section>\n<section id=\"part3\"><h2>3. Systems Development Methodologies</h2><div class='card' style='padding:20px;margin:15px 0;border:1px solid var(--accent)' id='ch1-methodology-slide'><div class='eyebrow'>教授投影片整合｜SDLC: Methodologies</div><h3>Methodology（方法論）</h3><p><b>Methodology</b>: A formal approach to conducting the <b>SDLC</b>.</p><p class='cn'><b>完整中文翻譯：</b><b>方法論（Methodology）</b>是執行<b>系統開發生命週期（SDLC）</b>的一套正式方法。<b>SDLC</b>回答開發會經過哪些階段；<b>Methodology</b>進一步決定如何組織、執行與管理各階段的工作。</p><h3>Four orientations in modern SDLC methodologies（現代方法論四種取向）</h3><p>依第一張投影片的印刷內容整理：<b>Process-oriented</b>、<b>Data-centered</b>、<b>Object-oriented</b>、<b>Rapid Application Development (RAD)</b>。</p><div style='overflow:auto'><table><thead><tr><th>投影片分類</th><th>中文</th><th>課堂手寫重點</th><th>中文解釋</th></tr></thead><tbody><tr><td><b>Process-oriented</b></td><td>流程導向</td><td><b>Repeatability</b></td><td><b>可重複性／流程標準化</b>：同一套流程可以一致地重複執行。</td></tr><tr><td><b>Data-centered</b></td><td>資料導向</td><td><b>Business Intelligence</b></td><td><b>商業智慧</b>：從資料中整理、分析資訊，協助業務決策。</td></tr><tr><td><b>Object-oriented</b></td><td>物件導向</td><td><b>Reusability</b></td><td><b>可重用性</b>：物件或類別的設計可在不同情境中重複利用。</td></tr><tr><td><b>Rapid Application Development (RAD)</b></td><td>快速應用程式開發</td><td><b>Agility</b></td><td><b>敏捷性／應變彈性</b>：快速回應需求與環境的變動。</td></tr></tbody></table></div><p class='small muted'><b>來源標示：</b>四個英文分類是投影片印刷內容；<b>Repeatability、Business Intelligence、Reusability、Agility</b> 是你確認的課堂手寫答案。中文解釋為閱讀輔助，其中 Repeatability 的直譯為「可重複性」，筆記以「標準化」幫助記憶。</p><h3>Process-oriented SDLC: Four Categories（流程導向開發的四大類）</h3><p><b>Structured Development</b> → <b>RAD</b> → <b>Agile Development</b> → <b>DevOps</b>，此處完全依第二張教授投影片的分類順序。</p><div style='overflow:auto'><table><thead><tr><th>類別</th><th>投影片列舉的方法</th><th>中文理解</th></tr></thead><tbody><tr><td><b>1. Structured Development（結構化開發）</b></td><td><b>Waterfall Development</b>、<b>Parallel Model (V Model)</b></td><td><b>瀑布式</b>依階段順序進行；<b>Parallel Model（V Model）</b>強調每個開發階段都有對應測試；教師版第 13 頁直接把兩者寫成同一模型。</td></tr><tr><td><b>2. RAD（快速應用程式開發）</b></td><td><b>Phased Development</b>、<b>Prototyping</b>：<b>Evolutionary</b> vs. <b>Throwaway</b></td><td><b>階段式開發</b>分批提供功能；<b>演化式原型</b>逐步發展為正式產品，<b>拋棄式原型</b>完成探索後不沿用。</td></tr><tr><td><b>3. Agile Development（敏捷式開發）</b></td><td><b>eXtreme Programming (XP)</b>、<b>Scrum</b></td><td>透過短週期、快速回饋與持續調整，更能因應需求及環境變動。</td></tr><tr><td><b>4. DevOps（開發與維運整合）</b></td><td><b>DevOps</b></td><td>強調開發、測試、部署與維運的持續協作及自動化。</td></tr></tbody></table></div><h3>Sequential vs. Iterative / Cyclic（循序式與迭代／循環式）</h3><p><b>Sequential</b>: Work moves through major phases in a largely ordered sequence.<br><b>Iterative / Cyclic</b>: Teams revisit and refine work using repeated feedback cycles.</p><p class='cn'><b>完整中文翻譯：</b><b>Sequential（循序式）</b>大致依主要階段順序往前推進；<b>Iterative / Cyclic（迭代／循環式）</b>則在重複週期中取得回饋、重新檢查與修正先前成果。</p><div style='overflow:auto'><table><thead><tr><th>方法</th><th>考試判斷</th><th>補充說明</th></tr></thead><tbody><tr><td><b>Waterfall</b></td><td>偏<b>Sequential</b></td><td>典型循序式方法，後期變更可能需要回頭修改。</td></tr><tr><td><b>Parallel Model (V Model)</b></td><td>教師版歸於<b>Structured / Sequential</b></td><td>左邊分析、設計與實作，右邊依序進行單元、整合、系統、驗收測試，開發時即規劃相應測試。</td></tr><tr><td><b>Phased Development</b></td><td>偏<b>Iterative / Incremental</b></td><td>逐批交付功能，下一批可以吸收前一批的使用者回饋。</td></tr><tr><td><b>Prototyping</b></td><td>偏<b>Iterative / Cyclic</b></td><td>原型製作、試用、回饋與修改形成循環。</td></tr><tr><td><b>XP / Scrum</b></td><td>偏<b>Iterative / Cyclic</b></td><td>短週期工作與持續回饋是主要特色。</td></tr><tr><td><b>DevOps</b></td><td><b>Continuous / Cyclic</b> 持續循環</td><td>持續整合、交付與維運回饋，不宜單純當作一次性的循序流程。</td></tr></tbody></table></div><p class='small muted'><b>考試來源提醒：</b>第二張投影片明確列出四大類與六種方法，並提出「Sequential vs. iterative/cyclic 各有哪些？」作為問題；上表的屬性判斷是根據這些方法的運作方式所作的<b>學習分類補充</b>，並不是投影片已印出的標準答案。教師版第 13 頁正式標示 <b>The Parallel Model (V Model)</b>，本課應將兩者一起複習。</p></div><p><b>Methodology:</b> A formalized approach to performing SDLC activities, techniques and deliverables. SDLC describes the broad process; a methodology defines how work is ordered, iterated and controlled.</p><h3>Waterfall Development</h3><p>Sequential phases with major deliverables and approval checkpoints. Benefits: clear milestones, documentation and formal control. Risks: late feedback, costly requirement changes and rework. Appropriate when needs are stable.</p><pre class=\"mermaid\">flowchart TD\\n A[\"Planning\"] --> B[\"Analysis\"]\\n B --> C[\"Design\"]\\n C --> D[\"Implementation\"]\\n D --> E[\"Testing / Installation / Support\"]</pre><details><summary>Copyable Mermaid source</summary><pre><code>flowchart TD\\n A[\"Planning\"] --> B[\"Analysis\"]\\n B --> C[\"Design\"]\\n C --> D[\"Implementation\"]\\n D --> E[\"Testing / Installation / Support\"]</code></pre></details><p>In the four-phase SDLC, testing belongs within Implementation even if a Waterfall teaching diagram shows it as a distinct step.</p><h3>The Parallel Model (V Model)｜平行模式／V 模型（教師版 p.13）</h3><p><b>Parallel Model (V Model):</b> Every development activity has a corresponding test design and testing activity. Test planning accompanies analysis and design instead of being postponed until all code is finished.</p><p class='cn'><b>中文完整翻譯：</b>本課程將<b>平行模式（Parallel Model）</b>稱為<b>V 模型（V Model）</b>。開發階段同時考慮並設計相應的測試，完成實作後再由下而上進行不同層級測試。重點是<b>每一個階段都要有對應的測試活動</b>，不是把開發切成幾個子專案同時進行。</p><div style='overflow:auto'><table><thead><tr><th>開發／測試設計端</th><th>右側對應測試</th></tr></thead><tbody><tr><td><b>Analysis → Acceptance test design</b><br>分析與驗收測試設計</td><td><b>Acceptanc
