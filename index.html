e testing</b><br>驗收測試</td></tr><tr><td><b>Design → System test design</b><br>設計與系統測試設計</td><td><b>System testing</b><br>系統測試</td></tr><tr><td><b>Design → Integration test design</b><br>設計與整合測試設計</td><td><b>Integration testing</b><br>整合測試</td></tr><tr><td><b>Design → Unit test design</b><br>設計與單元測試設計</td><td><b>Unit testing</b><br>單元測試</td></tr></tbody></table></div><p><b>V shape:</b> Analysis → Design → Implementation (coding) → Unit testing → Integration testing → System testing → Acceptance testing.</p><p class='cn'>左側向下依序為<b>分析、設計、程式實作</b>；右側向上依序為<b>單元測試、整合測試、系統測試、驗收測試</b>。各階段都有對應的<b>測試設計（test design）</b>，這正是投影片兩側虛線要表達的關係。</p><pre class=\"mermaid\">flowchart TB\\n R[\"User Requirements\"] --- AT[\"Acceptance Tests\"]\\n S[\"System Specifications\"] --- ST[\"System Tests\"]\\n H[\"Architecture\"] --- IT[\"Integration Tests\"]\\n D[\"Detailed Design\"] --- UT[\"Unit Tests\"]\\n R --> S --> H --> D --> C[\"Code\"]\\n C --> UT --> IT --> ST --> AT</pre><details><summary>Copyable Mermaid source</summary><pre><code>flowchart TB\\n R[\"User Requirements\"] --- AT[\"Acceptance Tests\"]\\n S[\"System Specifications\"] --- ST[\"System Tests\"]\\n H[\"Architecture\"] --- IT[\"Integration Tests\"]\\n D[\"Detailed Design\"] --- UT[\"Unit Tests\"]\\n R --> S --> H --> D --> C[\"Code\"]\\n C --> UT --> IT --> ST --> AT</code></pre></details><h3>The Phased Model（階段式開發）｜教師版 p.14</h3><p><b>Phased Development</b> repeatedly performs <b>Analysis → Design → Implementation</b> and delivers a usable <b>System Version</b> after each cycle.</p><p class='cn'><b>繁體中文完整翻譯：</b><b>Phased Model（階段式開發）</b>會把系統分成多個版本，每一輪各自進行<b>分析、設計、實作</b>，完成後交付可用的系統版本，再依後續需求進入下一輪。教師版圖示呈現<b>System Version 1 → Version 2 → Version 3</b>，並以「<b>實務上常搭配分批交付</b>」為重點。</p><div style='padding:14px;margin:12px 0;border:1px solid var(--accent);border-radius:12px'><strong>Phased Development｜分批交付流程圖（依教師版重新繪製）</strong><div style='display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0'><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>Planning</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>Analysis（共通規劃）</span></div><div style='display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0'><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>Cycle 1：Analysis</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>Design</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>Implementation</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>System Version 1</span></div><div style='display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0'><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>Cycle 2：Analysis</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>Design</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>Implementation</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>System Version 2</span></div><div style='display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0'><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>Cycle 3：Analysis</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>Design</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>Implementation</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>System Version 3</span></div><p class='small muted'>每一輪都有分析、設計與實作；不是只把第一次開發完的同一份程式重複交付。新版本可參考前一版的回饋。</p></div><h3>The Prototyping Model（原型開發）｜教師版 p.15</h3><p><b>Prototyping</b> builds a partial implementation to explore requirements or design alternatives, such as <b>UI Design</b>. Customer feedback guides repeated refinement before actual system implementation.</p><p class='cn'><b>繁體中文完整翻譯：</b><b>Prototyping（原型開發）</b>先針對需求或設計提出<b>部分實作（Prototype Only）</b>，例如使用者介面的草稿。將<b>System Prototype（系統原型）</b>展示給顧客，根據回饋反覆修改；顧客確認後，再依所採原型類型繼續演進或重新建造<b>Real System（正式系統）</b>。</p><div style='padding:14px;margin:12px 0;border:1px solid var(--accent);border-radius:12px'><strong>Prototyping｜試作與顧客回饋（概念重繪）</strong><div style='display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0'><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>Planning</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>Analysis / Design / Partial Implementation</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>System Prototype</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>Customer Feedback</span></div><p style='margin:4px 0'><b>Feedback Loop：</b>若未符合需求，回到原型設計與部分實作修改，再請顧客確認。</p><div style='display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0'><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>Customer OK</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>Real-system Implementation</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>System</span></div><p class='small muted'>教師版的原型流程以 UI Design 為例；不代表原型本身一定可直接正式上線。</p></div><div style='overflow:auto'><table><thead><tr><th>比較</th><th>Evolutionary Prototyping（演化式）</th><th>Throwaway Prototyping（拋棄式）</th></tr></thead><tbody><tr><td><b>Teacher's definition</b></td><td>Gradually refine a system using user feedback and customer input.</td><td>Quickly test and try different ideas for the same requirement.</td></tr><tr><td><b>中文完整翻譯</b></td><td>依使用者回饋及顧客意見，<b>逐步修正與完善系統</b>。</td><td>針對同一需求，<b>快速嘗試和測試不同想法</b>；探索用原型通常不保留為正式系統。</td></tr><tr><td><b>考試關鍵</b></td><td>持續演進、保留並改善</td><td>比較方案、學習後捨棄原型</td></tr></tbody></table></div><h3>Agile: eXtreme Programming (XP)（極限程式設計）｜教師版 p.16</h3><p><b>XP</b> combines <b>Stories</b>, <b>Iteration Planning</b>, <b>Pair Programming</b>, <b>Testing</b>, <b>Continuous Integration</b>, <b>Customer Approval</b>, <b>Acceptance Tests</b> and <b>Small Releases</b>.</p><p class='cn'><b>繁體中文完整翻譯：</b><b>XP</b> 先從<b>使用者故事（Stories）</b>了解需求，再估算及安排<b>迭代計畫（Iteration Planning）</b>。開發時可進行<b>結對程式設計（Pair Programming）</b>，例如資深／資淺工程師或開發者／使用者協作；搭配<b>單元測試（Unit Testing）</b>、<b>整合測試（Integration Testing）</b>與<b>持續整合（Continuous Integration）</b>，並接受顧客驗收後作<b>小規模發布（Small Releases）</b>。</p><div style='padding:14px;margin:12px 0;border:1px solid var(--accent);border-radius:12px'><strong>XP｜教師版流程重點（概念重繪）</strong><div style='display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0'><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>Exploration：Stories</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>Iteration Planning：Stories + Estimates</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>Iteration：Pair Programming + Development + Testing</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>Customer Approval / Acceptance Tests</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>Small Release</span></div><p><b>Testing loop：</b>Development ↔ Testing；測試與 <b>Collective Codebase（共同程式碼庫）</b>及持續整合相互支援。<b>Spikes</b> 是為解決不確定技術問題而做的探索性方案。</p></div><h3>Agile: SCRUM（Scrum 敏捷框架）｜教師版 p.17</h3><p><b>Scrum</b> organizes a ranked <b>Product Backlog</b> into a <b>Sprint Backlog</b> through <b>Sprint Planning</b>. A <b>Sprint</b> lasts <b>1–4 weeks</b>, with a <b>Daily Scrum Meeting</b> approximately every <b>24 hours</b>, followed by a <b>Sprint Review</b> and <b>Sprint Retrospective</b>.</p><p class='cn'><b>繁體中文完整翻譯：</b>利害關係人與顧客提出需求，由<b>Product Owner（產品負責人）</b>整理成有優先順序的<b>Product Backlog（產品待辦清單）</b>。團隊透過<b>Sprint Planning（衝刺規劃會議）</b>選出本輪能承諾完成的工作，形成<b>Sprint Backlog（衝刺待辦清單）</b>。一輪 <b>Sprint（衝刺）</b>為<b>1–4 週</b>；期間約每 24 小時開<b>Daily Scrum（每日會議）</b>，最後展示<b>Finished Work（完成成果）</b>、進行<b>Sprint Review（成果檢視）</b>及<b>Sprint Retrospective（流程回顧與反省）</b>。</p><div style='padding:14px;margin:12px 0;border:1px solid var(--accent);border-radius:12px'><strong>Scrum｜一輪 Sprint</strong><div style='display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0'><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>Inputs / Product Owner</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>Ranked Product Backlog</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>Sprint Planning</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>Sprint Backlog</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>Sprint（1–4 Weeks）</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>Finished Work</span></div><p><b>During Sprint：</b>Daily Scrum（每 24 小時）、<b>Scrum Master</b> 協助排除障礙，並可使用 <b>Burndown / Burnup Charts</b> 追蹤進度。</p><p><b>At Sprint End：</b>Sprint Review（檢視成果）＋ Sprint Retrospective（回顧改進）。教師版圖中特別標示 Sprint 的結束日與團隊承諾的交付成果不應任意更改。</p></div><h3>DevOps（開發與維運整合）｜教師版 p.18–19</h3><p><b>DevOps</b> is a new extension of <b>Agile</b>. It focuses on <b>delivery and operations during development</b>, <b>Continuous Integration</b>, requirements that include <b>testing-related</b> work, and <b>Automation</b> as a key enabler.</p><p class='cn'><b>繁體中文完整翻譯：</b><b>DevOps</b> 是<b>Agile（敏捷開發）</b>的延伸，強調在開發期間就考慮<b>交付（Delivery）</b>與<b>維運（Operations）</b>，並持續整合與反覆測試。教師版兩個填空答案為 <b>Testing（測試）</b>與<b>Automation（自動化）</b>。因為頻繁整合、測試與發布需要工具支援，所以自動化是關鍵。</p><div style='padding:14px;margin:12px 0;border:1px solid var(--accent);border-radius:12px'><strong>DevOps｜開發與維運的持續循環（依投影片概念重繪）</strong><div style='display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0'><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>PLAN</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>CODE</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>BUILD</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>TEST</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>RELEASE</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>DEPLOY</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>OPERATE</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>MONITOR</span><span aria-hidden='true'>→</span><span style='padding:9px 11px;border-radius:8px;background:rgba(128,128,128,.10);font-weight:600'>↻ PLAN</span></div><p><b>Dev / Ops：</b>開發（Plan、Code、Build、Test）與維運（Deploy、Operate、Monitor）透過持續整合、資訊回饋和自動化工具串起來。教師版的 <b>Tool View</b> 以不同工具對應規劃、程式碼管理、測試、部署與監控等工作，不要求每個專案必須使用圖上所有工具。</p></div><pre class=\"mermaid\">flowchart LR\\n P[\"Plan\"] --> C[\"Code\"] --> B[\"Build\"] --> T[\"Test\"] --> R[\"Release\"] --> D[\"Deploy\"] --> O[\"Operate\"] --> M[\"Monitor\"] --> P</pre><details><summary>Copyable Mermaid source</summary><pre><code>flowchart LR\\n P[\"Plan\"] --> C[\"Code\"] --> B[\"Build\"] --> T[\"Test\"] --> R[\"Release\"] --> D[\"Deploy\"] --> O[\"Operate\"] --> M[\"Monitor\"] --> P</code></pre></details><p>DevOps integrates Development, Operations and automation. <b>CI:</b> frequently integrate changes with automated validation. <b>Continuous Delivery:</b> keep updates releasable. <b>Continuous Deployment:</b> automatically deploy qualifying changes. CI does NOT necessarily mean production deployment.</p><div class='card' style='padding:18px;margin:16px 0;border:1px solid var(--accent)'><h3>DevOps: Tool View（工具觀點）｜教師版 p.19</h3><p><b>Continuous Integration</b>, <b>Continuous Feedback</b>, <b>Real-time Communication</b> and <b>Lifecycle-wide Traceability</b> connect planning, building, deployment and operations.</p><p class='cn'><b>中文完整翻譯：</b><b>持續整合</b>、<b>持續回饋</b>、<b>即時溝通</b>與<b>全生命週期可追溯性</b>將規劃、建置、部署、維運連成持續改善的過程。</p><div style='overflow:auto'><table><thead><tr><th>開發環節</th><th>教師版工具舉例</th><th>核心目的</th></tr></thead><tbody><tr><td><b>Plan / Communication</b></td><td>Microsoft Project、Slack、Mattermost</td><td>規劃與團隊溝通</td></tr><tr><td><b>Build / Version Control</b></td><td>Git、GitHub、GitLab</td><td>原始碼管理及版本追蹤</td></tr><tr><td><b>Integration / Testing</b></td><td>Jenkins、Selenium、JUnit</td><td>自動化整合與測試</td></tr><tr><td><b>Deploy / Operate</b></td><td>Docker、Kubernetes、Puppet、Jira</td><td>部署、維運與問題追蹤；各工具功能有所不同</td></tr></tbody></table></div><p class='small muted'>教師版 p.19 圖示的工具為舉例，並非所有專案必須安裝，也非各階段互斥的唯一分類。主要應記住 <b>Continuous Integration</b> 與 <b>Automation</b>。</p></div><div style=\"overflow:auto\"><table><thead><tr><th>Model</th><th>Core Structure</th><th>Strength</th><th>Main Risk</th></tr></thead><tbody><tr><td>Waterfall</td><td>Sequential</td><td>Control/documentation</td><td>Late changes</td></tr><tr><td>Parallel Model (V Model)</td><td>Development/testing correspondence</td><td>Test traceability</td><td>Each development phase needs corresponding tests</td></tr><tr><td>Phased</td><td>Incremental releases</td><td>Early usable value</td><td>Release dependencies</td></tr><tr><td>Evolutionary Prototype</td><td>Refinement into product</td><td>Frequent feedback</td><td>Technical debt</td></tr><tr><td>Throwaway Prototype</td><td>Explore and discard</td><td>Requirements clarity</td><td>Discarded effort</td></tr><tr><td>XP</td><td>Short engineering cycles</td><td>Technical quality feedback</td><td>Needs discipline</td></tr><tr><td>Scrum</td><td>Sprint framework</td><td>Transparency/adaptation</td><td>Engineering practices must be added</td></tr><tr><td>DevOps</td><td>Build-deliver-operate loop</td><td>Reliable frequent delivery</td><td>Operational complexity</td></tr></tbody></table></div></section>\n<section id=\"part4\"><section class=\"card\"><h3>Methodology Comparison &amp; Practice</h3><h3>Which Methodology to Use?</h3><div style=\"overflow-x:auto\"><table><thead><tr><th>Ability to Develop Systems</th><th>Waterfall</th><th>Parallel</th><th>Phased</th><th>Prototyping</th><th>Throwaway Prototyping</th><th>XP</th><th>SCRUM</th></tr></thead><tbody><tr><th>With Unclear User Requirements</th><td>Poor</td><td>Poor</td><td>Good</td><td>Excellent</td><td>Excellent</td><td>Excellent</td><td>Excellent</td></tr><tr><th>With Unfamiliar Technology</th><td>Poor</td><td>Poor</td><td>Good</td><td>Poor</td><td>Excellent</td><td>Good</td><td>Good</td></tr><tr><th>That Are Complex</th><td>Good</td><td>Good</td><td>Good</td><td>Poor</td><td>Excellent</td><td>Good</td><td>Good</td></tr><tr><th>That Are Reliable</th><td>Good</td><td>Good</td><td>Good</td><td>Poor</td><td>Excellent</td><td>Excellent</td><td>Excellent</td></tr><tr><th>With a Short Time Schedule</th><td>Poor</td><td>Good</td><td>Excellent</td><td>Excellent</td><td>Good</td><td>Excellent</td><td>Excellent</td></tr><tr><th>With Schedule Visibility</th><td>Poor</td><td>Poor</td><td>Excellent</td><td>Excellent</td><td>Good</td><td>Excellent</td><td>Excellent</td></tr></tbody></table></div><p class=\"small muted\">Structured Methodologies：Waterfall、Parallel；RAD Methodologies：Phased、Prototyping、Throwaway Prototyping；Agile Methodologies：XP、SCRUM。Poor / Good / Excellent 依投影片原表。</p>\n\n<h3>Exercise &amp; Discussion</h3><p>Identify the proper SDLC models for the following development scenarios:</p><ol><li>大型 ERP 系統：<b>Phased</b></li><li>工廠生管系統：<b>Parallel</b></li><li>政府委外系統：<b>Waterfall</b></li><li>遊戲軟體：<b>Prototyping / DevOps</b></li></ol><p><b>上述皆可運用 Agile?</b> Yes, but must consider (1) communication costs &amp; (2) entire development time frame (usually adopt the time-boxing approach to control time).</p>\n</section>\n<h2>4. Object-Oriented Information Systems (OOIS)</h2><p><b>Class:</b> A template defining shared structure and behavior. <b>Object:</b> A distinct instance of a Class with Identity, State and Behavior. <b>Attribute:</b> Relevant information characterizing an object. <b>Operation:</b> Supported behavior specification. <b>Method:</b> Concrete implementation. <b>Message:</b> Request sent to an object to invoke behavior, often with parameters and return values.</p><pre><code>Student joe = new Student();\nCourse sa = new Course();\njoe.addCourse(sa);</code></pre><p>Student / Course are classes; joe / sa are instances; addCourse is a method invocation or message. The Java snippet presumes suitable constructors and methods exist.</p><pre class=\"mermaid\">classDiagram\\n class Student {\\n -String name\\n -String major\\n +addCourse(Course c)\\n +dropCourse(Course c)\\n }\\n class Course {\\n -String courseName\\n -String courseCode\\n }\\n Student \"0..*\" -- \"0..*\" Course : enrolls</pre><details><summary>Copyable Mermaid source</summary><pre><code>classDiagram\\n class Student {\\n -String name\\n -String major\\n +addCourse(Course c)\\n +dropCourse(Course c)\\n }\\n class Course {\\n -String courseName\\n -String courseCode\\n }\\n Student \"0..*\" -- \"0..*\" Course : enrolls</code></pre></details><h3>Encapsulation vs Information Hiding</h3><p><b>Encapsulation:</b> Combine state and operations within a Class. <b>Information Hiding:</b> Conceal internal representation and expose required interfaces. Encapsulation groups; information hiding restricts access.</p><h3>Inheritance / Generalization / Abstraction</h3><p>Generalization models an <b>IS-A</b> relationship. UML uses a solid line and a <b>hollow triangle pointing to the Superclass</b>. A Superclass is not automatically an Abstract Class. Abstract classes generally cannot be instantiated directly; concrete superclasses can.</p><pre class=\"mermaid\">classDiagram\\n Student <|-- GradStudent\\n Student <|-- UnderGradStudent\\n class Student {\\n +addCourse()\\n +payTuition()\\n }\\n class GradStudent {\\n +writeThesis()\\n }\\n class UnderGradStudent {\\n +payTuition()\\n }</pre><details><summary>Copyable Mermaid source</summary><pre><code>classDiagram\\n Student &lt;|-- GradStudent\\n Student &lt;|-- UnderGradStudent\\n class Student {\\n +addCourse()\\n +payTuition()\\n }\\n class GradStudent {\\n +writeThesis()\\n }\\n class UnderGradStudent {\\n +payTuition()\\n }</code></pre></details><h3>Polymorphism, Overriding and Dynamic Binding</h3><p>Polymorphism permits subtype-specific implementation through a shared parent/interface. In Java, <code>Animal a = new Bird(); a.move();</code> normally executes Bird's overridden instance method; <code>a = new Crab(); a.move();</code> invokes Crab's implementation. Overriding differs from Overloading. Runtime Dynamic Dispatch selects the concrete receiver's overridden method.</p><pre class=\"mermaid\">classDiagram\\n Animal <|-- Bird\\n Animal <|-- Crab\\n Animal <|-- Snake\\n class Animal {\\n +move()\\n }\\n class Bird {\\n +move()\\n }\\n class Crab {\\n +move()\\n }\\n class Snake {\\n +move()\\n }</pre><details><summary>Copyable Mermaid source</summary><pre><code>classDiagram\\n Animal &lt;|-- Bird\\n Animal &lt;|-- Crab\\n Animal &lt;|-- Snake\\n class Animal {\\n +move()\\n }\\n class Bird {\\n +move()\\n }\\n class Crab {\\n +move()\\n }\\n class Snake {\\n +move()\\n }</code></pre></details><div style=\"overflow:auto\"><table><thead><tr><th>Concept</th><th>Meaning</th><th>Exam distinction</th></tr></thead><tbody><tr><td>Class / Object</td><td>Template / Instance</td><td>Student vs joe</td></tr><tr><td>Encapsulation / Hiding</td><td>Grouping / Restricting access</td><td>Not identical</td></tr><tr><td>Generalization</td><td>IS-A relationship</td><td>Triangle points to parent</td></tr><tr><td>Polymorphism</td><td>Runtime subtype behavior</td><td>Overriding vs Overloading</td></tr></tbody></table></div></section>\n<section id=\"part5\"><section class=\"card\"><h3>Classes, Objects &amp; OO Principles</h3><h3>Characterization of OOIS</h3><p><b>Classes &amp; Objects</b></p><ul><li>Object (instance): instantiation of a <b>class</b></li><li>Attributes: data that characterizes the class</li></ul><p><b>Methods &amp; Messages</b></p><ul><li>Methods: the <b>behavior</b> of a class</li><li>Messages: information sent to an object to trigger a method (method call)</li></ul><p>Student example:</p><pre>Student joe = new Student();\nCourse sa = new Course();\njoe.addCourse(sa);</pre><p>老師註記：method parameters (an object reference).</p>\n\n<h3>Characterization of OOIS (cont.)</h3><p><b>Encapsulation &amp; information hiding</b></p><ul><li>Encapsulation: a combination of data &amp; behaviors</li><li>Information hiding: functionality details are hidden</li></ul><p><b>Inheritance</b></p><ul><li>General classes are created (called: <b>Superclass</b>)</li><li><b>Subclass</b> can inherit some data and methods from a superclass</li><li>Abstraction vs. implementation (see next slide)</li></ul>\n\n<h3>Inheritance 例子</h3><pre>Student\n+addCourse()\n+dropCourse()\n+payTuition()\n     △\nGradStudent          UnderGradStudent\n+writeThesis()       +payTuition()\n+payTuition()</pre><p>In Student class: Any abstraction? <b>payTuition()</b>；Any implementation?（投影片未填答）</p><p>Can instantiate Student? <b>No</b>（老師手寫答案）。</p><p>Why define three methods here? Why no implementation of addCourse() &amp; dropCourse()? 老師註記：因為 superclass 有定義了。</p>\n\n<h3>Characteristics of OOIS (cont.)：Polymorphism</h3><p>Mechanism: linking a reference to various types of object at runtime. A key feature in such mechanism:</p><p><b>Dynamic binding</b>, which includes: (1) <b>type</b> binding &amp; (2) <b>method</b> binding. Contrast with static binding.</p>\n\n<h3>Polymorphism 例子</h3><pre>Animal\n+move()\n  △\nBird / Crab / Snake\n+move()\n\nIn Java:\nAnimal a;\na = new Bird();\na = new Crab();\na.move();</pre><p>課堂問題：Dynamic type binding 在哪裡？Dynamic method binding 在哪裡？</p>\n</section>\n<h2>5. OOAD Principles and Unified Process</h2><p><b>OOAD: Use-Case Driven, Architecture-Centric, Iterative and Incremental.</b></p><p><b>Functional View:</b> External functions using Use Case Diagram, Activity Diagram and Use-Case Description. <b>Structural View:</b> Classes and static relationships using CRC Cards, Class Diagram and Object Diagram. <b>Behavioral View:</b> Object interactions/state using Sequence, Communication and State Machine Diagrams. All views must remain consistent.</p><pre class=\"mermaid\">flowchart TD\\n R[\"Requirements\"] --> F[\"Functional Models: External View\"]\\n F --> S[\"Structural Models: Static View\"]\\n S --> B[\"Behavioral Models: Dynamic View\"]\\n B -. \"Refine responsibilities\" .-> S\\n B -. \"Check scenarios\" .-> F\\n F -. \"Clarify requirement\" .-> R</pre><details><summary>Copyable Mermaid source</summary><pre><code>flowchart TD\\n R[\"Requirements\"] --> F[\"Functional Models: External View\"]\\n F --> S[\"Structural Models: Static View\"]\\n S --> B[\"Behavioral Models: Dynamic View\"]\\n B -. \"Refine responsibilities\" .-> S\\n B -. \"Check scenarios\" .-> F\\n F -. \"Clarify requirement\" .-> R</code></pre></details><h3>Unified Process (UP)</h3><p>UP is an iterative and incremental process using two dimensions: <b>Phases (WHEN)</b> and <b>Workflows (WHAT ACTIVITIES)</b>. Its four phases are Inception (scope/business case; Lifecycle Objectives), Elaboration (core architecture/risks; Lifecycle Architecture), Construction (build/test; Initial Operational Capability) and Transition (deploy/accept; Product Release).</p><div style=\"overflow:auto\"><table><thead><tr><th>Workflow</th><th>Inception</th><th>Elaboration</th><th>Construction</th><th>Transition</th></tr></thead><tbody><tr><td>Business Modeling</td><td>High</td><td>Medium</td><td>Low</td><td>Low</td></tr><tr><td>Requirements</td><td>High</td><td>High</td><td>Medium</td><td>Low</td></tr><tr><td>Analysis</td><td>Medium</td><td>High</td><td>Medium</td><td>Low</td></tr><tr><td>Design</td><td>Low</td><td>High</td><td>High</td><td>Low</td></tr><tr><td>Implementation</td><td>Low</td><td>Medium</td><td>High</td><td>Medium</td></tr><tr><td>Testing</td><td>Low</td><td>Medium</td><td>High</td><td>High</td></tr><tr><td>Deployment</td><td>Low</td><td>Low</td><td>Medium</td><td>High</td></tr></tbody></table></div><p>Engineering Workflows: Business Modeling, Requirements, Analysis, Design, Implementation, Test, Deployment. Supporting Workflows: Project Management, Configuration and Change Management, Environment. This intensity matrix is a qualitative learning aid, not a copied quantitative UP workload curve.</p><p><b>Trap:</b> Requirements do not occur ONLY in Inception. Workflows span multiple phases. UP phases are not one-to-one renamings of four SDLC phases.</p></section>\n<section id=\"part6\"><section class=\"card\"><h3>OOSAD &amp; Unified Process</h3><h3>Characteristics of OOSAD</h3><p><b>1. Use-case driven</b></p><p>“Use cases” to define/objectize the <b>functionality</b> of an OOIS. Each use case focuses on one <b>business process</b>.</p><p>例如選課系統：business process? 老師註記：加選、退選。</p><p><b>2. Architecture/modularization centric</b></p><ul><li><b>Functional</b> view: focusing on user perspective</li><li><b>Structural</b> view: focusing on the content of a class and the relationships among classes</li><li><b>Behavioral</b> view: focusing on messaging between classes and resulting outcome</li></ul><p><b>3. Iterative &amp; incremental</b></p><p>Undergoes continuous increments, testing &amp; refinement. May go back to revise the prior analysis/design contents.</p><p>為何一開始無法正確完整地完成分析或設計？老師註記：需求不明確。</p><p>The analyst &amp; users understand the future system better over time.</p>\n\n<h3>The Unified Process</h3><p>A two-dimensional process consisting of <b>phases</b> and <b>workflows</b> to denote the workload of SDLC activities.</p><ul><li>Phases are time periods in development</li><li>Workflows are the tasks that occur in each phase</li><li>Activities in both phases &amp; workflows will overlap</li></ul></section>\n<section class=\"card\" id=\"ch1-handwritten-uml\"><h3>Unified Process: Phases &amp; Workflows</h3>\n<h3>The Unified Process：二維工作量圖</h3><p><b>Phases（橫軸）</b>：Inception → Elaboration → Construction → Transition → Production。<b>Workflows（縱軸）</b>：每種工作在各階段都有不同程度的投入；灰色曲線代表相對工作量，不是只能在某一階段執行。</p>\n<figure id=\"up-engineering-workflows-figure\" style=\"margin:18px 0\"><figcaption><b>Engineering Workflows｜Unified Process 工作量變化圖</b></figcaption><p class=\"muted small\">依課堂 Unified Process 圖的概念重繪，曲線為定性示意，並非原投影片精確描圖或數值。</p><div style=\"overflow-x:auto\"><div style=\"min-width:470px\"><div style=\"display:grid;grid-template-columns:150px minmax(290px,1fr);align-items:center;border-bottom:1px solid #d8dee8;gap:10px;padding:6px 0\"><b style=\"font-size:13px\">Business Model</b><svg viewBox=\"0 0 290 85\" width=\"100%\" role=\"img\" aria-label=\"Business Model relative workload across five phases\"><path d=\"M0 78H280\" stroke=\"currentColor\" opacity=\".22\" fill=\"none\"/><polygon points=\"0,78 0,26.0 70,32.5 140,59.8 210,72.8 280,75.4 280,78\" fill=\"#7b91b8\" fill-opacity=\".32\"/><polyline points=\"0,26.0 70,32.5 140,59.8 210,72.8 280,75.4\" fill=\"none\" stroke=\"#526e9e\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/></svg></div><div style=\"display:grid;grid-template-columns:150px minmax(290px,1fr);align-items:center;border-bottom:1px solid #d8dee8;gap:10px;padding:6px 0\"><b style=\"font-size:13px\">Requirement</b><svg viewBox=\"0 0 290 85\" width=\"100%\" role=\"img\" aria-label=\"Requirement relative workload across five phases\"><path d=\"M0 78H280\" stroke=\"currentColor\" opacity=\".22\" fill=\"none\"/><polygon points=\"0,78 0,52.0 70,23.4 140,33.8 210,62.4 280,74.1 280,78\" fill=\"#7b91b8\" fill-opacity=\".32\"/><polyline points=\"0,52.0 70,23.4 140,33.8 210,62.4 280,74.1\" fill=\"none\" stroke=\"#526e9e\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/></svg></div><div style=\"display:grid;grid-template-columns:150px minmax(290px,1fr);align-items:center;border-bottom:1px solid #d8dee8;gap:10px;padding:6px 0\"><b style=\"font-size:13px\">Analysis</b><svg viewBox=\"0 0 290 85\" width=\"100%\" role=\"img\" aria-label=\"Analysis relative workload across five phases\"><path d=\"M0 78H280\" stroke=\"currentColor\" opacity=\".22\" fill=\"none\"/><polygon points=\"0,78 0,71.5 70,41.6 140,19.5 210,54.6 280,74.1 280,78\" fill=\"#7b91b8\" fill-opacity=\".32\"/><polyline points=\"0,71.5 70,41.6 140,19.5 210,54.6 280,74.1\" fill=\"none\" stroke=\"#526e9e\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/></svg></div><div style=\"display:grid;grid-template-columns:150px minmax(290px,1fr);align-items:center;border-bottom:1px solid #d8dee8;gap:10px;padding:6px 0\"><b style=\"font-size:13px\">Design</b><svg viewBox=\"0 0 290 85\" width=\"100%\" role=\"img\" aria-label=\"Design relative workload across five phases\"><path d=\"M0 78H280\" stroke=\"currentColor\" opacity=\".22\" fill=\"none\"/><polygon points=\"0,78 0,74.1 70,62.4 140,26.0 210,31.2 280,71.5 280,78\" fill=\"#7b91b8\" fill-opacity=\".32\"/><polyline points=\"0,74.1 70,62.4 140,26.0 210,31.2 280,71.5\" fill=\"none\" stroke=\"#526e9e\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/></svg></div><div style=\"display:grid;grid-template-columns:150px minmax(290px,1fr);align-items:center;border-bottom:1px solid #d8dee8;gap:10px;padding:6px 0\"><b style=\"font-size:13px\">Implementation</b><svg viewBox=\"0 0 290 85\" width=\"100%\" role=\"img\" aria-label=\"Implementation relative workload across five phases\"><path d=\"M0 78H280\" stroke=\"currentColor\" opacity=\".22\" fill=\"none\"/><polygon points=\"0,78 0,76.7 70,71.5 140,52.0 210,15.6 280,65.0 280,78\" fill=\"#7b91b8\" fill-opacity=\".32\"/><polyline points=\"0,76.7 70,71.5 140,52.0 210,15.6 280,65.0\" fill=\"none\" stroke=\"#526e9e\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/></svg></div><div style=\"display:grid;grid-template-columns:150px minmax(290px,1fr);align-items:center;border-bottom:1px solid #d8dee8;gap:10px;padding:6px 0\"><b style=\"font-size:13px\">Test</b><svg viewBox=\"0 0 290 85\" width=\"100%\" role=\"img\" aria-label=\"Test relative workload across five phases\"><path d=\"M0 78H280\" stroke=\"currentColor\" opacity=\".22\" fill=\"none\"/><polygon points=\"0,78 0,76.7 70,74.1 140,62.4 210,23.4 280,52.0 280,78\" fill=\"#7b91b8\" fill-opacity=\".32\"/><polyline points=\"0,76.7 70,74.1 140,62.4 210,23.4 280,52.0\" fill=\"none\" stroke=\"#526e9e\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/></svg></div><div style=\"display:grid;grid-template-columns:150px minmax(290px,1fr);align-items:center;border-bottom:1px solid #d8dee8;gap:10px;padding:6px 0\"><b style=\"font-size:13px\">Deployment</b><svg viewBox=\"0 0 290 85\" width=\"100%\" role=\"img\" aria-label=\"Deployment relative workload across five phases\"><path d=\"M0 78H280\" stroke=\"currentColor\" opacity=\".22\" fill=\"none\"/><polygon points=\"0,78 0,78.0 70,76.7 140,71.5 210,45.5 280,23.4 280,78\" fill=\"#7b91b8\" fill-opacity=\".32\"/><polyline points=\"0,78.0 70,76.7 140,71.5 210,45.5 280,23.4\" fill=\"none\" stroke=\"#526e9e\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/></svg></div><div style=\"display:grid;grid-template-columns:150px minmax(290px,1fr);gap:10px;padding-top:7px\"><span></span><div style=\"display:grid;grid-template-columns:repeat(5,1fr);font-size:10px;text-align:center\"><span>Inception</span><span>Elaboration</span><span>Construction</span><span>Transition</span><span>Production</span></div></div></div></div><p><b>讀圖：</b>Business Model 與 Requirement 偏前期；Analysis、Design 隨開發推進；Implementation、Test 在 Construction 前後較多；Deployment 在後期增加。各工作流程可能重疊。</p></figure><p><b>Engineering Workflows（手寫填答）</b>：</p><ol><li>Business Model</li><li>Requirement</li><li>Analysis</li><li>Design</li><li>Implementation</li><li>Test</li><li>Deployment</li></ol>\n<p><b>Supporting Workflows（手寫填答）</b>：</p><ol><li>Configuration and Change Management</li><li>Project Management</li><li>Environment（旁註：IDE、CASE tools）</li><li>Operation and Support（旁註：Training、Document、user manual、maintenance）</li><li>Infrastructure Management（旁註：Design patterns、API、SPI）</li></ol>\n<p><b>讀圖技巧：</b>Business Model 的工作量偏前期；Implementation 在 Construction 較高；Operation and Support 在後期與 Production 更重要。這是圖形趨勢的解讀，不是額外手寫答案。</p>\n</section>\n<section class=\"card\" id=\"supporting-workflows-detailed\"><h3>Supporting Workflows</h3><p>這是 Unified Process 二維圖的下半部。橫軸是 <b>Phases</b>，縱軸是五種 <b>Supporting Workflows</b>；灰色面積表示該階段相對工作量，不是精確數值。</p><div style=\"overflow-x:auto\"><table><thead><tr><th>Supporting Workflow</th><th>Inception</th><th>Elaboration</th><th>Construction</th><th>Transition</th><th>Production</th></tr></thead><tbody><tr><th>Configuration and Change Management</th><td>少</td><td>增加</td><td>較多</td><td>仍持續</td><td>持續</td></tr><tr><th>Project Management</th><td>有明顯工作量</td><td>持續</td><td>持續</td><td>持續</td><td>仍持續</td></tr><tr><th>Environment</th><td>前期較多</td><td>降低</td><td>少</td><td>短暫增加</td><td>圖中接近無</td></tr><tr><th>Operation and Support</th><td>少</td><td>少</td><td>逐漸增加</td><td>增加</td><td>較多</td></tr><tr><th>Infrastructure Management</th><td>持續</td><td>持續</td><td>持續</td><td>持續</td><td>持續</td></tr></tbody></table></div><p class=\"muted small\">上表是依圖片灰色曲線做的定性讀圖，並非投影片提供的數值。</p><h3>老師手寫補充</h3><ul><li><b>Configuration and Change Management</b>：組態與變更管理</li><li><b>Project Management</b>：專案管理</li><li><b>Environment</b>：<b>IDE、CASE Tools</b></li><li><b>Operation and Support</b>：<b>Training、Document、user manual、maintenance</b></li><li><b>Infrastructure Management</b>：<b>Design patterns、API、SPI</b></li></ul><h3>Phases 與 Iterations</h3><p>圖上階段依序為 <b>Inception → Elaboration → Construction → Transition → Production</b>。下方迭代標示為 Inception 的 <b>Iter 1 … Iter i</b>、Elaboration 的 <b>Iter i+1 … Iter j</b>、Construction 的 <b>Iter j+1 … Iter k</b>、Transition 的 <b>Iter k+1 … Iter m</b>。</p><p><b>Production</b> 被綠色虛線圈起來，複習時要特別注意：系統投入正式使用後，Operation and Support 仍有大量工作，Configuration and Change Management、Project Management 與 Infrastructure Management 也沒有完全停止。</p><details><summary>💡 讀圖理解：為什麼 Production 還需要工作？</summary><p>系統正式上線不代表專案相關工作全部消失。使用者支援、文件、維護與變更仍然存在。圖中灰色曲線正是要表達：不同工作在不同階段的投入程度不同，而且可能重疊。</p></details></section>\n<section class=\"card\" id=\"ch1-uml-original\" style=\"margin:18px 0\"><h3>UML Diagram Types &amp; Scope</h3><p>✓ 表示本課程範圍。表格保留 Diagram Name、Used to、Primary Phase。</p>\n<h3>Unified Modeling Language (UML)</h3><p><b>手寫註記：</b>統一塑模語言。</p><p><b>Original:</b> Provides a common vocabulary of object-oriented terms and diagramming techniques to model an information system from analysis through implementation.</p><p><b>中文：</b>提供物件導向的共同術語及繪圖技術，用來描述資訊系統從分析到實作的模型。</p><p><b>Original:</b> The 2.5th version of UML has 15 diagram types in 2 major groups:</p><p><b>手寫填答：</b>1. <b>Structural diagrams</b>　2. <b>Behavior diagrams</b></p>\n<h3>UML Structure Diagrams</h3><p><b>Original + 手寫填空：</b>Represent the <b>Static &amp; Structural</b> relationships in an information system.</p><p><b>中文：</b>呈現資訊系統中的靜態與結構關係。</p><div style=\"overflow-x:auto\"><table style=\"min-width:690px;width:100%\"><thead><tr><th>本課程範圍</th><th>Diagram Name</th><th>Used to...</th><th>Primary Phase</th></tr></thead><tbody><tr><td style=\"text-align:center\">✅</td><td><b>Class</b></td><td>Illustrate the relationships between classes modeled in the system</td><td>Analysis, Design</td></tr><tr><td style=\"text-align:center\">✅</td><td><b>Object</b></td><td>Illustrate the relationships between objects modeled in the system; used when actual instances of the classes will better communicate the model</td><td>Analysis, Design</td></tr><tr><td style=\"text-align:center\">✅</td><td><b>Package</b></td><td>Group other UML elements together to form higher-level constructs</td><td>Analysis, Design, Implementation</td></tr><tr><td style=\"text-align:center\">✅</td><td><b>Deployment</b></td><td>Show the physical architecture of the system; can also be used to show software components being deployed onto the physical architecture</td><td>Physical Design, Implementation</td></tr><tr><td style=\"text-align:center\">✅</td><td><b>Component</b></td><td>Illustrate the physical relationships among the software components</td><td>Physical Design, Implementation</td></tr><tr><td style=\"text-align:center\">—</td><td><b>Composite Structure Design</b></td><td>Illustrate the internal structure of a class, i.e., the relationships among the parts of a class</td><td>Analysis, Design</td></tr><tr><td style=\"text-align:center\">—</td><td><b>Profile</b></td><td>Used to develop extensions to the UML itself</td><td>None</td></tr></tbody></table></div>\n<h3>UML Behavior Diagrams</h3><p><b>Original + 手寫填空：</b>Depict the <b>dynamic</b> relationships among the instances or objects that represent the business information system.</p><p><b>中文：</b>描述代表業務資訊系統的實例或物件之間的動態關係。</p><div style=\"overflow-x:auto\"><table style=\"min-width:690px;width:100%\"><thead><tr><th>本課程範圍</th><th>Diagram Name</th><th>Used to...</th><th>Primary Phase</th></tr></thead><tbody><tr><td style=\"text-align:center\">✅</td><td><b>Activity</b></td><td>Illustrate business workflows independent of classes, the flow of activities in a use case, or detailed design of a method</td><td>Analysis, Design</td></tr><tr><td style=\"text-align:center\">✅</td><td><b>Sequence</b></td><td>Model the behavior of objects within a use case; focuses on the time-based ordering of an activity</td><td>Analysis, Design</td></tr><tr><td style=\"text-align:center\">—</td><td><b>Communication</b></td><td>Model the behavior of objects within a use case; focus on the communication among a set of collaborating objects of an activity</td><td>Analysis, Design</td></tr><tr><td style=\"text-align:center\">—</td><td><b>Interaction Overview</b></td><td>Illustrate an overview of the flow of control of a process</td><td>Analysis, Design</td></tr><tr><td style=\"text-align:center\">—</td><td><b>Timing</b></td><td>Illustrate the interaction among a set of objects and the state changes they go through along a time axis</td><td>Analysis, Design</td></tr><tr><td style=\"text-align:center\">✅</td><td><b>Behavioral State Machine</b></td><td>Examine the behavior of one class</td><td>Analysis, Design</td></tr><tr><td style=\"text-align:center\">—</td><td><b>Protocol State Machine</b></td><td>Illustrate the dependencies among the different interfaces of a class</td><td>Analysis, Design</td></tr><tr><td style=\"text-align:center\">✅</td><td><b>Use-Case</b></td><td>Capture business requirements for the system and illustrate the interaction between the system and its environment</td><td>Analysis</td></tr></tbody></table></div>\n<details><summary>💡 兩類圖形怎麼區分？</summary><p><b>Structural</b> 著重「系統有哪些元素、彼此如何連結」；<b>Behavioral</b> 著重「流程、訊息與狀態如何變化」。這段是補充理解，不是投影片原文。</p></details></section>\n<h2>6. UML and Standard Modeling SOP</h2><p><b>Unified Modeling Language (UML)</b> is a standardized visual modeling language, NOT an SDLC methodology. UML diagrams can describe functional, static and behavioral views. This course teaches Use Case, Activity, Class, Object, Sequence, Communication and State Machine diagrams. The lecturer's count of UML diagram types may follow a different edition/grouping; do not invent an extra diagram type merely to match a quoted count.</p><div style=\"overflow:auto\"><table><thead><tr><th>Symbol / Model</th><th>Meaning</th><th>Key rule</th></tr></thead><tbody><tr><td>Stick Figure</td><td>Actor</td><td>Outside the system boundary</td></tr><tr><td>Oval</td><td>Use Case</td><td>Inside the subject boundary</td></tr><tr><td>Class Rectangle</td><td>Class</td><td>Name / Attributes / Operations</td></tr><tr><td>Hollow Triangle</td><td>Generalization</td><td>Points to superclass</td></tr><tr><td>Dashed «include»</td><td>Required reuse</td><td>Base → included</td></tr><tr><td>Dashed «extend»</td><td>Optional extension</td><td>Extension → base</td></tr><tr><td>Multiplicity 1, 0..1, *</td><td>Allowed instances</td><td>Read at association endpoint</td></tr><tr><td>Lifeline / Message</td><td>Object interaction over time</td><td>Messages match responsibilities</td></tr><tr><td>[guard]</td><td>Conditional flow or transition</td><td>Explicit condition</td></tr></tbody></table></div><h3>Chapter 1 Introductory Seven-Step Modeling Guide</h3><ol><li>Identify Business Problem, Value and Scope.</li><li>Identify Stakeholders, Actors and Requirements.</li><li>Build Functional View using Use Cases and activities.</li><li>Derive Structural View from relevant domain concepts and responsibilities.</li><li>Derive Behavioral View from object interactions and state changes.</li><li>Verify syntax and validate against stakeholder needs.</li><li>Iteratively refine the views and resolve inconsistencies.</li></ol><p><strong>Important distinction:</strong> This is an integrated Chapter 1 overview and NOT the later Chapter 4 structural CRC-to-class-diagram seven-step procedure.</p><h3>Cross-Model V&V</h3><ul><li>Each major Use Case traces to a requirement.</li><li>Object lifelines correspond to meaningful Class instances.</li><li>Messages invoke supported responsibilities / operations.</li><li>Class associations support scenario interactions.</li><li>Alternate and exception paths are addressed.</li><li>Analysis models remain logical rather than cluttered with technical infrastructure.</li><li>Names, business rules and constraints agree across models.</li></ul><h3>Five Modeling Pitfalls</h3><ol><li>Analysis confused with technical Design.</li><li>Generalization hollow triangle points to subclass rather than superclass.</li><li>«include» confused with «extend».</li><li>Irrelevant Classes invented without requirement support.</li><li>Models contradict each other because cross-model V&V is omitted.</li></ol></section>\n<section id=\"part7\"><h2>7. End-to-End Walkthrough: Health Clinic Appointment System</h2><h3>English Scenario Requirements</h3><blockquote>A community health clinic currently manages appointments using telephone calls and paper schedules. Receptionists spend significant time checking physician availability, recording patient details and resolving scheduling conflicts. Patients want to request, view, reschedule and cancel appointments, while doctors need to maintain consultation availability. The clinic manager wants to prevent double bookings and reduce manual administrative workload. After an appointment has been accepted, the system should notify the patient. Sensitive patient information must not be disclosed to unauthorized users. The development team must identify the business need, define the system's functional and nonfunctional requirements, model actors and domain objects, and test whether appointment requests can be completed without scheduling conflicts. The clinic also wants to retain a staffed telephone channel for patients who cannot use the online interface. The team should select a development approach that supports early user feedback and staged delivery.</blockquote><h3>Project Initiation / System Request</h3><div style=\"overflow:auto\"><table><thead><tr><th>Field</th><th>Derived Content</th></tr></thead><tbody><tr><td>Sponsor</td><td>Clinic Manager</td></tr><tr><td>Business Need</td><td>Reduce duplicate bookings, processing time and errors</td></tr><tr><td>Requirements</td><td>Booking, rescheduling, cancellation, availability, confirmation</td></tr><tr><td>Business Value</td><td>Reliable schedules and improved patient service</td></tr><tr><td>Special Issues</td><td>Patient confidentiality, staff training</td></tr></tbody></table></div><h3>Requirements Definition</h3><ul><li>FR-01: The system shall allow patients to request appointments.</li><li>FR-02: The system shall allow authorized users to reschedule appointments.</li><li>FR-03: The system shall allow patients to cancel appointments.</li><li>FR-04: The system shall allow doctors to update consultation availability.</li><li>FR-05: The system shall reject conflicting appointments.</li><li>FR-06: The system shall provide confirmation for accepted bookings.</li><li>NFR-01: Only authorized users may access patient information.</li><li>NFR-02: Booking data must be stored reliably.</li><li>NFR-03: The interface must be usable by patients and receptionists.</li></ul><h3>Functional View (Conceptual Mermaid representation)</h3><pre class=\"mermaid\">flowchart LR\\n P[\"Patient\"] --- U1([\"Request Appointment\"])\\n P --- U2([\"Cancel Appointment\"])\\n R[\"Receptionist\"] --- U1\\n D[\"Doctor\"] --- U3([\"Maintain Availability\"])\\n U1 -. \"triggers\" .-> U4([\"Send Confirmation\"])</pre><details><summary>Copyable Mermaid source</summary><pre><code>flowchart LR\\n P[\"Patient\"] --- U1([\"Request Appointment\"])\\n P --- U2([\"Cancel Appointment\"])\\n R[\"Receptionist\"] --- U1\\n D[\"Doctor\"] --- U3([\"Maintain Availability\"])\\n U1 -. \"triggers\" .-> U4([\"Send Confirmation\"])</code></pre></details><p>Mermaid Flowchart approximates the concept but is <b>not a formally exact UML Use Case Diagram</b>; the dotted line above means only conceptual relationship and is NOT automatically an «include» or «extend».</p><h3>Structural View</h3><pre class=\"mermaid\">classDiagram\\n class Patient {\\n +patientId\\n +name\\n +requestAppointment()\\n }\\n class Doctor {\\n +doctorId\\n +updateAvailability()\\n }\\n class Appointment {\\n +appointmentId\\n +status\\n +confirm()\\n +cancel()\\n }\\n class Availability {\\n +startTime\\n +endTime\\n }\\n Patient \"1\" -- \"0..*\" Appointment : requests\\n Doctor \"1\" -- \"0..*\" Appointment : attends\\n Doctor \"1\" -- \"0..*\" Availability : maintains</pre><details><summary>Copyable Mermaid source</summary><pre><code>classDiagram\\n class Patient {\\n +patientId\\n +name\\n +requestAppointment()\\n }\\n class Doctor {\\n +doctorId\\n +updateAvailability()\\n }\\n class Appointment {\\n +appointmentId\\n +status\\n +confirm()\\n +cancel()\\n }\\n class Availability {\\n +startTime\\n +endTime\\n }\\n Patient \"1\" -- \"0..*\" Appointment : requests\\n Doctor \"1\" -- \"0..*\" Appointment : attends\\n Doctor \"1\" -- \"0..*\" Availability : maintains</code></pre></details><p>Multiplicity: Each Appointment in this simplified example is associated with one Patient; one Patient may have zero or many Appointments. Multiplicity is read from the opposite endpoint.</p><h3>Behavioral View</h3><pre class=\"mermaid\">sequenceDiagram\\n actor Patient\\n participant UI as Appointment UI\\n participant Service as Appointment Service\\n participant Schedule\\n participant Appointment\\n Patient->>UI: requestAppointment(dateTime)\\n UI->>Service: submitRequest(dateTime)\\n Service->>Schedule: checkAvailability(dateTime)\\n Schedule-->>Service: available\\n alt Slot available\\n Service->>Appointment: createAppointment()\\n Appointment-->>Service: confirmation\\n Service-->>UI: bookingConfirmed()\\n UI-->>Patient: displayConfirmation()\\n else Slot unavailable\\n Service-->>UI: bookingRejected()\\n UI-->>Patient: requestAnotherSlot()\\n end</pre><details><summary>Copyable Mermaid source</summary><pre><code>sequenceDiagram\\n actor Patient\\n participant UI as Appointment UI\\n participant Service as Appointment Service\\n participant Schedule\\n participant Appointment\\n Patient->>UI: requestAppointment(dateTime)\\n UI->>Service: submitRequest(dateTime)\\n Service->>Schedule: checkAvailability(dateTime)\\n Schedule-->>Service: available\\n alt Slot available\\n Service->>Appointment: createAppointment()\\n Appointment-->>Service: confirmation\\n Service-->>UI: bookingConfirmed()\\n UI-->>Patient: displayConfirmation()\\n else Slot unavailable\\n Service-->>UI: bookingRejected()\\n UI-->>Patient: requestAnotherSlot()\\n end</code></pre></details><p>UI and Service are illustrative design-level participants. Analysis-level sequence diagrams should follow the lecturer's required abstraction and notation.</p><h3>V&V and Traceability</h3><div style=\"overflow:auto\"><table><thead><tr><th>Requirement</th><th>Functional Artifact</th><th>Structural Element</th><th>Behavioral Validation</th></tr></thead><tbody><tr><td>Book appointment</td><td>Request Appointment Use Case</td><td>Patient / Appointment</td><td>Request → Availability → Create</td></tr><tr><td>Maintain availability</td><td>Maintain Availability Use Case</td><td>Doctor / Availability</td><td>Update period</td></tr><tr><td>Prevent conflicts</td><td>Validation path</td><td>Availability / Appointment</td><td>Reject unavailable slot</td></tr><tr><td>Confirm booking</td><td>Confirmation flow</td><td>Appointment</td><td>Return confirmation</td></tr></tbody></table></div><p><b>Recommended Methodology:</b> Phased iterative releases. R1 Basic Booking; R2 Availability and Conflict Prevention; R3 Rescheduling and Notifications; R4 Reporting. The choice is an instructional inference, not a verbatim mandated textbook selection.</p></section>\n<section id=\"part8\"><h2>8. Cheat Sheet · Golden Rules</h2><ol><li><b>Planning asks WHY; Analysis asks WHAT; Design asks HOW; Implementation BUILDS and DELIVERS.</b></li><li>Every Information System should be justified by Business Value.</li><li>Requirements describe capabilities; design defines technical solutions.</li><li>Object is an instance of a Class; a Message requests behavior.</li><li>Generalization hollow triangle always points to the Superclass.</li><li>Polymorphism supports subtype-specific behavior through a common interface.</li><li>OOAD is Use-Case Driven, Architecture-Centric and Iterative/Incremental.</li><li>UP Phases describe WHEN; Workflows describe WHAT.</li></ol>\n<section class=\"quiz\"><h3>Quick Concept Check 1</h3><p><strong>In UP, the Requirements Workflow occurs only during Inception.</strong></p><button data-q=\"1\" data-option=\"0\" onclick=\"lessonAnswer('chapter1.html-1',0,1)\">A. True</button><button data-q=\"1\" data-option=\"1\" onclick=\"lessonAnswer('chapter1.html-1',1,1)\">B. False</button><div id=\"fbchapter1.html-1\"></div><div id=\"expchapter1.html-1\" hidden><b>Correct answer: B.</b> UP Workflows span multiple phases; requirements can be refined in later iterations. 中文：only 是陷阱。Workflow 與 Phase 不是一對一。</div><details><summary>English explanation / 中文解析</summary><p>UP Workflows span multiple phases; requirements can be refined in later iterations.</p><p>only 是陷阱。Workflow 與 Phase 不是一對一。</p></details></section>\n<section class=\"quiz\"><h3>Quick Concept Check 2</h3><p><strong>Which describes runtime polymorphism?</strong></p><button data-q=\"2\" data-option=\"0\" onclick=\"lessonAnswer('chapter1.html-2',0,1)\">A. All subclasses must have identical attribute values.</button><button data-q=\"2\" data-option=\"1\" onclick=\"lessonAnswer('chapter1.html-2',1,1)\">B. Superclass references may invoke a subclass's overridden instance method.</button><button data-q=\"2\" data-option=\"2\" onclick=\"lessonAnswer('chapter1.html-2',2,1)\">C. All subclasses must override every operation.</button><button data-q=\"2\" data-option=\"3\" onclick=\"lessonAnswer('chapter1.html-2',3,1)\">D. All superclasses are abstract.</button><div id=\"fbchapter1.html-2\"></div><div id=\"expchapter1.html-2\" hidden><b>Correct answer: B.</b> Dynamic dispatch invokes the method of the concrete runtime object for normally overridden methods. 中文：動態派發依實際物件型別執行覆寫方法；父類別並不必然抽象。</div><details><summary>English explanation / 中文解析</summary><p>Dynamic dispatch invokes the method of the concrete runtime object for normally overridden methods.</p><p>動態派發依實際物件型別執行覆寫方法；父類別並不必然抽象。</p></details></section>\n<section class=\"quiz\"><h3>Quick Concept Check 3</h3><p><strong>A prototype is used to compare UI alternatives and then discarded. Which approach?</strong></p><button data-q=\"3\" data-option=\"0\" onclick=\"lessonAnswer('chapter1.html-3',0,2)\">A. Waterfall</button><button data-q=\"3\" data-option=\"1\" onclick=\"lessonAnswer('chapter1.html-3',1,2)\">B. Evolutionary Prototyping</button><button data-q=\"3\" data-option=\"2\" onclick=\"lessonAnswer('chapter1.html-3',2,2)\">C. Throwaway Prototyping</button><button data-q=\"3\" data-option=\"3\" onclick=\"lessonAnswer('chapter1.html-3',3,2)\">D. Parallel Development</button><div id=\"fbchapter1.html-3\"></div><div id=\"expchapter1.html-3\" hidden><b>Correct answer: C.</b> The exploratory prototype is discarded after learning, defining Throwaway Prototyping. 中文：判斷原型是繼續演進還是丟棄。</div><details><summary>English explanation / 中文解析</summary><p>The exploratory prototype is discarded after learning, defining Throwaway Prototyping.</p><p>判斷原型是繼續演進還是丟棄。</p></details></section>\n<button onclick=\"lessonMarkDone(1)\">✓ Mark Chapter 1 as reviewed</button> <span id=\"reading1\"></span></section>\n<p class=\"muted\">Source alignment: Professor C.Y. Chen 2026 Chapter 1 slides; Dennis, Wixom & Tegarden Chapter 1 textbook. Workflow diagrams, comparison analyses and clinic scenario are instructional adaptations. Mermaid diagrams use a CDN and require internet access for rendering; textual content remains readable without it.</p>","2":"<h1>Chapter 2. Requirements Determination</h1><p class=\"muted\">English-first · 繁體中文補充 · 8 Analysis Strategies · 5 Gathering Techniques · Text Analysis · VT4C · Clinic Case Study</p><nav class=\"toc\"><a class=\"pill\" href=\"#part1\">1. Core Concepts</a><a class=\"pill\" href=\"#part2\">2. 8 Analysis Strategies</a><a class=\"pill\" href=\"#part3\">3. 5 Gathering Techniques</a><a class=\"pill\" href=\"#part4\">4. Documentation and Priorities</a><a class=\"pill\" href=\"#part5\">5. Text Analysis & VT4C</a><a class=\"pill\" href=\"#part6\">6. Requirements SOP and V&V</a><a class=\"pill\" href=\"#part7\">7. Clinic Walkthrough</a><a class=\"pill\" href=\"#part8\">8. Classroom Registration Case</a><a class=\"pill\" href=\"#part9\">9. Golden Rules & Quiz</a></nav>\n<section id=\"part1\"><h2>1. Core Concepts & Terminology</h2><p><b>Requirement:</b> A statement of what a system must do or what characteristic it must have to serve and support users' needs. <b>Requirements Determination:</b> Gathering, analyzing, refining and documenting needed capabilities and constraints.</p><p>本章屬於 SDLC Analysis。它把 System Request 中的高階 Business Need 細化成清楚的 Requirements Definition，支援後續 Functional、Structural、Behavioral Models，最後整合為 System Proposal。需求錯誤越晚發現，返工成本越大，因此不能把蒐集到的片段敘述直接當作已確認規格。</p><pre class=\"mermaid\">flowchart TD\\n A[\"Planning: System Request\"] --> B[\"Analysis: Requirements Determination\"]\\n B --> C[\"Requirements Definition\"]\\n C --> D[\"Functional Models\"]\\n C --> E[\"Structural Models\"]\\n C --> F[\"Behavioral Models\"]\\n D --> G[\"System Proposal\"]\\n E --> G\\n F --> G\\n G --> H[\"Design and Implementation\"]</pre><details><summary>Copyable Mermaid diagram source</summary><pre><code>flowchart TD\\n A[\"Planning: System Request\"] --> B[\"Analysis: Requirements Determination\"]\\n B --> C[\"Requirements Definition\"]\\n C --> D[\"Functional Models\"]\\n C --> E[\"Structural Models\"]\\n C --> F[\"Behavioral Models\"]\\n D --> G[\"System Proposal\"]\\n E --> G\\n F --> G\\n G --> H[\"Design and Implementation\"]</code></pre></details><h3>Business Requirements vs System Requirements</h3><div style=\"overflow:auto\"><table><thead><tr><th>Dimension</th><th>Business Requirement</th><th>System Requirement</th></tr></thead><tbody><tr><td>View</td><td>Business / User perspective</td><td>Developer / Technical perspective</td></tr><tr><td>Primary question</td><td>WHAT capability is needed?</td><td>HOW will this be realized?</td></tr><tr><td>Example</td><td>Patients shall be able to book appointments.</td><td>Booking service will expose an authenticated API.</td></tr><tr><td>Stage</td><td>Initially in Analysis</td><td>Refined in Design</td></tr></tbody></table></div><p>課本指出兩者沒有絕對界線；需求會隨 Inception、Elaboration、Construction 不斷細化。</p><h3>Functional vs Non-functional Requirements</h3><p><b>Functional:</b> What business processes the system must perform or information it must manage. <b>Nonfunctional:</b> Behavioral properties, qualities or constraints under which it operates.</p><div style=\"overflow:auto\"><table><thead><tr><th>Category</th><th>Definition</th><th>Example / 中文判斷</th></tr></thead><tbody><tr><td>Functional</td><td>System process or information capability</td><td>Generate daily appointment schedules（產生報表）</td></tr><tr><td>Operational</td><td>Operating environment or technology constraint</td><td>Support wireless printing（操作環境）</td></tr><tr><td>Performance</td><td>Speed, capacity, reliability and availability</td><td>Retrieve a schedule within 2 seconds（效能）</td></tr><tr><td>Security</td><td>Access and data protection</td><td>Only doctors can update availability（權限）</td></tr><tr><td>Cultural & Political</td><td>Regulatory and organizational constraints</td><td>Comply with applicable privacy regulation（法規）</td></tr></tbody></table></div><p>混合句型如「Doctors may retrieve medical records within two seconds」應視品質管理需要拆為 Functional Capability 和 measurable Performance Requirement。</p><h3>Essential Glossary</h3><div style=\"overflow:auto\"><table><thead><tr><th>Term</th><th>English Definition</th><th>中文易混淆點</th></tr></thead><tbody><tr><td>Requirements Elicitation</td><td>Discovering and clarifying stakeholder needs</td><td>需求發掘與引導，不是完全等於寫規格。</td></tr><tr><td>Requirements Gathering</td><td>Collecting information from stakeholders and artifacts</td><td>蒐集原始證據。</td></tr><tr><td>Requirements Definition</td><td>Document listing prioritized functional and nonfunctional requirements</td><td>需求定義文件，不等於整份 System Proposal。</td></tr><tr><td>As-Is / To-Be</td><td>Current / proposed future process</td><td>現況和改善目標。</td></tr><tr><td>Stakeholder</td><td>Individual or organization affected by the system</td><td>利害關係人不一定是 Actor。</td></tr><tr><td>Actor</td><td>External role interacting with a subject</td><td>對系統操作的角色，可能是人或外部系統。</td></tr><tr><td>Scope</td><td>Boundary of agreed project/system functionality</td><td>系統範圍。</td></tr><tr><td>Scope Creep</td><td>Uncontrolled growth in project scope</td><td>需求增加未做變更評估。</td></tr><tr><td>User Story</td><td>Role-centered statement of capability and benefit</td><td>As a ... I want ... so that ...</td></tr><tr><td>Verification</td><td>Checking requirements against defined specification-quality criteria</td><td>規格是否寫得正確。</td></tr><tr><td>Validation</td><td>Checking requirements meet actual stakeholder needs</td><td>是否真的是使用者要的。</td></tr><tr><td>Traceability</td><td>Linking requirements to origin, models and tests</td><td>可追蹤性。</td></tr></tbody></table></div></section>\n<section id=\"part2\"><section class=\"card\" style=\"margin:16px 0\"><h3>Requirements Determination: Key Concepts</h3><p><b>講義原文：</b> Determining system requirements is to gather, analyze, and document requirements.</p><p><b>中文理解：</b> 本章重點是先蒐集、分析，再記錄需求。需掌握 2 種需求、2 種記錄格式、8 種分析策略、5 種蒐集方法，以及需求品質檢查。</p><p><b>講義原文：</b> A statement of what the system must do to serve &amp; support the user need.</p><p><b>中文理解：</b> Functional requirements：系統要執行哪些業務流程；Non-functional requirements：系統要符合哪些支援性條件。</p><p><b>講義留白提醒：</b>p.3 非功能需求四個面向與「需求確定後成為系統的＿＿」仍是學生版填空，未以推測答案冒充老師手寫。</p></section><div class=\"card\" style=\"margin:14px 0;padding:16px\"><h3>Requirements Determination｜定義、類型與範圍（p.2–3）</h3><p><b>Learning Goals:</b> gather, analyze, and document requirements; 2 requirement types; 2 statement formats; 8 analysis strategies; 5 gathering methods; 2 methods for requirements quality; system proposal.</p><p><b>Requirement:</b> A statement of what the system must do to serve &amp; support the user need.</p><p><b>Functional requirements</b>：支援使用者需要的業務流程（系統做什麼）。<b>Non-functional requirements</b>：支援功能性需求，包含四個面向：</p><ol><li><b>Operational</b>（操作／運作）：例如能在手機瀏覽器使用</li><li><b>Performance</b>（效能／可靠度）：例如回應時間小於三秒</li><li><b>Security</b>（系統安全）：例如醫療資料僅供醫護存取</li><li><b>Political and Cultural</b>（政治與文化）：例如遵守法規</li></ol><p><b>Quality of a system:</b> to meet the above two types of requirements.</p><p><b>Scope（範圍）：</b> Once the requirements are determined, they become the <b>scope</b> of the system.</p></div><div class=\"card\" style=\"margin:14px 0;padding:16px\"><h3>Examples of Requirements｜The Patterson Superstore（p.4–7）</h3><p><b>案例背景：</b>Patterson 是連鎖藥局，原有手機 App 可處理處方訂購、通知與自動續領。希望擴充診所服務，包括即時音訊／視訊／文字溝通、行動預約、遠距健康評估及輕症視訊診療。</p><p><b>Functional Requirements（功能性）</b></p><ol><li><b>Schedule appointment：</b>顯示服務清單、選擇服務、判斷診所是否能提供；若超出能力則顯示轉介資訊；提供即時可預約時段、預約日曆與確認通知</li><li><b>Communicate real time：</b>病患提出即時會談需求，提供可用時間與技術偏好；照護人員回覆後安排會談</li><li><b>Assess via tele-health：</b>問答矩陣評估遠距診療適合性，照護人員檢視診斷資訊，必要時安排視訊、追蹤或轉介</li></ol><p><b>Nonfunctional Requirements（非功能性）</b></p><table><thead><tr><th>Aspect</th><th>課堂案例</th></tr></thead><tbody><tr><td>Operational</td><td>支援各種瀏覽器及手機、整合現有診所系統、每日午夜自動備份</td></tr><tr><td>Performance</td><td>全年每天 24 小時可用；互動回應小於 3 秒；交易資料存取每 2 秒一次</td></tr><tr><td>Security</td><td>醫療資訊限醫護人員；行政人員可查聯絡與帳務資訊但不可查醫療資訊</td></tr><tr><td>Cultural &amp; Political</td><td>符合醫療相關法規及 HIPAA</td></tr></tbody></table><p><b>另一實務案例（p.7）：</b>ee-class 本單元協同教材，投影片僅指示參閱，未列出細節。</p></div><h2>2. Eight Requirements Analysis Strategies</h2><p><b>Strategies</b> help discover problems, causes and opportunities in business processes; they are different from the five <b>Gathering Techniques</b> used to obtain evidence.</p><div style=\"overflow:auto\"><table><thead><tr><th>Strategy</th><th>Core Question</th><th>Best Use</th></tr></thead><tbody><tr><td>1. Problem Analysis</td><td>What current problems exist?</td><td>User pain points and defects.</td></tr><tr><td>2. Root Cause Analysis</td><td>Why is the problem occurring?</td><td>Repeated symptoms; uncover root causes.</td></tr><tr><td>3. Duration Analysis</td><td>Where is elapsed time spent?</td><td>Process delays and handoffs.</td></tr><tr><td>4. Activity-Based Costing</td><td>Which activities cost the most?</td><td>Business process cost reduction.</td></tr><tr><td>5. Informal Benchmarking</td><td>How do comparable organizations succeed?</td><td>Learn external practices.</td></tr><tr><td>6. Outcome Analysis</td><td>What end result is desired?</td><td>Result-first process redesign.</td></tr><tr><td>7. Technology Analysis</td><td>Can technology enable new capabilities?</td><td>Technology-enabled business change.</td></tr><tr><td>8. Activity Elimination</td><td>Which step can be removed?</td><td>Simplify or redesign process.</td></tr></tbody></table></div><p><b>Identifying business problems（p.8）：</b>先確認使用者端的業務問題，再分析或引導出需求。八種策略為 Problem analysis、Root cause analysis、Duration analysis、Activity-based costing、Informal benchmarking、Outcome analysis、Technology analysis、Activity elimination。</p><h3>2.1 Problem Analysis</h3><p><b>Definition:</b> Ask users what difficulties and inefficiencies they experience, then clarify concrete examples, frequency, impact and current workarounds. SOP: Identify Stakeholders → Ask Problems → Probe Specific Occurrences → Record Business Impact → Verify Issue → Form Improvement Hypothesis.</p><p>如果接待員說「預約常常重複」，不代表解決方案必然是換畫面。先問何時重複、由誰記錄、什麼情況會出錯。</p><p><b>Problem analysis（p.9）：</b>直接詢問使用者目前系統有哪些問題，並進一步問：<b>How they would solve these problems</b>（他們會如何解決這些問題）。</p><h3>2.2 Root Cause Analysis</h3><p><b>Definition:</b> Investigate underlying causes instead of treating only symptoms. Typical artifact: Fishbone / Cause-and-Effect Diagram.</p><pre class=\"mermaid\">flowchart LR\\n A[\"Incorrect Inventory Data\"] --> P[\"Inventory Stock-Outs\"]\\n B[\"Delayed Purchase Approval\"] --> P\\n C[\"Wrong Reorder Threshold\"] --> P\\n D[\"Slow Supplier Delivery\"] --> P\\n E[\"Unrecorded Sales\"] --> P</pre><details><summary>Copyable Mermaid diagram source</summary><pre><code>flowchart LR\\n A[\"Incorrect Inventory Data\"] --> P[\"Inventory Stock-Outs\"]\\n B[\"Delayed Purchase Approval\"] --> P\\n C[\"Wrong Reorder Threshold\"] --> P\\n D[\"Slow Supplier Delivery\"] --> P\\n E[\"Unrecorded Sales\"] --> P</code></pre></details><p>此 Mermaid 為因果關係示意；教授的 Fishbone Diagram 應用魚骨布局。SOP: Precisely define effect → Brainstorm categories → Decompose contributing causes → Validate evidence → Derive corrective requirements. 錯誤示範：只在缺貨後增加通知，卻不檢查庫存更新不正確的根本原因。</p><figure style=\"margin:16px 0\"><figcaption><b>Root Cause Analysis｜Fishbone Diagram（p.10）</b></figcaption><p>問題：<b>Frequent Inventory Stock-Outs（頻繁缺貨）</b>。魚骨圖由右側的業務問題往左追查原因，支線是更具體的原因。</p><div style=\"overflow-x:auto\"><svg viewBox=\"0 0 820 390\" width=\"100%\" style=\"min-width:570px;max-width:850px\" role=\"img\" aria-label=\"Fishbone diagram showing frequent inventory stock-outs caused by reorder settings, order delays, and inventory controls\"><g stroke=\"#62748a\" stroke-width=\"2\" fill=\"none\"><path d=\"M90 195H650\"/><path d=\"M230 195L120 52M440 195L335 52M260 195L155 340M470 195L575 340\"/><path d=\"M150 92H315M185 135H345M370 95H535M403 145H570M210 262H360M170 307H335M490 255H680M525 304H700\"/></g><g fill=\"currentColor\" font-size=\"13\"><text x=\"95\" y=\"30\">Incorrect Reorder Level</text><text x=\"130\" y=\"45\">and Quantities</text><text x=\"327\" y=\"30\">Delays in Order Processing</text><text x=\"155\" y=\"85\">Reorder Point Set Too Low</text><text x=\"180\" y=\"127\">Reorder Quantity (EOQ) Too Low</text><text x=\"378\" y=\"87\">Order Approval Late</text><text x=\"405\" y=\"138\">Identifying Vendor Delayed</text><text x=\"92\" y=\"355\">Problems with Inventory Controls</text><text x=\"215\" y=\"255\">Infrequent Manual Purchases Received</text><text x=\"170\" y=\"299\">Late Recording of Purchases Received</text><text x=\"510\" y=\"249\">Delay in Sending Order to Vendor</text><text x=\"535\" y=\"297\">Late Recording of Sales</text></g><rect x=\"650\" y=\"160\" width=\"165\" height=\"72\" rx=\"10\" fill=\"#dce5f2\" stroke=\"#62748a\"/><text x=\"732\" y=\"185\" font-size=\"15\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#24354a\"><tspan x=\"732\">Frequent Inventory</tspan><tspan x=\"732\" dy=\"19\">Stock-Outs</tspan></text></svg></div><p><b>讀圖重點：</b>Business problem 是「缺貨」；Cause 是訂購量設定不當、訂單處理延遲、庫存控制問題；Root cause 要再往下追問，例如核准太晚、銷售記錄太晚等。此圖為依 p.10 內容重繪的學習示意。</p></figure><h3>2.3 Duration Analysis</h3><div class=\"card\" style=\"margin:12px 0;padding:14px\"><strong>投影片 p.11｜Duration analysis（時間分析）</strong><p>資訊系統用來提升企業運作績效，因此也會推動 <b>Business Process Reengineering (BPR，作業流程再造)</b>。</p><ol><li>Determine the time to complete each step：量測各步驟花費時間。</li><li>Compare this to the total time required：與整體流程總耗時比較。</li><li>Large differences suggest problems：若差距大，可考慮 <b>eliminating steps</b>（刪除）、<b>integrating steps</b>（整合）、<b>performing steps simultaneously / in parallel</b>（平行處理）。</li></ol><p>例：審核只需 5 分鐘，但等待主管簽核要 3 天，瓶頸在等待而非審核本身。</p></div><p><b>Definition:</b> Compare actual working time required by process activities with the entire elapsed process duration. Investigate large gaps caused by waiting, handoffs, or redundant steps.</p><div style=\"overflow:auto\"><table><thead><tr><th>Activity</th><th>Processing (min)</th><th>Elapsed (min)</th></tr></thead><tbody><tr><td>Receive request</td><td>3</td><td>3</td></tr><tr><td>Wait for review</td><td>0</td><td>35</td></tr><tr><td>Verify booking</td><td>4</td><td>4</td></tr><tr><td>Wait for confirmation</td><td>0</td><td>18</td></tr><tr><td>Send confirmation</td><td>2</td><td>2</td></tr><tr><td>Total</td><td>9</td><td>62</td></tr></tbody></table></div><p>62 minutes end-to-end minus 9 minutes processing = 53 minutes waiting. Possible responses: eliminate steps, integrate steps, or execute independent tasks in parallel. 等待不必然等於浪費；如果有法定審核，需先確認是否能取消。</p><h3>2.4 Activity-Based Costing (ABC)</h3><div class=\"card\" style=\"margin:12px 0;padding:14px\"><strong>投影片 p.12｜Activity-based costing（作業基礎成本分析）</strong><p><b>Same as duration analysis but applied to costs.</b> 與時間分析相似，但比較各作業的成本。資訊系統節省的成本可能包含 <b>溝通／無紙化與交通費用、人事成本、時間成本、錯誤成本</b>（手寫：資訊化可減少錯誤）。</p><p>考題辨識：分析「哪個步驟最花錢」是 ABC；分析「哪個步驟最花時間」是 Duration analysis。</p></div><p><b>Definition:</b> Analyze costs assigned to activities to identify major cost drivers and improvement opportunities. Compare the cost of manual data entry, calls, corrections and paper processing with prospective automation and support costs.</p><div style=\"overflow:auto\"><table><thead><tr><th>Activity</th><th>Illustrative Monthly Cost</th></tr></thead><tbody><tr><td>Manual booking entry</td><td>NT$12,000</td></tr><tr><td>Confirmation calls</td><td>NT$8,000</td></tr><tr><td>Error correction</td><td>NT$6,000</td></tr><tr><td>Paperwork</td><td>NT$2,000</td></tr><tr><td>Total</td><td>NT$28,000</td></tr></tbody></table></div><p>ABC focuses the allocation and consequences of costs by business activity, not only the initial total software project budget. 數字是案例示例，不是課本提供的診所真實數據。</p><h3>2.5 Informal Benchmarking</h3><div class=\"card\" style=\"margin:12px 0;padding:14px\"><strong>投影片 p.12｜Informal benchmarking（非正式標竿比較）</strong><p><b>Analyzes similar processes in other successful organizations.</b> 參考其他成功組織的相似流程。課堂舉例：<b>金控產業的洗錢防治系統</b>。</p></div><p><b>Definition:</b> Compare successful organizations' processes to identify ideas, then adapt them to local circumstances. SOP: Select comparable process → Study its practices → Identify gap → Evaluate organizational fit → Adapt. 注意 Benchmarking 不代表完全抄襲其他組織的規則。</p><h3>2.6 Outcome Analysis</h3><div class=\"card\" style=\"margin:12px 0;padding:14px\"><strong>投影片 p.13｜Outcome analysis 與 GME</strong><p>先問 <b>What does the customer want in the end (goal)?</b>（客戶最終想達成什麼？）。老師手寫 <b>GME = Given → Means → Ends</b>：</p><ol><li><b>G (Given)</b>：已知／辨識的條件或問題。</li><li><b>M (Means)</b>：解決問題的方法。</li><li><b>E (Ends)</b>：由方法推導出來、滿足需求的功能性需求。</li></ol><p><b>購票系統案例：</b>業主目標是減少突然大量退票；<b>G</b>＝現有售票流程有黃牛；<b>M</b>＝採實名制；<b>E</b>＝購票時上傳照片，驗票口設置 AI 人臉辨識功能。</p><p>注意：減少大量退票是最終目標，不等於 G 的現況條件。</p></div><p><b>Definition:</b> Begin with the desired business outcome and derive suitable process changes and requirements. Lecturer's example: reducing abnormal mass ticket cancellations, examining scalping and identity controls.</p><pre class=\"mermaid\">flowchart TD\\n G[\"Desired Outcome: Fewer abnormal cancellations\"] --> C[\"Investigate causes\"]\\n C --> M[\"Evaluate methods: identity verification\"]\\n M --> E[\"Derive requirements and controls\"]</pre><details><summary>Copyable Mermaid diagram source</summary><pre><code>flowchart TD\\n G[\"Desired Outcome: Fewer abnormal cancellations\"] --> C[\"Investigate causes\"]\\n C --> M[\"Evaluate methods: identity verification\"]\\n M --> E[\"Derive requirements and controls\"]</code></pre></details><p>不應因為想用 Facial Recognition 就直接認定那是唯一需求；還要評估 privacy, misidentification, security and regulations。</p><h3>2.7 Technology Analysis</h3><div class=\"card\" style=\"margin:12px 0;padding:14px\"><strong>投影片 p.14｜Technology analysis（科技分析）</strong><p><b>Apply new technologies to business processes &amp; identify benefits.</b> 分析新科技導入業務流程的效益。老師手寫補充：還要分析 <b>使用者能否接受（TAM model，科技接受模型）</b>。</p></div><p><b>Definition:</b> Assess available or emerging technology for business opportunities. SOP: Discover capability → Determine business use → Evaluate feasibility and risks → Derive requirements → Confirm stakeholder value. Example: Automatic reminders → reduce no-shows → notification schedule requirement. Technology is a means to business value.</p><h3>2.8 Activity Elimination</h3><div class=\"card\" style=\"margin:12px 0;padding:14px\"><strong>投影片 p.14｜Activity elimination（作業刪除）</strong><p>用於 <b>simplify business processes and increase business efficiency</b>。即使使用者或主管不願刪除既有流程，投影片仍建議透過 <b>force-fit（強迫接受）</b> 的方式檢視能否取消不必要的活動。</p><p>課堂漫畫重點：開戶程序繁複、銷戶程序卻很簡單，藉此反思不合理的作業設計。</p></div><p><b>Definition:</b> Challenge the necessity of existing activities, often through a Force-Fit Exercise: assume the step must be removed and redesign the remaining process.</p><pre class=\"mermaid\">flowchart LR\\n A[\"Patient Form\"] --> B[\"Manual Re-entry\"] --> C[\"Schedule Check\"] --> D[\"Approval\"] --> E[\"Confirmation\"]</pre><details><summary>Copyable Mermaid diagram source</summary><pre><code>flowchart LR\\n A[\"Patient Form\"] --> B[\"Manual Re-entry\"] --> C[\"Schedule Check\"] --> D[\"Approval\"] --> E[\"Confirmation\"]</code></pre></details><p>Ask whether manual re-entry and some approvals are truly required. Cannot eliminate legally necessary, clinically necessary, or security-sensitive steps purely for speed.</p></section>\n<section id=\"part3\"><section class=\"card\" style=\"margin:16px 0\"><h3>Requirements Analysis: Examples</h3><p><b>原文八項：</b> Problem analysis / Root cause analysis / Duration analysis / Activity-based costing / Informal benchmarking / Outcome analysis / Technology analysis / Activity elimination.</p><p><b>Duration analysis：</b> Determine the time to complete each step; compare it to the total time; large differences suggest eliminating, integrating or parallelizing steps.</p><p><b>Activity-based costing：</b> Same as duration analysis but applied to costs. 講義舉無紙化、交通、人事、時間與錯誤成本。</p><p><b>Outcome analysis：</b> What does the customer want in the end? 講義購票例：目標是減少突然大量退票；發現黃牛問題；考慮實名制；衍生上傳照片與驗票口 AI 人臉辨識的需求。</p><p><b>Activity elimination：</b> 可用 force-fit（強迫接受）練習思考移除業務活動。</p><p><b>保留原講義留白：</b> Problem analysis 追問句、Duration analysis 中文填空、Outcome analysis 名稱與 Technology analysis 填空尚未有你提供的手寫答案。</p></section><h2>3. Five Requirements Gathering Techniques</h2><div class=\"card\" style=\"margin:12px 0;padding:14px\"><strong>投影片 p.15｜Gather / Collect Requirements</strong><p>辨識 <b>Business Problems (BPs)</b> 後，使用適當方法蒐集解決問題的系統需求。課堂列出的五種方法：</p><ol><li><b>Interview</b>：訪談</li><li><b>Workshops / JAD</b>：工作坊／聯合應用設計</li><li><b>Survey / Questionnaire</b>：調查／問卷</li><li><b>Observation (Field study)</b>：實地觀察／考察（老師手寫）</li><li><b>Document analysis</b>：文件分析</li></ol></div><div style=\"overflow:auto\"><table><thead><tr><th>Technique</th><th>Strength</th><th>Limit / Bias</th><th>Best Context</th></tr></thead><tbody><tr><td>Interviews</td><td>Detail, clarification and follow-up</td><td>Time-consuming; interviewer effects</td><td>Explore complicated business rules</td></tr><tr><td>JAD</td><td>Shared decisions and conflict resolution</td><td>Scheduling and facilitation overhead</td><td>Multiple stakeholders need consensus</td></tr><tr><td>Questionnaires</td><td>Scale, standardized answers</td><td>Limited depth, nonresponse bias</td><td>Large distributed user base</td></tr><tr><td>Observation</td><td>Reveal real workarounds</td><td>Observer effect; periodic work missed</td><td>Actual operations differ from documented process</td></tr><tr><td>Document Analysis</td><td>Records existing forms and rules</td><td>May be obsolete or inaccurate</td><td>Study policies, forms, reports and records</td></tr></tbody></table></div><h3>3.1 Interviews</h3><div class=\"card\" style=\"margin:12px 0;padding:14px\"><strong>投影片 p.16｜Interview formats & question types</strong><p><b>Suitable when users have no clear ideas about the functionality.</b> 使用者還不清楚系統應具備哪些功能時，訪談尤其適合。</p><table><thead><tr><th>Interview format</th><th>重點</th></tr></thead><tbody><tr><td><b>Structured</b>（結構式）</td><td>事先掌握全部問題，準備較費工</td></tr><tr><td><b>Unstructured</b>（非結構式）</td><td>隨受訪者回答延伸提問，注意不要離題（老師手寫）</td></tr><tr><td><b>Semi-structured</b>（半結構式）</td><td>有預定主題，也可依回答追問</td></tr></tbody></table><table><thead><tr><th>Question type</th><th>目的</th><th>投影片 p.17 例句</th></tr></thead><tbody><tr><td><b>Open-ended</b> 開放式</td><td>挖掘意外觀點或問題</td><td>What do you think about the current system?</td></tr><tr><td><b>Closed-ended</b> 封閉式</td><td>取得明確答案</td><td>How many telephone orders are received per day?</td></tr><tr><td><b>Probing</b> 探究／追問</td><td>深入了解背後原因</td><td>Why? / Can you give me an example? / Can you explain that in more detail?</td></tr></tbody></table><p>其他 p.17 範例：封閉式可問「How do customers place orders?」「What information is missing from the monthly sales report?」；開放式可問日常問題及新系統希望改善之處。</p></div><div class=\"card\" style=\"margin:12px 0;padding:14px\"><strong>投影片 p.18｜Interviewing Approaches（訪談金字塔）</strong><p>由一般到具體分為 <b>High-level</b>（Very general）、<b>Medium-level</b>（Moderately specific）、<b>Low-level</b>（Very specific）。</p><div style=\"max-width:650px;margin:auto\"><svg viewBox=\"0 0 640 330\" width=\"100%\" role=\"img\" aria-label=\"Top-down interviews move from general questions at the top of a triangle to specific questions at the bottom, while bottom-up moves in reverse\"><polygon points=\"320,16 40,302 600,302\" fill=\"#d7edf3\" stroke=\"#32627c\" stroke-width=\"3\"/><path d=\"M213 126H427M133 218H507\" stroke=\"#32627c\" stroke-dasharray=\"6 5\"/><g text-anchor=\"middle\" fill=\"#193b4e\" font-size=\"16\"><text x=\"320\" y=\"78\">High-level</text><text x=\"320\" y=\"99\" font-size=\"12\">How can order processing be improved?</text><text x=\"320\" y=\"163\">Medium-level</text><text x=\"320\" y=\"185\" font-size=\"12\">How can we reduce customer returns?</text><text x=\"320\" y=\"250\">Low-level</text><text x=\"320\" y=\"274\" font-size=\"12\">How can we reduce shipping errors?</text></g><text x=\"16\" y=\"28\" font-size=\"15\" fill=\"currentColor\">Top-down ↓</text><text x=\"494\" y=\"28\" font-size=\"15\" fill=\"currentColor\">↑ Bottom-up</text></svg></div><p><b>Top-down</b>：從籠統問題逐步問到具體細節；<b>Bottom-up</b>：從具體問題逐步歸納出高層議題。投影片對應課本 <b>p.57</b>。</p></div><div class=\"card\" style=\"margin:12px 0;padding:14px\"><strong>投影片 p.19｜Post-Interview（訪談後）</strong><p><b>Must send the interview notes for verification &amp; to be approved.</b> 訪談後必須將紀錄送交受訪者確認並核准（手寫答案：<b>approved</b>）。</p><p>投影片 p.59 範例的紀錄欄位包括：<b>Person Interviewed、Interviewer、Purpose of Interview、Summary of Interview、Open Items、Detailed Notes</b>，並標示 <b>Interview Notes Approved by</b>。範例指出現有 HR 報表資料過舊且品質不佳，後續待辦包括取得員工名冊、確認假期計算及追查資料品質問題。</p></div><p><b>Definition:</b> Direct conversations with stakeholders to elicit needs, problems and business facts. Structured interviews use predetermined questions; Unstructured interviews follow responses; semi-structured interviews blend both (a general methodological supplement). Question Types: Open-ended, Closed-ended and Probing.</p><div style=\"overflow:auto\"><table><thead><tr><th>Question Type</th><th>Example</th><th>Best Purpose</th></tr></thead><tbody><tr><td>Open-ended</td><td>What difficulties arise during booking?</td><td>Explore unknown issues</td></tr><tr><td>Closed-ended</td><td>How many bookings are processed daily?</td><td>Obtain precise/comparable facts</td></tr><tr><td>Probing</td><td>Why is manager approval required?</td><td>Clarify reasons and exceptions</td></tr></tbody></table></div><p><b>Top-Down:</b> General
