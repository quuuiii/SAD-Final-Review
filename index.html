pointmentId\n Manager-->>UI: confirmed(appointmentId)\n deactivate Manager\n UI-->>Patient: displayConfirmation()\n deactivate UI</pre><details><summary>Mermaid 原始碼（可複製）</summary><pre><code>sequenceDiagram\n actor Patient\n participant UI as bookingUI: BookingUI\n participant Manager as bookingManager: BookingManager\n participant Avail as availability: Availability\n participant Appt as appointment: Appointment\n Patient->>UI: requestAppointment(doctor,slot)\n activate UI\n UI->>Manager: book(patient,doctor,slot)\n activate Manager\n Manager->>Avail: isAvailable(slot)\n Avail-->>Manager: true\n Manager->>Appt: create(patient,doctor,slot)\n Appt-->>Manager: appointmentId\n Manager-->>UI: confirmed(appointmentId)\n deactivate Manager\n UI-->>Patient: displayConfirmation()\n deactivate UI</code></pre></details>\n<p><b>Source boundary:</b> This clinic scenario is an original worked example based on the course concepts. Slides 23–32 instead use the official Library Book Collection / Borrow Books worked sequence; those materials are analyzed separately in this chapter.</p></section><section id=\"part5\"><h2>5. Official Borrow Books Example: Sequence Diagram Drives Class Refinement</h2>\n<p><b>Lecture pp.23–32</b> walks from the <b>Library Book Collection Management System</b> and the Borrow Books UCD through candidate classes, a UC-level Class Diagram, Sequence Diagram, discussion of new business information and a revised Class Diagram. This is particularly important: behavioral modeling can reveal structural gaps.</p>\n<h3>Derivation</h3><ol><li><b>Identify the Borrow Books Normal Flow:</b> a borrower requests a book, the system checks required conditions, records checkout, and responds.</li><li><b>Inspect Candidate Classes:</b> Student, Librarian, Book, Book Collection and other concepts shown in the case; determine which are domain entities, actors, boundaries or controls.</li><li><b>Prepare UC-Level Class Diagram:</b> confirm classes' responsibilities and associations before building the Sequence Diagram.</li><li><b>Build Sequence Diagram:</b> allocate each UCD event to interacting instances.</li><li><b>Ask Design Questions:</b> who is the user of the future online system, which object becomes an interface, and where is checkout information stored?</li><li><b>Revise Class Diagram:</b> introduce or revise a checkout transaction representation where the scenario requires it; reflect corresponding operations and associations.</li></ol>\n<p>The available slides show diagrams partly as images and contain blanks; the next two diagrams illustrate the reasoning, <b>not a verbatim reproduction of slide figures 6-15 or 6-19</b>.</p>\n<pre class=\"mermaid\">sequenceDiagram\n actor Borrower\n participant UI as BorrowingUI\n participant C as BorrowingController\n participant Catalog as BookCollection\n participant Book\n participant Loan\n Borrower->>UI: requestBorrow(bookId)\n UI->>C: borrow(bookId,borrowerId)\n C->>Catalog: findBook(bookId)\n Catalog-->>C: Book\n C->>Book: isAvailable()\n Book-->>C: true\n C->>Loan: recordCheckout(bookId,borrowerId)\n Loan-->>C: loanId\n C-->>UI: approved(loanId)\n UI-->>Borrower: displayReceipt()</pre><details><summary>Mermaid 原始碼（可複製）</summary><pre><code>sequenceDiagram\n actor Borrower\n participant UI as BorrowingUI\n participant C as BorrowingController\n participant Catalog as BookCollection\n participant Book\n participant Loan\n Borrower->>UI: requestBorrow(bookId)\n UI->>C: borrow(bookId,borrowerId)\n C->>Catalog: findBook(bookId)\n Catalog-->>C: Book\n C->>Book: isAvailable()\n Book-->>C: true\n C->>Loan: recordCheckout(bookId,borrowerId)\n Loan-->>C: loanId\n C-->>UI: approved(loanId)\n UI-->>Borrower: displayReceipt()</code></pre></details>\n<pre class=\"mermaid\">classDiagram\n class Borrower {\n -borrowerId: String\n }\n class Book {\n -bookId: String\n -available: boolean\n +isAvailable(): boolean\n }\n class Loan {\n -loanId: String\n -checkoutDate: Date\n -dueDate: Date\n +recordCheckout()\n }\n class BookCollection {\n +findBook(bookId): Book\n }\n Borrower \"1\" -- \"0..*\" Loan : borrows\n Book \"1\" -- \"0..*\" Loan : checkout_history\n BookCollection \"1\" o-- \"0..*\" Book : holds</pre><details><summary>Mermaid 原始碼（可複製）</summary><pre><code>classDiagram\n class Borrower {\n -borrowerId: String\n }\n class Book {\n -bookId: String\n -available: boolean\n +isAvailable(): boolean\n }\n class Loan {\n -loanId: String\n -checkoutDate: Date\n -dueDate: Date\n +recordCheckout()\n }\n class BookCollection {\n +findBook(bookId): Book\n }\n Borrower \"1\" -- \"0..*\" Loan : borrows\n Book \"1\" -- \"0..*\" Loan : checkout_history\n BookCollection \"1\" o-- \"0..*\" Book : holds</code></pre></details>\n<p><b>Exam insight:</b> A new message such as <code>recordCheckout()</code> may imply missing state/transaction information in the Class Diagram. Sequence Diagram → Class Diagram is therefore a <b>bidirectional correction loop</b>.</p>\n<h3>From Sequence Diagram to Pseudocode (slides 17–18)</h3><pre><code>Course course = new Course();\nStudent student = new Student();\nboolean accepted = course.add(student.getId());\n// Caller Student uses Course's add() responsibility.</code></pre>\n<p>Program order should reflect the message chronology. This is a conceptual demonstration of how the same interaction may later become method calls; UML modeling does not require actual Java code in Analysis.</p></section><section id=\"part6\"><h2>6. CRUDE Analysis: Five Operations and System-Wide Collaboration Matrix</h2>\n<p><b>CRUDE = Create, Read, Update, Delete, Execute.</b> Slide 33 explicitly defines these five labels and says a Matrix helps identify or verify object collaborations. Its strength is a <b>system-wide interaction overview</b>, complementing scenario-specific Sequence Diagrams.</p>\n<div style=\"overflow:auto\"><table><thead><tr><th>Letter</th><th>Operation</th><th>Question for one actor/object versus another</th><th>Example</th></tr></thead><tbody><tr><td>C</td><td>Create</td><td>Can this actor/object create a target instance?</td><td>Staff creates Parcel entry</td></tr><tr><td>R</td><td>Read</td><td>Can it read the target's attributes?</td><td>Resident reads Parcel status</td></tr><tr><td>U</td><td>Update</td><td>Can it change target values?</td><td>Staff updates collected status</td></tr><tr><td>D</td><td>Delete</td><td>Can it delete a target instance?</td><td>Authorized staff deletes erroneous entry</td></tr><tr><td>E</td><td>Execute</td><td>Can it invoke a target object's operations?</td><td>BookingController invokes Appointment.confirm()</td></tr></tbody></table></div>\n<h3>Illustrative CRUDE Matrix: Parcel Collection</h3>\n<div style=\"overflow:auto\"><table><thead><tr><th>Initiator / Target</th><th>Resident</th><th>Parcel</th><th>CollectionRecord</th><th>Staff</th></tr></thead><tbody><tr><td>Resident (Actor)</td><td>—</td><td>R</td><td>R</td><td>—</td></tr><tr><td>Staff (Actor)</td><td>R</td><td>R, U</td><td>C, R</td><td>—</td></tr><tr><td>ParcelManager (Control)</td><td>R</td><td>R, U, E</td><td>C, R, E</td><td>—</td></tr><tr><td>Parcel (Entity)</td><td>—</td><td>—</td><td>—</td><td>—</td></tr></tbody></table></div>\n<p><b>How to read a matrix:</b> Row = initiating actor/class; Column = target class; entry = permitted/required interaction. A blank indicates no modeled collaboration in this scope, not necessarily that the class can never participate in another Use Case.</p>\n<h3>Procedure</h3><ol><li>Collect the relevant actors/classes from Use Cases and UC-level CD.</li><li>Review Sequence Diagram messages and responsibilities.</li><li>Identify which targets each initiator Creates, Reads, Updates, Deletes or Executes.</li><li>Populate the matrix with C / R / U / D / E, using multiple labels where appropriate.</li><li>Find unexpected blanks, unsupported associations or classes without meaningful collaboration.</li><li>Revisit Functional, Structural and Behavioral Models as needed.</li></ol>\n<p><b>Official cases:</b> Slide 34 uses <b>Campus Housing System</b> with Apartment Owner, Student, Staff and Apartment. Slide 35 uses the <b>Library Book Collection Management System</b> for a system-wide CRUDE Matrix and asks which classes appear to have no collaboration. The student image is partially not text-extractable, so the Parcel matrix here is an explicitly illustrative replacement rather than claimed exact numerical/transcription content.</p>\n<p><b>Exam trap:</b> A class with no links in a particular matrix is a candidate for investigation, not automatic deletion. Determine whether another UC requires the class.</p></section><section id=\"part7\"><h2>7. Behavioral State Machines: Syntax, State/Events/Guard and Black Holes</h2>\n<p><b>Behavioral State Machine:</b> A dynamic model of the state changes of a focal object in response to events throughout its lifecycle. The diagram models <b>one important business object's states</b>, not the order of all participants' messages. Focus on Classes with meaningful status-dependent behavior (slides 36–38).</p>\n<div style=\"overflow:auto\"><table><thead><tr><th>Symbol</th><th>Meaning</th><th>Exam Rule</th></tr></thead><tbody><tr><td>Initial State</td><td>Start of the object's modeled lifecycle</td><td>Filled black circle</td></tr><tr><td>Stable State</td><td>An object condition represented by attribute values</td><td>Rounded rectangle, e.g. Confirmed</td></tr><tr><td>Transition</td><td>Directed change between states</td><td>Arrow points to destination</td></tr><tr><td>Event / Trigger</td><td>Occurrence that enables a transition</td><td>Label e.g. confirmAppointment</td></tr><tr><td>Guard [condition]</td><td>Boolean constraint checked before transition</td><td>Square bracket guard must be satisfiable</td></tr><tr><td>Effect / Action</td><td>Behavior performed on transition</td><td>May use event [guard] / action</td></tr><tr><td>Final State</td><td>Termination of the modeled object lifecycle</td><td>Bullseye-style final</td></tr><tr><td>Self-transition</td><td>An event handled without changing the named state</td><td>Source and target same state</td></tr></tbody></table></div>\n<h3>Formal Transition Label</h3><pre><code>event(parameters) [guard] / action</code></pre>\n<p>Examples: <code>reserve() [slotAvailable] / markReserved()</code>; <code>cancel() [beforeDeadline] / releaseSlot()</code>. The exact guard depends on actual business rules, not intuition.</p>\n<h3>State Machine vs Activity Diagram</h3><div style=\"overflow:auto\"><table><thead><tr><th>Contrast</th><th>Behavioral State Machine</th><th>Activity Diagram</th></tr></thead><tbody><tr><td>Focus</td><td>Lifecycle of one object</td><td>Workflow across tasks/roles</td></tr><tr><td>Nodes represent</td><td>States</td><td>Actions / Activities</td></tr><tr><td>Edges represent</td><td>Event-triggered state transitions</td><td>Control/Object flows</td></tr><tr><td>Guards</td><td>Conditions on state transitions</td><td>Conditions on decisions / flows</td></tr><tr><td>Example</td><td>Requested → Confirmed → Cancelled</td><td>Select → Check → Confirm</td></tr><tr><td>Main question</td><td>What is the object now?</td><td>What step happens next?</td></tr></tbody></table></div>\n<h3>Black Hole and Dead-End States</h3><p>Lecture p.40 asks which state creates a <b>Black Hole</b> in a car-rental membership machine. The phrase describes a state into which the model can transition but from which no valid outgoing transition can be taken under the stated rules when one should exist. This may indicate missing events, misunderstood lifecycle conditions or an intentionally terminal state. Distinguish an erroneous black hole from a correctly modeled Final State.</p>\n<h3>Formal Example: Appointment Lifecycle</h3><pre class=\"mermaid\">stateDiagram-v2\n [*] --> Requested : submit()\n Requested --> Confirmed : accept() [slotAvailable]\n Requested --> Rejected : reject() [slotUnavailable]\n Confirmed --> Rescheduled : reschedule() [allowed]\n Rescheduled --> Confirmed : reconfirm()\n Confirmed --> Cancelled : cancel() [beforeDeadline]\n Confirmed --> Completed : visitFinished()\n Rejected --> [*]\n Cancelled --> [*]\n Completed --> [*]</pre><details><summary>Mermaid 原始碼（可複製）</summary><pre><code>stateDiagram-v2\n [*] --> Requested : submit()\n Requested --> Confirmed : accept() [slotAvailable]\n Requested --> Rejected : reject() [slotUnavailable]\n Confirmed --> Rescheduled : reschedule() [allowed]\n Rescheduled --> Confirmed : reconfirm()\n Confirmed --> Cancelled : cancel() [beforeDeadline]\n Confirmed --> Completed : visitFinished()\n Rejected --> [*]\n Cancelled --> [*]\n Completed --> [*]</code></pre></details>\n<p>Notice: A status such as <b>Cancelled</b> describes an Appointment, while <b>Cancel Appointment</b> is a Use Case. A Use Case name must not be used as if it were a state without semantic reasoning.</p></section><section id=\"part8\"><h2>8. State Machine Construction: Five-Step SOP + Lecturer's Car-Rental Case</h2>\n<p><b>Official five-step SOP, slide 41:</b></p>\n<ol><li><b>Set the Context:</b> Prepare relevant artifacts and select one Class from Class Diagram whose lifecycle requires modeling. The student slide leaves the exact preparatory artifact in a blank; use the validated Functional/Structural material as evidence.</li><li><b>Identify States:</b> Include Initial State, meaningful Stable States and appropriate Final State(s).</li><li><b>Lay Out the Diagram:</b> Prefer readable left-to-right and top-down lifecycle order.</li><li><b>Add Transitions:</b> Identify triggering Events, executed Actions and Guards.</li><li><b>Validate the Model:</b> Ensure required states are reachable and important business transitions are covered.</li></ol>\n<h3>Official Car-Rental Membership Exercise (slide 40)</h3>\n<p>Scenario: Customers deposit NT$10,000 to become Regular Members. On the second rental a Regular Member becomes Silver. After five rentals a Silver Member becomes Gold. Gold returns to Silver after six months without rentals. A member who damages a car becomes Frozen, cannot rent for six months and then returns to Regular. A Regular Member without any rentals for over three years loses membership and must apply again.</p>\n<pre class=\"mermaid\">stateDiagram-v2\n [*] --> Regular : registerAndDeposit(10000)\n Regular --> Silver : secondRental()\n Silver --> Gold : fiveRentalsCompleted()\n Gold --> Silver : inactiveForSixMonths()\n Regular --> Frozen : carDamaged()\n Silver --> Frozen : carDamaged()\n Gold --> Frozen : carDamaged()\n Frozen --> Regular : sixMonthsElapsed()\n Regular --> Expired : inactiveForThreeYears()\n Expired --> [*]</pre><details><summary>Mermaid 原始碼（可複製）</summary><pre><code>stateDiagram-v2\n [*] --> Regular : registerAndDeposit(10000)\n Regular --> Silver : secondRental()\n Silver --> Gold : fiveRentalsCompleted()\n Gold --> Silver : inactiveForSixMonths()\n Regular --> Frozen : carDamaged()\n Silver --> Frozen : carDamaged()\n Gold --> Frozen : carDamaged()\n Frozen --> Regular : sixMonthsElapsed()\n Regular --> Expired : inactiveForThreeYears()\n Expired --> [*]</code></pre></details>\n<p><b>Scope caveats:</b> The slide describes membership promotions and freezes, but does not define every possible counter-reset rule, billing exception or transition from every status. Do not invent those rules as if official. The state diagram above follows the explicit statements and omits unsupported transitions.</p>\n<h3>Finding a Potential Black Hole</h3><p>After checking the model, ask whether each nonterminal state has at least one reachable future transition. The state <b>Expired</b> can be intentionally terminal for the current Membership object, but the business says a customer can reapply for a <b>new membership</b>; this may be represented by a new object rather than reactivating the old one. If one incorrectly draws Expired as a stable state with no path to a new registration despite requiring the same object to be reused, it becomes a modeling ambiguity. Whether a state's lack of outgoing arrows is an error depends on the chosen lifecycle scope.</p></section><section id=\"part9\"><h2>9. Full Clinic Walkthrough: Requirements → CRC/Class → Sequence → State → CRUDE</h2>\n<h3>English Scenario Requirements (Original, approximately 150 words)</h3><blockquote>A community clinic requires an appointment system for patients who wish to schedule consultations with doctors. A Patient can select an available Doctor and Consultation Slot, submit a booking request, and receive either a confirmation or a rejection. Receptionists may assist patients who cannot access the online service. The System must validate availability before confirming any request, prevent overlapping bookings for the same Doctor, and record each accepted Appointment with its identifier, patient, doctor, scheduled time and status. Patients may cancel or reschedule under approved clinic policies. Doctors can maintain available consultation times. The clinic manager expects reduced duplication and accurate schedules. Analysts have completed functional and structural models and must now identify the objects exchanging messages, model the normal booking scenario, inspect how an Appointment's state changes, and verify that Class responsibilities, message directions, status attributes and system requirements are consistent across all models.</blockquote>\n<h3>Step A: Grounded Analysis Artifacts</h3><div style=\"overflow:auto\"><table><thead><tr><th>Requirement / Business Rule</th><th>Use Case / Flow</th><th>Structural Responsibility</th></tr></thead><tbody><tr><td>Patient requests booking</td><td>UC-01 Schedule Appointment</td><td>BookingController.scheduleAppointment()</td></tr><tr><td>Slot must be checked</td><td>Check Availability Action</td><td>Availability.isAvailable()</td></tr><tr><td>Approved appointment is persisted</td><td>Create Appointment Action</td><td>Appointment.create(), confirm()</td></tr><tr><td>Booking may be rejected</td><td>Unavailability Alternate Flow</td><td>Controller.reject()</td></tr><tr><td>Appointment may be cancelled</td><td>UC-02 Cancel Appointment</td><td>Appointment.cancel()</td></tr></tbody></table></div>\n<h3>Step B: CRC-to-Participant Extraction</h3><div style=\"overflow:auto\"><table><thead><tr><th>Class / Participant</th><th>Stereotype</th><th>Reason for Lifeline</th></tr></thead><tbody><tr><td>Patient</td><td>Actor</td><td>Initiates UC</td></tr><tr><td>BookingUI</td><td>Boundary</td><td>Receives request and returns confirmation</td></tr><tr><td>BookingController</td><td>Control</td><td>Coordinates booking rules</td></tr><tr><td>Availability</td><td>Entity</td><td>Checks time slot state</td></tr><tr><td>Appointment</td><td>Entity</td><td>Stores confirmed transaction and status</td></tr></tbody></table></div>\n<h3>Step C: Instance Sequence Diagram, Normal Scenario</h3>\n<pre class=\"mermaid\">sequenceDiagram\n actor Patient\n participant UI as bookingUI: BookingUI\n participant BC as controller: BookingController\n participant AV as availability: Availability\n participant AP as appointment: Appointment\n Patient->>UI: requestBooking(doctorId,slot)\n activate UI\n UI->>BC: schedule(patientId,doctorId,slot)\n activate BC\n BC->>AV: isAvailable(doctorId,slot)\n AV-->>BC: true\n BC->>AP: create(patientId,doctorId,slot)\n AP-->>BC: appointmentId\n BC->>AV: reserve(slot)\n BC->>AP: confirm()\n BC-->>UI: confirmed(appointmentId)\n deactivate BC\n UI-->>Patient: displayConfirmation()\n deactivate UI</pre><details><summary>Mermaid 原始碼（可複製）</summary><pre><code>sequenceDiagram\n actor Patient\n participant UI as bookingUI: BookingUI\n participant BC as controller: BookingController\n participant AV as availability: Availability\n participant AP as appointment: Appointment\n Patient->>UI: requestBooking(doctorId,slot)\n activate UI\n UI->>BC: schedule(patientId,doctorId,slot)\n activate BC\n BC->>AV: isAvailable(doctorId,slot)\n AV-->>BC: true\n BC->>AP: create(patientId,doctorId,slot)\n AP-->>BC: appointmentId\n BC->>AV: reserve(slot)\n BC->>AP: confirm()\n BC-->>UI: confirmed(appointmentId)\n deactivate BC\n UI-->>Patient: displayConfirmation()\n deactivate UI</code></pre></details>\n<p><b>V&V:</b> Every message's receiver must have the corresponding operation at its chosen modeling level; an Appointment status change must be reflected in state data. If the system must guarantee no double bookings under concurrent requests, the design must later use appropriate atomic reservation/concurrency handling; that engineering detail is beyond the analysis-level diagram.</p>\n<h3>Step D: Appointment State Machine</h3>\n<pre class=\"mermaid\">stateDiagram-v2\n [*] --> Requested\n Requested --> Confirmed : confirm() [available]\n Requested --> Rejected : reject() [unavailable]\n Confirmed --> Cancelled : cancel() [policyAllows]\n Confirmed --> Completed : visitCompleted()\n Rejected --> [*]\n Cancelled --> [*]\n Completed --> [*]</pre><details><summary>Mermaid 原始碼（可複製）</summary><pre><code>stateDiagram-v2\n [*] --> Requested\n Requested --> Confirmed : confirm() [available]\n Requested --> Rejected : reject() [unavailable]\n Confirmed --> Cancelled : cancel() [policyAllows]\n Confirmed --> Completed : visitCompleted()\n Rejected --> [*]\n Cancelled --> [*]\n Completed --> [*]</code></pre></details>\n<h3>Step E: CRUDE Matrix</h3><div style=\"overflow:auto\"><table><thead><tr><th>Caller / Target</th><th>BookingUI</th><th>BookingController</th><th>Availability</th><th>Appointment</th></tr></thead><tbody><tr><td>Patient (Actor)</td><td>E</td><td>—</td><td>—</td><td>—</td></tr><tr><td>BookingUI</td><td>—</td><td>E</td><td>—</td><td>—</td></tr><tr><td>BookingController</td><td>—</td><td>—</td><td>R,U,E</td><td>C,U,E</td></tr><tr><td>Appointment</td><td>—</td><td>—</td><td>—</td><td>—</td></tr></tbody></table></div>\n<h3>Step F: Bidirectional Traceability</h3><div style=\"overflow:auto\"><table><thead><tr><th>Functional Model</th><th>Structural Model</th><th>Behavioral Evidence</th></tr></thead><tbody><tr><td>Schedule Appointment Use Case</td><td>BookingController; Appointment</td><td>request → check → create → confirm messages</td></tr><tr><td>Check Availability Activity</td><td>Availability.isAvailable()</td><td>Check response precedes creation</td></tr><tr><td>Cancel Appointment Flow</td><td>Appointment.cancel()</td><td>Confirmed → Cancelled transition</td></tr><tr><td>Patient permitted to book</td><td>BookingUI + Patient Actor</td><td>Boundary message and authorized workflow</td></tr></tbody></table></div>\n<p>This is an original worked teaching scenario aligned with the lecture. It is not the professor's exact clinic diagram or a supplied official answer.</p></section><section id=\"part10\"><h2>10. Other Official Lecture Cases: Dating, Library, Parcel and CRUDE</h2>\n<h3>Dating Invitation System (slides 43–47)</h3><p>As in Chapters 3–4, the lecturer continues the Dating Website case: membership and login are required, members browse matches, and invitations are sent online. The lecture shows UCD, UC-level CD, a Sequence Diagram and the State Machine of <b>Invitation</b>, with a question asking where the future system stores status values. The structural answer must therefore include suitable Invitation attributes for lifecycle state.</p>\n<pre class=\"mermaid\">stateDiagram-v2\n [*] --> Draft\n Draft --> Sent : sendInvitation()\n Sent --> Accepted : accept()\n Sent --> Declined : decline()\n Sent --> Expired : responseDeadlinePassed()\n Accepted --> [*]\n Declined --> [*]\n Expired --> [*]</pre><details><summary>Mermaid 原始碼（可複製）</summary><pre><code>stateDiagram-v2\n [*] --> Draft\n Draft --> Sent : sendInvitation()\n Sent --> Accepted : accept()\n Sent --> Declined : decline()\n Sent --> Expired : responseDeadlinePassed()\n Accepted --> [*]\n Declined --> [*]\n Expired --> [*]</code></pre></details>\n<p><b>Important caveat:</b> The names of specific Invitation states above are an instructional proposal; the text-extractable slide does not enumerate the state names shown in its image. Check the slide's pictured State-Machine Chart when reproducing the exact professor example.</p>\n<h3>Library Book Collection (slides 23–35)</h3><p>Use the <b>Borrow Books UCD</b> to construct an instance Sequence Diagram; compare interacting classes with the UC-level CD; question whether checkout data deserves a transaction class or additional information. CRUDE shows collaborations across the system, including suspicious classes without meaningful interactions.</p>\n<h3>Campus Housing CRUDE (slide 34)</h3><p>Actors: Apartment Owner, Student, Staff. Structural objects: Apartment Owner and Apartment. The exercise asks which Create/Read/Update/Delete/Execute interactions are permitted. The official matrix includes Create/Delete permissions for owner/staff and read interactions for students, but not every cell's exact layout is fully extractable as text.</p>\n<h3>Take-Home Parcel Management (slide 49)</h3><p>Task: For <b>Collect Parcel</b>, draw (1) a <b>Sequence Diagram</b> and (2) a <b>Behavioral State Machine</b> for one important object. <b>Likely focal class:</b> Parcel, because it has meaningful states such as Received, Ready for Pickup, Collected. Exact business events/guards depend on the requirements from earlier chapters and must not be invented as authoritative.</p>\n<pre class=\"mermaid\">stateDiagram-v2\n [*] --> Registered\n Registered --> ReadyForPickup : staffReceivesParcel()\n ReadyForPickup --> Collected : verifyRecipientAndHandOver()\n Collected --> [*]</pre><details><summary>Mermaid 原始碼（可複製）</summary><pre><code>stateDiagram-v2\n [*] --> Registered\n Registered --> ReadyForPickup : staffReceivesParcel()\n ReadyForPickup --> Collected : verifyRecipientAndHandOver()\n Collected --> [*]</code></pre></details>\n<p><b>Practice assumption:</b> These three Parcel states are a study model, not a confirmed textbook or slide diagram. For graded work, align to the actual Use-Case Description and Class Diagram.</p></section><section id=\"part11\"><h2>11. V&V: Sequence–Class–State–Functional Consistency and Pitfalls</h2>\n<p>Lecture p.42 assigns students to read textbook <b>p.182</b> for Behavioral V&V and Functional–Behavioral cross-check, and <b>p.183</b> for Structural–Behavioral cross-check. The corresponding textbook Behavioral chapter PDF is <b>not among the currently uploaded five textbook PDFs</b>. Consequently the rules below are <b>source-aligned teaching checks synthesized from the slides</b>, not falsely quoted from unavailable textbook pages.</p>\n<h3>Scenario and Diagram Walkthrough SOP</h3><ol><li>Select a UCD scenario and record its trigger, normal/alternate steps and result.</li><li>Verify an Actor and each relevant Class participant appear in the Sequence Diagram.</li><li>For each UCD action, identify sender, receiver, method and meaningful parameter; check event order.</li><li>Ensure every receiver operation and relevant association can be found in the UC-level Class Diagram, or revise the Structural Model.</li><li>Check State Machine Events correspond to operations/events that actually occur in use cases and Sequence Diagrams.</li><li>Check state names map to meaningful object attributes; Guards match business rules.</li><li>Use CRUDE to compare class collaborations across several Use Cases and discover unsupported/orphan Classes.</li><li>Walk through exceptions, unreachable states, termination paths, and revise Functional, Structural and Behavioral Models bidirectionally.</li></ol>\n<div style=\"overflow:auto\"><table><thead><tr><th>Source ↔ Target</th><th>Consistency Rule</th><th>Diagnostic Example</th></tr></thead><tbody><tr><td>UCD → Sequence</td><td>Each relevant scenario step maps to an ordered message</td><td>Check availability before appointment confirmation</td></tr><tr><td>Activity → Sequence</td><td>Responsible actor/class and action ordering agree</td><td>Boundary sends request to controller</td></tr><tr><td>Class Diagram → Sequence</td><td>Methods and associations support receiver messages</td><td>Missing Appointment.confirm() must be added or diagram revised</td></tr><tr><td>Sequence → State Machine</td><td>Invoked events change object status consistently</td><td>confirm() causes Requested → Confirmed</td></tr><tr><td>State Machine → Class Diagram</td><td>States are representable via attributes / object structure</td><td>Appointment.status stores Confirmed</td></tr><tr><td>CRUDE → Sequence</td><td>Create/Read/Update/Execute labels reflect actual calls</td><td>Controller's C on Appointment corresponds to creation</td></tr><tr><td>Requirements → All models</td><td>Scenarios and constraints reflect business expectations</td><td>No double booking despite parallel requests</td></tr></tbody></table></div>\n<h3>Five Common Modeling Mistakes</h3><ol><li>Confusing one Instance Sequence Scenario with a Generic Diagram containing all alternate paths.</li><li>Reversing message direction or giving an operation to the wrong receiving Class.</li><li>Treating a return dashed arrow as a second method invocation.</li><li>Using Activity Diagram steps as State names, instead of modeling the focal object's attributes/lifecycle.</li><li>Ignoring unreachable/black-hole states or forgetting to update Class attributes when state transitions imply new status information.</li></ol></section><section id=\"part12\"><h2>12. Cheat Sheet, Golden Rules, Concept Traps and Mastery</h2>\n<h3>Eight 1-Sentence Golden Rules</h3><ol><li>Behavioral Models show how object collaborations realize Use Cases and how focal objects change states.</li><li>In Sequence Diagrams, time proceeds top-to-bottom and the receiving object owns the called operation.</li><li>For this course, create <b>Instance Sequence Diagrams</b> based on one specific UCD scenario.</li><li>Sequence Diagram SOP = Context → Participants → Lifelines → Messages → Execution Occurrences → Validation.</li><li>CRUDE stands for Create, Read, Update, Delete and Execute, and provides a system-wide collaboration check.</li><li>A State Machine models the lifecycle of one object, while an Activity Diagram models workflow actions.</li><li>A Transition is triggered by an Event, may depend on a [Guard], and may perform an Action.</li><li>Behavioral V&V is bidirectional: Messages and State Transitions can require revisions to the Class Diagram and Functional Models.</li></ol>\n<section class=\"quiz\"><h3>Quick Concept Check 1</h3><p><strong>A student is asked for a Sequence Diagram of the major normal scenario of Borrow Books. Which answer best follows the lecturer's convention?</strong></p><button onclick=\"lessonAnswer('chapter5.html-1',0,1)\">A. Show every possible scenario and unrelated use cases.</button><button onclick=\"lessonAnswer('chapter5.html-1',1,1)\">B. Create an Instance Sequence Diagram showing one selected Normal Flow and ordered messages.</button><button onclick=\"lessonAnswer('chapter5.html-1',2,1)\">C. Draw only static classes and multiplicities.</button><button onclick=\"lessonAnswer('chapter5.html-1',3,1)\">D. Draw a CRUDE matrix instead of messages.</button><p id=\"fbchapter5.html-1\"></p><span id=\"expchapter5.html-1\" hidden>Correct Answer: B. Slide 8 says the course uses Instance Sequence Diagrams, usually the major normal flow of the selected use case. 中文：本課程使用 Instance SD，先選定 UCD 正常流程再畫訊息。</span><details><summary>Answer & English / 中文解析</summary><p>Slide 8 says the course uses Instance Sequence Diagrams, usually the major normal flow of the selected use case.</p><p>本課程使用 Instance SD，先選定 UCD 正常流程再畫訊息。</p></details></section>\n<section class=\"quiz\"><h3>Quick Concept Check 2</h3><p><strong>Which statement about CRUDE is correct?</strong></p><button onclick=\"lessonAnswer('chapter5.html-2',0,2)\">A. E stands for Erase, identical to Delete.</button><button onclick=\"lessonAnswer('chapter5.html-2',1,2)\">B. CRUDE is a state diagram for object status.</button><button onclick=\"lessonAnswer('chapter5.html-2',2,2)\">C. E stands for Execute, meaning one object may invoke another object's operations.</button><button onclick=\"lessonAnswer('chapter5.html-2',3,2)\">D. CRUDE replaces every Class Diagram.</button><p id=\"fbchapter5.html-2\"></p><span id=\"expchapter5.html-2\" hidden>Correct Answer: C. CRUDE = Create, Read, Update, Delete, Execute; its matrix checks object collaborations across the system. 中文：E 是 Execute，不是再一次 Delete，也不是 State Machine。</span><details><summary>Answer & English / 中文解析</summary><p>CRUDE = Create, Read, Update, Delete, Execute; its matrix checks object collaborations across the system.</p><p>E 是 Execute，不是再一次 Delete，也不是 State Machine。</p></details></section>\n<section class=\"quiz\"><h3>Quick Concept Check 3</h3><p><strong>An object reaches a nonterminal state from which no valid outgoing transition is possible, although the business requires later behavior. What is the most likely issue?</strong></p><button onclick=\"lessonAnswer('chapter5.html-3',0,1)\">A. An intentional Activity Final is always correct.</button><button onclick=\"lessonAnswer('chapter5.html-3',1,1)\">B. It is a potential Black Hole or missing transition to investigate.</button><button onclick=\"lessonAnswer('chapter5.html-3',2,1)\">C. All events must be drawn as Use Cases.</button><button onclick=\"lessonAnswer('chapter5.html-3',3,1)\">D. The Class must automatically become Abstract.</button><p id=\"fbchapter5.html-3\"></p><span id=\"expchapter5.html-3\" hidden>Correct Answer: B. The diagram may contain an unintended black-hole/dead-end state. Validate missing events, guards, and whether the state should be terminal. 中文：沒有合理出口但業務仍需繼續時，要檢查 Black Hole 與遺漏轉移，不能只看圖能不能渲染。</span><details><summary>Answer & English / 中文解析</summary><p>The diagram may contain an unintended black-hole/dead-end state. Validate missing events, guards, and whether the state should be terminal.</p><p>沒有合理出口但業務仍需繼續時，要檢查 Black Hole 與遺漏轉移，不能只看圖能不能渲染。</p></details></section>\n<button onclick=\"lessonMarkDone(5)\">✓ Mark Chapter 5 as reviewed</button> <span id=\"reading5\"></span>\n<h3>Self-assessment</h3><ol><li>Can identify sender, receiver and return values in Java message calls.</li><li>Can draw a complete Instance Sequence Diagram with parameters and activation bars.</li><li>Can explain the 6-step SD SOP and 4 context inputs.</li><li>Can derive CRUDE entries from interactions across Use Cases.</li><li>Can draw State Machine Initial / Stable / Final States, Events and Guards.</li><li>Can check a Black Hole with an evidence-based lifecycle argument.</li><li>Can use a Sequence Diagram to identify missing Class operations/associations.</li><li>Can walk through the Borrow Books and Dating Invitation cases.</li></ol></section><p class=\"muted\">Primary verified material: 陳仲儼 2026 Chapter 5 “Behavioral Modeling” course slides (50 pages), esp. slides 4–8, 10–11, 19–20, 23–35, 36–42, 43–49. The slides cite Dennis, Wixom & Tegarden Systems Analysis and Design with UML, 6th edition and textbook pages 182–183 for V&V. The corresponding textbook Chapter 6 PDF was not provided among the five textbook attachments, so its missing pages are not represented as directly verified. All case expansions and Mermaid renderings are labeled instructional adaptations.</p>"};
const TEXTBOOK_CH6="<section class=\"card textbook-integrated\" style=\"padding:22px;margin:24px 0;border:1px solid var(--accent)\"><h2>📘 課本正式整合 | Textbook Chapter 6: Behavioral Modeling</h2><p><b>Dennis, Wixom &amp; Tegarden, Chapter 6, pp.202–235</b>，對應教授 2026 <b>Course Chapter 5</b>。本區整合剛上傳課本的定義、作圖規則、SOP、原書案例與驗證規則，與原本投影片教材互補。</p><div style=\"overflow:auto\"><table><tr><td>View</td><td>Core Purpose</td><td>Models</td></tr><tr><td>Functional / External</td><td>What capabilities users need</td><td>Use Cases, Activity, UCD</td></tr><tr><td>Structural / Static</td><td>What objects/classes exist</td><td>CRC, Class and Object Diagram</td></tr><tr><td>Behavioral / Dynamic</td><td>How objects interact and change state</td><td>Sequence, Communication, State Machine, CRUDE</td></tr></table></div><p><b>Book Key Idea:</b> Behavioral Modeling is <b>Use-Case Driven</b>, <b>Iterative</b>, and cross-checks Functional and Structural Models. Models describe the internal dynamic behavior during Analysis, not detailed implementation. <small>pp.202–204</small></p></section>\n<section class=\"card textbook-integrated\" style=\"padding:22px;margin:24px 0;border:1px solid var(--accent)\"><h2>Sequence Diagram | six-step SOP and textbook notation</h2><div style=\"overflow:auto\"><table><tr><td>Notation</td><td>Rule</td></tr><tr><td>Actor / Object</td><td>Across top; label concrete instances as instance: Class</td></tr><tr><td>Lifeline</td><td>Dashed line; X where a temporary object is destroyed</td></tr><tr><td>Execution Occurrence</td><td>Thin activity rectangle on lifeline</td></tr><tr><td>Operation Call</td><td>Solid arrow, with name(parameters), sorted top to bottom</td></tr><tr><td>Return Message</td><td>Dashed arrow; omit when not informative</td></tr><tr><td>Guard</td><td>[condition] before message; instance-specific scenario may imply guard</td></tr><tr><td>Frame</td><td>Explicit Use Case / scenario context</td></tr><tr><td>Self-Delegation</td><td>Object sends message to itself</td></tr></table></div><h3>Six-Step Construction SOP (pp.209–210)</h3><ol><li><b>Set Context</b> for one Use Case scenario.</li><li><b>Identify Actors and Objects</b> from Functional, Structural Models and CRC role-playing.</li><li><b>Set Lifelines</b> and object lifetimes.</li><li><b>Add Messages</b> with calls, parameters, order and useful returns.</li><li><b>Place Execution Occurrences</b> on relevant lifelines.</li><li><b>Validate</b> complete coverage of scenario events.</li></ol><h3>Six Style Guidelines (pp.207–209)</h3><ol><li>Prefer top-down and left-to-right reading order.</li><li>Use consistent names if an Actor and internal Object represent the same conceptual subject.</li><li>Put initiator at the far left.</li><li>Name multiple same-class instances distinctly.</li><li>Include only informative Return values.</li><li>Place labels near arrowheads.</li></ol><pre class=\"mermaid\">sequenceDiagram\n actor Patient\n actor Receptionist\n participant P as patient: Patient\n participant B as unpaidBill: UnpaidBill\n participant A as appointment: Appointment\n Patient->>Receptionist: RequestAppt(name,address)\n Receptionist->>P: LookUpPatient()\n Receptionist->>B: LookupBills()\n Receptionist->>A: MatchAppts()\n Receptionist->>A: CreateAppt()</pre><details><summary>Mermaid Source</summary><pre><code>sequenceDiagram\n actor Patient\n actor Receptionist\n participant P as patient: Patient\n participant B as unpaidBill: UnpaidBill\n participant A as appointment: Appointment\n Patient->>Receptionist: RequestAppt(name,address)\n Receptionist->>P: LookUpPatient()\n Receptionist->>B: LookupBills()\n Receptionist->>A: MatchAppts()\n Receptionist->>A: CreateAppt()</code></pre></details><p><b>Book Figure 6-1:</b> Make Old Patient Appt above is a condensed interpretation of the book case. <b>Book Borrow Books:</b> Nine scenarios, formed from three borrower roles (Student, Faculty/Staff, Guest) and three eligibility branches (valid/no-fine, invalid-ID, fine or overdue). Each requires a separate <b>Instance Sequence Diagram</b> for thorough scenario-based validation. <small>pp.212–215</small></p></section>\n<section class=\"card textbook-integrated\" style=\"padding:22px;margin:24px 0;border:1px solid var(--accent)\"><h2>Communication Diagram | complete five-step SOP from textbook</h2><p><b>Definition:</b> Describes collaboration through <b>Object Links + directed, numbered Messages</b>. Sequence focuses temporal order; Communication highlights who depends on whom. The newly uploaded book includes this technique in detail, whereas the lecture gives a shorter overview.</p><div style=\"overflow:auto\"><table><tr><td>Notation</td><td>Precise Interpretation</td></tr><tr><td>Object/Actor</td><td>Participating instances</td></tr><tr><td>Association</td><td>Undirected connection used for message passing</td></tr><tr><td>Message</td><td>Number and direction, e.g. 1: RequestAppt()</td></tr><tr><td>Guard</td><td>3: [patientExists] LookupBills()</td></tr><tr><td>Loop</td><td>Asterisk after message sequence number</td></tr><tr><td>Return</td><td>NOT shown in Communication Diagram per textbook</td></tr><tr><td>Create / Destroy</td><td>Implied by create/delete message rather than explicit lifeline X</td></tr><tr><td>Frame</td><td>Use Case/scenario context</td></tr></table></div><h3>Five-Step Construction (pp.218–219)</h3><ol><li><b>Set Context.</b></li><li><b>Identify Objects, Actors and Associations.</b></li><li><b>Lay Out Diagram</b> minimizing crossings.</li><li><b>Add numbered, directed Messages</b> on links.</li><li><b>Validate</b> against every scenario step.</li></ol><pre class=\"mermaid\">flowchart LR\n O[\"Apartment Owner\"] -- \"1: AddApartment()\" --> S[\"Campus Housing Service\"]\n S -- \"2: RequestApartmentInformation()\" --> O\n S -- \"3: Create(ApartmentInformation)\" --> A[\"apartment: Apartment\"]</pre><details><summary>Mermaid Source</summary><pre><code>flowchart LR\n O[\"Apartment Owner\"] -- \"1: AddApartment()\" --> S[\"Campus Housing Service\"]\n S -- \"2: RequestApartmentInformation()\" --> O\n S -- \"3: Create(ApartmentInformation)\" --> A[\"apartment: Apartment\"]</code></pre></details><p>Adaptation of <b>Book Figure 6-13: Add Apartment</b>. Mermaid flowcharts approximate Communication Diagram links; for graded UML, use the standard object notation and numbered message arrows.</p></section>\n<section class=\"card textbook-integrated\" style=\"padding:22px;margin:24px 0;border:1px solid var(--accent)\"><h2>Behavioral State Machine | exact textbook definitions and guides</h2><p><b>State:</b> Object condition determined by relevant attribute values and relationships. <b>Event:</b> a condition, call, signal or time passage triggering a change. <b>Transition:</b> a directed movement optionally constrained by <b>Guard</b>. <b>Action:</b> atomic and noninterruptible; <b>Activity:</b> decomposable and interruptible. <small>pp.221–223</small></p><div style=\"overflow:auto\"><table><tr><td>Concept Trap</td><td>Correct Reasoning</td></tr><tr><td>Black Hole State</td><td>A non-final state entered but never exited despite the business requiring continuation</td></tr><tr><td>Miracle State</td><td>A non-initial state with exits but no way to enter</td></tr><tr><td>Overlapping Guards</td><td>[x >= 0] and [x <= 0] both true at x=0</td></tr><tr><td>State vs Subclass</td><td>Freshman → Sophomore is often a state transition, not a different IS-A subclass</td></tr><tr><td>Candidate Class</td><td>Choose state-dependent and complex objects; not every class needs a state machine</td></tr></table></div><h3>Six Style Guidelines (p.226)</h3><ol><li>Model state-dependent objects only.</li><li>Place Initial top-left, Final bottom-right.</li><li>Name States simply and descriptively.</li><li>Investigate Black Hole and Miracle States.</li><li>Keep Guards mutually exclusive.</li><li>Support each Transition with a Message and Operation.</li></ol><h3>Five-Step Construction SOP (pp.226–227)</h3><ol><li><b>Set Context</b> (usually one Class).</li><li><b>Identify Object States</b> from UCDs and stakeholders.</li><li><b>Lay Out Diagram</b> by lifecycle order.</li><li><b>Add Transitions, Events, Actions, Guards.</b></li><li><b>Validate</b> every state is reachable, and only Final states are dead ends.</li></ol><pre class=\"mermaid\">stateDiagram-v2\n [*] --> Entering: Enters Hospital\n Entering --> Admitted: Checks In\n Admitted --> Released: [Diagnosis Healthy]\n Admitted --> UnderObservation: [Diagnosis Unhealthy]\n UnderObservation --> Released: [Diagnosis Healthy]\n Released --> [*]: After 2 weeks</pre><details><summary>Mermaid Source</summary><pre><code>stateDiagram-v2\n [*] --> Entering: Enters Hospital\n Entering --> Admitted: Checks In\n Admitted --> Released: [Diagnosis Healthy]\n Admitted --> UnderObservation: [Diagnosis Unhealthy]\n UnderObservation --> Released: [Diagnosis Healthy]\n Released --> [*]: After 2 weeks</code></pre></details><p><b>Book Figure 6-16:</b> Hospital Patient lifecycle. Book Figure 6-19 explicitly warns not to confuse Student year-level <b>States</b> with <b>Subclasses</b>. <small>pp.222–226</small></p><pre class=\"mermaid\">stateDiagram-v2\n [*] --> Available: Added To Collection\n Available --> CheckedOut: Borrower Checks Out\n CheckedOut --> Overdue: Time Expires\n Overdue --> Requested: Another Borrower Requests\n CheckedOut --> Available: Book Returned\n CheckedOut --> Damaged: Returned Damaged\n Damaged --> BeingRepaired: Sent For Repair\n BeingRepaired --> Available: Book Repaired\n Damaged --> [*]: Too Damaged</pre><details><summary>Mermaid Source</summary><pre><code>stateDiagram-v2\n [*] --> Available: Added To Collection\n Available --> CheckedOut: Borrower Checks Out\n CheckedOut --> Overdue: Time Expires\n Overdue --> Requested: Another Borrower Requests\n CheckedOut --> Available: Book Returned\n CheckedOut --> Damaged: Returned Damaged\n Damaged --> BeingRepaired: Sent For Repair\n BeingRepaired --> Available: Book Repaired\n Damaged --> [*]: Too Damaged</code></pre></details><p><b>Book Figure 6-22:</b> This is a simplified Book lifecycle interpretation; the source diagram includes additional transitions. Crucially, <b>Fined</b> is a Borrower condition, not a Book state. <small>pp.228–229</small></p></section>\n<section class=\"card textbook-integrated\" style=\"padding:22px;margin:24px 0;border:1px solid var(--accent)\"><h2>CRUDE | original Campus Housing case and model correction</h2><p><b>CRUDE = Create, Read, Update, Delete, Execute</b>. Each row names the initiating Actor/Class and each column a target Class/Actor. The matrix is designed for <b>system-wide</b> validation. More C/U/D interactions suggest a complex lifecycle that may require a State Machine. <small>pp.229–232</small></p><div style=\"overflow:auto\"><table><tr><td>Initiator / Target</td><td>Apartment Owner Class</td><td>Apartment Class</td></tr><tr><td>Apartment Owner Actor</td><td>(initially blank)</td><td>C, D</td></tr><tr><td>Student Actor</td><td>R</td><td>R</td></tr><tr><td>Staff Member Actor (added in correction)</td><td>C, D</td><td>(blank)</td></tr></table></div><p><b>Book Figures 6-24 to 6-25:</b> The first matrix showed <b>Apartment Owner Class was Read but never Created</b>. The textbook explicitly corrects this by introducing a <b>Staff Member Actor</b> that creates/deletes Apartment Owner records and new requirements/use cases. This is CRUDE identifying missing functionality, not merely a formatting error.</p><p><b>Additional textbook check:</b> The Library Book Collection CRUDE Matrix suggests <b>Library</b> and <b>Storage</b> Classes have no recorded collaborations, which calls for stakeholder verification rather than automatic deletion. Temporary objects need a plausible deletion path; classes may be created by external systems; many C/U/D entries suggest lifecycle complexity.</p></section>\n<section class=\"card textbook-integrated\" style=\"padding:22px;margin:24px 0;border:1px solid var(--accent)\"><h2>Seven textbook V&V Rules | exact pp.233–234</h2><p><b>This section replaces the earlier provisional inferred V&V list.</b> The provided book explicitly supplies <b>seven bidirectional consistency rules</b> across Sequence Diagrams, Communication Diagrams, State Machines and CRUDE.</p><div style=\"overflow:auto\"><table><tr><td>#</td><td>Required verification</td><td>Example</td></tr><tr><td>1</td><td>Actors and Objects must appear on both Sequence and Communication diagrams, and vice versa.</td><td>Receptionist and Patient</td></tr><tr><td>2</td><td>Sequence Messages imply Communication Associations, and vice versa.</td><td>Receptionist ↔ Patient</td></tr><tr><td>3</td><td>Every Sequence Message appears as a labeled Communication Message, and vice versa.</td><td>LookUpPatient()</td></tr><tr><td>4</td><td>Equivalent Guards must exist on both diagrams.</td><td>[aPatient Exists] LookupBills()</td></tr><tr><td>5</td><td>Communication Message sequence numbers match Sequence top-to-bottom order.</td><td>Second message numbered 2</td></tr><tr><td>6</td><td>Every State Machine Transition must correspond to an Interaction Message and C/U/D in CRUDE.</td><td>ChecksIn → U</td></tr><tr><td>7</td><td>Every CRUDE cell implies a Message; each C/U/D entry also requires a related State Machine Transition.</td><td>Appointment update → state change</td></tr></table></div><p><b>Book nuance:</b> A method named <code>MatchAppts()</code> may be Read, Update or both, so derive CRUDE permissions from behavior, not a method name guess.</p><pre class=\"mermaid\">flowchart LR\n U[\"UCD Scenario\"] --> S[\"Sequence\"]\n S <--> C[\"Communication\"]\n S --> R[\"CRUDE\"]\n C --> R\n R <--> M[\"State Machine\"]\n M -. \"revise\" .-> D[\"Class Diagram\"]\n D -. \"check\" .-> U</pre><details><summary>Mermaid Source</summary><pre><code>flowchart LR\n U[\"UCD Scenario\"] --> S[\"Sequence\"]\n S <--> C[\"Communication\"]\n S --> R[\"CRUDE\"]\n C --> R\n R <--> M[\"State Machine\"]\n M -. \"revise\" .-> D[\"Class Diagram\"]\n D -. \"check\" .-> U</code></pre></details><h3>Quick Checks (with answers)</h3><p><b>Q1.</b> Communication Diagram contains explicit Return arrows? <b>False</b> under textbook convention. <b>Q2.</b> Freshman is always a Student subclass? <b>False</b>, often a State. <b>Q3.</b> CRUDE says Class can be Read but never Created; no issue? <b>False</b>, investigate missing creation or external owner.</p></section>";

const READING_HINTS={"1":[["business needs|business value|support business","這段強調系統開發要回應組織的實際需求，並帶來可辨識的商業效益。"],["planning|project initiation|system request","這段說明專案如何啟動與規劃，重點是為何值得投入、範圍和可行性如何。"],["analysis phase|analyze requirements|requirements definition","這段主要談需求分析：釐清使用者需要什麼功能，以及業務如何運作。"],["design phase|physical design|logical design","這段描述把需求轉成設計，決定系統架構、資料、介面與技術做法。"],["implementation|build|install|deploy","這段介紹實作、測試、安裝與交付，讓設計真正變成可使用的系統。"],["waterfall|sequential development","瀑布式開發按階段逐步完成，需求若經常改變，後期修改成本可能較高。"],["prototype|prototyping","原型法先做可展示的版本，讓使用者提出回饋，再調整需求或設計。"],["agile|scrum|sprint","敏捷方法採短週期交付與持續回饋，強調因應變動及團隊協作。"],["encapsulation|information hiding","封裝把資料和操作整合到物件內；資訊隱藏則限制外部直接依賴內部細節。"],["inheritance|generalization|superclass","繼承與一般化表示類別間的共通性，子類別可延伸父類別的特性。"],["polymorphism|overriding|dynamic binding","多型讓相同操作可因物件實際型別而有不同表現；覆寫常是實現方式之一。"],["verification|validation","Verification 檢查有沒有依規格正確建造；Validation 檢查建造的東西是否真正符合需求。"]],"2":[["functional requirement|system must|system shall","功能性需求描述系統必須執行的功能，例如建立預約、查詢或更新資料。"],["non.functional|quality attribute|response time","非功能性需求描述品質與限制，像效能、安全、可靠性，最好用可量測條件寫出。"],["interview|interviewing","訪談能了解使用者的看法與做法，但仍要和實際流程或資料交叉確認。"],["observation|observe","觀察法直接看現場如何操作，能找出受訪者可能沒提到的實際步驟。"],["document analysis|documents|forms","文件分析利用現有表單、報表、政策與紀錄，協助理解業務規則。"],["questionnaire|survey","問卷適合向較多人蒐集標準化答案，但不容易深入追問複雜原因。"],["root cause|five whys|problem analysis","根本原因分析要找到造成問題的源頭，不只是處理表面症狀。"],["as.is|to.be|current process","As-Is 是現況，To-Be 是改善後的目標流程；比較兩者才能提出有依據的需求。"],["traceab|consistent|complete|verifiable","好的需求應完整、一致、可追溯且可驗證，避免只寫「快速、方便」這類模糊描述。"]],"3":[["use case|actor|system boundary","使用案例以外部角色為出發點，描述系統能提供什麼服務；系統邊界決定範圍。"],["include|included use case","«include» 表示必須執行的共用流程，虛線箭頭指向被包含的 Use Case。"],["extend|extension point","«extend» 是有條件的額外行為，箭頭從擴充案例指向原本被擴充的案例。"],["precondition|postcondition|trigger","Precondition 是開始前必須成立的條件；Postcondition 是結束後應達成的結果；Trigger 是啟動事件。"],["normal flow|alternative flow|exception flow","Normal Flow 是主要成功流程；Alternative Flow 和 Exception Flow 描述其他分支或例外情況。"],["decision|merge","Decision 依條件選路；Merge 將替代路徑匯回，並不代表平行同步。"],["fork|join|parallel","Fork 將工作分成平行路徑；Join 等待指定平行工作同步匯合。"],["activity diagram|control flow","活動圖呈現工作如何流動，讀圖要看起點、動作、條件分支與終點。"]],"4":[["crc|responsibility|collaborator","CRC 卡片討論每個類別負責什麼，以及它需要哪些其他類別合作。"],["class diagram|attribute|operation","類別圖描述系統的靜態結構，Class 內通常標示名稱、屬性與操作。"],["class|object|instance","Class 是類別的定義；Object／Instance 是該類別在執行時的具體實例。"],["association|relationship","Association 是類別之間的關聯，要看名稱與關係兩端的多重性。"],["aggregation|composition","Aggregation 表示較弱的整體部分關係；Composition 表示更強的生命週期依存。"],["multiplicity|cardinality|0..","Multiplicity 告訴你某一端可以對應幾個物件，例如 1、0..1 或 0..*。"],["boundary class|control class|entity class","Boundary 處理外部互動；Control 協調流程；Entity 封裝領域資料與業務概念。"],["cohesion|coupling","高內聚代表同一類別的職責關聯緊密；低耦合代表類別較少依賴彼此內部細節。"]],"5":[["sequence diagram|lifeline|message","循序圖由上往下表示時間，生命線是參與互動的物件或角色，箭頭是訊息。"],["synchronous|asynchronous|return message","同步訊息通常等待處理；非同步訊息不一定等待；回傳訊息則代表結果回來。"],["alt|opt|loop|combined fragment","alt 表示條件擇一，opt 表示可選路徑，loop 表示重複執行。"],["communication diagram|interaction diagram","溝通圖強調物件間的連結與訊息編號；循序圖則比較強調時間順序。"],["state machine|state diagram","狀態機圖描述單一物件在生命週期中如何依事件改變狀態。"],["transition|guard|trigger","Transition 是狀態之間的移動；Guard 是允許移動的條件；Trigger 是引起轉換的事件。"],["entry action|exit action|do activity","Entry 是進入狀態時的動作；Exit 是離開時的動作；Do activity 是處於狀態期間的活動。"],["crude|create.*read.*update.*delete","CRUDE 用建立、讀取、更新、刪除、執行等操作，檢查類別協作是否完整。"],["pseudocode|operation|message","可由循序圖的訊息整理出操作與虛擬碼，用來檢查類別方法是否足夠。"]]};
function addReadingTranslations(html,ch){let rules=READING_HINTS[ch]||[];return html.replace(/(<p\b[^>]*>)([\s\S]*?)(<\/p>)/gi,(whole,open,content,close)=>{let plain=content.replace(/<[^>]+>/g,' ').replace(/&[a-z]+;/gi,' ').trim();if(plain.length<65)return whole;let english=(plain.match(/[A-Za-z]/g)||[]).length,chinese=(plain.match(/[\u4e00-\u9fff]/g)||[]).length;if(english<55||chinese>english/3)return whole;let found=rules.find(([p])=>new RegExp(p,'i').test(plain));if(!found||((FULL_TRANSLATION_PARAGRAPHS[ch]||[]).some(([k])=>plain.toLowerCase().includes(k.toLowerCase()))))return whole;return whole+'<div class="cn" style="padding:8px 12px;margin:3px 0 14px;border-radius:8px;background:rgba(128,128,128,.07)"><span style="font-size:.85em;font-weight:700">📘 中文句意輔助</span><div style="margin-top:4px">'+found[1]+'</div><div class="small muted">重點意譯，非逐字翻譯；請搭配上方英文原文閱讀。</div></div>'})}
const FULL_TRANSLATION_PARAGRAPHS={"1":[["Systems Development Life Cycle (SDLC):","**系統開發生命週期（SDLC）**是指了解資訊系統如何支援企業需求，接著設計、建置系統，最後將其交付使用者的整體過程。"],["Project Initiation:","**專案啟動（Project Initiation）**：接收系統需求書或提案徵求書，釐清企業問題、目標與預期商業價值，評估技術、經濟和組織可行性，並取得核准。**專案管理（Project Management）**：制定工作計畫、安排人力、監督與控制專案。主要交付成果為系統需求書、可行性分析與工作計畫。"],["System Request typically contains","**系統需求書（System Request）**通常包括專案發起人、業務需求、業務要求、商業價值和特殊議題。**提案徵求書（RFP）**用於邀請外部廠商提出方案，不等同於內部系統需求書。"],["Develop Analysis Strategy","建立**分析策略（Analysis Strategy）**，研究現況（As-Is）與未來目標（To-Be）的作業方式；蒐集與細化需求，界定誰、做什麼、在哪裡、何時發生，並建立功能、結構和行為模型。此階段交付的**系統提案（System Proposal）**整合需求定義、系統構想及各項模型；分析偏重邏輯需求，而非具體技術實作。"],["Four steps: (1) Design Strategy","設計有四個步驟：（1）決定自行開發、購買或委外的**設計策略**；（2）設計軟硬體、網路、使用者介面和元件介面的**架構與介面**；（3）制定**資料庫與檔案規格**；（4）定義模組及輸入輸出的**程式設計**。交付成果為**系統規格書（System Specification）**。"],["System Construction (coding/testing)","**實作階段（Implementation）**包含系統建置（寫程式與測試）、安裝、使用者訓練、支援維護和**組態管理（Configuration Management）**。組態管理包括辨認受控項目、管理變更及維護版本與狀態紀錄；只使用 Git 不代表已完成整套組態管理。"],["Methodology:","**方法論（Methodology）**是執行 SDLC 活動、技術與交付成果的正式方法。SDLC 描述整體開發流程；方法論則規定工作如何安排順序、反覆修正和受到控制。"],["Sequential phases with major deliverables","**瀑布式開發（Waterfall）**依階段順序進行，重要交付成果經過審核才能進入下一步。優點是里程碑明確、文件完整和管理正式；缺點是回饋來得較晚，需求變更與重工成本高。適合需求穩定的情況。"],["Prototype is not automatically","**原型（Prototype）**不一定可以直接當成正式產品使用。**迭代式（Iterative）**是反覆修改、逐步完善；**增量式（Incremental）**則是隨不同版本逐步增加功能。"],["In the four-phase SDLC, testing","在四階段的 **SDLC（系統開發生命週期）** 中，測試屬於 **Implementation（實作階段）**，即使瀑布式開發的某些教學圖把測試單獨畫成一個階段，也是如此。"],["Parallel Development: Subprojects","**Parallel Model（V Model，平行模式／V 模型）**：教師版第 13 頁將兩者視為同一模型，強調每個開發階段都有對應的測試設計與測試活動。從分析、設計到程式實作後，再依單元、整合、系統及驗收測試逐步完成驗證。"],["Deliver successive functional releases","以連續發布的方式逐步提供功能，例如診所系統的第一版提供預約、第二版提供空檔查詢、第三版加入通知、第四版增加分析功能。提早交付能更快創造價值並取得回饋，但初期版本可能不完整，且各版本之間可能存在依賴關係。"],["XP (eXtreme Programming)","**XP（極限程式設計）**著重工程實作中的快速回饋，包含結對程式設計、**TDD（測試驅動開發）**、持續整合、小規模發布與程式重構。**Scrum** 則提供有固定時間長度的 **Sprint（衝刺）**流程，包含產品待辦清單、衝刺規劃、每日站立會議、衝刺檢視與回顧；主要角色有產品負責人、Scrum Master 和開發人員。XP 與 Scrum 可以互相搭配。"],["DevOps integrates Development","**DevOps** 整合開發、維運與自動化。**CI（持續整合）**是經常整合變更並透過自動化驗證；**Continuous Delivery（持續交付）**讓更新隨時處於可發布狀態；**Continuous Deployment（持續部署）**則把符合條件的更新自動部署。CI 本身不代表已部署到正式環境。"],["Class: A template defining","**Class（類別）**是定義共同結構與行為的範本。**Object（物件）**是類別的一個具體實例，具有身分、狀態與行為。**Attribute（屬性）**描述物件的相關資訊；**Operation（操作）**定義物件支援的行為；**Method（方法）**是操作的具體實作；**Message（訊息）**是傳給物件、要求它執行某項行為的請求，可能包含參數與回傳值。"],["Student / Course are classes","Student 和 Course 是**類別（Class）**；joe 和 sa 是具體**實例（Instance）**；addCourse 是方法呼叫或訊息。Java 程式範例假設相關的建構子與方法已經存在。"],["Encapsulation: Combine state","**Encapsulation（封裝）**把狀態和操作整合在同一個類別內。**Information Hiding（資訊隱藏）**則遮蔽內部資料的表示方式，只暴露必要的介面。封裝著重把相關內容組合在一起；資訊隱藏著重限制外部直接存取。"],["Generalization models an","**Generalization（一般化）**表示「是一種」（IS-A）的關係。在 UML 中使用實線與空心三角形表示，三角形指向**Superclass（父類別）**。父類別不一定是**Abstract Class（抽象類別）**；抽象類別通常不能直接產生實例，但一般具體父類別可以。"],["Polymorphism permits subtype","**Polymorphism（多型）**允許子類別透過共同的父類別或介面提供不同的具體實作。例如在 Java 中，Animal 變數實際指向 Bird 時呼叫 move()，通常會執行 Bird 覆寫的方法；改指向 Crab 後，則執行 Crab 的實作。**Overriding（覆寫）**與 **Overloading（多載）**不同；執行階段的**動態分派（Dynamic Dispatch）**會根據接收物件的實際型別選擇覆寫的方法。"],["OOAD: Use-Case Driven","**OOAD（物件導向分析與設計）**具有四項主要特色：以使用案例為驅動、以架構為核心、採用反覆迭代，以及逐步增加功能。"],["Functional View: External functions","**功能觀點（Functional View）**利用使用案例圖、活動圖和使用案例描述呈現系統對外提供的功能。**結構觀點（Structural View）**利用 CRC 卡、類別圖和物件圖描述類別與靜態關係。**行為觀點（Behavioral View）**利用循序圖、溝通圖和狀態機圖呈現互動及狀態變化。所有觀點都必須彼此一致。"],["UP is an iterative and incremental","**UP（統一開發流程）**是一種迭代且增量式的流程，包含兩個維度：**Phases（階段）**回答何時進行，**Workflows（工作流程）**回答進行哪些活動。四階段為 **Inception（初始）**確認範圍與商業案例；**Elaboration（細化）**確認核心架構與風險；**Construction（建構）**完成實作與測試；**Transition（移轉）**進行部署及驗收。"],["Engineering Workflows: Business Modeling","**工程工作流程**包括業務建模、需求、分析、設計、實作、測試與部署；**支援工作流程**則包括專案管理、組態與變更管理，以及環境管理。這裡的工作強度矩陣是定性教學輔助，不是直接複製 UP 的量化工作量曲線。"],["Trap: Requirements do not occur","**常見陷阱：**需求工作不只發生在 Inception（初始階段），各種工作流程會橫跨多個開發階段。UP 的四個階段也不能直接當作四階段 SDLC 的重新命名。"],["Unified Modeling Language (UML)","**UML（統一塑模語言）**是標準化的視覺建模語言，並非 SDLC 開發方法論。UML 圖可表達功能、靜態結構與行為觀點。本課程涵蓋使用案例圖、活動圖、類別圖、物件圖、循序圖、溝通圖和狀態機圖。不同 UML 版本或分類方式可能有不同的圖形數量，不能只為了湊數而自行增添圖種。"],["Important distinction: This is an integrated","**重要區別：**這裡是第一章的整合概觀，不是後面第四章介紹的從 CRC 卡到類別圖的七步驟程序。"],["Mermaid Flowchart approximates","**Mermaid 流程圖**只能近似表達這個概念，並不等於格式完全正確的 UML 使用案例圖。上圖的虛線只代表概念性關係，不能自動視為 **«include»** 或 **«extend»**。"],["Multiplicity: Each Appointment","**Multiplicity（多重性）**：在這個簡化範例中，每筆 Appointment（預約）對應一名 Patient（病人），而一名 Patient 可以有零筆或多筆 Appointment。多重性應從關聯的另一端來解讀。"],["UI and Service are illustrative","**UI（使用者介面）**和 **Service（服務）**是用來說明設計層級的參與者。分析層級的循序圖必須依教授要求的抽象程度與符號表示。"],["In UP, the Requirements Workflow occurs only","「在 UP 中，需求工作流程只發生於 Inception 初始階段」這個說法是不正確的，因為需求工作也可能出現在其他階段。"],["UP Workflows span multiple phases","**UP 的工作流程**會跨越不同開發階段，需求也可以在後續迭代中持續細化。"],["Dynamic dispatch invokes","**動態分派（Dynamic Dispatch）**會在程式執行時，根據實際物件的具體類別，呼叫正常覆寫的方法。"],["A prototype is used to compare","題目：使用原型比較不同**使用者介面（UI）**方案，學習完成後就丟棄原型。這是哪一種開發方式？"],["The exploratory prototype is discarded","這種**探索型原型（Exploratory Prototype）**在取得需求與設計上的經驗後會被丟棄，稱為**拋棄式原型開發（Throwaway Prototyping）**。"],["The textbook also distinguishes","課本也區分**流程導向（Process-Centered）**、**資料導向（Data-Centered）**和**物件導向（Object-Oriented）**觀點。這些是建模時的著重面向，而不是 Waterfall、XP、Scrum 等開發時程安排的另一套分類；一種方法論可以結合多種建模觀點。"],["Example: A clinic replacing","範例：診所要以新系統取代紙本排班，需要**業務分析師（Business Analyst）**研究工作流程、**系統分析師（Systems Analyst）**把需求轉成模型，以及**變革管理分析師（Change Management Analyst）**協助櫃檯人員接受新系統。"],["Exam Check: Responsible for overcoming","考題檢查：負責克服員工抗拒、安排訓練的是哪種分析師？答案是**變革管理分析師（Change Management Analyst）**，而不是基礎設施分析師。"],["Source: Dennis, Wixom","**資料來源：**Dennis、Wixom 與 Tegarden 課本第一章「系統分析師的典型角色與技能」。此補充內容為摘要與說明，不是重製原書頁面；課本補充與教授投影片內容分開標示。"],["Source alignment: Professor C.Y.","**來源對照：**本章依據陳教授 2026 年第一章投影片，以及 Dennis、Wixom 與 Tegarden 課本第一章。流程圖、方法比較與診所情境屬於教學改編。Mermaid 圖形從網路 CDN 載入，需要連線才能顯示，但純文字內容可離線閱讀。"]],"2":[["Requirement: A statement","**需求（Requirement）**指系統為了滿足並支援使用者需求，必須執行的工作，或必須具備的特性。**需求確認（Requirements Determination）**是蒐集、分析、細化及記錄所需功能與限制的過程。"],["Functional: What business","**功能性需求（Functional）**描述系統必須執行的業務流程或管理的資訊；**非功能性需求（Nonfunctional）**則描述系統運作時的行為特性、品質或限制。"],["Strategies help discover","**分析策略（Strategies）**用於發掘業務流程的問題、原因與改善機會；它們與用來蒐集證據的五種**資料蒐集技術（Gathering Techniques）**並不相同。"],["Definition: Ask users","**問題分析（Problem Analysis）**先詢問使用者遇到的困難與沒有效率的地方，再釐清具體例子、發生頻率、影響和現有替代做法。步驟為：找出利害關係人 → 詢問問題 → 追查具體事件 → 記錄對業務的影響 → 確認問題 → 提出改善假設。"],["Definition: Investigate underlying","**根本原因分析（Root Cause Analysis）**研究問題背後的根本成因，而不是只處理表面症狀。典型的成果是**魚骨圖／因果圖（Fishbone / Cause-and-Effect Diagram）**。"],["Definition: Compare actual working time","比較流程各活動真正需要的**處理時間（Processing Time）**與整體流程經過的**總時間（Elapsed Time）**，找出等待、工作交接或重複步驟造成的過大差距。"],["Definition: Analyze costs assigned","分析分配到各項活動的成本，找出主要**成本驅動因素（Cost Drivers）**和改善機會。可比較人工輸入資料、電話聯絡、錯誤更正和紙本處理的成本，以及自動化及後續維護的預估成本。"],["Definition: Compare successful organizations","比較成功組織的作業流程，從中找出改善構想，再依自身條件調整。步驟是選擇可比較的流程 → 研究作法 → 找出落差 → 評估與組織是否相容 → 進行調整。**標竿學習（Benchmarking）**不代表完全照抄別人的規則。"],["Definition: Begin with the desired business outcome","先從期望的**業務成果（Business Outcome）**出發，再反推需要改進的流程與需求。教授的例子是為了減少異常的大量退票，研究黃牛及身分驗證控制等問題。"],["Definition: Assess available or emerging technology","評估現有或新興技術能帶來哪些業務改善機會。流程為發現技術能力 → 找出業務用途 → 評估可行性與風險 → 推導需求 → 確認利害關係人的價值。例：自動提醒可降低爽約，因此提出通知排程需求。**技術是創造業務價值的手段，不是目的。**"],["Definition: Challenge the necessity","質疑現行活動是否真的必要，常透過 **Force-Fit Exercise（強制適配練習）**假設某個步驟必須被刪除，再重新設計其餘流程。"],["Definition: Direct conversations with stakeholders","**訪談（Interview）**透過與利害關係人直接對話，了解需求、問題與業務事實。**結構式訪談**使用預先固定的題目；**非結構式訪談**依回答延伸；**半結構式訪談**結合兩者。問題類型包含開放式、封閉式與追問式。"],["Top-Down: General business objectives","**Top-Down（由上而下）**從整體業務目標逐步問到具體流程；**Bottom-Up（由下而上）**由實際操作細節歸納一般結論。訪談步驟為選擇對象、準備題目、訪談及紀錄、追問、整理、與受訪者確認紀錄，再更新需求。訪談筆記需要驗證，不能直接當成最終事實。"],["Definition: Standardized written questions","**問卷（Questionnaire）**使用標準化書面問題，讓受訪者獨立填答，適合地理位置分散的利害關係人及量化比較。題目應中立、避免一次問兩件事，先試填，使用一致的量尺並事先規劃分析方法。回覆率低或誤解題目可能影響有效性。"],["Definition: Systematically examine actual work","**觀察法（Observation）**有系統地查看真實工作活動與行為，可發現未記錄的捷徑或使用者忘記提到的步驟。主要風險包括**霍桑效應（Hawthorne Effect）**，以及漏看不常發生的工作。步驟為訂定觀察工作 → 取得同意 → 盡量不干擾 → 記錄行為、延遲和例外 → 檢查週期性工作 → 與員工確認。"],["Definition: Examine existing forms","**文件分析（Document Analysis）**檢查現有表單、政策、報表、使用手冊與紀錄，以理解現行業務。使用者自行加上的欄位可能表示缺少資訊需求，沒人使用的欄位則可能已過時。這些發現仍須向使用者確認。例如手寫的「偏好聯絡方式」只能視為候選資料需求，不能自動認定已獲核准。"],["Definition: Structured requirements workshops","**JAD（聯合應用開發）**是讓使用者、分析師、管理者與主持人共同參與的結構式需求工作坊。角色包括主持人、使用者、分析師、決策者和記錄者。流程為訂定目標 → 選擇參與者 → 準備議程 → 約定討論規則 → 主持討論 → 記錄議題與決策 → 確認成果。成效取決於參與者的專業知識與主持品質。"],["Descriptive Requirement Statement: FR-014","**敘述式需求範例 FR-014：**當使用者要求的新時段仍有空位時，系統應允許經授權的櫃檯人員重新安排既有預約。"],["User Story: As a receptionist","**使用者故事（User Story）**：身為櫃檯人員，我想重新安排預約，讓病人可以變更時間，同時不與醫師的可用時段衝突。"],["Story Cards are lightweight","**故事卡（Story Cards）**是維護使用者故事的輕量工具，但單一使用者故事通常不足以完整表達安全性、例外流程及效能條件。"],["Priority (business importance) and Sequence","**Priority（優先程度）**表示業務上的重要性；**Sequence（執行順序）**表示技術或業務的先後依賴，兩者不同。例如若規定先登錄病人資料才能預約，順序是登錄病人 → 安排預約 → 發送確認。但這個假設仍須向利害關係人確認。"],["Scope Creep: Uncontrolled expansion","**Scope Creep（範圍蔓延）**是專案已同意的範圍在缺乏控制下不斷擴大。新功能應先評估變更、分析影響並排定優先順序，不能默默接受。"],["62 minutes end-to-end minus","整個流程歷時 62 分鐘，其中實際處理只有 9 分鐘，因此**等待時間為 53 分鐘**。可能的改善方式包括刪除步驟、整合步驟，或讓相互獨立的工作平行執行。但等待不一定是浪費，如果涉及法定審核，必須先確認是否允許取消。"],["ABC focuses the allocation","**ABC（作業基礎成本分析）**重點是各業務活動如何分配成本，以及這些成本帶來的影響，而不只看軟體專案最初的總預算。此處的數字只是案例示例，不是課本提供的診所真實資料。"],["Ask whether manual re-entry","應檢查人工重複輸入與某些核准程序是否真的必要。但不能只為了加快速度，就取消法律、醫療或安全上必須保留的步驟。"],["Analyze sentence components","分析句子的組成，以找出候選**物件（Objects）**、**動作（Actions）**和**關係（Relationships）**。例如「病人為了預約而聯絡診所」，Patient 是角色／物件，contacts 是動作，Office 是參與者，Appointment 是相關業務物件。句子裡的名詞只是候選類別，不能直接認定都應成為 Class。"],["Identify domain boundaries","辨識**領域範圍（Domain Boundaries）**及同一概念可能有的不同含義。例如 Student Consultation 可能包括論文指導、選課諮詢、個人諮商及職涯諮詢。**領域分析（Domain Analysis）**可減少遺漏情境及錯誤假設。"],["Identify relevant Attributes","找出業務概念需要的**屬性（Attributes）**。例如 Patient 可能需要病人編號、姓名、電話、電子郵件和偏好的聯絡方式。不要蒐集與已同意業務範圍無關的屬性。"],["Identify classification structures","找出**分類結構**與概念之間的關係，例如各種類型的諮詢。不是每個概念分類階層都應不加判斷地轉成 UML 繼承關係。"],["Find additional and exceptional","找出主要流程可能遺漏的其他情境或例外。例如購票時，家庭成員想坐在相鄰座位，同時又必須遵守反黃牛規定。**主題分析（Theme Analysis）**研究的是業務模式，不是介面配色主題。"],["Criteria labels are completed","這裡的品質準則名稱依 2026 教授課程的 **VT4C** 架構補齊。**文字分析（Text Analysis）**用來發現需求的意義；**VT4C** 則用來檢查寫好的需求品質，兩者負責的工作不同。"],["The lecturer's formal Requirements Definition Cycle","教授正式的**需求定義循環（Requirements Definition Cycle）**有四個步驟。以下九步驟只是延伸的課堂執行指引，不能拿來取代教授的四步驟架構。"],["Interviews: receptionist, doctor","**訪談**可找櫃檯人員、醫師和經理；**觀察**實際櫃檯工作；**文件分析**可查看紙本預約表、表單和取消政策；**問卷**蒐集病人偏好；**JAD 工作坊**則讓主要利害關係人一起解決有衝突的業務規則。"],["Verification: Are all requirements linked","**Verification（驗證）**：所有需求是否都能對應到清楚的模型與測試？**Validation（確認）**：未來系統是否真的減少預約衝突和工作負擔？此案例是依課本概念改編的原創教學例子，不是抄錄的官方標準答案。"],["Executive Summary + System Request","完整的**系統提案（System Proposal）**通常整合執行摘要、系統需求書、工作計畫、可行性分析、需求定義，以及現況與未來流程模型。**需求定義**是重要部分，但不等於整份系統提案。"],["2026 slide example: enrollment","**2026 年投影片案例**包含報名、折扣、廣告、教師管理、課程核准、課程名額、人工付款、取消門檻與關鍵字搜尋。"],["System Boundary: The lecturer's case","**系統邊界（System Boundary）**：教授的案例明確保留人工收款。系統記錄收銀人員確認收到款項，不等於系統自動刷卡扣款；未經範圍核准不可自行加入線上付款處理。"],["Users cannot fully describe","題目：使用者無法完整說明非正式的排班替代做法，哪種需求蒐集技術最能找出他們實際如何操作？"],["Observation reveals actual behavior","答案：**觀察法（Observation）**可以發現實際行為，包括未記錄的工作捷徑；但受觀察的人可能因為有人在場而改變行為。"],["The requirement says the interface","題目：需求寫成「介面必須快速又好看」，最直接違反哪些需求品質準則？"],["Fast and attractive lack objective","「快速」與「好看」都缺乏客觀判準，不同人可能有不同理解，因此應改寫成明確且可驗證的條件。"],["A cashier manually verifies","題目：收銀人員以人工方式確認付款後，系統才啟用會員資格。哪項需求符合此案例的系統範圍？"],["The system records an external","答案：系統應記錄外部人工付款的結果；這不表示系統取得了自動處理付款的授權。"],["Definition: A Concept Map","**概念圖（Concept Map）**以需求或概念作為節點，再以具有意義標籤的連線連接。它可以表示非階層式關係，例如**功能性需求**如何受到安全、效能與操作限制的影響。"],["SOP: Identify verified requirements","**概念圖製作步驟（SOP）**：找出已確認需求 → 建立節點 → 標示影響或包含關係 → 檢查遺漏連線 → 與利害關係人逐步檢查 → 更新文字需求定義。優點是容易看到跨需求的共同限制；缺點是大型系統可能讓圖過度複雜，因此應搭配而非取代文字需求。"],["Begin with the actual process","先理解實際作業流程，找出根本原因與改善機會，再將它們轉化為需求；利用概念圖表示限制條件的影響，最後把已驗證的需求納入**系統提案（System Proposal）**。**考試陷阱：**故事卡不能取代完整、可驗證的需求文件。"],["Source: Textbook Ch3","**來源：**課本第三章「其他需求記錄技術」。此處摘要並解釋課本概念，沒有重製有著作權的原始頁面；課本內容與教授投影片分開標示。"],["混合句型如「Doctors may retrieve","**混合需求句**：「醫師可以在兩秒內查閱病歷」包含兩部分：**Functional Capability（功能性能力）**是查閱病歷；**Measurable Performance Requirement（可量測的效能需求）**是在兩秒內完成。視品質管理需要可以將兩者拆開記錄。"],["不應因為想用 Facial Recognition","不能只因為想使用**Facial Recognition（臉部辨識）**，就認為它是唯一需求；還須評估**Privacy（隱私）**、**Misidentification（辨識錯誤）**、**Security（安全）**及**Regulations（法規）**。"],["Course alignment: 2026 Requirements Determination","**課程來源對照：**2026 年需求確認投影片第 2–3 頁是定義，第 8–14 頁是八種分析策略，第 15–25 頁是資料蒐集技術，第 26–30 頁是格式及優先順序，第 32–37 頁是文字分析與 VT4C，第 38–41 頁是課程報名案例，第 42 頁是系統提案；亦參考 Dennis、Wixom、Tegarden 課本第三章。示例數字、Mermaid 圖、練習和診所規格屬教學改編；圖形需要連網才能顯示，文字說明可離線閱讀。"]],"3":[["Functional Modeling: The analysis","**功能模型（Functional Modeling）**是分析工作的一部分，描述系統需要的功能、與之互動的參與者，以及實現各功能的業務流程。它是物件導向系統分析設計的**外部／功能觀點**，輸入為需求定義，產出包含使用案例圖等功能模型。"],["Source note: The lecturer","**教材來源提醒：**教授投影片第 4 頁明確列出三個步驟。本章圖形規則與格式依 2026 年課程投影片，而非直接採用一般網路 UML 教學。"],["Warning: Mermaid's generic","**提醒：Mermaid** 的一般虛線無法精確重現正式 UML 使用案例圖的所有連接方式。這些圖示著重語意與方向；正式考試應繪製正確的虛線箭頭，並使用準確的 **«include»** 與 **«extend»** 標記。"],["Generalization example: Member","**一般化（Generalization）**範例：Member 與 Non-member 是 Learner 的特殊類型。如果這種角色區分對權限有意義，兩者應以空心三角形箭頭指向一般化的 Learner。"],["Activity Diagram: Depicts ordered Actions","**活動圖（Activity Diagram）**描述業務流程中的動作與活動順序，包括循序執行、條件分支、平行處理及可能的物件移動。在 OOAD 中可用來描繪一個 Use Case 的流程，也可獨立用於業務流程管理與改造。"],["Activity Final stops the entire","**Activity Final（活動終止）**結束整個活動的執行，**Flow Final（流程終止）**只終止某一條路徑。例如被拒絕的可選分支可以用 Flow Final 結束，而整個預約成功並完成流程時可能使用 Activity Final。兩者不能互換。"],["This Mermaid illustrates mutually exclusive","這張 **Mermaid** 圖呈現互斥條件的 **Decision → Merge（分支到合併）**。如果是平行活動，則必須使用兩條同時執行的路徑與負責同步的 **Join**，不能用 Decision 取代。Mermaid 僅為近似表示，正式 UML 活動圖須使用正確節點符號。"],["Swimlanes assign responsibility","**Swimlane（泳道）**用來分配各活動的責任，可以水平或垂直繪製。此處用 Mermaid 子圖模擬概念，不完全等同於 UML 原生的活動分區符號。"],["UCD: The textual specification","**UCD（使用案例描述）**是單一 Use Case 的文字規格，說明互動細節、正常流程、子流程、替代流程與例外事件流程。教授強調**每一個 Use Case 應有且僅有一份 UCD**。"],["External Trigger: An Actor initiates","**External Trigger（外部觸發）**是由參與者啟動 Use Case，例如學員要求報名；**Temporal Trigger（時間觸發）**是在某個時間或排程到達時發生事件，例如課前三天自動發送廣告。投影片第 22 頁要求對照課本第 102 頁核對名稱，因此這裡採用的是標準解釋，正式考試應以課本該版本為準。"],["Essential vs Real asks","**Essential 與 Real** 區分描述是否涉及實作細節；**Overview 與 Detail** 區分內容寫得多詳細。這是兩個互相獨立的維度，不是四個不同等級的品質排名。"],["At Normal Flow Step 3","在**正常流程第 3 步**，若課程已額滿，系統應顯示名額已滿，而且不能接受此次報名。學員可以另選其他課程；如果實際業務規則要求回到搜尋，圖中就必須畫出這條返回路徑。"],["At Step 6, if persistence fails","在第 6 步，若**資料儲存（Persistence）**失敗，系統必須顯示失敗資訊，而不是出示報名成功確認。這是延伸的教學案例，不是原本九項情境需求明文列出的規則。"],["Cross-check: Every Action","**交叉檢查（Cross-check）**：活動圖中的每個 Action（動作）都應在 UCD 中有至少一項對應事件，順序也必須一致。若某個業務目標被提升為獨立 Use Case，就需要自己的 UCD，不能拿同一份描述取代兩個案例。"],["Verification: Check artifacts","**Verification（驗證）**檢查各項文件、模型的 UML 語法、流程與欄位是否正確且內部一致。**Validation（確認）**則與客戶一起檢查功能模型是否真正滿足業務需求。"],["Normal Flow: (1) Patient selects","**正常流程（Normal Flow）**：（1）病人選擇醫師與日期；（2）系統取得可預約時段；（3）系統檢查選定時段是否可用；（4）系統建立預約；（5）系統發送或顯示確認通知。"],["Alternate AF-01: When slot unavailable","**替代流程 AF-01**：若第 3 步發現時段不可用，系統顯示其他可選時段，病人可以改選或離開。**例外流程 EF-01**：若資料無法儲存，系統顯示失敗，而不能宣稱預約已確認。"],["**Modeling caution:** The original classroom","**建模提醒：**課堂原圖可能把顯示課程名額視為內部步驟，也可能視為獨立 Use Case。不要機械地把所有內部操作都轉成獨立使用案例，只有具有獨立價值、可重用性或明確範圍的互動才需要分開。"],["Scope caveat: Payment collection itself","**範圍提醒：**教授的課程報名案例仍採人工收款，由櫃檯人員記錄確認後系統再作出反應。若畫成系統自動處理線上付款，就超過原情境的範圍。"],["User Story emphasizes Role","**User Story（使用者故事）**強調角色 → 想要的能力 → 價值（為什麼）。**Use Case（使用案例）**描述參與者與系統如何互動，以及業務目標如何實現。一則 Story 可能對應多個 Use Case，反過來一個 Use Case 也可能支援多則 Story。投影片使用多對多的教學關係，應依內容的細緻程度判斷，不能硬套一對一。"],["Step 1 source gap: The student","**來源缺口：**學生版投影片在「設定建模範圍」後留有空白。將 Use Case 作為範圍，是依相鄰投影片內容所作的解讀；其餘五步驟標籤則遵循第 21 頁。"],["Assumptions to confirm: Whether selecting","**需要確認的假設：**如果使用者選擇已額滿的課程，是應終止報名還是返回搜尋？折扣應該獨立成 Use Case，還是只算內部 Action？這兩點都會影響正式活動圖是否正確。"],["Transparency: Guidelines 1 and 6","**透明度說明：**提供的學生版投影片在規則 1 和 6 留有空白，補出的 SVO 和 KISS 名稱屬於教學解讀，並非已核實的教授填空標準答案。"],["Formal UML rendering requires","正式 **UML 使用案例圖**需要在有名稱的系統主體邊界內畫橢圓形使用案例，並使用適當的 Actor 和 UML 相依關係符號。此處 Mermaid 流程圖只是在呈現帶標籤的互動語意。"],["Modeling decision: The distinction","**建模判斷：**Check Availability（查詢空檔）究竟是獨立 Use Case，還是另一個 Use Case 內部的動作，取決於情境邊界和可重用性。兩種作法都可能合理，但使用案例圖、活動圖和 UCD 必須選擇一致的解釋。"],["Membership required for all site","網站所有功能都要求會員資格。會員可依偏好搜尋或瀏覽異性會員資料。登入後的 Member 最多可設定五項興趣及三項個性條件，從結果中選出最多十位符合條件的會員，透過網站發送約會邀請並查看邀請紀錄。"],["Descriptive statement (English teaching","**描述式需求（英文教學翻譯）**：登入後，會員最多可指定五個興趣條件與三個個性條件、選擇最多十位符合的會員，透過系統發送約會邀請並檢視邀請紀錄。"],["User Story: As a registered Member","**使用者故事（User Story）**：身為已註冊會員，我想搜尋合適的會員並發送線上約會邀請，藉此認識興趣相近的人。"],["UCD: UC-D03 Send Date Invitations","**UCD：UC-D03 發送約會邀請**。主要參與者是會員，觸發事件是會員選擇邀請功能。正常流程依序為登入 → 設定條件 → 查看結果 → 選擇收件者 → 發送 → 記錄。替代情況包括條件數超限、收件者超過十人、沒有符合的會員。每條分支均應在 UCD 中具體說明。"],["Suggested practice only: Actor Resident","**僅供練習的建議流程：**住戶要求領取包裹，工作人員檢查包裹身分，系統記錄領取並更新包裹狀態。若前面的正式需求未支持這些細節，就不能把它們當成教授提供的官方答案。"],["Source alignment: Slide 10","**來源說明：**投影片第 10 頁列出四步驟辨識流程。學生版部分欄位仍是空白；Actor（參與者）與 Business Process（業務流程）的名稱依相鄰第 11 頁的主詞與動詞辨識方法整理。"],["The lecturer assigns an independent","教授指定的獨立作業是：（1）為**大樓包裹管理系統**畫 Use-Case Diagram；（2）為 **Collect Parcel（領取包裹）**畫 Activity Diagram；（3）撰寫 Collect Parcel 的 **UCD**。投影片引用先前需求卻未完整重述，因此光靠本章無法確認全部官方業務規則。"],["A use case called 'Apply Member Discount'","題目：**Apply Member Discount（套用會員折扣）**是 **Register for Course（課程報名）**的可選延伸功能，哪個箭頭方向才正確？"],["An «extend» arrow originates","**«extend» 延伸關係**的箭頭由擴充的使用案例出發，指向原本的基礎使用案例。"],["Two concurrent branches have been started","題目：兩條平行分支已開始執行，應用哪個節點進行同步？又是哪種終止節點只結束其中一條路徑？"],["Join synchronizes concurrent paths","**Join（同步匯合節點）**會同步平行路徑；**Flow Final（流程終止節點）**只結束單一活動路徑，不會讓整個活動停止。"],["Slide 31 requires an event","第 31 頁規定**活動圖（Activity Diagram）**中的每個動作或活動，在 **UCD（使用案例描述）**中至少要有一個對應事件，且順序一致。每個使用案例都需要一份獨立的 UCD。"],["Verification: Check valid symbols","**Verification（驗證）**檢查符號是否有效、Guard（守衛條件）是否完整，以及 UCD 的事件順序是否一致。**Validation（確認）**則要向使用者確認實際診所究竟應顯示替代時段，還是將病人排入候補名單。即使 UML 圖在技術上正確，仍可能畫錯業務流程。"],["Source: Textbook Ch4","**來源：**課本第四章「活動圖繪製指引」與「業務流程的驗證與確認」。本區摘要、解釋課本內容，而非重製原書；課本與教授投影片分開標示。"],["Source: 2026 Chapter 3: Business Process","**來源：**2026 年第三章業務流程與功能模型投影片（共 43 頁），以及 Dennis、Wixom、Tegarden《Systems Analysis and Design with UML》第六版（2015）第三章。Mermaid 圖形是重建的教學示意，並非複製受著作權保護的原圖。課程報名和交友網站的限制取自投影片；診所案例和延伸的替代流程有另外標示為教學改編。未獨立確認的填空部分也會明確註記。"]],"4":[["Structural Modeling: A process","**結構模型（Structural Modeling）**是把業務流程涉及的真實世界物件表示成類別、定義類別內的結構內容，以及建立類別之間關係的過程。它提供物件導向分析設計的**靜態／結構觀點**，支援功能觀點。"],["Course contextual progression:","本課程的主要建模流程是**功能模型 → CRC Cards → Class Diagram → Object Diagram**，並在過程中回頭修正與檢查。第 13 張投影片部分標籤留白，但第 14、20、38 張有具體介紹相關成果，因此此處依投影片順序整理。"],["Slide 5 leaves the three","第 5 張投影片的三個類別範疇留空，但第 11 張在類別識別過程中提到**實體事物／場所、交易／事件，以及角色／人員**，本章據此採用這三類。"],["Slide 12 explicitly cautions","第 12 張投影片特別提醒：不是每個被標記的候選概念，經過分析後都一定會變成**類別（Class）**。"],["The lecture asks: Student","課堂提出：Student 有 school 屬性時，School 是否應成為獨立的**類別（Class）**？判斷時需考慮是否需要多個學校相關屬性，以及許多 Student 物件是否共用同一 School 物件或值。"],["V&V loop: An Object Diagram","**V&V（驗證與確認）**循環：物件圖可能揭露多個 Student 實例重複保存同一組資料，此時應回頭檢查類別圖，考慮是否抽出獨立的 School 類別。是否抽出要經過判斷，並非自動規則。"],["CRC stands for Class","**CRC** 是 **Class–Responsibility–Collaboration（類別、職責、協作）**的縮寫。每張卡記錄特定類別的職責，以及為完成某個 Use Case 而需要合作的其他類別。"],["In the illustrated call b.mb()","在範例呼叫 **b.mb()** 中，A 是**請求端／客戶端（Requestor/Client）**，B 是**回應端／協作者／服務端（Responder/Collaborator/Server）**。收到訊息的物件應負責執行對應的操作。"],["Knowing: appointmentId","**知道的資訊（Knowing）**包含預約編號、病人、醫師、看診時間與預約狀態等資料。"],["Collaboration: Appointment needs","**協作（Collaboration）**：Appointment 需要取得空檔資訊，才能驗證預約是否可成立。"],["Card field arrangement is an explanatory","卡片欄位的安排是為方便解釋而重建；投影片第 17–18 頁顯示的是卡片正反面的圖片，不是純文字格式的欄位定義。"],["In a realistic system, Order","在實際系統中，Order 與 Product 之間可能需要 **OrderLine（訂單明細）**這種關聯類別；簡化圖只是用三個起始類別說明觀念，並非適用所有電商系統的完整領域模型。"],["Class Diagram: Static representation","**Class Diagram（類別圖）**用來靜態呈現類別及其結構關係。教授在投影片第 22 頁明確指出：考試除非指定 **Simplified Format（簡化格式）**，否則應使用 **Standard Format（標準格式）**。"],["Professor's simplification guideline","教授的簡化原則是：若能減少不必要的複雜度，類別圖不必每次都列出建構子、一般服務方法或 getter／setter 存取方法。"],["Aggregation vs Composition","**Aggregation（聚合）**允許部分在整體以外獨立存在；**Composition（組合）**代表更強的擁有關係，通常也有相依的生命週期。2026 投影片把兩者都歸在整體與部分關係下；細節區分屬於額外的 UML 說明，不是第 8 頁投影片逐字寫出的內容。"],["How to read: For a single Advisor","**多重性（Multiplicity）**的讀法：對一位 Advisor 而言，要看 Student 那一端的數字，才能知道對應幾位學生；對一位 Student 而言，要看 Advisor 那一端的數字，才能知道對應幾位導師。不要只看數字旁邊的類別名稱。"],["A many-to-many association often","**多對多關聯（Many-to-many Association）**往往需要記錄交易本身的資料。例如 Customer 購買 Product，可以加入 Order 或 PurchaseLine 類別，保存數量、日期、金額等特定購買資訊，使模型更完整。"],["Entry Criteria: A selected Use Case","**開始條件（Entry Criteria）**是已選定一個 Use Case，並具備三個功能模型成果：使用案例圖、活動圖與使用案例描述。投影片第 32 頁的流程是以使用案例為驅動，而不是先畫類別圖。"],["Step 3 Role-Play: Student requests","**第 3 步角色扮演（Role-Play）**：Student 提出要求 → RegistrationUI 傳遞請求 → RegistrationManager 詢問 ClassSection.hasSpace() → 建立 Enrollment → ClassSection 更新已報名人數 → 介面顯示確認。如果名額已滿，就必須拒絕，而不是建立 Enrollment。"],["Slide 19 contains blanks","投影片第 19 頁有部分精確術語留空，因此底線標示的 Use Case 與 Event Flow 屬於依上下文推論；不過保持職責精簡、透過協商調整職責的指示確實有投影片支持。"],["Slide 24 calls the class","第 24 頁將該類別命名為 Class，但 Mermaid 範例為了避免英文 Class 與 UML 類別語法混淆，改用 **ClassSection**。正式考試畫圖時應使用題目或教授指定情境的精確名稱。"],["Professor explicitly requires indicating","教授明確要求考試或報告應標示**關聯方向（Association Direction）**。可用適當動詞短語標示業務關係，例如 Boss manages Employee，並依教授規定畫方向。投影片展示三角形或箭頭的變體；不要把關聯方向箭頭和 **Generalization（一般化）**的空心三角形箭頭混淆。"],["Important nuance: The slide calls Order","**細節提醒：**投影片在教學層級把 Order 視為由 Customer–Product 關聯導出的關聯類別；擴充後的 Order／OrderLine 圖只是補充說明，並不是說原投影片已包含 OrderLine 類別。"],["Slide 33 shows Student","第 33 頁顯示 Student 與 Class、Class 與 Course 間的多重性範例，包括 5..*、4..*、0..* 和 1..1。各數值分別寫在關聯的對應端點上。這些數字是特定範例的業務限制，不能直接套用到所有選課系統。"],["Functional input: A Student selects","**功能輸入：**Student 選擇一個有空位的 ClassSection，系統檢查報名規則、建立 Enrollment，並更新報名資訊。"],["Step 2 Review: A direct","**第 2 步檢查：**Student 和 ClassSection 間直接的多對多關聯，可能需要增加 **Enrollment（選課／報名交易）**類別。也要確認 ClassSection 與 Course 是否各有獨立意義；如果沒有，應考慮適當合併。"],["Step 5: Remove unnecessary","**第 5 步：**移除不必要的 getter／setter 方法，確認關聯與多重性有依據。**第 6 步：**將 Enrollment 交易類別的模式與電商中的 Order／OrderLine 比較。**第 7 步：**測試可報名與額滿情境，並和利害關係人確認。"],["Teaching-data boundary: The lecture's","**教學資料界線：**教授第 33 頁的 Student–Class–Course 多重性與擴充範例的一般業務限制不同，不能用示範數字覆蓋教授投影片或考題明確給的多重性。"],["Object Diagram: A runtime snapshot","**Object Diagram（物件圖）**呈現某個時刻實際物件實例的快照，包含當時的屬性值與連結，而非事件的先後順序。物件圖可以揭露類別圖遺漏的類別、關聯或屬性。"],["Typical UML Object Diagram notation","典型 UML **物件圖**會使用加底線的「物件名稱：類別名稱」標籤，例如 **john: Student**，以及當下實際的屬性值。Mermaid 的 ClassDiagram 無法完整重現物件圖的所有標準表示方式，因此此處另用 ASCII 範例強調符號。"],["Seeing that many student objects","當許多學生物件都指向同一個 School 物件時，表示 **School** 可能值得成為獨立類別，而不是讓每名 Student 重複存放學校相關屬性。"],["Associations in the CD may become","類別圖（CD）中的關聯，在具體設計時可能轉為接收類別定義中的物件參照屬性。"],["Given a Boss–Employee association","假設 **Boss–Employee** 關聯表示一位老闆管理一位或多位員工，每位 Employee 可以保存對應 Boss 物件的參照。但實際參照欄位存在哪一端、關聯能往哪個方向導覽，必須與模型和實作一致；UML 關聯並非一律要求兩端都保存參照。"],["The 2026 slides at pp.","**來源說明：**2026 年投影片第 40–41 頁要求分析師與開發者及使用者一起逐步檢查結構模型，解釋每個 Class（類別）存在的理由，並參考課本第 152 頁的 V&V 規則和第 154 頁的功能與結構模型平衡原則。學生版投影片沒有重製完整規則，因此下方清單是透明標示的教學綜合整理，並非課本逐字抄錄。"],["Multiplicity constraints are illustrative","**多重性（Multiplicity）**的數值只是示例：每筆預約對應一名病人和一名醫師，而病人及醫師均可能有許多預約；在簡化模型中，同一時段最多只能有一筆有效預約。其餘限制要從診所實際規則推導，不能自行編造。"],["Remove unsupported classes","移除情境不支持的類別，例如當系統沒有管理建築物位置時，不應額外建立 HospitalBuilding。可套用可重用的**交易－當事人－資源（Transaction–Party–Resource）**模式：Appointment 是連結 Patient、Doctor 與時間資源的交易。接著建立物件快照、檢查超額預約情境，再與診所人員逐步核對。"],["Lecturer's business conditions: membership","**教授案例條件：**所有服務都需要會員資格與登入；會員可以依條件瀏覽異性會員；登入後最多設定五個興趣、三個個性特徵，選出最多十名符合條件的會員並發送邀請，而且必須能查看邀請紀錄。結構模型的教學使用 Member、Invitation 和 InvitationManager 的 CRC 卡，接著針對 Send Date Invitation 使用案例畫類別圖。"],["Validation: up to five interests","**驗證提醒：**五個興趣、三個個性條件與十名邀請對象都是投影片實際給出的限制。上方類別的具體屬性是為教學而重建，因為原圖是圖片，無法完整擷取所有欄位文字。"],["Assignment asks students to create",
